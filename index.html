    const job = oracleJob(action);
    if (!job) { K.logMove(app.coach, entry); return Promise.resolve(entry); }
    const coach = app.coach;
    // the house play (Coach.houseAction): what the standard bot would play here, dealt out in the same job
    let house = null;
    try { house = K.houseAction(app.table, coach.est); } catch (e) { console.error('house play', e); }
    if (house) { job.actions = O.withAction(job.actions, house); entry.houseKey = O.keyOf(house); }
    // kept for the review: the job to deal out again, and (shown only after an answer) the cards hidden then
    const hand = app.table.hand;
    entry.job = job;
    // the partner's score it was priced with (a resumed hand prices it again: rehydrateLog)
    job.at = { bulge: app.table.bulge === undefined ? null : app.table.bulge, bulgeBoxes: app.table.bulgeBoxes === undefined ? null : app.table.bulgeBoxes, doubled: !!hand.doubled };
    entry.key = O.keyOf(action);
    entry.mode = app.match.mode;
    entry.truth = { opp: hand.hands[1].slice(), next: hand.stock[hand.stock.length - 1] };
    coach.afterEvent = () => { if (app.table && app.table.hand && app.table.hand.phase === 'over') setTimeout(startReview, 0); };
    K.logPending(coach, entry);
    return judgeMove(entry, job, action, house);
  }

  /* Deal a logged play out, price it and count it. Whatever comes back (a verdict, or null: a
     job dropped when the table was left, abandoned past the limit, or no deals) goes to the
     record's one gate through settlePlay: it writes nothing for a table since left (the play
     stays pending in the save made on leaving, and Continue deals it out again under its own
     id), and it makes the play's part in the record equal to this verdict, never adds one.   */
  function judgeMove(entry, job, action, house) {
    let stats = null;
    return runJob(job, ownerOf(entry)).then(s => {
      stats = s;
      // a play that looks costly gets a second, longer look before it is called a mistake
      const first = s && s.n ? O.verdict(s, O.keyOf(action)) : null;
      if (first && first.grade !== 'optimal' && first.loss > 0.02 * first.unit && first.n < 600 && !job.dropped) {
        return runJob(Object.assign({}, job, { n: 1500, first: 20, budgetMs: 3500 }), ownerOf(entry))
          .then(deeper => { if (deeper && deeper.n > s.n) stats = deeper; });
      }
    }).then(() => houseDuel(job, entry, action, house, stats)).then(fig => {
      settlePlay(entry, stats, fig);
      return entry;
    });
  }
  /* A play's verdict to the record's gate (Coach.settle): dealt out (`stats`), else the rule of
     thumb it was shown with, which grades the decision made (gradePlay: a knock or play-on by the
     knock rule, a draw by the draw rule, a throw by the throw rule). True if the table is live. */
  function settlePlay(entry, stats, fig) {
    let verdict;
    if (stats && stats.n && entry.action) {
      const v = O.verdict(stats, O.keyOf(entry.action));
      verdict = {
        grade: v.grade, cost: v.cost, house: fig || null,
        show: { oracle: { loss: v.loss, margin: v.margin, n: v.n, close: v.close }, stats, text: entry.verb + '. ' + verdictText(v, entry) }
      };
    } else {
      const rule = entry.rule || { grade: entry.grade, text: entry.text };
      verdict = { grade: rule.grade, cost: 0, house: null, show: { text: rule.text } };
    }
    const wrote = K.settle(app.coach, entry, verdict);
    if (entry.kept) { dropKept(entry); return false; }   // let go for good: judged once, no table to show it at
    if (!wrote) return false;
    // the hand saved with it at once: always whole (a move is logged, recorded and made in one step,
    // humanAct and humanDiscard), and the record is the gate's, so a resumed hand counts nothing twice
    saveMatch();
    refreshOpenAnalysis();
    if (app.table && app.table.hand && app.table.hand.phase === 'over') startReview();
    return true;
  }

  /* a discard, with or without a knock: one verdict for the whole play */
  function gradePlay(hand, card, knock, gin, tally) {
    const acts = E.legalActions(hand);
    const legal = acts.find(a => a.type === 'discard' && a.card === card);
    const g = K.gradeDiscard(app.coach, hand, card);
    // the rule of thumb for the decision made: with this card able to knock, knocking or playing on
    // is judged by the knock rule (Coach.gradeKnock), never by how good a throw the card is
    let rule = null;
    if (legal && legal.canKnock && !legal.canGin && !gin) {
      const rest = hand.hands[0].filter(c => c !== card);
      const gr = C.ginRating(rest, E.unseenFor(hand, 0));
      rule = K.gradeKnock(hand, !!knock, legal.deadwood, gr, app.table, card, app.coach.est, app.names);
    }
    const unseen = K.couldHold(hand, 0);   // the ways they can use a card: what they took is in their hand, not gone
    const facts = { cards: {} };
    if (g) for (const s of g.scored) facts.cards[s.card] = { dw: s.dw, hits: s.hits, u: C.usefulness(s.card, unseen) };
    const canKnock = acts.some(a => a.canKnock || a.canGin);
    const verb = gin ? `Went gin with the ${C.name(card)} down`
      : knock ? `Knocked${legal ? ' at ' + legal.deadwood : ''} with the ${C.name(card)} down`
      : canKnock ? `Threw the ${C.name(card)} and played on` : `Threw the ${C.name(card)}`;
    const pos = K.snapshot(hand);
    // the sheet and partner score it happened on, so it can come back as the same decision
    pos.scene = {
      mode: app.match.mode, games: JSON.parse(JSON.stringify(app.match.games)),
      bulge: app.table.bulge === undefined ? null : app.table.bulge,
      bulgeBoxes: app.table.bulgeBoxes === undefined ? null : app.table.bulgeBoxes
    };
    return submitMove({
      kind: canKnock ? 'knock' : 'discard', turn: hand.turns[0] + 1,
      grade: rule ? rule.grade : g ? g.grade : 'good', verb, facts,
      text: verb + '. ' + (rule ? rule.explanation : g ? g.explanation : ''),
      chosen: knock ? 'knock' : C.name(card), pos, tally
    }, { type: 'discard', card, knock: !!knock, gin: !!gin });
  }

  /* ---------------- judging Gym answers ----------------
     A Gym position is priced where it sits: a scene (the team drills) brings
     its own sheet and partner score; a bare hand is priced on an empty sheet
     in the game you have selected. Positions are dealt out BEFORE they are
     shown, so the answer comes back at once and a position with no clear
     right answer can be passed over for one that has.                      */
  function gymScene(q) {
    const st = app.settings;
    if (q.match && q.table) {
      const mode = q.match.mode === 'team' ? 'team' : 'solo';
      const stake = matchStakes(q.match);   // a position from a match is priced at that match's stakes
      return { match: q.match, table: q.table, model: window.Gym.modelFor(mode, q.match.settings, stake.box, stake.game) };
    }
    const mode = st.mode === 'team' ? 'team' : 'solo';
    const key = [mode, st.targetScore, st.dollarsPerBox, st.dollarsPerGame, st.shutoutDoubles, st.spadeDoubles].join('|');
    if (!app.gym || app.gym.key !== key) {
      const match = mode === 'team' ? E.makeTeamMatch(st) : E.makeMatch(st);
      app.gym = { key, match, model: window.Gym.modelFor(mode, match.settings, st.dollarsPerBox, st.dollarsPerGame) };
    }
    return { match: app.gym.match, table: { hand: q.hand, bulge: null }, model: app.gym.model };
  }
  function gymJob(q, actions, focus, n, budgetMs) {
    const sc = gymScene(q);
    if (!q._sw) q._sw = Money.swing(sc.model, sc.match);
    return {
      snap: O.snapshot(sc.table, 0, null), actions,
      ctx: O.context(sc.model, sc.match, sc.table, q._sw),
      n, first: 16, budgetMs, focus
    };
  }
  const canJudge = q => !!(q && q.hand && q.play && O && Money);

  /* deal out a question's plays before it is posed; fills q.judged. `owner`: the set asking */
  function gymPrejudge(q, owner) {
    if (!canJudge(q)) return Promise.resolve(q);
    try {
      const sc = gymScene(q);
      let actions = q.options ? q.options.map(o => q.play(o.id)) : O.candidates(sc.table, 0, 4);
      actions = actions.filter((a, i) => actions.findIndex(b => O.keyOf(b) === O.keyOf(a)) === i);
      if (actions.length < 2) return Promise.resolve(q);
      return runJob(gymJob(q, actions, null, 700, 1500), owner).then(stats => {
        if (stats && stats.n) q.judged = stats;
        return q;
      });
    } catch (e) { console.error('gym prejudge', e); return Promise.resolve(q); }
  }
  /* is the second-best play clearly worse than the best? */
  function gymClear(q) {
    if (!q.judged || q.judged.rows.length < 2) return false;
    const v = O.verdict(q.judged, q.judged.rows[1].key);
    return v.grade === 'acceptable' || v.grade === 'blunder';
  }
  /* make a question, passing over (up to twice) positions with no clear answer */
  function gymPrepare(make, owner) {
    return new Promise(resolve => {
      let tries = 0, last = null;
      (function attempt() {
        setTimeout(() => {
          if (owner && owner.gone) { resolve(null); return; }   // the set was left: deal nothing more for it
          let q = null;
          try { q = make(); } catch (e) { console.error('gym', e); }
          if (!q) { resolve(last); return; }
          gymPrejudge(q, owner).then(() => {
            tries++; last = q;
            // a drill built on the fitted knock rule also wants the dealt-out answer to be the rule's answer:
            // two methods agreeing is what makes the position worth teaching
            const split = !!(q.fitted && q.judged && q.judged.rows[0] && !!q.judged.rows[0].action.knock !== q.fitted.knock);
            if (q.wantClear && q.judged && (!gymClear(q) || split) && tries < (q.fitted ? 5 : 3)) attempt();
            else resolve(q);
          });
        }, 30);
      })();
    });
  }

  /* the verdict on an answer: { grade, explanation, cost } or null if it could not be dealt out */
  function gymVerdict(q, action, owner) {
    const key = O.keyOf(action);
    const finish = stats => {
      if (!stats || !stats.n) return null;
      const sc = gymScene(q);
      const unseen = K.couldHold(q.hand, 0);   // what they took is in their hand, not gone
      const facts = { cards: {} };
      for (const s of A.scoreDiscards(q.hand, 0, null)) facts.cards[s.card] = { dw: s.dw, hits: s.hits, u: C.usefulness(s.card, unseen) };
      const v = O.verdict(stats, key);
      let text = playName(action, true) + '. ' + verdictText(v, { action, facts });
      if (v.grade === 'optimal' && stats.rows.length > 1) {
        // say what the other play would have given up
        const other = stats.rows[1], ov = O.verdict(stats, other.key);
        text += ov.close || ov.loss <= 0 ? ` ${playName(other.action, true)} was close behind.`
          : ` ${playName(other.action, true)} would have given up ${money2(ov.loss)}.`;
      }
      const notes = q.notes ? q.notes() : '';
      if (notes) text += ' ' + notes;
      if (q.sheet && sc.match.mode === 'team') {
        // what this deal is worth here against a clean sheet: the reason the sheet matters
        const clean = sc.model.cleanUnit || (sc.model.cleanUnit = (() => {
          const m0 = E.makeTeamMatch(sc.match.settings), s0 = Money.swing(sc.model, m0);
          return Money.at(s0, 1, 1) - Money.at(s0, -1, -1);
        })());
        const here = Money.at(q._sw, 1, 1) - Money.at(q._sw, -1, -1);
        // said only when the sheet really changes what the deal is worth
        if (Math.abs(here - clean) >= 0.15 * clean) {
          text += ` This deal matters ${here > clean ? 'more' : 'less'} than usual: ${money2(here)} lies between winning it and losing it, against ${money2(clean)} on a clean sheet.`;
        }
      }
      return { grade: v.grade, explanation: text, cost: v.cost };
    };
    try {
      const row = q.judged && q.judged.rows.find(r => r.key === key);
      if (row && row.live) return Promise.resolve(finish(q.judged));
      const sc = gymScene(q);
      const list = O.withAction(O.candidates(sc.table, 0, 4), action);
      if (list.length < 2) return Promise.resolve(null);
      return runJob(gymJob(q, list, key, 1500, 2600), owner).then(finish);
    } catch (e) { console.error('gym verdict', e); return Promise.resolve(null); }
  }

  /* ---------------- the review ----------------
     After the hand, the plays that cost money are dealt out again far deeper
     (review.js), and the ones still a clear loss are posed again.          */
  const RV = window.Review;
  function startReview() {
    if (!RV || !app.coach || !app.table || !app.table.hand || app.table.hand.phase !== 'over' || !onTable()) return;
    const log = app.coach.handLog;
    if (app.review && app.review.log === log && !app.review.finished) return;
    if (!RV.toDeepen(log).length) return;
    const coach = app.coach;
    const h = RV.deepen(log, {
      onEach: e => {
        // the deeper verdict replaces the first one in the record and the mistakes bank, through the
        // record's gate (Coach.reviseMove, Coach.settle), with the play's own words, so a banked
        // mistake comes back with the final verdict; nothing is written for a table since left
        if (K.reviseMove && e && e.deep) {
          try {
            const v = RV.final(e);
            K.reviseMove(coach, e, v, v ? { text: e.verb + '. ' + verdictText(v, e) } : null);
            saveMatch();
          } catch (x) { console.error('revise move', x); }
        }
        refreshOpenAnalysis();
      }
    });
    h.log = log;
    h.done.then(() => { h.finished = true; refreshOpenAnalysis(); });
    app.review = h;
  }
  function stopReview() {
    if (app.review) { app.review.cancel(); app.review = null; }
  }

  /* if the review's front page or the move list is on screen when a verdict lands, show it there */
  let redrawing = false;
  function refreshOpenAnalysis() {
    if (!app.analysisOpen || app.analysisOpen.which === 'moment' || !U.sheetState().open) return;
    if (!document.getElementById('an-back') && !document.getElementById('rv-back')) return;
    const body = document.querySelector('#sheet .sheet-body');
    const y = body ? body.scrollTop : 0;
    redrawing = true;   // the same view drawn again: taps on it are not held
    try { openAnalysisSheet(app.analysisOpen.fromResult, app.analysisOpen.which); } finally { redrawing = false; }
    const again = document.querySelector('#sheet .sheet-body');
    if (again) again.scrollTop = y;
  }

  /* the review: the key moments; the full move list one tap away */
  function openAnalysisSheet(fromResult, which) {
    startReview();
    const log = app.coach.handLog;
    const priced = RV && log.some(e => e.stats || e.pending);
    which = priced ? which || 'home' : 'list';
    app.analysisOpen = { fromResult, which };
    const leave = () => { app.analysisOpen = null; if (fromResult) backToResult(); else U.closeSheet(); };
    if (which === 'list') { openMoveList(fromResult, priced ? () => openAnalysisSheet(fromResult) : leave); return; }
    const r = RV.pick(log);
    const rows = r.moments.map((m, i) => `
      <button class="rv-moment" data-m="${i}">
        <span class="rv-turn">${m.entry.turn}</span>
        <span class="rv-what">${m.entry.verb}</span>
        <span class="rv-cost">−${money2(m.v.cost)}</span>
      </button>`).join('');
    const body = U.openSheet(
      `<h2>${r.moments.length ? (r.moments.length === 1 ? 'Key moment' : 'Key moments') : r.line || `Checking ${r.waiting} play${r.waiting === 1 ? '' : 's'}…`}</h2>
       ${rows ? `<div class="rv-moments">${rows}</div>` : ''}
       ${r.waiting && r.moments.length ? `<div class="rv-wait">Checking ${r.waiting} more…</div>` : ''}
       <div class="row-btns"><button class="btn" id="rv-all">All plays</button><button class="btn" id="rv-back">Back</button></div>`,
      { locked: true, onDismiss: leave, same: redrawing });
    body.querySelector('#rv-back').addEventListener('click', leave);
    body.querySelector('#rv-all').addEventListener('click', () => openAnalysisSheet(fromResult, 'list'));
    body.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => {
      openMoment(fromResult, r.moments[Number(b.dataset.m)].entry);
    }));
  }

  /* every play of the hand, as judged (the deeper look where it is in) */
  function openMoveList(fromResult, back) {
    const log = app.coach.handLog;
    const fin = e => (RV && e.deep ? RV.final(e) : null);
    const costOf = e => {
      if (e.pending) return '<span class="an-cost wait">…</span>';
      if (!e.oracle) return '';
      const v = fin(e), cost = v ? v.cost : e.cost, close = v ? v.close : e.oracle.close;
      return cost > 0 ? `<span class="an-cost ${v ? v.grade : e.grade}">−${money2(cost)}</span>`
        : `<span class="an-cost ok">${close ? '≈' : '$0'}</span>`;
    };
    const textOf = e => { const v = fin(e); return v ? e.verb + '. ' + verdictText(v, e) : e.text; };
    const gradeOf = e => { const v = fin(e); return v ? v.grade : e.grade || 'good'; };
    const items = log.map(e => `
      <div class="an-item">
        <div class="an-grade ${e.pending ? 'wait' : gradeOf(e)}"></div>
        <div class="an-body">
          <div class="an-turn">Turn ${e.turn} · ${e.kind}</div>
          <div class="an-text">${e.pending ? e.verb + '. Dealing it out…' : textOf(e)}</div>
        </div>
        ${costOf(e)}
      </div>`).join('');
    const counts = { optimal: 0, good: 0, acceptable: 0, blunder: 0 };
    log.forEach(e => { if (!e.pending && counts[gradeOf(e)] !== undefined) counts[gradeOf(e)]++; });
    const judged = log.filter(e => !e.pending).length || 1;
    const acc = Math.round(100 * (counts.optimal + counts.good) / judged);
    const body = U.openSheet(
      `<h2>${acc}% right or fine</h2>
       <div class="an-list">${items}</div>
       <div class="row-btns"><button class="btn" id="an-back">Back</button></div>`,
      { locked: true, onDismiss: back, same: redrawing }
    );
    body.querySelector('#an-back').addEventListener('click', back);
  }

  /* A key moment, played again from what you could see then. Solved: the best
     play or one as good (Review.solved); your own play is not accepted.
     Unlimited tries; "Show me" gives the answer.                            */
  function openMoment(fromResult, entry) {
    app.analysisOpen = { fromResult, which: 'moment' };
    const v = RV.view(entry);
    const stats = RV.statsOf(entry);
    const back = () => openAnalysisSheet(fromResult);
    const mini = c => U.miniCardHTML(c);
    const bySuit = cards => cards.slice().sort((a, b) => C.suitOf(a) - C.suitOf(b) || C.rankOf(a) - C.rankOf(b));
    let sel = null, note = '', posed = false;

    /* the table as it lay: the knock card, the stock and the pile as on the felt,
       every face-up card in order under them (their takes marked), then the hand
       grouped as it is at the table                                           */
    const big = (c, cls) => U.cardEl(c, { cls }).outerHTML;
    function table() {
      const draw = v.phase !== 'discard';
      const scored = v.games.some(g => g.scores[0] || g.scores[1] || g.boxes[0] || g.boxes[1]);
      const sheet = scored ? hollyBoardHTML({ games: v.games, settings: app.match.settings }, { team: v.team, compact: true }) : '';
      const pname = escH((app.names && app.names.partner) || 'Partner');
      const partner = v.bulge === null ? ''
        : v.bulge > 0 ? `${pname} won ${v.bulge}` : v.bulge < 0 ? `${pname} lost ${-v.bulge}` : `${pname}: dead hand`;
      const top = v.pile.length ? v.pile[v.pile.length - 1] : null;
      const earlier = v.seq.filter(x => x.card !== top);
      const seq = earlier.map(x => `<span class="rv-sq rv-at-${x.at}">${big(x.card, 'rv-c-xs')}${x.at === 'them' ? '<small>took</small>' : x.at === 'you' ? '<small>you</small>' : ''}</span>`).join('');
      const kc = U.cardEl(v.knockCard, { cls: 'rv-c-kc' });
      if (v.doubled) kc.insertAdjacentHTML('beforeend', '<div class="rv-x2">×2</div>');
      return `<div class="rv-head"><h2>${draw ? 'Your draw' : 'Your throw'}<span>turn ${v.turn}</span></h2>${partner ? `<div class="rv-partner">${partner}</div>` : ''}</div>
        ${sheet}
        <div class="rv-felt">
          <div class="rv-kc${v.doubled ? ' doubled' : ''}">${kc.outerHTML}<div class="rv-kc-line">${v.ginOnly ? 'Gin only' : v.line + ' or under'}</div></div>
          <div class="rv-stock">${U.backEl({ cls: 'rv-c-pile' }).outerHTML}<div class="rv-kc-line">${v.stockLen}</div></div>
          <div class="rv-top">${top === null ? '' : big(top, 'rv-c-pile' + (draw ? ' rv-up' : ''))}</div>
        </div>
        ${seq ? `<div class="rv-seq">${seq}</div>` : ''}`;
    }
    function pose() {
      const draw = v.phase !== 'discard';
      // grouped as at the table (melds, then the loose cards), in two even rows so every card stays tappable
      const flat = [];
      U.handGroups(v.mine, 'melds').forEach((g, gi) => g.cards.forEach(c => flat.push({ c, gi, meld: g.meld })));
      const half = Math.ceil(flat.length / 2);
      const cardBtn = c => {
        const off = draw || !v.plays.some(x => x.card === c);
        return `<button class="rv-card${!draw && off ? ' barred' : ''}${sel === c ? ' on' : ''}" data-c="${c}"${off ? ' disabled' : ''}>${big(c, 'rv-c-hand')}</button>`;
      };
      const rowHTML = cells => {
        const runs = [];
        for (const x of cells) { const last = runs[runs.length - 1]; if (last && last.gi === x.gi) last.cards.push(x.c); else runs.push({ gi: x.gi, meld: x.meld, cards: [x.c] }); }
        return `<div class="rv-row">${runs.map(r => `<div class="rv-grp${r.meld ? ' meld' : ''}">${r.cards.map(cardBtn).join('')}</div>`).join('')}</div>`;
      };
      const hand = rowHTML(flat.slice(0, half)) + rowHTML(flat.slice(half));
      const sp = sel === null ? null : v.plays.find(x => x.card === sel);
      const btns = draw
        ? v.plays.map(p => `<button class="btn" data-a="${p.type}">${p.type === 'draw-stock' ? 'Draw from stock' : p.type === 'pass-upcard' ? 'Pass' : 'Take the ' + C.name(v.upcard)}</button>`).join('')
        : sp ? `<button class="btn" data-how="throw">Throw the ${C.name(sel)}</button>` +
          (sp.canGin ? '<button class="btn" data-how="knock">Gin</button>' : sp.canKnock ? `<button class="btn" data-how="knock">Knock with ${sp.dw}</button>` : '')
          : '';
      const body = U.openSheet(
        `${table()}
         <div class="rv-hand${draw ? '' : ' pick'}">${hand}</div>
         <div class="rv-play${btns ? '' : ' empty'}">${btns}</div>
         ${note ? `<div class="rv-note">${note}</div>` : ''}
         <div class="row-btns"><button class="btn ghost" id="rv-show">Show me</button><button class="btn" id="rv-back">Back</button></div>`,
        { locked: true, onDismiss: back, same: posed });
      posed = true;   // from here a tap on a card redraws this same view
      const sq = body.querySelector('.rv-seq');
      if (sq) sq.scrollLeft = sq.scrollWidth;   // the latest throws in view
      body.querySelector('#rv-back').addEventListener('click', back);
      body.querySelector('#rv-show').addEventListener('click', () => reveal(false));
      if (!draw) body.querySelectorAll('.rv-card:not([disabled])').forEach(b => b.addEventListener('click', () => {
        const c = Number(b.dataset.c);
        sel = sel === c ? null : c; note = ''; pose();
      }));
      body.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => answer(RV.actionFor(v, b.dataset.a))));
      body.querySelectorAll('[data-how]').forEach(b => b.addEventListener('click', () => answer(RV.actionFor(v, sel, b.dataset.how))));
    }
    function answer(action) {
      if (!action) return;
      const key = O.keyOf(action);
      if (RV.solved(stats, key, entry.key)) { reveal(true, action); return; }
      note = key === entry.key ? 'Your play.' : 'Not it.';
      sel = null;
      pose();
    }
    function reveal(solvedIt, action) {
      const fv = RV.final(entry);
      const best = fv.best;
      const why = reasonFor(best, entry);
      const truth = entry.truth || {};
      const luck = (truth.opp ? `<div class="rv-luck-row"><span class="eyebrow">${escH((app.names && app.names.opp) || 'Opponent')}</span>${bySuit(truth.opp).map(mini).join('')}</div>` : '') +
        (v.phase !== 'discard' && truth.next !== undefined ? `<div class="rv-luck-row"><span class="eyebrow">Stock</span>${mini(truth.next)}</div>` : '');
      const rest = RV.pick(app.coach.handLog).moments.map(m => m.entry);
      const next = rest[rest.indexOf(entry) + 1];
      const own = solvedIt && O.keyOf(action) !== fv.bestKey ? `<div class="rv-also">${playName(action, true)} was as good.</div>` : '';
      const body = U.openSheet(
        `${solvedIt ? `<div class="grade-chip optimal">${GRADE_WORD.optimal}</div>` : ''}
         <h2>${playName(best, true)}</h2>
         <div class="rv-gap">−${money2(fv.loss)} <span>± ${money2(fv.margin)}</span></div>
         ${why ? `<div class="drill-explain">${why}</div>` : ''}
         ${own}
         ${luck ? `<div class="rv-luck"><div class="eyebrow">Luck</div>${luck}</div>` : ''}
         <div class="row-btns">${next ? '<button class="btn" id="rv-back">Back</button><button class="btn gold" id="rv-next">Next</button>' : '<button class="btn" id="rv-back">Back</button>'}</div>`,
        { locked: true, onDismiss: back });
      body.querySelector('#rv-back').addEventListener('click', back);
      const nb = body.querySelector('#rv-next');
      if (nb) nb.addEventListener('click', () => openMoment(fromResult, next));
    }
    pose();
  }

  /* ---------------- human interaction ---------------- */
  /* A coach answer is being dealt out, or its verdict waits for Continue, or its play is
     committed and not yet made: nothing at the table may change the hand meanwhile (a tap,
     a double tap, a drag, a pile, the action bar). Continue makes the play itself.     */
  const handLocked = () => !!(app.coachDealing || app.drillVerdict || app.drillCommit);

  function onCardTap(card) {
    const hand = app.table.hand;
    if (app.busy || handLocked() || hand.current !== 0 || hand.phase !== 'discard') return;
    if (card === barredCard(hand) || app.drillAsk) return;   // the hand drew it as barred; a question waits on its buttons
    if (app.selected === card) {
      // second tap discards (quick flow), unless this is a drill pick
      if (app.drillPendingDiscard) { resolveDiscardDrill(card); return; }
      humanDiscard(card, false, false);
      return;
    }
    app.selected = card;
    renderAll();
  }

  /* a card dragged up onto the felt: a plain discard. True if it was taken. */
  function onCardThrow(card) {
    const hand = app.table.hand;
    if (app.busy || handLocked() || hand.current !== 0 || hand.phase !== 'discard') return false;
    if (card === barredCard(hand) || app.drillAsk) return false;   // it springs back to its place
    if (app.drillPendingDiscard) { resolveDiscardDrill(card); return false; }
    if (!E.legalActions(hand).some(a => a.type === 'discard' && a.card === card)) return false;
    humanDiscard(card, false, false);
    return true;
  }

  /* a hand you arranged yourself stays that way until Sort is pressed (or the deal ends) */
  function handOrder() {
    const o = app.order;
    if (!o || o.hand !== app.table.hand || o.sortMode !== app.sortMode) { app.order = null; return null; }
    return o.cards;
  }
  function onHandReorder(cards) {
    app.order = { hand: app.table.hand, sortMode: app.sortMode, cards };
    renderAll();
  }

  /* a tap on a pile, or a pile dragged down to the hand. True if the draw was taken. */
  function onPileDraw(which) {
    const hand = app.match && app.table.hand;
    if (!hand || app.busy || handLocked() || hand.current !== 0) return false;
    // a draw question is answered by the pile itself: the verdict comes first, then the draw is made
    if (app.drillAsk) {
      if (app.drillAsk.type === 'draw' && hand.phase === 'draw') answerDrill(app.drillAsk, which === 'stock' ? 'stock' : 'upcard');
      return false;
    }
    if (which === 'stock' && hand.phase === 'draw') { humanAct({ type: 'draw-stock' }); return true; }
    if (which === 'discard' && (hand.phase === 'upcard' || (hand.phase === 'draw' && !hand.forcedStock))) {
      humanAct({ type: 'take-upcard' });
      return true;
    }
    return false;
  }

  function pileTaps() {
    $('pile-stock').addEventListener('click', () => onPileDraw('stock'));
    $('pile-discard').addEventListener('click', () => onPileDraw('discard'));
  }

  /* grade + execute a human draw-phase action */
  /* judge a draw (or the first-upcard choice); resolves with the log entry once it is priced */
  function gradeDrawPlay(hand, action, tally) {
    const took = action.type === 'take-upcard';
    const g = K.gradeDraw(hand, took);
    const verb = hand.phase === 'upcard'
      ? (took ? 'Took the first upcard ' + C.name(E.upcard(hand)) : 'Passed the ' + C.name(E.upcard(hand)))
      : (took ? 'Took ' + C.name(E.upcard(hand)) : 'Drew from stock');
    return submitMove({
      kind: 'draw', turn: hand.turns[0] + 1, grade: g.grade, verb,
      text: verb + '. ' + g.explanation,
      facts: { makesMeld: g.makesMeld }, tally
    }, action);
  }

  /* `graded`: a coach drill has already judged and logged this play */
  /* is this play one the engine takes now (a stale button or a resumed answer may not be)? */
  function legalNow(hand, action) {
    try {
      return hand.current === 0 && E.legalActions(hand).some(a => a.type === action.type && (action.type !== 'discard' || a.card === action.card));
    } catch (e) { return false; }
  }
  /* the move is over (made, refused or failed): the table is live again, never left busy */
  function moveDone(gen) {
    if (gen !== app.gen) return;   // the table was left meanwhile: whatever is in play now owns busy
    app.selected = null;
    renderAll();
    app.busy = false;
    pump();
  }

  /* `graded`: a coach drill has already judged and logged this play (its committed answer).
     The play is logged, recorded and made in one step after the animation, so a hand saved
     at any moment (a verdict landing saves it) is whole: no play logged and not yet made. */
  async function humanAct(action, graded) {
    if (app.busy || (!graded && handLocked())) return;
    app.busy = true;
    const gen = app.gen;
    try {
      await animateHumanAction(action);
      if (gen !== app.gen) return;   // the table was left meanwhile
      const hand = app.table.hand;
      if (graded) app.drillCommit = null;
      if (!legalNow(hand, action)) { console.error('your move refused', action); return; }
      // silent grading of draw + first-upcard decisions
      if (!graded && ((hand.phase === 'draw' && !hand.forcedStock) || hand.phase === 'upcard')) {
        try { gradeDrawPlay(hand, action); } catch (e) { console.error('grade draw', e); }
      }
      recordAction(action, 0);
      const evs = actHere(action);
      feedObservers(evs);
    } catch (e) {
      console.error('your move', e);   // the table is not frozen by it
    } finally {
      moveDone(gen);
    }
  }

  async function animateHumanAction(action) {
    const hand = app.table.hand;
    // the card travels into its own slot as the hand is drawn again (UI.arriveNext), so nothing waits
    // here; a card dragged off a pile comes on from where it was let go
    const dropped = U.takeDropRect();
    try {
      if (action.type === 'take-upcard') {
        const top = $('pile-discard').querySelector('.card.top');
        U.arriveNext(E.upcard(hand), dropped || (top ? top.getBoundingClientRect() : U.rectOfId('pile-discard')));
      } else if (action.type === 'draw-stock') {
        const back = $('pile-stock').querySelector('.card');
        U.arriveNext(hand.stock[hand.stock.length - 1], dropped || (back ? back.getBoundingClientRect() : U.rectOfId('pile-stock')));
      }
    } catch (e) {}
  }

  /* human discard (possibly with knock/gin) */
  async function humanDiscard(card, knock, gin, graded) {
    if (app.busy || (!graded && handLocked())) return;
    const gen = app.gen;
    if (card === barredCard(app.table.hand)) return;   // the card just taken may not go straight back

    // coach: a best-throw drill takes a plain throw as its answer. Knock and Gin are
    // not plain throws: the drill is dropped and the knock or gin is made.
    if (app.drillPendingDiscard && !graded) {
      if (!knock && !gin) { resolveDiscardDrill(card); return; }
      app.drillPendingDiscard = null;
    }

    app.busy = true;
    try {
      // animate
      try {
        const cardEls = document.querySelectorAll('#hand .card');
        let fromRect = null;
        cardEls.forEach(el => { if (Number(el.dataset.card) === card) fromRect = el.getBoundingClientRect(); });
        if (fromRect) await U.flyCard(card, fromRect, U.rectOfId('pile-discard'));
      } catch (e) {}
      if (gen !== app.gen) return;   // the table was left meanwhile
      const hand = app.table.hand;
      if (graded) app.drillCommit = null;
      if (!legalNow(hand, { type: 'discard', card })) { console.error('your throw refused', card); return; }
      gradeHumanDiscard(hand, card, knock, gin, graded);
      recordAction({ type: 'discard', card, knock, gin }, 0);
      const evs = actHere({ type: 'discard', card, knock, gin });
      feedObservers(evs);
    } catch (e) {
      console.error('your throw', e);   // the table is not frozen by it
    } finally {
      moveDone(gen);
    }
  }

  /* silent grading of a throw: the discard choice and the knock decision (made just before the throw) */
  function gradeHumanDiscard(hand, card, knock, gin, graded) {
    try {
      if (graded) { /* a coach drill already judged this play */ }
      else if (oracleReady()) gradePlay(hand, card, knock, gin);
      else {
      const g = K.gradeDiscard(app.coach, hand, card);
      if (g) {
        const pos = K.snapshot(hand);
        K.logMove(app.coach, {
          kind: 'discard', turn: hand.turns[0] + 1, grade: g.grade,
          chosen: C.name(card), pos,
          text: 'Threw the ' + C.name(card) + '. ' + g.explanation
        });
      }
      const acts = E.legalActions(hand);
      const entry = acts.find(a => a.type === 'discard' && a.card === card);
      const anyKnockable = acts.some(a => a.canKnock || a.canGin);
      if (entry && (entry.canKnock || entry.canGin) && !gin) {
        const rest = hand.hands[0].filter(c => c !== card);
        const gr = C.ginRating(rest, E.unseenFor(hand, 0));
        const g2 = K.gradeKnock(hand, knock, entry.deadwood, gr, app.table, card, app.coach.est, app.names);
        const pos = K.snapshot(hand);
        K.logMove(app.coach, {
          kind: 'knock', turn: hand.turns[0] + 1, grade: g2.grade,
          chosen: knock ? 'knock' : 'play on', pos,
          text: (knock ? 'Knocked at ' + entry.deadwood : 'Played on at ' + entry.deadwood) + '. ' + g2.explanation
        });
      } else if (!entry || (!entry.canKnock && !entry.canGin)) {
        if (anyKnockable && !gin && !knock) {
          // player had a knock available on a different discard and walked past it
          const k = acts.find(a => a.canKnock || a.canGin);
          if (k && k.canGin) {
            K.logMove(app.coach, {
              kind: 'knock', turn: hand.turns[0] + 1, grade: 'blunder',
              text: 'Missed gin: throwing the ' + C.name(k.card) + ' would have given you gin.'
            });
          }
        }
      }
      }
    } catch (e) { console.error('grade discard', e); }
  }

  function feedObservers(evs) {
    for (const ev of evs) {
      A.observe(app.brain, ev);
      K.onEvent(app.coach, ev);
      if (ev.type === 'improper-knock' && ev.player === 0) {
        // real rules: your hand is exposed and play continues
        for (const c of ev.exposed) app.brain.est.knownIn.add(c);
        U.toast('Improper knock: ' + ev.dw + ' is over the line. Hand exposed, play on.');
        K.logMove(app.coach, {
          kind: 'knock', turn: app.table.hand.turns[0] + 1, grade: 'blunder',
          text: `Improper knock at ${ev.dw} (line is ${app.table.hand.ginOnly ? 'gin only' : app.table.hand.knockLimit}). Your hand is exposed and ${app.names.opp} now plays with perfect information. Count twice, knock once.`
        });
      }
    }
    saveMatch();   // every completed action at your table (table two's turns with it)
  }

  /* ---------------- game pump ---------------- */
  function pump() {
    const hand = app.table && app.table.hand;
    if (!hand || !onTable()) return;   // nothing at the table moves while it is not on screen
    if (hand.phase === 'over') { onHandOver(); return; }
    if (hand.phase === 'layoff') { openLayoffSheet(); return; }
    if (hand.current === 1) { aiTurn(); return; }
    // human's move — maybe fire a coach drill at this decision point
    maybeFireDrill();
  }

  /* pro mode: find your own layoffs */
  function openLayoffSheet() {
    const hand = app.table.hand;
    const p = hand.pending;
    const chosen = new Set();
    function body() {
      const dwCards = p.dArrPre.deadwood.map(c =>
        `<span class="lo-card${chosen.has(c) ? ' on' : ''}" data-lo="${c}">${U.miniCardHTML(c)}</span>`).join('');
      return `<div class="eyebrow lead">Pro table · Layoffs</div>
        <h2>${escH(app.names.opp)} knocked</h2>
        <div class="sub">Tap every card of yours that plays onto their melds. Anything you miss counts against you, just like at the table.</div>
        ${U.revealRowHTML(app.names.opp + '’s melds', { melds: p.kArr.melds, deadwood: p.kArr.deadwood }, null, p.kArr.points + ' deadwood')}
        <div class="eyebrow sec">Your unmatched cards</div>
        <div class="lo-row">${dwCards}</div>
        <div class="row-btns"><button class="btn gold" id="lo-done">Lay off ${chosen.size ? chosen.size + ' card' + (chosen.size > 1 ? 's' : '') : 'nothing'}</button></div>`;
    }
    function wire(el) {
      el.querySelectorAll('[data-lo]').forEach(s => s.addEventListener('click', () => {
        const c = Number(s.dataset.lo);
        chosen.has(c) ? chosen.delete(c) : chosen.add(c);
        wire(U.openSheet(body(), { locked: true, same: true }));
      }));
      el.querySelector('#lo-done').addEventListener('click', () => {
        const missed = E.finalizeLayoffs(app.table, [...chosen]);
        if (missed.length) {
          const pts = missed.reduce((t, c) => t + C.pointsOf(c), 0);
          K.logMove(app.coach, {
            kind: 'discard', turn: hand.turns[0] + 1, grade: 'blunder',
            text: `Missed layoff${missed.length > 1 ? 's' : ''}: ${missed.map(C.name).join(', ')}, ${pts} points left on the table. At ${fmtMoney(matchStakes(app.match).box)} a box, points like these decide columns.`
          });
          U.toast('Missed: ' + missed.map(C.name).join(', '));
        }
        U.closeSheet();
        pump();
      });
    }
    wire(U.openSheet(body(), { locked: true }));
  }

  function maybeFireDrill() {
    const hand = app.table.hand;
    if (!app.coach.enabled) return;
    const key = hand.phase + ':' + hand.turn;
    if (app.drillChecked === key) return;
    app.drillChecked = key;
    // a sheet you opened (the menu, the tracker, the scoreboard) is not replaced by a drill under your finger
    if (U.sheetState().open) return;
    let point = null;
    if (hand.phase === 'draw' && !hand.forcedStock) point = 'draw';
    if (hand.phase === 'discard') point = 'discard';
    if (!point) return;
    let drill = null;
    // a knock decision is asked at once; anything else only once it has been pre-judged costly (Coach.maybeDrill)
    try { drill = K.maybeDrill(app.coach, hand, point, app.table, app.names); } catch (e) { console.error('drill', e); }
    if (drill) { openDrill(drill); return; }
    // a side quiz only once the money question has passed this decision by: here when
    // nothing is dealt out, else when the pre-judgement lands and finds it not costly
    if (!prejudgeDrill(hand, point, key)) sideQuiz(hand, point);
  }
  /* the hand's counting or read question, if this is its moment (Coach.maybeSideQuiz) */
  function sideQuiz(hand, point) {
    let drill = null;
    const plan = app.coach.sidePlan;
    try { drill = K.maybeSideQuiz && K.maybeSideQuiz(app.coach, hand, point, app.table, app.names); } catch (e) { console.error('side quiz', e); }
    if (drill) openDrill(drill);
    else if (app.coach.sidePlan !== plan) saveMatch();   // the hand's side quiz was planned here: kept with the hand
  }

  /* Deal the decision out before the player moves (Coach.prejudgeJob: every
     candidate play with the house play kept in the race, 1.3 s at most, ahead
     of anything else waiting). The question comes only if the verdict lands
     while the same decision is still open and untouched; nothing waits for it,
     so the table never stops or flashes. On a slow phone fewer deals fit in
     the 1.3 s, fewer plays clear the bar, and the player more often moves
     first: the coach asks less, never later.                               */
  function prejudgeDrill(hand, point, key) {
    if (!oracleReady() || !K.wantsPrejudge(app.coach, hand, point)) return false;
    let pj = null;
    try {
      const o = app.oracle;
      if (!o.sw) o.sw = Money.swing(o.model, app.match);
      pj = K.prejudgeJob(app.table, app.coach.est, O.context(o.model, app.match, app.table, o.sw));
    } catch (e) { console.error('prejudge', e); return false; }
    if (!pj) return false;
    const gen = app.gen, coach = app.coach;
    runJobFirst(pj.job, 'table').then(stats => {
      if (gen !== app.gen || !stats || !stats.n || pj.job.dropped) return;
      const now = app.table && app.table.hand;
      // still this decision, nobody has touched it, and nothing is on screen over it
      if (now !== hand || now.current !== 0 || now.phase + ':' + now.turn !== key || app.busy || app.aiLoop) return;
      if (app.selected != null || app.drillPendingDiscard || app.drillAsk || app.coachDealing || U.sheetState().open || !onTable() || coach !== app.coach || !coach.enabled) return;
      let drill = null;
      try { drill = K.maybeDrill(coach, now, point, app.table, app.names, K.prejudged(stats, pj.houseKey, pj.at)); } catch (e) { console.error('drill', e); }
      if (drill) openDrill(drill);
      else sideQuiz(now, point);   // the money question passed it by: the hand's side quiz may come here
    });
    return true;
  }

  /* The coach asks at the table, over nothing: the question is the status line, the
     answers are the action bar (a pile answers a draw question, a card a throw
     question, a number the counting question, a card name the read "which do they
     hold?"), so the hand and the pile top stay in view while you think. Only the
     read that puts three cards in order needs more: a short sheet above the hand. */
  function openDrill(drill) {
    // the hand's question is spent (Coach.maybeDrill, maybeSideQuiz): saved with the hand at once, so a
    // hand closed with the question open does not ask its one question again when it comes back
    saveMatch();
    if (drill.pickFromHand) {
      // discard drill: the hand stays live; the pick is the answer
      app.drillPendingDiscard = drill;
      renderAll();
      return;
    }
    if (drill.read && (drill.read.form !== 'certain' || !drill.prompt)) { openReadDrill(drill); return; }
    app.drillAsk = drill;
    renderAll();
  }
  function answerDrill(drill, answer) {
    if (app.drillAsk !== drill) return;   // one answer: a double tap must not judge (and log) the play twice
    app.drillAsk = null;
    const gen = app.gen, hand = app.table.hand;
    // the answer's drill count, minted now: counted once through the record's gate when its verdict
    // lands (with the play it makes, when it is one: Coach.settle), never for a table since left
    const tally = K.mint(app.coach, { drill: drill.type });
    let judged;
    try {
      const quick = drill.resolve(answer);
      // the play this answer makes (a draw, a knock), made after the verdict: committed now
      app.drillCommit = commitFor(drill, quick, hand);
      coachDealing(true);
      judged = judgeDrill(drill, answer, quick, tally);
    } catch (e) { console.error('drill answer', e); judged = Promise.reject(e); }
    // the answer, its logged play and the play still to make, saved together: a hand resumed from here
    // makes that play once (resumeHand), and the play is judged and counted once (rehydrateLog)
    saveMatch();
    judged.then(res => {
      if (!res.tallied) K.recordDrillResult(app.coach, drill.type, res.grade, tally);
      if (gen !== app.gen) return;   // the table was left while it was dealt out: nothing shown
      showDrillResult(drill, res);
    }).catch(e => {
      console.error('drill verdict', e);
      if (gen !== app.gen) return;
      coachDealing(false);
      applyDrillAnswer();   // no verdict to show: the committed play (if any) is made, the table goes on
    });
  }
  /* the play a coach answer makes once its verdict is read: { act, at } (null: the player plays on) */
  function commitFor(drill, quick, hand) {
    if (!drill || drill.side || !quick || !quick.apply || !hand) return null;
    const at = hand.phase + ':' + hand.turn;
    if (drill.type === 'draw') return { act: { type: quick.apply === 'upcard' ? 'take-upcard' : 'draw-stock' }, at };
    if (drill.type === 'knock' && quick.apply.card !== undefined) {
      return { act: { type: 'discard', card: quick.apply.card, knock: !!quick.apply.knock, gin: !!quick.apply.gin }, at };
    }
    return null;
  }
  /* a committed play that can still be made: the same decision, yours, and legal */
  function commitOK(c, hand) {
    return !!(c && c.act && typeof c.act.type === 'string' && typeof c.at === 'string' && hand &&
      hand.current === 0 && hand.phase + ':' + hand.turn === c.at && legalNow(hand, c.act));
  }
  /* make the committed play (graded: it was judged and logged when answered). False if there is none to make */
  function makeCommitted() {
    const c = app.drillCommit;
    if (!c) return false;
    const hand = app.table && app.table.hand;
    if (app.busy || !commitOK(c, hand)) { app.drillCommit = null; return false; }   // stale: nothing is made
    if (c.act.type === 'discard') humanDiscard(c.act.card, !!c.act.knock, !!c.act.gin, true);
    else humanAct(c.act, true);
    return true;
  }

  const skipDrill = () => { U.closeSheet(); renderAll(); };

  /* The opponent read in a short sheet that stops above the hand (no blur): their
     takes and throws in order, then three cards. Uncertain form: tap all three,
     most likely first (a tap on a numbered card takes it and those after it back).
     Certain form (only when asked without a prompt): tap the one they surely hold. */
  function openReadDrill(drill) {
    const q = drill.read, order = [];
    const who = escH((app.names && app.names.opp) || 'your opponent');
    let drawn = false;
    const mini = c => U.miniCardHTML(c);
    const moves = q.moves.map(m => `<span class="rv-mv rv-${m.verb}">${mini(m.card)}<small>${m.verb}</small></span>`).join('');
    function render() {
      const cards = q.cards.map(x => {
        const i = order.indexOf(x.card);
        return `<button class="rv-pickcard${i >= 0 ? ' on' : ''}" data-c="${x.card}">${U.cardEl(x.card, { cls: 'rv-c-pick' }).outerHTML}${i >= 0 ? `<span class="rv-ord">${i + 1}</span>` : ''}</button>`;
      }).join('');
      const body = U.openSheet(
        `<h2>${q.form === 'certain' ? `Which does ${who} hold?` : `Which does ${who} most likely hold?`}</h2>
         <div class="rv-moves">${moves}</div>
         ${q.form === 'certain' ? '' : '<div class="rv-ask">All three, most likely first</div>'}
         <div class="rv-pick">${cards}</div>`,
        { locked: true, onDismiss: skipDrill, same: drawn, ask: true });
      drawn = true;
      let picked = false;
      body.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => {
        if (picked) return;   // one tap per drawing: a double tap is not two picks
        picked = true;
        const c = Number(b.dataset.c);
        if (q.form === 'certain') { done(c); return; }
        const i = order.indexOf(c);
        if (i >= 0) order.splice(i); else order.push(c);
        if (order.length === q.cards.length) done(order.slice());
        else render();
      }));
    }
    function done(answer) {
      const res = drill.resolve(answer);
      K.recordDrillResult(app.coach, 'read', res.grade);
      showDrillResult(drill, res);
    }
    render();
  }
  /* one line a card: the evidence and how often it holds; then what they held, as luck */
  function readResultHTML(res) {
    const mini = c => U.miniCardHTML(c);
    const why = l => (l.group === 'held' ? 'they took it'
      : l.group === 'gone' ? 'they let it go'
      : l.group === 'nearTaken' ? `near the ${C.name(l.link)} they took`
      : l.group === 'nearThrown' ? `near the ${C.name(l.link)} they threw`
      : l.group === 'dead' ? 'no meld left' : 'no link');
    const lines = res.lines.map(l => `<div class="rv-line">${mini(l.card)}<span class="rv-why">${why(l)}</span>${l.group === 'held' || l.group === 'gone' ? '' : `<span class="rv-rate">${Math.round(l.rate * 100)}%</span>`}</div>`).join('');
    const uncertain = res.lines.some(l => l.group !== 'held' && l.group !== 'gone');
    const luck = uncertain ? `<div class="rv-luck"><div class="eyebrow">Luck</div><div class="rv-luck-row">${res.held.length ? res.held.map(mini).join('') : '<span>None held</span>'}</div></div>` : '';
    return `<div class="rv-lines">${lines}</div>${luck}`;
  }

  /* while an answer is dealt out the status line says so and nothing at the table can be pressed */
  function coachDealing(on) {
    app.coachDealing = !!on;
    if (app.table && app.table.hand) renderStatusAndActions();
  }
  const dealingSheet = () => coachDealing(true);

  /* A drill answer about a draw or a knock is the real play, so it is judged the
     way every play is: dealt out and priced on this sheet. `quick` is the old
     rule-of-thumb answer, used when it cannot be dealt out.                     */
  function judgeDrill(drill, answer, quick, tally) {
    const hand = app.table.hand;
    // a side quiz (counting, read) is not a play: nothing logged, nothing priced, no house figure
    if (drill.side) return Promise.resolve(quick);
    // Logged at once, by the coach's own rule for the decision answered (the knock rule, the draw
    // rule): only when nothing can be dealt out. Only an answer that is the play made is logged; a
    // Play on is not (the throw that follows is the play, logged and judged as any throw).
    const byRule = () => {
      if (answer !== 'play' && (drill.type === 'draw' || drill.type === 'knock' || drill.type === 'discard')) {
        K.logMove(app.coach, {
          kind: drill.type, turn: hand.turns[0] + 1, grade: quick.grade,
          text: 'Coach drill: ' + drill.title + '. ' + quick.explanation
        });
      }
      return Promise.resolve(quick);
    };
    if (!oracleReady() || answer === 'gin' || (drill.type !== 'draw' && drill.type !== 'knock')) return byRule();
    try {
      // the drill's count rides with the play (Coach.settle counts it with the play's verdict, once)
      const priced = entry => ({ grade: entry.grade, explanation: entry.text, apply: quick.apply, graded: true, tallied: true });
      if (drill.type === 'draw') {
        dealingSheet(drill.title);
        return gradeDrawPlay(hand, answer === 'upcard' ? { type: 'take-upcard' } : { type: 'draw-stock' }, tally).then(priced);
      }
      if (answer === 'knock') {
        dealingSheet(drill.title);
        return gradePlay(hand, quick.apply.card, true, false, tally).then(priced);
      }
      // playing on: set against the knock, but not logged, because the throw that follows is the play that
      // counts. The drill's own count waits on this verdict, saved with the hand (coach.asks) until it lands
      const best = A.scoreDiscards(hand, 0, app.coach.est)[0];
      const knockAct = { type: 'discard', card: drill.knockCard, knock: true };
      const playAct = { type: 'discard', card: best.card };
      const o = app.oracle;
      if (!o.sw) o.sw = Money.swing(o.model, app.match);
      dealingSheet(drill.title);
      const ask = {
        tally, rule: quick.grade, key: O.keyOf(playAct),
        job: {
          snap: O.snapshot(app.table, 0, app.coach.est), actions: [knockAct, playAct],
          ctx: O.context(o.model, app.match, app.table, o.sw), n: 800, first: 16, budgetMs: 1800, focus: null,
          at: { bulge: app.table.bulge === undefined ? null : app.table.bulge, bulgeBoxes: app.table.bulgeBoxes === undefined ? null : app.table.bulgeBoxes, doubled: !!hand.doubled }
        }
      };
      (app.coach.asks = app.coach.asks || []).push(ask);
      return judgeAsk(ask).then(v => (v ? {
        grade: v.grade, apply: null, tallied: true,
        explanation: `Playing on (judged with the ${C.name(best.card)} thrown). ` + verdictText(v, { action: playAct, facts: {} })
      } : Object.assign({}, quick, { tallied: true })));
    } catch (e) { console.error('judge drill', e); return byRule(); }
  }

  /* A Play on answer's drill count: dealt out (or by the knock rule, with nothing dealt out) and
     counted through the record's gate once; kept with the hand until then, so a table left while
     it is dealt out counts it after Continue (rehydrateLog). -> the verdict, or null.        */
  function judgeAsk(a) {
    const done = v => {
      const grade = v ? v.grade : a.rule;
      const wrote = K.settle(app.coach, a.tally, { drill: 'knock', right: grade === 'optimal' || grade === 'good' });
      if (a.kept) dropKept(a);   // let go for good (keepPending): counted once, here
      else if (wrote) {
        const list = app.coach.asks || [], i = list.indexOf(a);
        if (i >= 0) { list.splice(i, 1); saveMatch(); }
      }
      return v;
    };
    if (!a.job || !a.job.ctx) return Promise.resolve(done(null));
    return runJob(a.job, a.kept ? 'kept' : 'table').then(stats => done(stats && stats.n ? O.verdict(stats, a.key) : null));
  }

  function showDrillResult(drill, res) {
    app.drillVerdict = drill;   // the hand stays locked until Continue
    coachDealing(false);
    let gone = false;
    const go = () => { if (gone || app.drillVerdict !== drill) return; gone = true; U.closeSheet(); applyDrillAnswer(); };
    const body = U.openSheet(
      `<div class="grade-chip ${res.grade}">${GRADE_WORD[res.grade] || res.grade}</div>
       ${res.read ? readResultHTML(res.read) : `<div class="drill-explain">${res.explanation}</div>`}
       <div class="row-btns"><button class="btn gold" id="drill-continue">Continue</button></div>`,
      // leaving is the same as Continue: a judged draw or knock is then made. Every verdict at
      // the table, a side quiz's included, is a short sheet that stops above the hand
      { locked: true, onDismiss: go, ask: true }
    );
    body.querySelector('#drill-continue').addEventListener('click', go);
  }

  /* Continue on a coach verdict: the committed play is made (it was judged and logged when
     answered, so it is not judged again); a counting, read or declined-knock answer has none
     and play goes on. A stale verdict makes nothing, and nothing here can leave the table busy. */
  function applyDrillAnswer() {
    app.drillVerdict = null;
    try {
      if (makeCommitted()) return;
    } catch (e) {
      console.error('drill answer', e);
      app.drillCommit = null;
      app.busy = false;
    }
    if (!app.table || !app.table.hand) return;
    renderAll();
    pump();
  }

  function resolveDiscardDrill(card) {
    const drill = app.drillPendingDiscard;
    app.drillPendingDiscard = null;
    const hand = app.table.hand, gen = app.gen;
    // the card picked is the play: committed now, made when the verdict is read (or on resume)
    app.drillCommit = { act: { type: 'discard', card, knock: false, gin: false }, at: hand.phase + ':' + hand.turn };
    const tally = K.mint(app.coach, { drill: 'discard' });   // counted with the play's verdict (Coach.settle)
    const show = res => {
      if (!res.tallied) K.recordDrillResult(app.coach, 'discard', res.grade, tally);
      if (gen !== app.gen) return;   // the table was left while it was dealt out
      app.drillVerdict = drill;
      coachDealing(false);
      let played = false;
      const play = () => { if (played || app.drillVerdict !== drill) return; played = true; U.closeSheet(); applyDrillAnswer(); };
      const body = U.openSheet(
        `<div class="grade-chip ${res.grade}">${GRADE_WORD[res.grade] || res.grade}</div>
         <div class="drill-explain">${res.explanation}</div>
         <div class="row-btns"><button class="btn gold" id="drill-continue">Play it</button></div>`,
        { locked: true, onDismiss: play, ask: true }   // the card was chosen: leaving plays it
      );
      body.querySelector('#drill-continue').addEventListener('click', play);
    };
    if (oracleReady()) {
      // the throw is the real play: deal it out and price it like any other
      dealingSheet('Best throw');
      let judged;
      try { judged = gradePlay(hand, card, false, false, tally); } catch (e) { judged = Promise.reject(e); }
      saveMatch();   // the pick, its logged play and the play still to make, together (see answerDrill)
      judged.then(entry => show({ grade: entry.grade, explanation: entry.text, tallied: true })).catch(e => {
        console.error('throw verdict', e);
        if (gen !== app.gen) return;
        coachDealing(false);
        applyDrillAnswer();
      });
      return;
    }
    const res = drill.resolve(card);
    K.logMove(app.coach, {
      kind: 'discard', turn: hand.turns[0] + 1, grade: res.grade,
      text: 'Coach drill: threw the ' + C.name(card) + '. ' + res.explanation
    });
    saveMatch();
    show(res);
  }

  /* ---------------- AI turn ---------------- */
  /* One rival turn at a time, ever: a second call while one is under way, or
     when it is not the rival's turn, does nothing. Each wait checks that the
     hand it began in is still the hand in play (app.gen).                   */
  async function aiTurn() {
    const hand = app.table.hand;
    if (app.aiLoop || hand.current !== 1 || hand.phase === 'over') return;
    const me = {}, gen = app.gen;
    app.aiLoop = me;
    app.busy = true;
    let again = false;
    try {
      again = await aiMove(hand, gen);
    } catch (e) {
      console.error('AI turn', e);   // not even a fallback move could be made: stop rather than loop
    } finally {
      if (app.aiLoop === me) app.aiLoop = null;
      if (gen === app.gen) app.busy = false;
    }
    if (again) pump();
  }

  /* the rival's move: true if play should go on from here */
  async function aiMove(hand, gen) {
    U.setOppStatus('thinking', true);
    await wait(550 + Math.random() * 550);
    if (gen !== app.gen) return false;

    let action;
    try {
      action = A.decide(app.brain, app.table);
    } catch (e) {
      console.error('AI decide failed', e);
      action = fallbackAction(hand);
    }
    if (!action || !action.type) action = fallbackAction(hand);

    // animate AI action
    try {
      if (action.type === 'take-upcard') {
        const top = E.upcard(hand);
        U.setOppStatus('took the ' + C.name(top));
        await U.flyCard(top, U.rectOfId('pile-discard'), U.rectOfId('opp-cards'));
        U.toast(app.names.opp + ' took ' + C.name(top));
      } else if (action.type === 'draw-stock') {
        U.setOppStatus('drew from the stock');
        await U.flyCard(null, U.rectOfId('pile-stock'), U.rectOfId('opp-cards'));
      } else if (action.type === 'pass-upcard') {
        U.setOppStatus('passed the ' + C.name(E.upcard(hand)));
        await wait(420);
      } else if (action.type === 'discard') {
        await U.flyCard(action.card, U.rectOfId('opp-cards'), U.rectOfId('pile-discard'));
        U.setOppStatus('discarded ' + C.name(action.card));
      }
    } catch (e) {}
    if (gen !== app.gen) return false;

    let evs;
    recordAction(action, 1);
    try { evs = actHere(action); }
    catch (e) {   // the engine refused the move: a legal one instead, so the hand goes on
      console.error('AI move refused', action, e);
      if (app.rec) app.rec.actions.pop();
      action = fallbackAction(hand);
      recordAction(action, 1);
      evs = actHere(action);
    }
    feedObservers(evs);
    renderAll();
    // the rival drew and now throws: a brief pause, for readability
    await wait(hand.phase !== 'over' && action.type !== 'discard' && hand.current === 1 ? 420 : 150);
    return gen === app.gen;
  }

  /* ---------------- hand end / scoring ---------------- */
  function onHandOver() {
    const match = app.match, hand = app.table.hand, gen = app.gen;
    const r = hand.result;
    if (r.dead && !isTeam()) {
      U.toast('Stock ran dry: dead hand, redeal');
      setTimeout(() => { if (gen === app.gen) startNextHand(); }, 1400);
      return;
    }
    if (!app.handCounted) {
      app.handCounted = true;
      const st = app.coach.stats;
      const won = !r.dead && r.winner === 0;
      if (oracleReady()) st.pricedHands = (st.pricedHands || 0) + 1;
      if (!r.dead) {
        st.hands++;
        K.weekBucket(st).hands++;
        if (won) st.handWins++;
        K.bookHouseHand(app.coach);   // the rating of decisions: this hand joins it (Coach.houseRating)
        app.lastResults = (app.lastResults || []).concat([won ? 1 : 0]).slice(-6);
        if (won && (r.type === 'gin' || r.type === 'big-gin')) match.myGins = (match.myGins || 0) + 1;
      }
      if (!isTeam()) {
        // heads-up: the hand is the box. In a team deal the box is settled
        // once both tables are done (settleTeamDeal).
        const boxD = (won ? 1 : -1) * (match.lastEntries || 1) * matchStakes(match).box;
        st.money += boxD;
        match.accruedMoney = (match.accruedMoney || 0) + boxD;
        if (match.over) {
          st.matches++;
          if (settlement(match).total > 0) st.matchWins++;
          evaluateMilestones(match);
          bookMatchMoney(match);
        }
      }
      // tilt alert (once per session)
      const t = st.tilt;
      if (!app.tiltWarned && t.tilted[1] >= 12 && t.normal[1] >= 30) {
        const rT = t.tilted[0] / t.tilted[1], rN = Math.max(0.01, t.normal[0] / t.normal[1]);
        if (rT > 2 * rN) {
          app.tiltWarned = true;
          U.toast('After two straight losses your costly plays run ' + Math.round(rT / rN) + ' times as often. Slow down: streaks are normal.', 3500);
        }
      }
      K.saveStats(app.coach);
    }
    saveMatch();
    // the hand's deeper review, whatever ended it (a committed coach answer made on resume included)
    setTimeout(() => { if (gen === app.gen) startReview(); }, 0);
    // whoever ended it lays the hand down before any result appears
    const toResult = () => { if (gen === app.gen) backToResult(); };   // not if the table was left meanwhile
    if (r.dead || hand.laidDown) { setTimeout(toResult, 550); return; }
    hand.laidDown = true;
    U.layDown({
      who: r.knocker === 0 ? myName() : app.names.opp,
      kind: r.type === 'gin' || r.type === 'big-gin' ? r.type : 'knock',
      melds: r.knockerArr.melds, deadwood: r.knockerArr.deadwood,
      from: r.knocker === 0 ? 'hand' : 'opp', mine: r.knocker === 0
    }).then(toResult);
  }

  /* the hand's points as the player reads them: theirs carry a minus */
  const handPts = (n, won) => (won ? '+' : '−') + n;

  function openResultSheet() {
    const match = app.match, hand = app.table.hand, r = hand.result;
    const youWon = r.winner === 0;
    const typeNames = { gin: 'Gin', 'big-gin': 'Gin', knock: 'Knock', undercut: 'Undercut', 'gin-off': 'Gin off' };
    const who = youWon ? 'You win the hand' : `${escH(app.names.opp)} wins the hand`;
    const laidSet = new Set(r.layoff);
    const knockerLabel = r.knocker === 0 ? myName() : app.names.opp;
    const defenderLabel = r.defender === 0 ? myName() : app.names.opp;

    let html = `
      <div class="eyebrow lead">${typeNames[r.type]}${r.doubled ? ' · spades ×2' : ''}</div>
      <h2>${who}</h2>
      <div class="result-headline">
        <div class="pts${youWon ? '' : ' down'}">${handPts(r.points, youWon)}</div>
        ${r.doubled ? '<div class="x2badge">×2</div>' : ''}
      </div>
      ${gamesClosedHTML(dealBeats())}
      <div class="sub">${resultBlurb(r)}</div>
      <div class="reveal-hands">
        ${U.revealRowHTML(knockerLabel + ': ' + (r.type === 'undercut' || r.type === 'gin-off' ? 'knocked' : typeNames[r.type].toLowerCase()),
          r.knockerArr, null, r.knockerDW + ' deadwood')}
        ${U.revealRowHTML(defenderLabel + (r.layoff.length ? ', laid off ' + r.layoff.length : ''),
          r.defenderArr, laidSet, r.defenderDW + ' deadwood after layoffs')}
      </div>
      <div class="sub">${(match.lastEntries || 1)} box${(match.lastEntries || 1) > 1 ? 'es' : ''} ${r.winner === 0 ? 'made' : 'given up'} (${fmtD((r.winner === 0 ? 1 : -1) * (match.lastEntries || 1) * matchStakes(match).box)}) · running ${fmtD(settlement(match).total)}</div>
      ${hollyBoardHTML(match)}
      <div class="row-btns">
        ${app.coach.handLog.length ? '<button class="btn" id="btn-analysis">Analysis</button>' : ''}
        <button class="btn gold" id="btn-next">${match.over ? 'Final tally' : 'Next hand'}</button>
      </div>
      <div class="row-btns more">
        <button class="btn ghost" id="btn-replay">Replay hand</button>
        <button class="btn ghost" id="btn-recall">Pile quiz</button>
        ${Object.keys(app.beliefMarks || {}).length ? '<button class="btn ghost" id="btn-grid-score">Score my reads</button>' : ''}
      </div>`;
    const body = U.openSheet(html, { locked: true });
    // an undercut: the under-cutter's hand rises over the knocker's and the points roll up
    if (!hand.resultShown) {
      // the first time this result shows (not on the way back from Analysis)
      hand.resultShown = true;
      if (r.type === 'undercut') U.undercutMoment(body.querySelector('.reveal-hands'), body.querySelector('.result-headline .pts'), r.points, v => handPts(v, youWon));
      U.writeBoard(body, app.sheetBefore, match);
    }
    const analysisBtn = body.querySelector('#btn-analysis');
    if (analysisBtn) analysisBtn.addEventListener('click', () => openAnalysisSheet(true));
    body.querySelector('#btn-next').addEventListener('click', () => {
      U.closeSheet();
      if (match.over) openMatchEndSheet();
      else startNextHand();
    });
    body.querySelector('#btn-replay').addEventListener('click', openReplaySheet);
    body.querySelector('#btn-recall').addEventListener('click', openRecallSheet);
    const gridBtn = body.querySelector('#btn-grid-score');
    if (gridBtn) gridBtn.addEventListener('click', openGridScoreSheet);
  }

  /* ---------- replay ---------- */
  function openReplaySheet() {
    if (!app.rec || !app.rec.actions.length) { U.toast('Nothing recorded'); return; }
    const session = window.Replay.start(app.rec, app.names);
    let drawn = false;
    function render() {
      const hand = session.hand;
      const know = session.knowable();
      const arr0 = C.bestArrangement(hand.hands[0]);
      const arr1 = C.bestArrangement(hand.hands[1]);
      const top = hand.discard[hand.discard.length - 1];
      const body = U.openSheet(
        `<div class="eyebrow lead">Replay · step ${session.step}/${session.total}</div>
         <h2 class="h-name">${session.narration()}</h2>
         <div class="sub">Pile: ${top !== undefined ? C.name(top) : 'empty'} (${hand.discard.length}) · stock ${hand.stock.length} · ${know.dead} of ${know.live} hidden cards provably dead · ${know.knownIn} of ${escH(app.names.opp)}’s cards known</div>
         <div class="reveal-hands">
           ${U.revealRowHTML(app.names.opp, arr1, null, arr1.points + ' deadwood')}
           ${U.revealRowHTML(myName(), arr0, null, arr0.points + ' deadwood')}
         </div>
         <div class="row-btns">
           <button class="btn" id="rp-back" ${session.step === 0 ? 'disabled' : ''}>← Back</button>
           <button class="btn gold" id="rp-next" ${session.step >= session.total ? 'disabled' : ''}>Next →</button>
         </div>
         <div class="row-btns more"><button class="btn ghost" id="rp-close">Close replay</button></div>`,
        { locked: true, onDismiss: backToResult, same: drawn });
      drawn = true;   // stepping redraws this same view
      body.querySelector('#rp-back').addEventListener('click', () => { session.back(); render(); });
      body.querySelector('#rp-next').addEventListener('click', () => { session.next(); render(); });
      body.querySelector('#rp-close').addEventListener('click', backToResult);
    }
    render();
  }

  /* ---------- pile recall quiz ---------- */
  function openRecallSheet() {
    const quiz = K.buildRecallQuiz(app.table.hand);
    if (!quiz) { U.toast('Too few cards showed this hand'); return; }
    const body = U.openSheet(
      `<div class="eyebrow lead">Memory · Pile recall</div>
       <h2>Which one hit the table?</h2>
       <div class="sub">Exactly one of these was face up this hand.</div>
       <div class="drill-options">${quiz.options.map(c =>
         `<button class="btn" data-id="${c}">${C.name(c)}</button>`).join('')}</div>`,
      { locked: true, onDismiss: backToResult });
    body.querySelectorAll('[data-id]').forEach(btn => btn.addEventListener('click', () => {
      const right = Number(btn.dataset.id) === quiz.real;
      K.recordDrillResult(app.coach, 'counting', right ? 'optimal' : 'blunder');
      const b2 = U.openSheet(
        `<div class="eyebrow lead">Memory · Pile recall</div>
         <div class="grade-chip ${right ? 'optimal' : 'blunder'}">${right ? GRADE_WORD.optimal : GRADE_WORD.blunder}</div>
         <div class="drill-explain">${C.name(quiz.real)} hit the table this hand. The book: rehearse the pile after every deal. Fifteen cards a hand is all it takes.</div>
         <div class="row-btns"><button class="btn" id="rc-back">Back</button></div>`,
        { locked: true, onDismiss: backToResult });
      b2.querySelector('#rc-back').addEventListener('click', backToResult);
    }));
  }

  /* ---------- belief grid scoring ---------- */
  function openGridScoreSheet() {
    const s = K.scoreBeliefGrid(app.coach, app.table.hand, app.beliefMarks || {});
    const arr1 = C.bestArrangement(app.table.hand.hands[1]);
    const body = U.openSheet(
      `<div class="eyebrow lead">Memory · Opponent tracker</div>
       <h2>${s.inRight + s.outRight} right · ${s.inWrong + s.outWrong} wrong</h2>
       <div class="sub">✓ in their hand: ${s.inRight}/${s.inRight + s.inWrong} correct · ✗ dead calls: ${s.outRight}/${s.outRight + s.outWrong} correct.<br>
       The Plug Rule had ${s.knowableDead} hidden cards provably dead and ${s.knownIn} of ${escH(app.names.opp)}’s cards certain: the ceiling for a perfect tracker.</div>
       ${U.revealRowHTML(app.names.opp + '’s hand', arr1, null, arr1.points + ' deadwood')}
       <div class="row-btns"><button class="btn" id="gs-back">Back</button></div>`,
      { locked: true, onDismiss: backToResult });
    body.querySelector('#gs-back').addEventListener('click', backToResult);
  }

  function resultBlurb(r) {
    const opp = escH(app.names.opp);
    if (r.type === 'gin') return `${r.knocker === 0 ? 'You' : opp} went gin: ${app.match.settings.ginBonus} bonus plus ${r.defenderDW} opponent deadwood.`;
    if (r.type === 'big-gin') return `Eleven melded cards: gin. ${app.match.settings.bigGinBonus} bonus plus ${r.defenderDW} deadwood.`;
    if (r.type === 'gin-off') return `${r.defender === 0 ? 'You' : opp} laid off to nothing: a gin off. A flat ${app.match.settings.ginOffBonus || 30}.`;
    if (r.type === 'knock') return `Knocked at ${r.knockerDW} against ${r.defenderDW} after layoffs.`;
    return `${r.defender === 0 ? 'You' : opp} undercut the knock: ${r.knockerDW} knocked into ${r.defenderDW}. Bonus ${app.match.settings.undercutBonus}.`;
  }

  /* the score, drawn by scoreboard.js: the paper sheet (the owner's pick) for the full view, the
     compact totals where space is short (the Gym, the review). Named for the people playing
     (scoreboard.js escapes the names). */
  function hollyBoardHTML(match, opts) {
    opts = opts || {};
    const n = (app.match && app.names) || {};
    const team = opts.team !== undefined ? opts.team : isTeam();
    const names = team
      ? { us: n.partner ? myName() + ' & ' + n.partner : 'Us', them: [n.opp, n.opp2].filter(Boolean).sort().join(' & ') || 'Them' }
      : { us: myName(), them: n.opp || 'Them' };
    return window.Scoreboard.html(match, { variant: opts.compact ? 'totals' : 'sheet', names });
  }

  function evaluateMilestones(match) {
    const st = app.coach.stats;
    const ms = st.milestones;
    const won = settlement(match).total > 0;
    if (won) ms.firstWin = true;
    if (!gameNight()) {   // the level milestones are about the home screen's rival strength
      if (won && !activePersona() && app.settings.level === 'standard') {
        st.stdStreak = (st.stdStreak || 0) + 1;
        if (st.stdStreak >= 3) ms.threeStraight = true;
      } else if (!won && app.settings.level === 'standard') st.stdStreak = 0;
      if (won && !activePersona() && app.settings.level === 'expert') ms.beatExpert = true;
    }
    if (won && app.settings.tableMode === 'pro') ms.proWin = true;
    const mv = st.moves, total = mv.optimal + mv.good + mv.acceptable + mv.blunder;
    if (won && total > 30 && (mv.optimal + mv.good) / total >= 0.8) ms.sharp80 = true;
    const gins = match.myGins || 0;
    if (gins >= 3) ms.ginRun = true;
  }

  /* "what changed in you": the dollars a hand against the house player since this
     match began, with how sure it is (coach.js, once it has the house rating) */
  function houseLine(match) {
    try {
      if (!K.houseSince || !app.coach || match.houseMark === undefined) return '';
      const r = K.houseSince(app.coach.stats, match.houseMark);
      if (!r || !isFinite(r.value)) return '';
      const v = Math.round(r.value * 100) / 100;
      const sign = v > 0 ? '+' : v < 0 ? '−' : '';
      return `${sign}$${Math.abs(v).toFixed(2)} a hand against the house` +
        (isFinite(r.pm) ? `, give or take $${Math.abs(r.pm).toFixed(2)}` : '');
    } catch (e) { console.error('house rating', e); return ''; }
  }
  /* a new match: the house mark is taken now, so the match end can say what changed */
  function stampMatch(match) {
    try { if (K.houseMark && app.coach) match.houseMark = K.houseMark(app.coach.stats); } catch (e) { console.error('house mark', e); }
    // the stakes it is played at are its own (makeMatch copied them): Table rules change the next match
    const st = matchStakes(match);
    match.settings.dollarsPerBox = st.box; match.settings.dollarsPerGame = st.game;
  }
  /* the hero figure rolls up from nothing when the match is yours; a lost one stays still */
  function rollMoney(el, value) {
    if (!el || !(value > 0)) return;
    U.rollFigure(el, 0, value, fmtD);
  }

  function openMatchEndSheet() {
    const match = app.match;
    // the money was booked when the last hand ended (bookMatchMoney); this sheet only shows it
    const st = matchStakes(match);
    const N = EndingAPI();
    const sum = N ? N.matchSummary(match, { box: st.box, game: st.game, shutoutDoubles: match.settings.shutoutDoubles, hollywood: match.settings.hollywood })
      : { total: settlement(match).total, games: [] };
    const total = sum.total;   // the money decides, not the point totals
    const result = Math.round(total * 100) > 0 ? 'won' : Math.round(total * 100) < 0 ? 'lost' : 'even';
    const persona = activePersona();
    // a mystery style is the one thing left to tell
    const personaBlock = persona && app.settings.persona === 'mystery'
      ? `<div class="end-note">${escH(app.names.opp)} played as ${PERSONAS[persona].name}</div>` : '';
    if (!gameNight()) app.mysteryPersona = null;
    // game night: record the match once, then offer the next rotation
    const sc = match.scout || null;
    let next = null;
    if (sc) {
      recordGameNight(match);
      try {
        if (window.Scout) next = window.Scout.nextTeams({ partner: sc.partner, opps: [sc.opps[0], sc.opps[1]] }, (sc.pool || []).slice());
      } catch (e) { console.error('game night rotation', e); next = null; }
      if (next && (next.partner == null || !next.opps || next.opps.length < 2)) next = null;
    }
    const nextLabel = next ? 'Next: with ' + escH(shortName(fullName(scoutFriend(next.partner), 'a removed friend'))) : '';
    const title = result === 'even' ? 'All square' : escH(takes(result === 'won' ? 0 : 1)) + ' the match';
    const house = houseLine(match);
    const primary = sc ? (next ? `<button class="btn gold" id="btn-gn-next">${nextLabel}</button>` : '')
      : '<button class="btn gold" id="btn-rematch">Rematch</button>';
    // the whole sheet is given to one number: the money for the match
    const body = U.openSheet(
      `<div class="end-match ${result}">
         ${sc ? `<div class="eyebrow lead">Game night · match ${sc.round || 1}</div>` : ''}
         <h2>${title}</h2>
         <div class="end-hero" id="end-hero">${fmtD(total)}</div>
         <div class="end-games">${sum.games.map(gameRowHTML).join('')}</div>
         ${house ? `<div class="end-note end-house">${house}</div>` : ''}
         ${personaBlock}
       </div>
       <div class="row-btns end-actions">
         ${primary || '<button class="btn" id="btn-home">Home</button>'}
         ${primary ? '<button class="btn ghost" id="btn-home">Home</button>' : ''}
       </div>`,
      { locked: true }
    );
    if (result === 'won') rollMoney(body.querySelector('#end-hero'), total);
    saveMatch();
    // the finished match is kept until this sheet is left (closing the app here comes back to it)
    // the match is left for good: the plays it still waits on are judged and counted wherever you go (keepPending)
    const home = () => { keepPending(); leaveTable(); app.match = null; dropSavedMatch(); initHome(); };
    body.querySelector('#btn-home').addEventListener('click', home);

  }

  /* ---------- one way the unseen cards could lie ---------- */

  /* A hand in mid-play is not ten random cards: it has been improved every
     turn, and it has let go of, or passed up, every card now in the pile.
     So the rival is dealt ten cards, shown one more unseen card for each draw
     they have made (keeping the best ten each time), and the result is thrown
     back and redone if a card in the pile would have fitted it.              */
  function determinize(snap, rng, opts) {
    const develop = !opts || opts.develop !== false;
    let last = null;
    const r = rng || Math.random;
    for (let attempt = 0; attempt < (develop ? 14 : 1); attempt++) {
      last = dealOnce(snap, r, develop);
      if (!develop) break;
      if (pileFits(snap, last.oppHand)) continue;
      // they have not knocked: a hand already under the line would mostly have done so
      if (snap.oppLen === 10 && snap.turns[1 - snap.me] > 0) {
        const dw = C.deadwoodPoints(last.oppHand);
        const line = E.knockLine(snap.knockCard).knockLimit;
        if (dw === 0 || (dw <= line && r() < 0.85)) continue;
      }
      break;
    }
    return last;
  }
  /* would their hand have used a card that they let go by? (recent pile cards only) */
  function pileFits(snap, oppHand) {
    const recent = snap.pile.slice(-8);
    return recent.length > 0 && C.hitCards(oppHand, recent).length > 0;
  }
  function dealOnce(snap, rng, develop) {
    const known = new Set(snap.mine.concat(snap.pile, snap.oppKnown));
    const pool = [];
    for (let c = 0; c < 52; c++) if (!known.has(c)) pool.push(c);
    const oppHand = snap.oppKnown.slice();
    let need = snap.oppLen - oppHand.length;
    // their hidden cards: drawn without replacement, leaning toward what their play suggests
    const w = pool.map(c => (snap.weights ? Math.max(0.05, snap.weights[c]) : 1));
    while (need > 0 && pool.length) {
      let total = 0;
      for (const x of w) total += x;
      let u = rng() * total, i = 0;
      while (i < w.length - 1 && (u -= w[i]) > 0) i++;
      oppHand.push(pool[i]);
      pool.splice(i, 1); w.splice(i, 1);
      need--;
    }
    if (develop) {
      const fixed = snap.oppKnown.length;           // cards they are known to hold stay put
      // one look more than their draws: measured against real hands (tools/check-deals.js),
      // this brings the dealt hands level with how developed real ones are
      const looks = (snap.oppDraws || 0) + ((snap.oppDraws || 0) >= 2 ? 1 : 0);
      for (let d = 0; d < looks && pool.length; d++) {
        const pi = (rng() * pool.length) | 0;
        const eleven = oppHand.concat([pool[pi]]);
        // let go of whichever hidden card leaves the least deadwood (the bigger card on a tie)
        let drop = -1, bestPts = Infinity;
        for (let i = fixed; i < eleven.length; i++) {
          const pts = C.deadwoodPoints(eleven.filter((c, j) => j !== i));
          if (pts < bestPts || (pts === bestPts && C.pointsOf(eleven[i]) > C.pointsOf(eleven[drop]))) { bestPts = pts; drop = i; }
        }
        if (drop < 0) break;
        pool[pi] = eleven[drop];
        eleven.splice(drop, 1);
        oppHand.length = 0;
        for (const c of eleven) oppHand.push(c);
      }
    }
    // the rest is the stock, in random order
    for (let i = pool.length - 1; i > 0; i--) {
      const j = (rng() * (i + 1)) | 0;
      const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    return { oppHand, stock: pool };
  }

  /* a table set up exactly as the player sees it, with the unseen cards filled in */
  function instantiate(snap, det, ctx) {
    const t = {
      isTable: true, autoLayoff: true,
      settings: ctx.settings, games: ctx.games,
      dealer: snap.dealer, hand: null,
      bulge: ctx.bulge === undefined ? null : ctx.bulge
    };   // (the bots in a trial play to the bulge's points; its boxes are in the prices)
    const hands = [];
    hands[snap.me] = snap.mine;
    hands[1 - snap.me] = det.oppHand;
    E.buildHand(t, {
      hands, stock: det.stock, discard: snap.pile, faceUp: snap.faceUp,
      knockCard: snap.knockCard, doubled: snap.doubled, dealer: snap.dealer,
      current: snap.current, phase: snap.phase, upcardDecliner: snap.upcardDecliner,
      turn: snap.turn, turns: snap.turns
    });
    t.hand.forcedStock = snap.forcedStock;
    t.hand.drawnCard = snap.drawnCard;
    t.hand.drawnFrom = snap.drawnFrom;
    return t;
  }

  /* play a table to the end with the standard bot in both seats;
     returns seat 0's points and boxes (negative when seat 1 won them) */
  function playOut(t, brains) {
    const hand = t.hand;
    let guard = 0;
    while (hand.phase !== 'over' && guard++ < 400) {
      E.act(t, A.decide(brains[hand.current], t));
    }
    return { points: E.signedResult(hand), boxes: E.signedBoxes(hand) };
  }

  /* ---------- the plays worth comparing ---------- */

  const keyOf = a => a.type + (a.card !== undefined ? ':' + a.card : '') + (a.knock ? ':k' : '') + (a.gin ? ':g' : '');

  function candidates(table, me, limit) {
    const hand = table.hand;
    if (hand.phase === 'upcard') return [{ type: 'pass-upcard' }, { type: 'take-upcard' }];
    if (hand.phase === 'draw') {
      return hand.forcedStock ? [{ type: 'draw-stock' }] : [{ type: 'draw-stock' }, { type: 'take-upcard' }];
    }
    if (hand.phase !== 'discard') return [];
    const acts = E.legalActions(hand);
    const big = acts.find(a => a.type === 'big-gin');
    if (big) return [{ type: 'big-gin' }];
    const scored = A.scoreDiscards(hand, me, null);
    const gin = scored.filter(s => s.canGin).sort((a, b) => C.pointsOf(b.card) - C.pointsOf(a.card))[0];
    if (gin) return [{ type: 'discard', card: gin.card, gin: true }];
    const out = scored.slice(0, limit || 4).map(s => ({ type: 'discard', card: s.card }));
    if (!hand.ginOnly) {
      const knocks = scored.filter(s => s.canKnock);
      if (knocks.length) {
        const low = knocks.slice().sort((a, b) => a.dw - b.dw)[0];
        out.push({ type: 'discard', card: low.card, knock: true });
        if (knocks[0].card !== low.card) out.push({ type: 'discard', card: knocks[0].card, knock: true });
      }

  function withAction(list, action) {
    const k = keyOf(action);
    return list.some(a => keyOf(a) === k) ? list : list.concat([action]);
  }

  /* ---------- the context a result is priced in ---------- */

  /* model: Money.build(...). match: the sheet. table: the table being played
     (its bulge is used in team play). Cache `sw` per deal: the sheet does not
     change until the deal is settled.                                        */
  function context(model, match, table, sw) {
    sw = sw || M.swing(model, match);
    const team = match.mode === 'team';
    const known = team && table.bulge !== undefined && table.bulge !== null;
    const bulge = known ? table.bulge : null;
    const tsw = !team ? sw
      : M.tableSwing(sw, known ? { points: table.bulge, boxes: table.bulgeBoxes || 0 } : null, table.hand.doubled);
    return {
      settings: match.settings,
      games: match.games.map(g => ({ scores: g.scores.slice(), boxes: g.boxes.slice(), closed: g.closed, winner: g.winner })),
      bulge,
      // the price table, copied field by field so the context stays plain data for the worker
      P: tsw.P, B: tsw.B, Bn: tsw.Bn, R: tsw.R, V: tsw.V, K: tsw.K,
      // the money between winning this deal by a knock and losing it by one: the yardstick for "how bad"
      unit: M.unit(sw)
    };
  }
  /* dollars for side 0 of a result of r points and k boxes at this table */
  const priced = (ctx, r, k) => M.at(ctx, r, k);

  /* ---------- a comparison in progress ---------- */

  function session(snap, actions, ctx, rng) {
    const brains = [A.createBrain('standard', 0), A.createBrain('standard', 1)];
    const sign = snap.me === 0 ? 1 : -1;
    const vals = actions.map(() => []);      // dollars per deal, per play
    const pts = actions.map(() => 0), wins = actions.map(() => 0);
    let n = 0;
    const self = {
      get n() { return n; },
      /* Try plays against k more deals. `only` (indexes) narrows it to the plays
         still in contention; a play left out keeps the deals it already has and
         is never brought back, so every comparison is over shared deals.        */
      step(k, only) {
        for (let i = 0; i < k; i++) {
          const det = determinize(snap, rng);
          actions.forEach((a, ai) => {
            if (vals[ai].length !== n || (only && !only.includes(ai))) return;
            let res = { points: 0, boxes: 0 };
            try {
              const t = instantiate(snap, det, ctx);
              E.act(t, a);
              res = playOut(t, brains);
            } catch (e) { /* a broken trial counts as nothing happening */ }
            vals[ai].push(sign * priced(ctx, res.points, res.boxes));
            pts[ai] += sign * res.points;
            if (sign * res.points > 0) wins[ai]++;
          });
          n++;
        }
      },
      /* Each play's average dollars, best first. `loss` is the gap to the best
         play over the deals both were tried in; `margin` is how far that gap
         could be off (two standard errors).                                   */
      stats() {
        const meanOf = v => v.reduce((s, x) => s + x, 0) / Math.max(1, v.length);
        let best = -1;
        actions.forEach((a, i) => {
          if (vals[i].length === n && (best < 0 || meanOf(vals[i]) > meanOf(vals[best]))) best = i;
        });
        if (best < 0) best = 0;
        const evBest = meanOf(vals[best]);
        const rows = actions.map((a, i) => {
          const ni = vals[i].length;
          let s = 0, s2 = 0;
          for (let j = 0; j < ni; j++) { const d = vals[best][j] - vals[i][j]; s += d; s2 += d * d; }
          const loss = ni ? s / ni : 0;
          const sd = ni > 1 ? Math.sqrt(Math.max(0, s2 / ni - loss * loss) * ni / (ni - 1)) : 0;
          return {
            action: a, key: keyOf(a), index: i, n: ni, live: ni === n,
            ev: evBest - loss, loss, margin: ni ? 2 * sd / Math.sqrt(ni) : Infinity,
            points: ni ? pts[i] / ni : 0, winRate: ni ? wins[i] / ni : 0
          };
        });
        rows.sort((x, y) => y.ev - x.ev);
        return { n, rows, unit: ctx.unit };
      }
    };

  }

  /* Spend a budget where it matters: a first look at every play, then only the
     two leading plays and the one actually made (job.focus).                  */
  function contenders(s, focus) {
    const live = s.stats().rows.filter(r => r.live);
    const keep = live.slice(0, 2);
    const f = live.find(r => r.key === focus);
    if (f && !keep.includes(f)) keep.push(f);
    return keep.map(r => r.index);
  }
  function runJob(job) {
    const s = session(job.snap, job.actions, job.ctx);
    const t0 = Date.now();
    s.step(Math.min(job.n, job.first || 12));
    while (s.n < job.n && Date.now() - t0 < job.budgetMs) s.step(2, contenders(s, job.focus));
    return s.stats();
  }

  /* The verdict on the play that was made. Sizes are judged against the money
     riding on the deal's box, and nothing is called a mistake unless the gap
     is clear of the margin.                                                   */
  /* Tested by playing 2,520 deals twice (tools/bench-dup.js): acting on these
     verdicts made money, but only 45% of what they claimed, because the best
     of several noisy averages always looks better than it is. So every gap is
     scaled to what was actually realised before it is graded or shown.        */
  const REALISED = 0.45;
  function verdict(stats, chosenKey) {
    const best = stats.rows[0];
    const raw = stats.rows.find(r => r.key === chosenKey) || best;
    const row = raw === best ? raw : Object.assign({}, raw, { loss: raw.loss * REALISED, margin: raw.margin * REALISED });
    const unit = stats.unit || 1;
    // The best play is picked from several noisy averages, which flatters it, so
    // a gap has to clear the margin with room to spare before it counts.
    const clear = row.loss > 1.5 * row.margin;
    let grade;
    if (raw === best || row.loss <= 0) grade = 'optimal';
    else if (!clear || row.loss < 0.015 * unit) grade = 'good';

          const stuck = [...pending.values()];

        const s = session(job.snap, job.actions, job.ctx), t0 = Date.now();

    function endWorker() {

      evaluate(job) { return new Promise(resolve => { queue.push({ job, resolve }); pump(); }); },

<script>
/* ============================================================

        draw: [0, 0], discard: [0, 0], knock: [0, 0], counting: [0, 0], read: [0, 0], ginrating: [0, 0], gym: [0, 0]
      },
      baseline: null,                   // { ts, by: {skill: [right, total]}, right, total } from the sixty-position test
      daily: { last: '', streak: 0, sets: 0 },   // the ten-minute set: last day done, days running, sets ever
      moves: { optimal: 0, good: 0, acceptable: 0, blunder: 0 },

      tilt: { normal: [0, 0], tilted: [0, 0] }, // [blunders, moves]
      lost: 0,                          // dollars given away, as priced by the playout coach

  /* weeks run Sunday to Saturday, counted by the player's own calendar days */
  function weekKey(when) {

  function gradeDraw(hand, tookUpcard) {

        : diff > 0

      } else if (bulge > 0) {

      } else if (bulge < 0) {

    }

    const ginSide = `playing for gin (${ginRating} card${ginRating === 1 ? '' : 's'} gin you)`;

        ? ` At this table gin is two boxes to a knock's one, and with ${ginRating} cards that gin you this table's own play says wait, even early.`

        ? (locked ? `With the points locked, ${knockSide} is the play: waiting for gin only gives them turns.`
          : fitted ? `By the rule fitted to this table's own play, ${knockSide} beats ${ginSide}.`
          : `The published formula says ${knockSide} beats ${ginSide} by ${fmt(margin)} points.`) + (knocked ? '' : ' Playing on gives them time to undercut or gin.')
        : (fitted ? `By the rule fitted to this table's own play, ${ginSide} beats ${knockSide}.`

     saved hand: the ledger is the only truth.
       - ids: minted once when a play is made (mint: the time, kept rising, and a random tail),
         saved with the play, never made again from anything else;
       - epochs: Reset stats and a restored backup start a new epoch; a play carries the epoch
         of the record as it was when the play was made (mint), and a verdict on a play of an
         older epoch is not counted: what was made before a reset or a restore never counts,
         and everything made after it does, wherever it is made (a hand begun before it too);
       - the sitting: Leave table moves coach.seat on (leave); a play asked about at a table
         since left (play.seat) is not written at all, in the record or in the hand's log: that
         table's save deals it out again after Continue. A play its table let go for good (a
         finished match left, a saved match given up: keep) belongs to no sitting: it is
         written whenever its verdict lands, once;
       - no count goes below zero: a change that would is refused (and reported).
     The ledger keeps the newest PLAYS_KEPT plays; older ones are folded into its `base` (the
     parts no play can change any more) and a verdict on a play folded so is not counted.
     The totals are always exactly base plus the plays held (audit).                        */
  /* ---- record gate: begin ---- */
  const PLAYS_KEPT = 300;   // about fifteen hands; only the hand in play (and its review) can still change
  const DRILLS_KEPT = 40;
  const EPS = 1e-6;
  function emptyLedger() { return { plays: {}, base: {}, floor: 0 }; }

  /* A play's part in the record as flat [key, amount] pairs:
       l              dollars given away          w|week|f  that week's sharp, total, lost
       m|grade        the grades                  t|side|i  the tilt check [blunders, moves]
       h|hand|f       the hand's house figure d, v (variance), n (plays)

  function parts(rec) {
    const out = [];

    if (rec.cost > 0) out.push(['l', rec.cost], ['w|' + rec.week + '|lost', rec.cost]);
    if (rec.grade) {

      // tilt telemetry: how do you play right after losing hands?

    if (rec.close) out.push(['k|' + rec.hand, rec.close], ['C', 1]);

  const signed = key => key.charAt(0) === 'h' && key.slice(-2) === '|d';   // the only part that may be below zero
  const sumParts = (into, list, sign) => { for (const [k, v] of list) into[k] = (into[k] || 0) + sign * v; return into; };

  /* the record's counted fields, read the same flat way */
  function tallyOf(stats) {
    const out = {};

    put('l', stats.lost);
    for (const g of Object.keys(isObj(stats.moves) ? stats.moves : {})) put('m|' + g, stats.moves[g]);
    for (const w of Object.keys(isObj(stats.weekly) ? stats.weekly : {})) {
      const b = stats.weekly[w];
      if (isObj(b)) for (const f of ['sharp', 'total', 'lost']) put('w|' + w + '|' + f, b[f]);
    }
    for (const side of ['normal', 'tilted']) {
      const s = isObj(stats.tilt) && Array.isArray(stats.tilt[side]) ? stats.tilt[side] : [];
      put('t|' + side + '|0', s[0]); put('t|' + side + '|1', s[1]);
    }
    const house = isObj(stats.house) && Array.isArray(stats.house.list) ? stats.house : null;
    if (house) {

      put('C', house.closed);

  function houseRecord(stats, id, make) {

    for (let i = list.length - 1; i >= 0; i--) if (list[i].id === id) return list[i];
    if (!make) return null;

  function ledgerOf(stats) {
    if (!isObj(stats.ledger) || !isObj(stats.ledger.plays) || !isObj(stats.ledger.base)) stats.ledger = emptyLedger();
    if (!(typeof stats.ledger.floor === 'number' && isFinite(stats.ledger.floor))) stats.ledger.floor = 0;

  /* what the record should hold: base plus every play's part, by key */

    return want;
  }

    for (const k of new Set(Object.keys(want).concat(Object.keys(have)))) {

  /* A play part as stored in the ledger, or null if it is not one */
  function cleanPart(r) {
    if (!isObj(r)) return null;

    if (!(r.grade === null || r.grade === undefined || typeof r.grade === 'string') || !num(r.cost || 0)) return null;
    if (r.house && !(isObj(r.house) && num(r.house.d) && num(r.house.se))) return null;
    if (typeof r.drill === 'string' && r.drill) return { at: num(r.at) ? r.at : 0, hand: '', drill: r.drill, right: r.right ? 1 : 0 };
    return {
      at: num(r.at) ? r.at : 0, hand: r.hand === undefined || r.hand === null ? '' : String(r.hand),
      grade: r.grade || null, cost: r.cost > 0 ? r.cost : 0, week: typeof r.week === 'string' ? r.week : weekKey(),

  }
  /* The ledger of a loaded record. A record from an older version (no ledger) keeps its totals:
     they are the base, and the plays it counted by id (its `plays`, round two) are taken in
     with their parts so the review can still revise them. A damaged ledger is mended the same
     way: the base becomes what the totals hold beyond the plays kept. Counts an older version
     left below zero are set to zero first.                                                    */
  function openLedger(stats, saved) {
    for (const k of Object.keys(tallyOf(stats))) if (!signed(k) && readKey(stats, k) < 0) applyKey(stats, k, -readKey(stats, k));
    const L = emptyLedger(), have = tallyOf(stats);

    const fits = (base, list) => list.every(([k, v]) => signed(k) || (base[k] || 0) - v >= -EPS);

      for (const id of Object.keys(old.plays)) { const r = cleanPart(old.plays[id]); if (r) L.plays[id] = r; }

    if (old && isObj(old.base) && Object.keys(old.base).every(k => typeof old.base[k] === 'number' && isFinite(old.base[k]))) {

      if (same) base = Object.assign({}, old.base);

  /* fold the oldest plays into the base once more than PLAYS_KEPT are held */
  function fold(stats) {

    // (the ids are read afresh for each pass: the first one deletes some of them)
    for (const drills of [true, false]) {

      if (ids.length <= keep) continue;

  /* The plays of a saved hand, as this version keeps them. A play minted by this version is

  /* The first verdict on a play as the play holds it (a play logged at once, by the rule of thumb) */

    const st = entry.deep && entry.deep.n > (entry.stats ? entry.stats.n : 0) ? entry.deep : null;
    const fig = st && entry.houseKey && entry.key ? houseFigure(st, entry.key, entry.houseKey) : null;
    return settle(coach, entry, { grade: verdict.grade, cost: verdict.cost, house: fig || undefined, revise: true, show: show || undefined }) === 2;
  }

  /* ---------------- against the house player ----------------
     The rating of decisions (docs/audit/endgame-evidence.md, section 2b). At
     each play the player makes, the house play is what the standard bot would
     play in the same position: it keeps no memory, flips no coins, and sees
     only the player's cards and the table. Where the two plays are the same
     the decision scores exactly 0 and adds no noise. Where they differ they
     are set against each other on the same deals, inside the job the app
     already deals out for the play (main.js submitMove). The house play is
     always among that job's candidates (Oracle.candidates lists the standard
     bot's own throw, its knocks and both draws), so this costs nothing extra
     unless the race inside the job dropped one of the two; then a duel of the
     two plays (200 deals, 0.9 s at most) settles it. Every figure is in the
     app's shown dollars, the evaluator's times 0.45 (REALISED in oracle.js),
     like "Given away a hand".                                              */
  const HOUSE_SCALE = 0.45;      // oracle.js REALISED: the evaluator's dollars -> the dollars the app shows
  const HOUSE_WINDOW = 200;      // the rating: the mean of the most recent 200 rated hands
  const HOUSE_MIN = 30;          // and nothing before 30 (give or take about a dollar then: the gap between neighbouring levels)
  const HOUSE_SINCE_MIN = 5;     // a stretch of play (a match) needs 5 rated hands
  const HOUSE_KEEP = 400;        // hand records kept

  function emptyHouse() { return { list: [], closed: 0 }; }
  /* a saved record list, kept only where it has the right shape */
  function cleanHouse(h) {
    const out = emptyHouse();
    if (!isObj(h)) return out;
    if (typeof h.closed === 'number' && isFinite(h.closed) && h.closed > 0) out.closed = Math.floor(h.closed);
    if (Array.isArray(h.list)) {
      out.list = h.list.filter(r => isObj(r) && typeof r.id === 'string' && [r.d, r.v, r.n, r.k].every(x => typeof x === 'number' && isFinite(x)))
        .slice(-HOUSE_KEEP).map(r => ({ id: r.id, d: r.d, v: Math.max(0, r.v), n: r.n, k: r.k }));
    }
    for (const r of out.list) if (r.k > out.closed) out.closed = r.k;
    return out;
  }

  /* the standard bot's play here, from what the player can see */
  function houseAction(table, est) {
    const brain = A.createBrain('standard', 0);
    if (est) brain.est = est;   // the player's own view of the other hand, never more (the standard bot does not use it)
    return A.decide(brain, table);
  }

  /* The player's play against the house play, from an evaluator job's rows
     (Oracle stats): { d, se, n } in shown dollars, d above 0 when the player's
     play did better. null when the two were not both dealt out in full.     */
  function houseFigure(stats, playerKey, houseKey) {
    if (!playerKey || !houseKey) return null;
    if (playerKey === houseKey) return { d: 0, se: 0, n: stats && stats.n ? stats.n : 0 };
    if (!stats || !Array.isArray(stats.rows)) return null;
    const rp = stats.rows.find(r => r.key === playerKey), rh = stats.rows.find(r => r.key === houseKey);
    if (!rp || !rh || !rp.live || !rh.live || !(rp.n > 1) || !isFinite(rp.ev) || !isFinite(rh.ev)) return null;
    // a row's margin is two standard errors of its gap to the best play over the same deals: when either play is
    // the best one this is exactly the error of the difference, otherwise the two added are the cautious bound
    const se = Math.sqrt((rp.margin / 2) * (rp.margin / 2) + (rh.margin / 2) * (rh.margin / 2));
    return { d: HOUSE_SCALE * (rp.ev - rh.ev), se: HOUSE_SCALE * se, n: Math.min(rp.n, rh.n) };
  }

  /* the hand's total against the house: { d, se, plays } (plays: the decisions with a figure) */
  function houseHand(handLog) {
    let d = 0, v = 0, plays = 0;
    for (const e of handLog || []) {
      if (!e || !e.house || !isFinite(e.house.d)) continue;
      const se = e.house.se || 0;
      d += e.house.d; v += se * se; plays++;
    }
    return { d, se: Math.sqrt(v), plays };
  }

  /* The hand is over and counted (main.js onHandOver): its record joins the rating, through
     the gate, once. Plays still being dealt out join it when their verdicts land.          */
  function bookHouseHand(coach) {
    settle(coach, { id: 'c.' + coach.handId, at: stamp(), hand: coach.handId, epoch: ledgerOf(coach.stats) && coach.stats.epoch, seat: coach.seat || 0 }, { close: true });
    return houseRecord(coach.stats, coach.handId, false);
  }

  /* The mean of a run of hands, with two standard errors: from how the hands
     spread, and never less than the dealing's own noise stored with them.  */
  function houseSummary(recs, min) {
    const n = recs.length;
    if (n < Math.max(2, min)) return null;
    let s = 0, dealt = 0;
    for (const r of recs) { s += r.d; dealt += r.v; }
    const value = s / n;
    let ss = 0;
    for (const r of recs) ss += (r.d - value) * (r.d - value);
    const se = Math.sqrt(Math.max(ss / (n - 1) / n, dealt / (n * n)));
    return { value, pm: 2 * se, hands: n };
  }
  const rated = stats => (stats && isObj(stats.house) && Array.isArray(stats.house.list) ? stats.house.list : [])
    .filter(r => r.k > 0 && r.n > 0).sort((a, b) => a.k - b.k);
  /* dollars a hand against the house player over the recent hands: { value, pm, hands } or null */
  function houseRating(stats) {
    return houseSummary(rated(stats).slice(-HOUSE_WINDOW), HOUSE_MIN);
  }
  /* a point to measure from (match start); JSON-safe */
  function houseMark(stats) {
    return { k: stats && isObj(stats.house) && stats.house.closed > 0 ? stats.house.closed : 0 };
  }
  /* the same figure over the hands closed since the mark, or null */
  function houseSince(stats, mark) {
    if (!isObj(mark) || typeof mark.k !== 'number' || !isFinite(mark.k)) return null;
    return houseSummary(rated(stats).filter(r => r.k > mark.k), HOUSE_SINCE_MIN);
  }
  /* clearly ahead of the house player lately: the give-or-take does not reach down to zero */
  function playingWell(stats) {
    const r = houseRating(stats);
    return !!r && r.value - r.pm > 0;
  }

  /* ---------------- when the coach asks ----------------
     docs/audit/endgame-evidence.md, section 3. There is no roll. At most one
     question a hand, and only at:
       - a knock-or-play-on decision (a legal knock that is not gin), on any
         turn: where the player's own play goes wrong most often and costs most;
       - any other draw or throw from the player's third turn on, when it has
         been pre-judged costly: main.js deals the position out before the
         player moves (prejudgeJob) and the rule-of-thumb play, the house play,
         would be flagged for more than ASK_BAR. If the player moves first,
         no question: the review after the hand covers it.
     A player clearly ahead of the house player over the recent hands
     (playingWell) is asked less: the bar doubles to WELL_BAR and a knock
     decision is asked about only when it clears that bar too.            */
  const ASK_BAR = 1;            // shown dollars: the smallest gap the grader can call clear with its full deals
  const WELL_BAR = 2;
  const ASK_FROM = 2;           // completed turns: the third turn is the first one pre-judged
  const PREJUDGE_MS = 1300;     // the same clock as the verdict on a play
  const decisionKey = hand => hand.phase + ':' + hand.turn;
  const askBar = stats => (playingWell(stats) ? WELL_BAR : ASK_BAR);

  const knockDecision = (hand, scored) => !hand.ginOnly && !scored.some(s => s.canGin) && scored.some(s => s.canKnock);

  /* should main.js deal this decision out before the player moves? */
  function wantsPrejudge(coach, hand, point) {
    return !!(coach && coach.enabled && !coach.drillUsedThisHand && hand && hand.current === 0 &&
      (point === 'draw' || point === 'discard') && hand.turns[0] >= ASK_FROM);
  }
  /* the job that pre-judges it, priced as the app prices plays: { job, houseKey, at } or null */
  function prejudgeJob(table, est, ctx) {
    const O = window.Oracle;
    if (!O || !table || !table.hand) return null;
    const house = houseAction(table, est);
    const list = O.withAction(O.candidates(table, 0, 4), house);
    if (list.length < 2) return null;
    const houseKey = O.keyOf(house);
    return {
      houseKey, at: decisionKey(table.hand),
      job: { snap: O.snapshot(table, 0, est), actions: list, ctx, n: 500, first: 14, budgetMs: PREJUDGE_MS, focus: houseKey, prejudge: true }
    };
  }
  /* what the pre-judgement found: the house play's flagged cost, in shown dollars */
  function prejudged(stats, houseKey, at) {
    const O = window.Oracle;
    if (!O || !stats || !stats.n || !stats.rows) return null;
    const v = O.verdict(stats, houseKey);
    return { at, cost: v.cost, grade: v.grade, loss: v.loss, n: v.n };
  }

  /* Decision points: 'draw' (about to draw), 'discard' (holding 11). `judged`:
     what the pre-judgement found at this very decision (prejudged()), if any.
     Returns a drill descriptor or null. `names` (optional): { partner }.    */
  function maybeDrill(coach, hand, point, match, names, judged) {
    if (!coach.enabled || coach.drillUsedThisHand) return null;
    if (point !== 'draw' && point !== 'discard') return null;
    const scored = point === 'discard' ? A.scoreDiscards(hand, 0, coach.est) : null;
    const knock = !!scored && knockDecision(hand, scored);
    const costly = !!judged && judged.at === decisionKey(hand) && hand.turns[0] >= ASK_FROM && judged.cost > askBar(coach.stats);
    let pick = null;
    if (knock) {
      if (costly || !playingWell(coach.stats)) pick = { type: 'knock', data: scored };
    } else if (costly && point === 'draw') {
      pick = { type: 'draw' };
    } else if (costly && scored && scored.length >= 2 && !scored.some(s => s.canGin || s.canKnock)) {
      // a throw question on a hand that can knock or gin would take the knock away
      pick = { type: 'discard', data: scored };
    }
    if (!pick) return null;
    const drill = buildDrill(coach, hand, pick, match, names);
    // the hand's one drill is spent only on a drill that could be made
    if (drill) { coach.drillUsedThisHand = true; coach.moneyTurn = hand.turns[0]; }
    return drill;
  }

  /* ---------------- side quizzes ----------------
     The counting question and the opponent read (both forms, review.js) are
     asked at the table too, apart from the money questions above:
       - never before the player's fifth turn (nothing to count or read sooner);
       - at a throw only, the last decision of a turn, and never on a throw that
         can knock or gin (that decision is the money's), nor on a turn that
         had a money question: main.js asks only once the money question has
         passed this decision by (not pre-judged costly, or nothing to deal out);
       - at most one a hand, so with the money question at most two a hand;
       - one hand in three or so: the hand's chance is rolled once, at its first
         eligible throw, and the quiz comes on a turn picked from the 5th to 7th
         (SIDE_SHARE measured with tools/bench-moments.js fire); half as often
         for a player clearly ahead of the house (playingWell);
       - never graded Costly, and never a play: nothing is logged, so the
         dollars given away and the house rating do not see it.             */
  const SIDE_FROM = 4;          // completed turns: the fifth turn is the first one
  const SIDE_SPREAD = 3;        // the quiz's turn is picked from the 5th, 6th and 7th
  const SIDE_SHARE = 0.45;      // the roll at the first eligible throw (about a third of all hands get one)
  const sideShare = stats => (playingWell(stats) ? SIDE_SHARE / 2 : SIDE_SHARE);

  function maybeSideQuiz(coach, hand, point, match, names) {
    if (!coach || !coach.enabled || coach.sideUsed || point !== 'discard' || !hand || hand.current !== 0 || hand.phase !== 'discard') return null;
    if (hand.turns[0] < SIDE_FROM || coach.moneyTurn === hand.turns[0]) return null;
    const acts = E.legalActions(hand);
    if (acts.some(a => a.type === 'big-gin' || a.canGin || (a.canKnock && !hand.ginOnly))) return null;
    if (coach.sidePlan === undefined) {
      coach.sidePlan = Math.random() < sideShare(coach.stats)
        ? { type: Math.random() < 0.5 ? 'counting' : 'read', turn: SIDE_FROM + 1 + ((Math.random() * SIDE_SPREAD) | 0) }
        : null;
    }
    const plan = coach.sidePlan;
    if (!plan || hand.turns[0] + 1 < plan.turn) return null;
    // the planned kind, else the other: the hand's quiz is spent only on one that could be made
    const kinds = plan.type === 'read' ? ['read', 'counting'] : ['counting', 'read'];
    let drill = null;
    for (const type of kinds) {
      drill = type === 'read' ? buildOppRead(coach, hand) : buildCounting(hand);
      if (drill) break;
    }
    if (!drill) return null;
    const opp = (names && names.opp) || 'they';
    if (drill.type === 'counting') {
      // short enough for the status line; the answer says what was counted
      const word = { A: 'aces', J: 'jacks', Q: 'queens', K: 'kings' }[drill.rank] || drill.rank + 's';
      drill.prompt = `How many ${word} have you seen, counting your own?`;
    } else {
      drill.prompt = drill.read.form === 'certain' ? `Which of these does ${opp} hold?` : `Which does ${opp} most likely hold? All three, most likely first`;
    }
    // a side quiz is never Costly: a wrong count is a slip
    const resolve = drill.resolve;
    drill.resolve = answer => {
      const r = resolve(answer);
      if (r && r.grade === 'blunder') r.grade = 'acceptable';
      return r;
    };
    drill.side = true;
    coach.sideUsed = true;
    return drill;
  }
  /* any of the coach's questions, built on request (the gin-cards question is not
     asked at the table; the counting and read questions are, by maybeSideQuiz) */
  function drillOfType(coach, hand, type, match, names) {
    const data = hand.phase === 'discard' ? A.scoreDiscards(hand, 0, coach.est) : null;
    return buildDrill(coach, hand, { type, data }, match, names);
  }

  function buildDrill(coach, hand, pick, match, names) {
    if (pick.type === 'draw') {
      const up = E.upcard(hand);
      return {
        type: 'draw',
        title: 'Draw decision',
        prompt: `Take the ${C.name(up)} or draw from the stock?`,
        options: [
          { id: 'upcard', label: `Take ${C.name(up)}` },
          { id: 'stock', label: 'Draw from stock' }
        ],
        resolve(answer) {
          const g = gradeDraw(hand, answer === 'upcard');
          return { grade: g.grade, explanation: g.explanation, apply: answer };
        }
      };
    }
    if (pick.type === 'discard') {
      return {
        type: 'discard',
        title: 'Best throw',
        prompt: 'Pick your best throw.',
        pickFromHand: true,
        resolve(card) {
          const g = gradeDiscard(coach, hand, card);
          return { grade: g.grade, explanation: g.explanation, bestCard: g.best.card, apply: card };
        }
      };
    }
    if (pick.type === 'knock') {
      const scored = pick.data;
      const k = scored.filter(s => s.canKnock)[0];
      if (!k) return null;
      const rest = hand.hands[0].filter(c => c !== k.card);
      const gr = C.ginRating(rest, E.unseenFor(hand, 0));
      return {
        type: 'knock', knockCard: k.card, knockDw: k.dw,
        title: 'Knock or play on',
        prompt: `Throwing the ${C.name(k.card)} leaves you ${k.dw}, within the knock card's ${hand.knockLimit}. Knock or play on?`,
        options: [
          { id: 'knock', label: `Knock with ${k.dw}` },
          { id: 'play', label: 'Play on' }
        ],
        resolve(answer) {
          const g = gradeKnock(hand, answer === 'knock', k.dw, gr, match, k.card, coach.est, names);
          return {
            grade: g.grade, explanation: g.explanation,
            apply: answer === 'knock' ? { card: k.card, knock: true } : null
          };
        }
      };
    }
    if (pick.type === 'ginrating') {
      return buildGinRating(hand, pick.data);
    }
    if (pick.type === 'counting') {
      return buildCounting(hand);
    }
    if (pick.type === 'read') {
      return buildOppRead(coach, hand);
    }
    return null;
  }

  /* Gin cards: a counting question answered from what is shown, the ten cards `rest`
     and the throw `card`. How many cards not in that hand would give you gin
     (C.ginCards over every card but the ten and the throw; nothing earlier in the
     hand is assumed seen)? The four answers run from `low` up; the right one is
     never steered to a fixed place: the Gym chooses `low` and the count together
     so each place is equally likely; given only a hand, `low` is picked at random
     below the count. Whether to knock is not asked here: the Knock or play on
     drill judges that by the fitted rule and the dealt-out verdict.            */
  function ginCountQuestion(card, rest, low) {
    const held = new Set(rest.concat([card])), others = [];
    for (let c = 0; c < 52; c++) if (!held.has(c)) others.push(c);
    const gins = C.ginCards(rest, others).sort((a, b) => a - b), gr = gins.length;
    if (!(low >= 0 && low <= gr && gr <= low + 3)) low = gr - ((Math.random() * (Math.min(3, gr) + 1)) | 0);
    const names = gins.map(c => 'the ' + C.name(c));
    const list = names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] : names[0];
    const said = gr === 0 ? 'No card would give you gin.'
      : `${gr === 1 ? 'One card' : gr + ' cards'} would give you gin: ${list}.`;
    return {
      gr, gins,
      prompt: `Throw the ${C.name(card)}. How many cards not in your hand would give you gin?`,
      options: [0, 1, 2, 3].map(i => ({ id: String(low + i), label: String(low + i) })),
      resolve(answer) {
        const off = Math.abs(Number(answer) - gr);
        return {
          grade: off === 0 ? 'optimal' : off === 1 ? 'acceptable' : 'blunder',
          explanation: (off === 0 ? 'Right. ' : '') + said
        };
      }
    };
  }

  function buildGinRating(hand, scored) {
    // the hand after its best throw; a hand that is gin already has nothing to count
    const best = scored && scored[0];
    if (!best || scored.some(s => s.canGin)) return null;
    const rest = hand.hands[0].filter(c => c !== best.card);
    if (C.bestArrangement(rest).points === 0) return null;
    const q = ginCountQuestion(best.card, rest);
    return {
      type: 'ginrating',
      title: 'Gin cards',
      prompt: q.prompt,
      options: q.options,
      resolve(answer) { return Object.assign(q.resolve(answer), { apply: null }); }
    };
  }

  /* how many of a rank you can account for: each card once, wherever it is now */
  function buildCounting(hand) {
    // pick a rank that has appeared at least once face up
    const seen = [...new Set(hand.faceUp)];
    if (!seen.length) return null;
    const rank = C.rankOf(seen[(Math.random() * seen.length) | 0]);
    const mine = new Set(hand.hands[0]);
    const inHand = hand.hands[0].filter(c => C.rankOf(c) === rank).length;
    const onTable = seen.filter(c => C.rankOf(c) === rank && !mine.has(c)).length;
    const accounted = inHand + onTable;
    const rname = C.RANKS[rank - 1];
    const opts = [];
    for (let n = Math.max(0, accounted - 2); n <= Math.min(4, accounted + 2) && opts.length < 4; n++) opts.push(n);
    return {
      type: 'counting', rank: rname,
      title: 'Card counting',
      prompt: `Counting your hand and every card that has been face up: how many ${rname}s are accounted for?`,
      options: opts.map(n => ({ id: String(n), label: String(n) })),
      resolve(answer) {
        const right = Number(answer) === accounted;
        return {
          grade: right ? 'optimal' : 'blunder',
          explanation: `${accounted} ${rname}${accounted === 1 ? ' is' : 's are'} accounted for: ${inHand} in your hand, ${onTable} seen face up elsewhere. ${4 - accounted} still unseen.`,
          apply: null
        };
      }
    };
  }

  /* A question answered from the table (review.js): which card they surely
     hold, or three unseen cards put in order of how likely they are held.
     resolve(answer) never grades a read as costly.                         */
  function buildOppRead(coach, hand, opts) {
    const R = window.Review;
    const q = R ? R.readQuestion(hand, coach.est, opts) : null;
    if (!q) return null;
    return {
      type: 'read',
      title: q.form === 'certain' ? 'Which do they hold?' : 'Most likely first',
      read: q,
      options: q.cards.map(x => ({ id: String(x.card), label: C.name(x.card) })),
      resolve(answer) {
        const res = R.scoreRead(q, answer);
        return { grade: res.grade, read: res, explanation: '', apply: null };
      }
    };
  }

  /* ------------- memory tools ------------- */

  /* pile recall: one card really hit the table, three never showed */
  function buildRecallQuiz(hand) {
    const shown = hand.faceUp.filter(c => !hand.hands[0].includes(c));
    if (shown.length < 3) return null;
    const real = shown[(Math.random() * shown.length) | 0];
    const never = [];
    for (let c = 0; c < 52; c++) {
      if (!hand.faceUp.includes(c) && !hand.hands[0].includes(c) && !hand.hands[1].includes(c)) never.push(c);
    }
    if (never.length < 3) return null;
    const picks = [];
    while (picks.length < 3) {
      const c = never[(Math.random() * never.length) | 0];
      if (!picks.includes(c)) picks.push(c);
    }
    const options = [real, ...picks].sort(() => Math.random() - 0.5);
    return { real, options };
  }

  /* score the player's belief grid against reality + what was knowable */
  function scoreBeliefGrid(coach, hand, marks) {
    const opp = new Set(hand.hands[1]);
    let inRight = 0, inWrong = 0, outRight = 0, outWrong = 0, marked = 0;
    for (const [card, m] of Object.entries(marks)) {
      const c = Number(card);
      marked++;
      if (m === 'in') { opp.has(c) ? inRight++ : inWrong++; }
      else if (m === 'out') { !opp.has(c) ? outRight++ : outWrong++; }
    }
    // knowable reference: cards provably dead from the human seat (plug rule),
    // counting the cards they were seen taking as theirs
    const live = E.unseenFor(hand, 0), theirs = couldHold(hand, 0);
    let knowableDead = 0;
    for (const c of live) {
      if (coach.est.knownOut.has(c) || C.usefulness(c, theirs) === 0) knowableDead++;
    }
    return { inRight, inWrong, outRight, outWrong, marked, knowableDead, knownIn: coach.est.knownIn.size };
  }

  /* ------------- rating + milestones ------------- */
  /* The old rating (hands won, 6 points a hand against the level's figure).
     Retired: it could not tell players apart (endgame-evidence.md 2a). The
     app no longer calls it; tools/bench-rating.js keeps it as the "before". */
  const TIER_RATING = { casual: 1100, standard: 1400, expert: 1700, persona: 1400 };

  function updateRating(stats, oppKey, won) {
    const opp = TIER_RATING[oppKey] || 1400;
    const expected = 1 / (1 + Math.pow(10, (opp - stats.rating) / 400));
    stats.rating = Math.round((stats.rating + 6 * ((won ? 1 : 0) - expected)) * 10) / 10;
  }

  const MILESTONES = [
    ['firstWin', 'Win a match'],
    ['threeStraight', 'Three straight matches vs Standard'],
    ['beatExpert', 'Win a match vs Expert'],
    ['sharp80', 'Win a match with 80% of all your plays right or fine'],
    ['proWin', 'Win a match at the Pro table'],
    ['ginRun', 'Score three gins in one match']
  ];

  /* A drill answered, counted through the gate. `asked` (optional): the answer minted when it
     was given (mint), so an answer whose verdict lands after the table was left is not counted. */
  function recordDrillResult(coach, type, grade, asked) {
    if (!isObj(coach.stats.drills) || !Array.isArray(coach.stats.drills[type])) return;
    const play = asked || mint(coach, {});
    settle(coach, play, { drill: type, right: grade === 'optimal' || grade === 'good' });
  }

  window.Coach = {
    createCoach, newHand, onEvent, maybeDrill,
    gradeDraw, gradeDiscard, gradeKnock,
    logMove, logPending, countMove, reviseMove, recordDrillResult, saveStats,
    // the record's one gate (settle) and what it keeps
    mint, leave, keep, ask, adoptLog, settle, audit, negatives, newEpoch, newRecordEpoch,
    snapshot, loadBlunders, saveBlunders, weekKey, weekBucket, couldHold,
    buildCounting, ginCountQuestion, buildRecallQuiz, scoreBeliefGrid, updateRating, MILESTONES,
    // against the house player
    houseAction, houseFigure, houseHand, bookHouseHand, houseRating, houseMark, houseSince, playingWell,
    HOUSE: { SCALE: HOUSE_SCALE, WINDOW: HOUSE_WINDOW, MIN: HOUSE_MIN, SINCE_MIN: HOUSE_SINCE_MIN },
    // when the coach asks
    wantsPrejudge, prejudgeJob, prejudged, drillOfType, maybeSideQuiz,
    ASK: { BAR: ASK_BAR, WELL_BAR, FROM: ASK_FROM, PREJUDGE_MS },

<script>
/* ============================================================
   review.js — the review after a hand, and the opponent read

   After a hand, every play the dollar coach flagged or called too close
   is dealt out again, far deeper, off the main thread. The plays still a
   clear loss become key moments (three at most, biggest first). Each is
   posed again with only what the player could see then, and solved when
   the answer is the best play or as good as it.

   The read question asks about the other hand using only the table:
   what they took and threw. It is scored against how often each kind of
   evidence really points to a held card (tools/bench-reads.js).

   Pure functions here; the sheets are drawn in main.js.
   ============================================================ */
(function () {
  'use strict';
  const C = window.Cards, E = window.Engine, O = window.Oracle;

  /* ---------------- the deeper look ---------------- */

  const DEEP_DEALS = 5000;        // deals per re-judged play
  const DEEP_FIRST = 200;         // every play gets this many before only the contenders go on
  const DEEP_BUDGET_MS = 30000;   // per play; a phone may stop short of DEEP_DEALS
  const HAND_BUDGET_MS = 90000;   // the whole hand: what is left after this keeps its first verdict
  const SLICE_MS = 12;            // main-thread fallback: work per slice
  const MAX_MOMENTS = 3;

  /* the stats a verdict on this entry rests on: the deeper look once it is in */
  const statsOf = e => (e.deep && e.deep.n > (e.stats ? e.stats.n : 0) ? e.deep : e.stats);
  function final(e) {
    const st = e && e.key ? statsOf(e) : null;
    return st && st.n ? O.verdict(st, e.key) : null;
  }

  /* Flagged (cost) or too close, priced, and not yet looked at again. A close
     call whose gap could not reach 1.5% of the deal even at the top of its
     margin can never become a key moment, so it is not looked at again.     */
  const couldMatter = e => e.cost > 0 ||
    (e.oracle.close && e.oracle.loss + e.oracle.margin >= 0.015 * (e.stats.unit || 1));
  const needsDeep = e => !!(e && e.job && e.stats && e.key && e.oracle && !e.pending && !e.deepDone && couldMatter(e));
  function toDeepen(log) {
    return log.filter(needsDeep).sort((a, b) => b.oracle.loss - a.oracle.loss);
  }

  /* a clear loss: gap above 1.5 margins and above 1.5% of the deal (the oracle's 'acceptable' and 'blunder') */
  const isKey = v => !!v && !v.close && (v.grade === 'acceptable' || v.grade === 'blunder') && v.cost > 0;

  /* -> { moments: [{ entry, v }], waiting, line } */
  function pick(log) {
    const waiting = log.filter(e => e.pending || needsDeep(e)).length;
    const moments = log
      .filter(e => e.stats && e.key && !e.pending && !needsDeep(e))
      .map(entry => ({ entry, v: final(entry) }))
      .filter(m => isKey(m.v))
      .sort((a, b) => b.v.cost - a.v.cost)
      .slice(0, MAX_MOMENTS);
    return { moments, waiting, line: moments.length || waiting ? null : 'Nothing given away.' };
  }

  /* Is `key` an answer to the position? The play made is never accepted. The
     best is; so is a play inside its margin or within 1.5% of the deal (the
     oracle's 'good'). A play dropped from the deeper look early has a wide
     margin, so it is accepted only on the 1.5% rule.                         */
  function solved(stats, key, playedKey) {
    if (!stats || !stats.rows || !stats.rows.length || key === playedKey) return false;
    const row = stats.rows.find(r => r.key === key);
    if (!row) return false;
    if (row === stats.rows[0]) return true;
    const v = O.verdict(stats, key);
    if (row.live) return v.grade === 'optimal' || v.grade === 'good';
    return v.loss < 0.015 * (stats.unit || 1);
  }

  /* contenders, as oracle.js keeps them: the two leading plays and the one made */
  function contenders(s, focus) {
    const live = s.stats().rows.filter(r => r.live);
    const keep = live.slice(0, 2);
    const f = live.find(r => r.key === focus);
    if (f && !keep.includes(f)) keep.push(f);
    return keep.map(r => r.index);
  }

  /* main-thread fallback, in slices, checked for cancel between slices */
  function sliced(job, stopped) {
    return new Promise(resolve => {
      const s = O.session(job.snap, job.actions, job.ctx), t0 = Date.now();
      (function slice() {
        if (stopped()) { resolve(null); return; }
        const t1 = Date.now();
        while (s.n < job.n && Date.now() - t1 < SLICE_MS) s.step(1, s.n < job.first ? null : contenders(s, job.focus));
        if (s.n < job.n && Date.now() - t0 < job.budgetMs) setTimeout(slice, 0);
        else resolve(s.stats());
      })();
    });
  }

  /* a worker of its own, so a cancel can end it at once (terminate). The
     script is built once and its URL kept: every hand's review reuses it.  */
  let workerUrl = null;
  function makeWorker() {
    if (typeof Worker === 'undefined' || typeof document === 'undefined') return null;
    try {
      if (!workerUrl) {
        const src = [];
        document.querySelectorAll('script[data-worker]').forEach(el => src.push(el.textContent || ''));
        if (!src.length || !src.every(x => x.length > 0)) return null;   // dev mode: scripts loaded by src
        const boot = 'self.window = self;\n' + src.join('\n;\n') + '\n;' +
          'self.onmessage = function (e) { self.postMessage(Oracle.runJob(e.data)); };';
        workerUrl = URL.createObjectURL(new Blob([boot], { type: 'text/javascript' }));
      }
      return new Worker(workerUrl);
    } catch (e) { return null; }
  }

  /* Look again at every flagged or too-close play in `log`, one at a time,
     biggest first. Each result is cached on its entry (entry.deep) and
     onEach(entry) is called. -> { done: Promise, cancel() }                  */
  function deepen(log, opts) {
    opts = opts || {};
    const n = opts.n || DEEP_DEALS, perPlay = opts.budgetMs || DEEP_BUDGET_MS;
    const total = opts.totalMs || HAND_BUDGET_MS, t0 = Date.now();
    let stopped = false, worker = null, wake = null, budgetMs = perPlay, usedWorker = false;
    const stop = () => stopped;
    function runOne(e) {
      const job = Object.assign({}, e.job, { n, first: Math.min(n, opts.first || DEEP_FIRST), budgetMs, focus: e.key });
      if (opts.worker !== false && !worker) { worker = makeWorker(); if (worker) usedWorker = true; }
      if (!worker) return sliced(job, stop);
      return new Promise(resolve => {
        wake = resolve;
        worker.onmessage = m => { wake = null; resolve(m.data); };
        worker.onerror = () => {
          wake = null;
          try { worker.terminate(); } catch (x) {}
          worker = null; opts.worker = false;
          resolve(stopped ? null : sliced(job, stop));
        };
        worker.postMessage(job);
      });
    }
    const done = (async () => {
      // asked again after each play, so a verdict that lands meanwhile joins the queue
      for (let e = toDeepen(log)[0]; e && !stopped; e = toDeepen(log)[0]) {
        const left = total - (Date.now() - t0);
        if (left < 1000) {
          // out of time for this hand: the rest keep the verdict they had
          for (const x of toDeepen(log)) { x.deepDone = true; x.deepSkipped = true; }
          if (opts.onEach) { try { opts.onEach(e); } catch (x) {} }
          break;
        }
        budgetMs = Math.min(perPlay, left);
        let stats = null;
        const t1 = Date.now();
        try { stats = await runOne(e); } catch (x) { stats = null; }
        if (stopped) break;
        if (stats && stats.n && e.stats && stats.n > e.stats.n) e.deep = stats;
        e.deepDone = true;
        e.deepMs = Date.now() - t1;
        if (opts.onEach) { try { opts.onEach(e); } catch (x) {} }
      }
      if (worker) { try { worker.terminate(); } catch (x) {} worker = null; }
      return !stopped;
    })();
    return {
      done,
      cancel() {
        stopped = true;
        if (worker) { try { worker.terminate(); } catch (x) {} worker = null; }
        if (wake) { const w = wake; wake = null; w(null); }
      },
      get stopped() { return stopped; },
      get usedWorker() { return usedWorker; }
    };
  }

  /* ---------------- the position, as the player saw it ---------------- */

  /* Only what the player could see: their hand, the pile in order, the cards
     the other player was seen taking and still holds, the knock card, the
     sheet and the partner's result if it was known. No hidden card.         */
  function view(entry) {
    const s = entry.job.snap, ctx = entry.job.ctx;
    const kr = C.rankOf(s.knockCard), ginOnly = kr === 1, line = ginOnly ? 0 : Math.min(kr, 10);
    const v = {
      phase: s.phase, mine: s.mine.slice(), pile: s.pile.slice(), took: s.oppKnown.slice(),
      knockCard: s.knockCard, doubled: !!s.doubled, ginOnly, line,
      stockLen: s.stockLen, oppLen: s.oppLen, turn: s.turns[s.me] + 1,
      upcard: s.pile.length ? s.pile[s.pile.length - 1] : null,
      games: ctx.games.map(g => ({ scores: g.scores.slice(), boxes: g.boxes.slice(), closed: g.closed, winner: g.winner })),
      bulge: ctx.bulge === undefined ? null : ctx.bulge,
      team: entry.mode === 'team',
      barred: s.drawnFrom === 'discard' && s.drawnCard !== null && s.drawnCard !== undefined ? [s.drawnCard] : [],
      plays: [],
      seq: []
    };
    // every card that has been face up, oldest first, and where it is now: the pile, their hand or yours
    const seen = s.faceUp.filter((c, i) => s.faceUp.lastIndexOf(c) === i);
    const inPile = new Set(s.pile), theirs = new Set(s.oppKnown);
    v.seq = seen.map(card => ({ card, at: inPile.has(card) ? 'pile' : theirs.has(card) ? 'them' : 'you' }));
    if (s.phase === 'upcard') v.plays = [{ type: 'take-upcard' }, { type: 'pass-upcard' }];
    else if (s.phase === 'draw') v.plays = s.forcedStock ? [{ type: 'draw-stock' }] : [{ type: 'draw-stock' }, { type: 'take-upcard' }];
    else if (s.phase === 'discard') {
      for (const card of s.mine) {
        if (v.barred.includes(card)) continue;
        const dw = C.deadwoodPoints(s.mine.filter(c => c !== card));
        v.plays.push({ type: 'discard', card, dw, canGin: dw === 0, canKnock: dw > 0 && !ginOnly && dw <= line });
      }
    }
    return v;
  }
  /* every card a view shows */
  const viewCards = v => v.mine.concat(v.pile, v.took, v.seq.map(x => x.card), [v.knockCard], v.barred,
    v.upcard === null ? [] : [v.upcard], v.plays.filter(p => p.card !== undefined).map(p => p.card));

  /* the play for an answer: a draw choice ('take-upcard' ...) or a card with 'throw' | 'knock' */
  function actionFor(v, choice, how) {
    if (typeof choice === 'string') return { type: choice };
    const p = v.plays.find(x => x.card === choice);
    if (!p) return null;
    if (how === 'knock' && p.canGin) return { type: 'discard', card: choice, gin: true };
    if (how === 'knock' && p.canKnock) return { type: 'discard', card: choice, knock: true };
    return { type: 'discard', card: choice };
  }

  /* ---------------- the opponent read ---------------- */

  /* How often an unseen card was really in their hand, by what a player can
     see (tools/bench-reads.js, 3,000 hands). "Dead" counts the cards they were
     seen taking as theirs (Coach.couldHold): re-measured 2026-11-15 over 3,000
     hands set up as test/review.js deals its reads, 12.9% held (16.8% before,
     when a card next to their pickup could be called dead).                  */
  const RATE_NEAR_TAKEN = 0.55;    // same rank as, or same suit within two of, a card they took
  const RATE_NO_LINK = 0.30;       // nothing on the table points either way
  const RATE_DEAD = 0.13;          // can no longer make a meld, even with the cards they took
  const RATE_NEAR_THROWN = 0.15;   // near a card they threw or passed
  const GROUPS = {
    nearTaken: RATE_NEAR_TAKEN, noLink: RATE_NO_LINK, dead: RATE_DEAD, nearThrown: RATE_NEAR_THROWN
  };
  const TIE = 0.05;   // rates closer than this are not told apart

  const near = (c, d) => c !== d && (C.rankOf(c) === C.rankOf(d) ||
    (C.suitOf(c) === C.suitOf(d) && Math.abs(C.rankOf(c) - C.rankOf(d)) <= 2));

  /* the evidence group of an unseen card, and the card that links it.
     theirs: every card they could hold, the ones seen taken included    */
  function evidenceOf(c, taken, thrown, theirs) {
    if (C.usefulness(c, theirs) === 0) return { group: 'dead', link: null };
    const t = taken.find(d => near(c, d)), h = thrown.find(d => near(c, d));
    if (t !== undefined && h !== undefined) return { group: 'mixed', link: null };
    if (t !== undefined) return { group: 'nearTaken', link: t };
    if (h !== undefined) return { group: 'nearThrown', link: h };
    return { group: 'noLink', link: null };
  }

  /* their takes and throws, in order */
  function oppMoves(hand, opp) {
    return (hand.history || [])
      .filter(e => e.player === opp && (e.type === 'take-upcard' || e.type === 'discard' || e.type === 'pass-upcard') && e.card !== undefined)
      .map(e => ({ verb: e.type === 'take-upcard' ? 'took' : e.type === 'discard' ? 'threw' : 'passed', card: e.card }));
  }

  const shuffled = (arr, rng) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = (rng() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  };
  const pickOne = (arr, rng) => arr[(rng() * arr.length) | 0];

  /* Certain form: a card they were seen taking and still hold, among two they
     let go. Uncertain form: three unseen cards from different evidence groups,
     to be put in order, most likely first. null when neither can be made.
     `truth` (what they really hold) is for the answer only.                   */
  function readQuestion(hand, est, opts) {
    opts = opts || {};
    const rng = opts.rng || Math.random, me = 0, opp = 1;
    const mine = new Set(hand.hands[me]), pile = new Set(hand.discard);
    const moves = oppMoves(hand, opp);
    const held = [...est.knownIn].filter(c => !mine.has(c) && !pile.has(c));
    const thrown = moves.filter(m => m.verb !== 'took').map(m => m.card);
    const live = E.unseenFor(hand, me);
    const theirs = window.Coach && window.Coach.couldHold ? window.Coach.couldHold(hand, me) : live;
    const truth = hand.hands[opp].slice();

    // uncertain: unseen, not seen taken, not seen let go
    const groups = {};
    for (const c of live) {
      if (est.knownIn.has(c) || est.knownOut.has(c)) continue;
      const ev = evidenceOf(c, held, thrown, theirs);
      if (!GROUPS[ev.group]) continue;
      (groups[ev.group] || (groups[ev.group] = [])).push({ card: c, group: ev.group, link: ev.link, rate: GROUPS[ev.group] });
    }
    const names = Object.keys(groups).sort((a, b) => GROUPS[b] - GROUPS[a]);
    let triple = null;
    if (names.length >= 3) {
      // the top group, then two more; at least two of the three pairs must be told apart
      const tries = [];
      for (let i = 0; i < names.length; i++) for (let j = i + 1; j < names.length; j++) for (let k = j + 1; k < names.length; k++) {
        const g = [names[i], names[j], names[k]];
        if (comparablePairs(g.map(x => GROUPS[x])) >= 2) tries.push(g);
      }
      if (tries.length) triple = pickOne(tries, rng);
    }
    const uncertain = triple ? {
      form: 'uncertain',
      cards: shuffled(triple.map(g => pickOne(groups[g], rng)), rng)
    } : null;

    let certain = null;
    if (held.length) {
      // decoys: cards they let go (taken then thrown first), not in your hand
      const back = moves.filter((m, i) => m.verb === 'threw' && moves.slice(0, i).some(x => x.verb === 'took' && x.card === m.card)).map(m => m.card);
      const out = [...new Set(back.concat(thrown))].filter(c => !mine.has(c) && !est.knownIn.has(c));
      if (out.length >= 2) {
        const answer = pickOne(held, rng);
        const decoys = shuffled(out, rng).slice(0, 2);
        certain = {
          form: 'certain', answer,
          cards: shuffled([answer].concat(decoys), rng).map(c => ({ card: c, group: c === answer ? 'held' : 'gone' }))
        };
      }
    }
    // opts.form asks for one form (when it can be made)
    const q = opts.form === 'certain' ? certain : opts.form === 'uncertain' ? uncertain
      : uncertain && (!certain || rng() < 0.5) ? uncertain : certain;
    if (!q) return null;
    q.moves = moves;
    q.truth = truth;
    return q;
  }

  function comparablePairs(rates) {
    let n = 0;
    for (let i = 0; i < rates.length; i++) for (let j = i + 1; j < rates.length; j++) if (Math.abs(rates[i] - rates[j]) >= TIE) n++;
    return n;
  }
  /* pairs the player put the wrong way round (ties are never wrong) */
  function misorders(order, rateOf) {
    let n = 0;
    for (let i = 0; i < order.length; i++) for (let j = i + 1; j < order.length; j++) {
      if (rateOf(order[j]) - rateOf(order[i]) >= TIE) n++;
    }
    return n;
  }

  /* answer: a card (certain form) or the cards in the player's order (uncertain).
     -> { grade, lines: [{ card, text, rate }], held: [cards of the question they held] }
     Never 'blunder': the cards they hold are luck; the order is the skill.     */
  function scoreRead(q, answer) {
    const truth = new Set(q.truth);
    const held = q.cards.map(x => x.card).filter(c => truth.has(c));
    if (q.form === 'certain') {
      const right = Number(answer) === q.answer;
      return {
        grade: right ? 'optimal' : 'acceptable', right,
        lines: q.cards.map(x => ({ card: x.card, group: x.group, rate: x.group === 'held' ? 1 : 0 })),
        held
      };
    }
    const order = (answer || []).map(Number);
    const rateOf = c => { const x = q.cards.find(y => y.card === c); return x ? x.rate : 0; };
    const wrong = order.length === q.cards.length ? misorders(order, rateOf) : comparablePairs(q.cards.map(x => x.rate));
    const grade = wrong === 0 ? 'optimal' : wrong === 1 ? 'good' : 'acceptable';
    const lines = q.cards.slice().sort((a, b) => b.rate - a.rate)
      .map(x => ({ card: x.card, group: x.group, link: x.link, rate: x.rate }));
    return { grade, right: wrong === 0, lines, held };
  }

  window.Review = {
    RATE_NEAR_TAKEN, RATE_NO_LINK, RATE_DEAD, RATE_NEAR_THROWN, GROUPS, TIE,
    statsOf, final, needsDeep, toDeepen, pick, solved, deepen,
    view, viewCards, actionFor,
    evidenceOf, readQuestion, scoreRead
  };
})();

</script>
<script>
/* ============================================================
   playbook.js: the strategy library.
   Rewritten 2026-11-15 from a full read of Pramod Shankar,
   "How to Win at Gin Rummy" (notes: docs/book-notes-full.md).
   Everything is paraphrased and much shorter than the book.

   An item is [title, text, extra]. `extra` is optional:
     test:  key into MEASURED, a piece of advice that was tested
     view:  true when it is the book's opinion about heads-up gin
            scored in points, which may not carry over to 2v2
            played for boxes and games
   MEASURED comes from tools/bench-book.js: the same seeded 2v2
   deals played twice, once by the Expert bot as it is and once
   with that one piece of advice forced on one team, priced at
   $2 a box and $20 a game under the house scoring.
   ============================================================ */
(function () {
  'use strict';

  /* dollars a deal, with the margin (two standard errors). Filled in from the bench. */
  const MEASURED = {
    'knock-first': 'loses money: −$1.39 a deal, margin 0.21',
    'knock-early': 'loses money: −$0.45 a deal, margin 0.12',
    'gin-late': 'inside the margin: +$0.01 a deal, margin 0.01 (it came up in only 12 deals)',
    'low-card-gin': 'inside the margin: −$0.04 a deal, margin 0.19',
    'no-loose-take': 'loses money: −$0.70 a deal, margin 0.38',
    'speculate': 'inside the margin: +$0.39 a deal, margin 0.42',
    'take-low': 'loses money: −$0.39 a deal, margin 0.27',
    'unload-tens': 'inside the margin: −$0.20 a deal, margin 0.22',
    'break-high': 'inside the margin: −$0.01 a deal, margin 0.04',
    'safest-throw': 'inside the margin: −$0.26 a deal, margin 0.36',
    'lower-first': 'inside the margin: −$0.05 a deal, margin 0.53',
    'triangle-safe': 'loses money: −$1.57 a deal, margin 0.33',
    // not from the book: the knock rule fitted to this table (docs/knock-model.md), same test, 14,000 fresh deals
    'knock-fitted': 'makes money: +$1.61 a deal, margin 0.29, against the bot on the published formula'
  };
  const MEASURED_OVER = '14,000 deals';

  const SECTIONS = [
    {
      title: 'The Ten Golden Rules',
      tag: 'the book’s ten, in its order',
      items: [
        ['1. One goal', 'Every play aims at getting under the knock card as fast as you can. The shape to build is melds, one triangle (a pair plus a suited neighbour) and a cache of low cards. Do not plan on hitting two or three combinations.'],
        ['2. Knock at the first chance', 'If you are playing for a knock, knock the first time you can. The author calls this the most broken rule in gin. Between two of your turns they get your discard and a draw from the stock.', { test: 'knock-first', view: true }],
        ['3. Take a card that melds', 'Take a pile card that makes a meld or adds to one. Two exceptions: when taking it weakens a combination you have to hit, or leaves you having to throw their gin card.'],
        ['4. Leave the rest', 'Do not take a pile card that makes no meld. Draw from the stock instead. The one exception is a planned speculation (see Ploys).', { test: 'no-loose-take' }],
        ['5. Do not throw what they can use', 'That means cards that add to melds you know they hold. If the choice is between an add-on and a card that could make them a new meld, give the add-on: a new meld is the bigger swing.'],
        ['6. Do not throw what they may use', 'When you cannot be sure, throw the card with the fewest ways left to meld, and prefer one that would show you how it was used if they took it.', { test: 'safest-throw' }],
        ['7. Dealt heavy, unload', 'With four or more ten-point cards at the deal, start throwing them however good the high combination looks. One high triangle may stay early, rarely two. If it has not hit in six or seven turns, break it, safest card first.', { test: 'unload-tens', test2: 'break-high' }],
        ['8. Low cards for the cache', 'Take an ace, two, three or four from the pile when you have a safe higher card to throw. The cache is your third meld and adding to it is as good as adding to a meld.', { test: 'take-low' }],
        ['9. Play for the tie', 'Near the bottom of the stock, play to a draw before knocking for a doubtful win. Late in the hand you know the most, so play carefully. Not tested: "doubtful" has no fixed meaning a bot can follow.'],
        ['10. Sooner be undercut than feed gin', 'Faced with a knock that may be undercut or a throw that may gin them, knock. In points an undercut of 10 against 9 costs 26 and their gin costs 35 or more.', { view: true, note: 'At this table an undercut and a gin are both two boxes, and a gin off is three. The point gap the book relies on is not there in box money.' }]
      ]
    },
    {
      title: 'Knock or gin?',
      tag: 'the big decision',
      items: [
        ['What this table’s own play says', 'Not from the book. In 72,475 knock decisions played out with the true cards under this table’s scoring, knocking beat playing on by about $2 with no card that gins you and $1 with one, was even with two, and lost about $3 with three and $7 with four. That held with under ten cards in the pile too: there it was +$3.14, +$2.13, +$1.37, then −$1.01 with three gin cards and −$7.00 with four or more. Knocking also earns less the longer the hand runs, less on a spade, and less when your partner is behind. A rule fitted to those records knocks about 39% of the time where the old rule knocked 66%. The bot and the coach now use it in the team game, and the Gym’s Knock or play on drill is dealt from it. Heads-up, it is used only once you are on two of the three games: before that, getting on the sheet is worth more than a bigger win, and the rule measured worse there.', { test: 'knock-fitted' }],
        ['Early: knock', 'With fewer than ten cards in the pile, knock whenever you can, unless they are plainly very low and playing for gin or the undercut. With twenty cards in the stock a four-way gin shot hits one draw in five, so gin has to pay five times the knock.', { test: 'knock-early', view: true }],
        ['Late: honour four ways', 'Past twenty cards in the pile a winning knock usually wins under ten, and they know your melds. With four or more cards that gin you, play for gin. Five and six ways are uncommon and usually worth honouring. Seven or more, always.', { test: 'gin-late', view: true }],
        ['Level scores: just win', 'When both sides are close to the game line, whoever scores next probably wins it. Take the points.'],
        ['Behind or far ahead', 'Well behind with both sides on the sheet, careful play will not catch up: go for the big hand. Far ahead with both sides on the sheet, a gin can end it at once.', { view: true }],
        ['When they are blank', 'If the other side has no score in a game, any score of yours that keeps them blank or ends the game is the aim. Do not hold out for gin. The book’s one exception is a team case: your partner has just lost, so a small knock would let them onto the sheet anyway, and only a big hand keeps them off.'],
        ['Blocked hands knock', 'Two four-card sets and two strays cannot improve and cannot gin. Knock at the first chance.'],
        ['Count layoffs first', 'Before knocking, count the unseen cards that fit your melds. A three-card set leaves one, a three-card run up to four. The same nine cards held as three runs can leave twelve layoffs, as three sets only three. Show sets where you can, and keep melds apart on the table so a set does not lend its card to a run.'],
        ['Keep the high card for the knock', 'With two loose cards and one of them going face down when you knock, throw the lower one now and keep the higher for the knock. A live jack that hits their hand saves them more than a five would. Thrown on the knock it cannot be taken.', { test: 'lower-first' }],
        ['Melded cards you need', 'The book’s rule of thumb: to knock you need six cards melded at a knock card of 9 or 10, seven at 5 to 8, and nine at 4 or less. The rules allow less, with the lowest loose cards: five (as a five-card run) at 9 or 10, six at 6 to 8, seven at 4 or 5, and eight at 2 or 3. The old playbook went further and said to play a low knock card for gin from the start. That was the app’s idea, not the book’s.', { test: 'low-card-gin' }],
        ['The published formula', 'Not from the book. Until this table’s rule was fitted, the bot knocked by a formula from a 2021 paper: knock when 25.9 minus 0.15 times deadwood squared, minus 1.15 times the turn, minus 1.2 times gin rating squared, is above zero. It was made from plain gin to 100 points, knock card always 10, against a bot that never knocks. On this table’s records it does worse than the fitted rule, and its authors say themselves that such a formula has to be refitted for the players and the game.']
      ]
    },
    {
      title: 'Safe discarding',
      tag: 'where games are won',
      items: [
        ['The 0 to 6 count', 'A card can complete at most six three-card melds for them: three runs and three sets. Count the ones still possible. Zero is perfectly safe, six is fully wild. Aces and kings start at four, twos and queens at five.'],
        ['How often a wild card hits', 'A fully wild card helps them 27% of the time with an empty pile, 50% by the thirteenth discard and always by the twenty-eighth. If a wild card has to go, it goes early.'],
        ['What a hit costs', 'A card that completes their triangle can cut their count by three times its face value. Expected cost is 3 times face value times the chance of a new meld: a ten with three cards in the pile costs about 9 points, a five-way eight at the fifteenth discard about 14. Make the throw only if your own gain is bigger.'],
        ['Hold wild cards, shed dead ones', 'By the book’s table, holding back a fully wild card gains a point or two for a low card and three or four for a ten, at every stage. Once a card is down to three ways or fewer, keeping it costs you: throw it.', { view: true, note: 'The table assumes fixed chances of knocking, gin and undercut for both players and scores in points. It is a model, not a measurement.' }],
        ['Of two wild cards, the lower first', 'Between two fairly wild cards the book prefers throwing the lower. Early in a hand beginners throw high cards and experienced players throw protected low or middle ones. The author says the difference is small. It pulls against rule 7, which is only for hands dealt four or more ten-point cards.', { test: 'lower-first', view: true }],
        ['Same rank seen beats neighbour seen', 'At the same count, a card whose rank has already shown is a little safer than one whose suit neighbour has shown.'],
        ['Three ranks away', 'Their throw of a same-suit card three ranks from yours removes one of your card’s runs: about a third safer.'],
        ['The adjacent card', 'Their very first throws are usually load cards, so a card one rank away in another suit is fairly safe. This holds for the first three or four discards only. After that the card may have come from a pair or a run.'],
        ['Seven is king', 'A seven fits five times as many runs as an ace or king. Other things equal, cards far from seven go first and sevens last. Low cards still earn their keep by cutting points.'],
        ['Break a triangle the safe way', 'From 3-2 of diamonds and the 2 of hearts, throw the 2 of diamonds: the card that is in both the pair and the run. Only a set can use it, and then your other two lays off. Throwing the odd card and hoping to fill the run is the risky way. Once you start splitting, play defence to the end.', { test: 'triangle-safe' }],
        ['Break a combination before a bad throw', 'The common mistake is a good hand, one card from knocking, throwing wild card after wild card. Do not be afraid to split a combination to avoid a dangerous throw. With two tens and two wild load cards, think about splitting the tens: if they take one, the other probably lays off.'],
        ['One layoff card, not two', 'Keep at most one card that lays off on their melds. Holding two pins your hand: you cannot knock or gin, and your best hope is that they knock.']
      ]
    },
    {
      title: 'Reading the opponent',
      tag: 'the expert’s edge',
      items: [
        ['Every play talks', 'A pick says what they hold. A discard or a pass says what they do not. There are more discards than picks, so most of what you learn is what is missing, and that is enough.'],
        ['The plug rule', 'A card that has two or fewer cards left around it that could meld with it is dead for them: safe for you to throw, useless for them to hold. Your own cards count as gone. Run it after every play; one play often kills several cards.'],
        ['Four steps', 'Their likely hand at any moment: your own cards out, the discards out, the cards they took and what must go with them in, and then the plug rule over what is left.'],
        ['The twelve-discard point', 'After twelve to fifteen discards you can place about fifty of the fifty-two cards. From there play should involve very little guessing.'],
        ['Which way the run goes', 'When they take your discard for a run, watch their next throw. Another suit’s card two ranks above yours: the run climbs from your card and stops there. Two below: it runs down. One rank away: your card is probably the middle.'],
        ['Split odds', 'You split a pair and they took the card: about 3 to 1 it went into a run. You split two suited neighbours and they took one: about 3 to 1 a set.'],
        ['An add-on left alone', 'If they pass a card that adds to their meld, they hold a combination they will not break and are probably going for gin.'],
        ['Habits to watch', 'Constant re-sorting suggests sets and runs close in rank. A long pause means several choices. A fast draw means they want one card. Do kings always go first? Do they speculate? How long do they keep high cards?'],
        ['A badly shuffled deck', 'A deck needs about seven good shuffles. After a poor one the last hand’s melds come out together: if a meld of jacks went in and a jack turns up, more jacks are near.'],
        ['Check yourself', 'At the end of each hand look at what they held and compare it with your picture. That is how the picture gets better.']
      ]
    },
    {
      title: 'Ploys',
      tag: 'bending the rules on purpose',
      items: [

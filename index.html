  function read(f, key) {
    const h = habit(key);
    const s = f && f.seen && f.seen[key];
    if (!s || !s.length) return h.def;
    return s.reduce((a, b) => a + b, 0) / s.length;
  }

  const seen = (f, key) => (f && f.seen && f.seen[key] ? f.seen[key].length : 0);

  /* the step nearest a value; a tie goes to the habit's default */
  function nearestStep(key, value) {
    const h = habit(key);
    let best = null;
    for (const st of h.steps) {
      const d = Math.abs(st[0] - value);
      if (!best || d < best.d - 1e-9 ||
          (Math.abs(d - best.d) < 1e-9 && Math.abs(st[0] - h.def) < Math.abs(best.st[0] - h.def))) {
        best = { st, d };
      }
    }
    return best.st;
  }

  const stepLabel = (key, value) => nearestStep(key, value)[1];

  function summary(f) {
    const parts = [];
    for (const h of HABITS) {
      const st = nearestStep(h.key, read(f, h.key));
      if (st[0] !== h.def) parts.push(st[1]);
    }
    return parts.length ? parts.join(' · ') : 'No read yet';
  }

  /* ---------------- the tuned bot ---------------- */

  function tuneFor(f) {
    if (!f) return { level: 'expert', tune: null };
    const skill = read(f, 'skill');
    const d = read(f, 'defense');
    /* These settings were chosen by measurement (tmp/sweep.js, 800 to 2500 hands
       each against the standard bot), so that every step plays measurably
       differently from the next:
       Throws: Careless 0, Ordinary 1.5, Careful 6. Your pickups of its throws
         fall from about 19 in 100 to 17 to 15; the careful one pays for it in speed.
       Overall: Sharp is the app's expert bot. Solid makes four throws in ten the
         simple way (lowest count, nothing else weighed). A Beginner makes every
         throw that way, and one in four of them is any loose card at all.      */
    const defense = d <= 1 ? 1.5 * d : 1.5 + 4.5 * (d - 1);
    const sloppy = skill >= 2 ? 0 : skill >= 1 ? 0.4 * (2 - skill) : 0.4 + 0.6 * (1 - skill);
    return {
      level: skill >= 1.5 ? 'expert' : 'standard',
      tune: {
        knock: read(f, 'knock'),
        spec: 0.35 * read(f, 'spec'),
        defense,
        sloppy,
        wild: skill < 1 ? 0.25 * (1 - skill) : 0,
        bulge: read(f, 'bulge') >= 0.5
      }
    };
  }

  function brainFor(f, seat) {
    if (!f) return A.createBrain('expert', seat);
    const t = tuneFor(f);
    return A.createBrain(t.level, seat, null, t.tune);
  }

  /* ---------------- running many hands ---------------- */

  /* small seeded generator, so a deal can be replayed exactly */
  function mulberry32(a) {
    a = a >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* Play one hand to the end between two brains on a fresh match.
     `watch(info)` sees each step, before it is played, for the statistics. */
  function playHand(brains, watch) {
    const match = E.makeMatch({ manualLayoff: false });
    match.settings.manualLayoff = false;
    E.startHand(match);
    const hand = match.hand;
    let guard = 0;
    while (hand.phase !== 'over') {
      const p = hand.current;
      const phase = hand.phase;
      const action = A.decide(brains[p], match);
      if (watch) watch({ p, phase, action, hand });
      const evs = E.act(match, action);
      for (const ev of evs) { A.observe(brains[0], ev); A.observe(brains[1], ev); }
      if (++guard > 500) throw new Error('hand did not finish');
    }
    return hand;
  }

  /* run `job.step(i)` n times, with Math.random swapped for rng if given */
  function runSync(job, n, rng) {
    const saved = Math.random;
    if (rng) Math.random = rng;
    try {
      for (let i = 0; i < n; i++) job.step(i);
    } finally { Math.random = saved; }
    return job.result();
  }

  /* the same, in ~15 ms slices so a page stays responsive */
  function runAsync(job, n, onProgress, rng) {
    return new Promise((resolve, reject) => {
      let i = 0;
      function slice() {
        const saved = Math.random;
        if (rng) Math.random = rng;
        try {
          const t0 = Date.now();
          while (i < n && Date.now() - t0 < 15) job.step(i++);
        } catch (e) {
          Math.random = saved;
          reject(e);
          return;
        }
        Math.random = saved;
        if (onProgress) { try { onProgress(n ? i / n : 1); } catch (e) { /* the page's problem */ } }
        if (i < n) setTimeout(slice, 0);
        else resolve(job.result());
      }
      setTimeout(slice, 0);
    });
  }

  const mean = xs => (xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null);

  /* the friend's bot (seat 1) against a plain standard bot (seat 0) */
  function measureJob(f) {
    const t = {
      hands: 0, won: 0, decided: 0, byKnock: 0, byGin: 0,
      knockTurns: [], knockCounts: [], caught: [], undercut: 0,
      takes: 0, loose: 0, discards: 0, fed: 0, boxes: 0, points: 0, lengths: []
    };
    return {
      step() {
        const brains = [A.createBrain('standard', 0), brainFor(f, 1)];
        let lastThrow = null; // the bot's last discard, waiting on seat 0's draw
        const hand = playHand(brains, s => {
          if (s.p === 1 && (s.phase === 'upcard' || s.phase === 'draw')) {
            // the very first upcard decision is left out: nothing else is on offer
            if (s.phase === 'draw' && s.action.type === 'take-upcard' && !s.hand.forcedStock) {
              t.takes++;
              if (!A.upcardMakesMeld(s.hand, 1)) t.loose++;
            }
          }
          if (s.p === 1 && s.phase === 'discard' && s.action.type === 'discard' && !s.action.knock && !s.action.gin) {
            lastThrow = s.action.card;
          }
          if (s.p === 0 && s.phase === 'draw' && lastThrow !== null) {
            t.discards++;
            if (s.action.type === 'take-upcard' && !s.hand.forcedStock) t.fed++;
            lastThrow = null;
          }
        });
        const r = hand.result;
        t.hands++;
        t.lengths.push(hand.turns[1]);
        t.boxes -= E.signedBoxes(hand);
        t.points -= E.signedResult(hand);
        if (!r || r.dead) return;
        t.decided++;
        if (r.winner === 1) t.won++;
        if (r.knocker === 1) {
          if (r.type === 'gin' || r.type === 'big-gin') t.byGin++;
          else {
            t.byKnock++;
            t.knockTurns.push(hand.turns[1]);
            t.knockCounts.push(r.knockerDW);
            if (r.type === 'undercut' || r.type === 'gin-off') t.undercut++;
          }
        } else if (r.knocker === 0) {
          t.caught.push(r.defenderDW);
        }
      },
      result() {
        const share = (a, b) => (b ? a / b : 0);
        return {
          hands: t.hands,
          winShare: share(t.won, t.decided),
          endsByKnock: share(t.byKnock, t.hands),
          endsByGin: share(t.byGin, t.hands),
          knockTurn: mean(t.knockTurns),
          knockCount: mean(t.knockCounts),
          caughtWith: mean(t.caught),
          undercut: share(t.undercut, t.byKnock),
          looseTakes: share(t.loose, t.takes),
          fed: share(t.fed, t.discards),
          boxes: share(t.boxes, t.hands),
          points: share(t.points, t.hands),
          // extra: how many turns the bot had in an average hand, however it ended
          handTurns: mean(t.lengths)
        };
      }
    };
  }

  const measure = (f, n, rng) => runSync(measureJob(f), n, rng);
  const measureAsync = (f, n, onProgress) => runAsync(measureJob(f), n, onProgress);

  /* three ways of playing against the friend's bot, over the same deals */
  const COUNTERS = [
    { key: 'sooner', label: 'Knock sooner than you normally would', tune: { knock: 1 } },
    { key: 'book', label: 'Play your normal game', tune: null },
    { key: 'later', label: 'Hold out for more before you knock', tune: { knock: -1 } }
  ];

  function counterJob(f, seedRng) {
    const rows = COUNTERS.map(() => ({ boxes: [], points: [] }));
    return {
      step() {
        // the deal's seed comes from the caller's generator (or Math.random)
        const seed = Math.floor(seedRng() * 4294967296) >>> 0;
        const outer = Math.random;
        COUNTERS.forEach((c, k) => {
          Math.random = mulberry32(seed); // identical cards and luck for each version
          try {
            const you = c.tune ? A.createBrain('expert', 0, null, c.tune) : A.createBrain('expert', 0);
            const hand = playHand([you, brainFor(f, 1)]);
            rows[k].boxes.push(E.signedBoxes(hand));
            rows[k].points.push(E.signedResult(hand));
          } finally { Math.random = outer; }
        });
      },
      result() {
        const n = rows[1].boxes.length;
        const book = rows[1].boxes;
        const options = COUNTERS.map((c, k) => {
          const diffs = rows[k].boxes.map((b, i) => b - book[i]);
          const d = mean(diffs) || 0;
          let margin = 0;
          if (n > 1) {
            const v = diffs.reduce((s, x) => s + (x - d) * (x - d), 0) / (n - 1);
            margin = 2 * Math.sqrt(v / n);
          }
          return {
            key: c.key, label: c.label,
            boxes: mean(rows[k].boxes) || 0,
            points: mean(rows[k].points) || 0,
            vsBook: d, margin
          };
        });
        let best = null, bestVs = 0;
        for (const o of options) {
          if (o.key === 'book') continue;
          if (o.vsBook > 0 && o.vsBook > o.margin && o.vsBook > bestVs) { best = o.key; bestVs = o.vsBook; }
        }
        return { hands: n, options, best };
      }
    };
  }

  /* seeds are drawn from rng when given; the hands themselves always run on
     their own seeded generator, and Math.random is put back afterwards     */
  function counterTest(f, n, rng) {
    const saved = Math.random;
    return runSync(counterJob(f, rng || (() => saved())), n, null);
  }
  function counterTestAsync(f, n, onProgress) {
    const saved = Math.random;
    return runAsync(counterJob(f, () => saved()), n, onProgress);
  }

  /* ---------------- the plan ---------------- */

  const pct = x => Math.round((x || 0) * 100) + '%';
  const one = x => (x === null || x === undefined ? '?' : (Math.round(x * 10) / 10).toString());

  function plan(f, stats) {
    const name = (f && f.name) || 'this player';
    const s = stats || {};
    const n = s.hands || 0;
    const r = key => read(f, key);
    const items = [];
    const isDefault = HABITS.every(h => nearestStep(h.key, r(h.key))[0] === h.def);

    if (!isDefault && !n) {
      // a read, not yet played out: nothing measured to quote
      items.push({ title: 'Not measured yet',
        text: `The read on ${name} (${summary(f)}) has not been played out yet, so there are no numbers to quote. Open these notes again once it has.` });
    }
    if (isDefault || !n) {
      if (isDefault) items.push({ title: 'No read yet',
        text: `There is no read on ${name} yet, so this bot plays an ordinary game. Practise against it as you would anyone, and note a few things at the next night.` });
      items.push({ title: 'Watch when they knock',
        text: `Do they knock as soon as they can, or keep going for gin? Note roughly which turn and how much they knock with.` });
      items.push({ title: 'Watch the pile',
        text: `Do they take a discard only when it makes a meld, or also to build toward one? Loose pickups make their hand harder to read.` });
      items.push({ title: 'Watch their late throws',
        text: `Late in a hand, do they throw cards you can use, or hold them back? That tells you how much they think about your hand.` });
      return items;
    }

    items.push({ title: 'What this is',
      text: `These notes describe a bot built from your read of ${name} (${summary(f)}), measured over ${n} hands against an ordinary bot. It wins ${pct(s.winShare)} of the hands that finish and nets ${one(s.boxes)} boxes a hand. It is a model of your read, not ${name}.` });

    const knock = r('knock');
    if (knock >= 0.75) {
      let text = `The bot ends ${pct(s.endsByKnock)} of hands by knocking, on average on its turn ${one(s.knockTurn)} holding ${one(s.knockCount)}. Keep your count low from the first turns, since the knock comes early.`;
      if (s.knockCount !== null && s.knockCount >= 5) {
        text += ` It knocks with a fair amount (${one(s.knockCount)}), so a low hand of your own has real undercut chances: ${pct(s.undercut)} of its knocks lost.`;
      } else {
        text += ` ${pct(s.undercut)} of its knocks were undercut.`;
      }
      items.push({ title: 'They knock early', text });
    } else if (knock <= -0.75) {
      items.push({ title: 'They wait for gin',
        text: `The bot ends ${pct(s.endsByKnock)} of hands by knocking and ${pct(s.endsByGin)} by gin. When you knock first it is caught holding ${one(s.caughtWith)} on average, so knock as soon as your count is low enough rather than waiting.` });
    }

    if (r('spec') >= 0.75) {
      items.push({ title: 'They pick up loosely',
        text: `${pct(s.looseTakes)} of the bot's pickups made no meld. A card they take from the pile tells you less than usual, so do not build your whole read of their hand on it.` });
    }

    const def = r('defense');
    if (def <= 0.5) {
      items.push({ title: 'Careless throws',
        text: `The bot throws without much thought for your hand: you took ${pct(s.fed)} of its discards. Keep combinations that their likely throws fill, and watch the pile late in the hand.` });
    } else if (def >= 1.5) {
      items.push({ title: 'Careful throws',
        text: `The bot holds back cards you might want: you took ${pct(s.fed)} of its discards. Expect to draw from the stock more and plan around your own cards rather than its throws.` });
    }

    const skill = r('skill');
    if (skill <= 0.5) {
      items.push({ title: 'A beginner',
        text: `The bot often throws whatever leaves the lowest count. Mistakes add up over a night, so keep it simple and avoid big risks against it.` });
    } else if (skill >= 1.5) {
      items.push({ title: 'A sharp player',
        text: `The bot plays a strong game. Small edges matter here: count carefully and do not give away cheap pickups.` });
    }

    if (r('bulge') < 0.5) {
      items.push({ title: 'Ignores the score in team play',
        text: `Once their partner's table has finished, the bot plays the same as before. If your partner is ahead, expect them to keep chasing when a knock would be the sensible play, and if behind, to knock when they need more.` });
    }

    // never fewer than three pieces: fill from the numbers
    if (items.length < 3 && s.caughtWith !== null && s.caughtWith !== undefined && knock > -0.75) {
      items.push({ title: 'When you knock first',
        text: `When you end the hand the bot is caught with ${one(s.caughtWith)} on average.` });
    }
    if (items.length < 3) {
      items.push({ title: 'How often it feeds you',
        text: `You picked up ${pct(s.fed)} of the bot's discards over ${n} hands.` });
    }
    return items.slice(0, 5);
  }

  /* ---------------- nights and the ledger ---------------- */

  function addNight(night) {
    const d = data();
    const n = Object.assign({}, night || {});
    n.id = newId('n', d.nights);
    if (typeof n.date !== 'string') n.date = today();
    n.matches = (n.matches || []).map(m => ({
      partner: m.partner, opps: (m.opps || []).slice(), dollars: Number(m.dollars) || 0
    }));
    if (typeof n.notes !== 'string') n.notes = '';
    d.nights.push(n);
    save();
    return n;
  }

  function removeNight(id) {
    const d = data();
    d.nights = d.nights.filter(n => n.id !== id);
    save();
  }

  const nameOf = id => { const f = friend(id); return f ? f.name : 'Someone removed'; };

  function twoSE(xs) {
    if (xs.length < 4) return null;
    const m = mean(xs);
    const v = xs.reduce((s, x) => s + (x - m) * (x - m), 0) / (xs.length - 1);
    return 2 * Math.sqrt(v / xs.length);
  }

  function ledger() {
    const nights = data().nights.slice().sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    const all = [];
    for (const n of nights) for (const m of n.matches) all.push(m);
    const results = all.map(m => m.dollars);
    let run = 0;
    const series = results.map(x => (run += x));
    const total = results.reduce((a, b) => a + b, 0);

    function group(idsOf) {
      const by = new Map();
      for (const m of all) {
        for (const id of idsOf(m)) {
          if (id === null || id === undefined) continue;
          const g = by.get(id) || { id, name: nameOf(id), matches: 0, total: 0, perMatch: 0 };
          g.matches++; g.total += m.dollars;
          by.set(id, g);
        }
      }
      const out = Array.from(by.values());
      for (const g of out) g.perMatch = g.total / g.matches;
      return out.sort((a, b) => b.matches - a.matches);
    }

    return {
      matches: all.length,
      total,
      wins: results.filter(x => x > 0).length,
      losses: results.filter(x => x < 0).length,
      perMatch: all.length ? total / all.length : 0,
      margin: twoSE(results),
      series,
      byPartner: group(m => [m.partner]),
      byOpponent: group(m => Array.from(new Set(m.opps))),
      nights: nights.slice().reverse().map(n => ({
        id: n.id, date: n.date,
        total: n.matches.reduce((s, m) => s + m.dollars, 0),
        matches: n.matches.length, notes: n.notes
      }))
    };
  }

  /* ---------------- practice ---------------- */

  function addPractice(entry) {
    const e = entry || {};
    const p = {
      ts: typeof e.ts === 'number' ? e.ts : Date.now(),
      partner: e.partner === undefined ? null : e.partner,
      opps: (e.opps || []).slice(),
      dollars: Number(e.dollars) || 0
    };
    data().practice.push(p);
    save();
    return p;
  }

  function practiceSummary() {
    const ps = data().practice;
    return {
      matches: ps.length,
      total: ps.reduce((s, p) => s + p.dollars, 0),
      wins: ps.filter(p => p.dollars > 0).length
    };
  }

  /* teams for the next match: everyone takes a turn as your partner */
  function nextTeams(prev, pool) {
    const i = prev ? pool.indexOf(prev.partner) : -1;
    const partner = pool[(i + 1) % pool.length];
    return { partner, opps: pool.filter(id => id !== partner) };
  }

  window.Scout = {
    HABITS,
    data, save, reload,
    friends, friend, addFriend, renameFriend, removeFriend, setNotes,
    setHabit, observe, read, seen, stepLabel, summary,
    tuneFor, brainFor,
    measure, measureAsync, counterTest, counterTestAsync,
    plan,
    addNight, removeNight, ledger,
    addPractice, practiceSummary,
    nextTeams,
    mulberry32
  };
})();

</script>
<script>
/* ============================================================
   backup.js — take your record with you

   Everything the app remembers (training record, mistakes bank,
   friends, the ledger, table rules, a match in progress) lives in
   this browser, under this address. Open the app at a different
   address, or as a home-screen app, and it starts empty. A backup
   is one small file holding all of it, which can be read back in
   anywhere.
   ============================================================ */
(function () {
  'use strict';
  const PREFIX = 'grt-';
  const APP = 'oklahoma-gin';

  /* everything the app has stored, as one object */
  function collect(store) {
    store = store || localStorage;
    const data = {};
    for (let i = 0; i < store.length; i++) {
      const k = store.key(i);
      if (k && k.indexOf(PREFIX) === 0) data[k] = store.getItem(k);
    }
    return { app: APP, version: 1, saved: new Date().toISOString(), data };
  }

  /* what a backup holds, in plain words, without changing anything.
     Throws with a readable message if the text is not one of ours. */
  function inspect(text) {
    let b;
    try { b = JSON.parse(text); } catch (e) { throw new Error('That file is not a backup from this app.'); }
    if (!b || b.app !== APP || !b.data || typeof b.data !== 'object') throw new Error('That file is not a backup from this app.');
    const keys = Object.keys(b.data).filter(k => k.indexOf(PREFIX) === 0 && typeof b.data[k] === 'string');
    const parse = k => { try { return JSON.parse(b.data[k]); } catch (e) { return null; } };
    const stats = parse('grt-stats') || {}, scout = parse('grt-scout') || {};
    // plain counts, whatever the file holds: these are shown on the restore sheet
    const count = v => Math.max(0, Math.floor(Number(v) || 0));
    const len = v => (Array.isArray(v) ? v.length : 0);
    return {
      saved: typeof b.saved === 'string' ? b.saved : '', keys,
      hands: count(stats.hands),
      friends: len(scout.friends),
      nights: len(scout.nights),
      mistakes: len(parse('grt-blunders'))
    };
  }

  /* Replace what is stored with the backup's contents. Everything of ours that
     is stored now is removed first, so the result is exactly the backup.      */
  function restore(text, store) {
    store = store || localStorage;
    const info = inspect(text);
    const b = JSON.parse(text);
    const old = [];
    for (let i = 0; i < store.length; i++) { const k = store.key(i); if (k && k.indexOf(PREFIX) === 0) old.push(k); }
    old.forEach(k => store.removeItem(k));
    info.keys.forEach(k => store.setItem(k, b.data[k]));
    return info;
  }

  /* hand the backup to the phone: the share sheet where there is one (so it can
     go to Files, mail or AirDrop), otherwise an ordinary download              */
  function save() {
    const text = JSON.stringify(collect());
    const name = 'oklahoma-gin-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    try {
      const file = new File([text], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file], title: 'Oklahoma Gin backup' }).then(() => 'shared', () => 'cancelled');
      }
    } catch (e) { /* fall through to a download */ }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return Promise.resolve('downloaded');
  }

  /* ask for a backup file and give back its text */
  function pick() {
    return new Promise((resolve, reject) => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.onchange = () => {
        const f = input.files && input.files[0];
        if (!f) { reject(new Error('No file chosen.')); return; }
        const r = new FileReader();
        r.onload = () => resolve(String(r.result));
        r.onerror = () => reject(new Error('That file could not be read.'));
        r.readAsText(f);
      };
      input.click();
    });
  }

  window.Backup = { collect, inspect, restore, save, pick };
})();

</script>
<script>
/* ============================================================
   replay.js — step-through replay of the last recorded hand,
   the other hand face up, with "what was knowable" annotations.
   Replay.start(rec, names): names.opp is the person across the table.
   ============================================================ */
(function () {
  'use strict';
  const C = window.Cards, E = window.Engine, A = window.AI;

  function fresh(rec) {
    const match = E.makeMatch({});
    match.settings.manualLayoff = false;
    match.dealer = rec.dealer;
    E.buildHand(match, {
      hands: rec.hands, stock: rec.stock, discard: [rec.upcard],
      faceUp: [rec.upcard], knockCard: rec.knockCard, doubled: rec.doubled,
      dealer: rec.dealer, phase: 'upcard'
    });
    return match;
  }

  function describe(a, opp) {
    const who = a.player === 0 ? 'You' : (opp || 'The other player');
    if (a.type === 'pass-upcard') return `${who} passed the first card`;
    if (a.type === 'take-upcard') return `${who} took the ${a.card !== undefined ? C.name(a.card) : 'pile card'}`;
    if (a.type === 'draw-stock') return `${who} drew from the stock`;
    if (a.type === 'big-gin') return `${who} went big gin`;
    if (a.type === 'discard') {
      const verb = a.gin ? 'went gin, throwing' : a.knock ? 'knocked, throwing' : 'threw';
      return `${who} ${verb} the ${C.name(a.card)}`;
    }
    return who + ' moved';
  }

  /* create a replay session: state at step k = deal + first k actions */
  function start(rec, names) {
    let step = 0;
    let match = fresh(rec);
    const opp = names && names.opp;

    function applyTo(k) {
      match = fresh(rec);
      const e2 = A.createEstimator(0);
      for (let i = 0; i < k && i < rec.actions.length; i++) {
        try {
          const evs = E.act(match, rec.actions[i]);
          for (const ev of evs) A.estimatorObserve(e2, ev);
        } catch (e) { break; }
      }
      return e2;
    }

    return {
      total: rec.actions.length,
      get step() { return step; },
      get hand() { return match.hand; },
      narration() {
        if (step === 0) return 'The deal. Knock card: ' + C.name(rec.knockCard) +
          (match.hand.ginOnly ? ', gin only.' : ', knock with ' + match.hand.knockLimit + ' or less.') +
          (rec.doubled ? ' A spade: doubled.' : '');
        return describe(rec.actions[step - 1], opp);
      },
      knowable() {
        const e2 = applyTo(step);
        const live = E.unseenFor(match.hand, 0);
        // the cards they were seen taking count as theirs: a card next to one is not dead
        const theirs = window.Coach.couldHold(match.hand, 0);
        let dead = 0;
        for (const c of live) {
          if (e2.knownOut.has(c) || C.usefulness(c, theirs) === 0) dead++;
        }
        return { dead, knownIn: e2.knownIn.size, live: live.length };
      },
      next() { if (step < rec.actions.length) { step++; applyToLive(); } },
      back() { if (step > 0) { step--; applyToLive(); } }
    };

    function applyToLive() {
      match = fresh(rec);
      for (let i = 0; i < step; i++) {
        try { E.act(match, rec.actions[i]); } catch (e) { break; }
      }
    }
  }

  window.Replay = { start };
})();

</script>
<script>
/* ============================================================
   people.js — the people across the table.
   People.cast(seed, n, opts): n different people, the same for the same seed.
     opts.exclude: names never dealt (any case), e.g. the player's own.
   Each is { id, name, initials, hue, style, line }:
     style  rusher | chaser | rock | speculator, played as a tune on the
            table's bot (main.js STYLE_TUNE), or null for a plain player
     hue    the avatar colour, from the app's palette
     line   how they play, six words at most
   Every first letter is different, so initials never clash at a table.
   No storage of its own.
   ============================================================ */
(function () {
  'use strict';

  // from style.css: brass, card red, green, blue, the grade colours
  const HUES = ['#c9a45c', '#b3261e', '#1d6a44', '#1f4f94', '#7fc79b', '#a9c57a', '#d9a441', '#d4614f'];

  const POOL = [
    ['abe', 'Abe', 'rusher', 'Knocks the moment they can'],
    ['bea', 'Bea', null, 'Plays it straight'],
    ['cy', 'Cy', 'chaser', 'Holds out for gin'],
    ['della', 'Della', 'rock', 'Throws nothing you can use'],
    ['edie', 'Edie', 'speculator', 'Picks up odd cards early'],
    ['flo', 'Flo', null, 'Counts every card'],
    ['gus', 'Gus', 'rusher', 'Knocks at the first chance'],
    ['hank', 'Hank', 'chaser', 'Never knocks. Wants gin.'],
    ['iris', 'Iris', null, 'Knocks when it pays'],
    ['june', 'June', 'rock', 'Breaks pairs rather than feed you'],
    ['kit', 'Kit', 'speculator', 'Picks up cards to build on'],
    ['lou', 'Lou', null, 'Quiet, patient, hard to rattle'],
    ['mae', 'Mae', 'rusher', 'Never waits for gin'],
    ['nell', 'Nell', 'chaser', 'Plays every hand to gin'],
    ['otis', 'Otis', 'rock', 'Slow, careful, hard to read'],
    ['pearl', 'Pearl', 'speculator', 'Takes your discards to confuse'],
    ['ruth', 'Ruth', null, 'Plays the percentages'],
    ['theo', 'Theo', null, 'Steady, no surprises']
  ];

  const PEOPLE = POOL.map(([id, name, style, line], i) => Object.freeze({
    id, name, initials: name[0].toUpperCase(), hue: HUES[(i * 3) % HUES.length], style, line
  }));
  const BY_ID = {};
  PEOPLE.forEach(p => { BY_ID[p.id] = p; });

  function hash(seed) {
    const s = String(seed == null ? 0 : seed);
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rng(seed) {   // mulberry32
    let a = hash(seed);
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function cast(seed, n, opts) {
    const r = rng(seed);
    let list = PEOPLE.slice();
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = list[i]; list[i] = list[j]; list[j] = t;
    }
    // shuffled first, so a cast with nobody excluded is the cast it always was
    const ex = opts && Array.isArray(opts.exclude) ? opts.exclude : [];
    if (ex.length) {
      const out = new Set(ex.map(x => String(x == null ? '' : x).trim().toLowerCase()));
      list = list.filter(p => !out.has(p.name.toLowerCase()));
    }
    const k = Math.max(0, Math.min(list.length, n == null ? 1 : n | 0));
    return list.slice(0, k);
  }

  function byId(id) { return BY_ID[id] || null; }

  window.People = { cast, byId, ALL: PEOPLE };
})();

</script>
<script>
/* ============================================================
   scoreboard.js — the three Hollywood games, three ways.
   Scoreboard.html(match, { variant, names: { us, them } })
     sheet   the paper pad: running totals down each column
     race    each side's distance to the target, as a bar per game
     totals  a compact grid: one row per side, one cell per game
   Side 0 is `us`. An empty score reads 0. A side still on 0 in a game
   the other side has scored in (a shut-out on) shows its 0 in red.
   Boxes are drawn as a number in a small square. Styles: board.css (sb-).
   ============================================================ */
(function () {
  'use strict';

  const VARIANTS = ['sheet', 'race', 'totals'];
  const ROMAN = ['I', 'II', 'III'];
  const ROWS = 4;

  /* text into markup: the app's one escape helper (also UI.esc) */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  /* what each side needs to know about one game */
  function read(match, g) {
    const target = (match.settings && match.settings.targetScore) || 200;
    const sc = g.scores || [0, 0];
    const bx = g.boxes || [0, 0];
    const lead = sc[0] === sc[1] ? -1 : (sc[0] > sc[1] ? 0 : 1);
    return [0, 1].map(p => ({
      score: sc[p] || 0,
      boxes: bx[p] || 0,
      lead: g.closed ? g.winner === p : lead === p,
      won: !!g.closed && g.winner === p,
      shut: !(sc[p] > 0) && sc[1 - p] > 0,   // on zero while the other side is on the sheet
      pct: Math.max(0, Math.min(100, Math.round(100 * (sc[p] || 0) / target))),
      entries: (g.entries && g.entries[p] && g.entries[p].length) ? g.entries[p] : (sc[p] ? [sc[p]] : [])
    }));
  }

  const cls = (base, s) => base + (s.lead ? ' sb-lead' : '') + (s.won ? ' sb-won' : '') + (s.shut ? ' sb-shut' : '');
  const box = n => `<span class="sb-box">${n}</span>`;

  /* the pad: names over each game's two columns, running totals, boxes at the foot */
  /* a side's name for a narrow column: as it is when short, else its initials ("Max & Ruth" -> "M&R") */
  const brief = n => (String(n).length <= 6 ? String(n) : String(n).split(/s*&s*/).map(w => w.trim().charAt(0).toUpperCase()).join('&'));

  function sheet(match, nm) {
    const us = brief(nm.us), them = brief(nm.them);
    // names too long for the columns are written once, in full, above the pad
    const legend = us !== String(nm.us) || them !== String(nm.them)
      ? `<div class="sb-sides"><span>${esc(nm.us)}</span><span>${esc(nm.them)}</span></div>` : '';
    const cols = match.games.map((g, i) => {
      const sides = read(match, g);
      const col = s => {
        const list = s.entries.length ? s.entries.slice(-ROWS) : [0];
        const cells = list.map((v, r) => r === list.length - 1
          ? `<div class="${cls('sb-now', s)}">${v}</div>`
          : `<div>${v}</div>`);
        while (cells.length < ROWS) cells.push('<div></div>');
        return `<div class="sb-run">${cells.join('')}</div>`;
      };
      return `<div class="sb-col${g.closed ? ' sb-closed' : ''}">
        <h4>${ROMAN[i]}</h4>
        <div class="sb-two sb-who"><span>${esc(us)}</span><span>${esc(them)}</span></div>
        <div class="sb-two sb-rows">${col(sides[0])}${col(sides[1])}</div>
        <div class="sb-two sb-foot">${box(sides[0].boxes)}${box(sides[1].boxes)}</div>
      </div>`;
    }).join('');
    return `${legend}<div class="sb sb-sheet">${cols}</div>`;
  }

  /* the race: one block per game, a bar per side filling toward the target */
  function race(match, nm) {
    const names = [nm.us, nm.them];
    const games = match.games.map((g, i) => {
      const sides = read(match, g);
      const row = (s, p) => `<div class="${cls('sb-lane', s)}">
          <span class="sb-name">${esc(names[p])}</span>
          <span class="sb-track"><i style="width:${s.pct}%"></i></span>
          <b>${s.score}</b>${box(s.boxes)}
        </div>`;
      return `<div class="sb-game${g.closed ? ' sb-closed' : ''}">
        <h4>${ROMAN[i]}</h4>
        <div>${row(sides[0], 0)}${row(sides[1], 1)}</div>
      </div>`;
    }).join('');
    return `<div class="sb sb-race">${games}</div>`;
  }

  /* the grid: a row per side, the three games across, boxes beside each score */
  function totals(match, nm) {
    const names = [nm.us, nm.them];
    const reads = match.games.map(g => read(match, g));
    const dim = g => (g.closed ? ' class="sb-closed"' : '');
    const head = `<tr><th></th>${match.games.map((g, i) => `<th${dim(g)}>${ROMAN[i]}</th>`).join('')}</tr>`;
    const rows = [0, 1].map(p => `<tr><th class="sb-name">${esc(names[p])}</th>${reads.map((sides, i) => {
      const c = (cls('', sides[p]) + (match.games[i].closed ? ' sb-closed' : '')).trim();
      return `<td${c ? ` class="${c}"` : ''}><b>${sides[p].score}</b>${box(sides[p].boxes)}</td>`;
    }).join('')}</tr>`).join('');
    return `<table class="sb sb-totals">${head}${rows}</table>`;
  }

  function html(match, opts) {
    opts = opts || {};
    const names = opts.names || {};
    const nm = { us: names.us || 'Us', them: names.them || 'Them' };
    const draw = { sheet, race, totals }[VARIANTS.indexOf(opts.variant) >= 0 ? opts.variant : 'sheet'];
    return draw(match, nm).replace(/>\s+</g, '><').trim();
  }

  window.Scoreboard = { html, VARIANTS, esc };
})();

</script>
<script>
/* ============================================================
   ending.js — what a deal did to the sheet, told in beats, and
   what the match paid. Pure: no page, no app state.

   Money is side 0's (the player's side), in dollars, worked in whole
   cents so it agrees with Engine.settle to the cent at any stakes.
   A game pays: net boxes x the box stake, plus the game stake to its
   winner, the whole column doubled when the loser never scored in it.

     Ending.stakes(settings)            { box, game, shutoutDoubles, hollywood }
     Ending.snapshot(games)             a copy of the sheet, to compare later
     Ending.gamePay(game, stakes)       { pays, boxes, game, boxNet, shutout, closed }
     Ending.beats(before, after, stakes)
         [{ type: 'boxes', amount, delta }]                       boxes written on games still open
         [{ type: 'game', index, numeral, winner, pays, boxes,
            game, boxNet, shutout, delta }]                        each game closed by this deal, in order
         [{ type: 'match', total, perGame, winner, delta: 0 }]    the match is over
       the deltas add up to the change in the settlement.
     Ending.kind(beats)                 the ending's name, as docs/audit/endgame-evidence.md lists them
     Ending.matchSummary(match, stakes) { total, winner, over, games: [gamePay + index, numeral, winner] }
   ============================================================ */
(function () {
  'use strict';

  const NUMERALS = ['I', 'II', 'III'];
  const cents = x => Math.round(Number(x || 0) * 100);
  const dollars = c => c / 100;

  /* the stakes a match is played at: its own settings, taken when it started */
  function stakes(settings) {
    const s = settings || {};
    return {
      box: s.dollarsPerBox !== undefined ? Number(s.dollarsPerBox) : 2,
      game: s.dollarsPerGame !== undefined ? Number(s.dollarsPerGame) : 20,
      shutoutDoubles: s.shutoutDoubles !== false,
      hollywood: s.hollywood !== false
    };
  }
  const norm = st => (st && st.box !== undefined ? Object.assign({ shutoutDoubles: true, hollywood: true }, st) : stakes(st));

  function snapshot(games) {
    return (games || []).map(g => ({
      scores: [g.scores[0] || 0, g.scores[1] || 0],
      boxes: [g.boxes[0] || 0, g.boxes[1] || 0],
      closed: !!g.closed,
      winner: g.winner === undefined ? null : g.winner
    }));
  }

  /* one game's money for side 0, the way Engine.settle counts it */
  function payCents(g, st) {
    const boxNet = (g.boxes[0] || 0) - (g.boxes[1] || 0);
    const boxC = boxNet * cents(st.box);
    let gameC = 0, shutout = false;
    if (g.closed && g.winner !== null && g.winner !== undefined) {
      gameC = (g.winner === 0 ? 1 : -1) * cents(st.game);
      shutout = !!st.shutoutDoubles && !(g.scores[1 - g.winner] > 0);
    }
    const mult = shutout ? 2 : 1;
    return { pays: (boxC + gameC) * mult, boxes: boxC * mult, game: gameC * mult, boxNet, shutout, closed: !!g.closed };
  }
  function gamePay(g, st) {
    const p = payCents(g, norm(st));
    return { pays: dollars(p.pays), boxes: dollars(p.boxes), game: dollars(p.game), boxNet: p.boxNet, shutout: p.shutout, closed: p.closed };
  }

  const blank = () => ({ scores: [0, 0], boxes: [0, 0], closed: false, winner: null });

  function beats(before, after, st) {
    st = norm(st);
    after = after || [];
    before = before && before.length ? before : after.map(blank);
    const out = [];
    let boxDelta = 0;
    const closed = [];
    after.forEach((g, i) => {
      const was = before[i] || blank();
      const now = payCents(g, st), then = payCents(was, st);
      if (g.closed && !was.closed) closed.push({ i, g, now, then });
      else boxDelta += now.pays - then.pays;   // boxes on a game still open (a closed game never moves)
    });
    if (boxDelta) out.push({ type: 'boxes', amount: dollars(boxDelta), delta: dollars(boxDelta) });
    for (const c of closed) {
      out.push({
        type: 'game', index: c.i, numeral: NUMERALS[c.i] || String(c.i + 1), winner: c.g.winner,
        pays: dollars(c.now.pays), boxes: dollars(c.now.boxes), game: dollars(c.now.game),
        boxNet: c.now.boxNet, shutout: c.now.shutout, delta: dollars(c.now.pays - c.then.pays)
      });
    }
    const active = st.hollywood ? after : after.slice(0, 1);
    const wasOver = (st.hollywood ? before : before.slice(0, 1)).every(g => g.closed);
    if (active.length && active.every(g => g.closed) && !wasOver) {
      const per = after.map(g => payCents(g, st).pays);
      const total = per.reduce((a, b) => a + b, 0);
      out.push({ type: 'match', total: dollars(total), perGame: per.map(dollars), winner: total > 0 ? 0 : total < 0 ? 1 : null, delta: 0 });
    }
    return out;
  }

  /* the ending's name: "two games close on one deal (I+II), one of them a shut-out, match continues" */
  function kind(list) {
    const games = (list || []).filter(b => b.type === 'game');
    if (!games.length) return null;
    const n = games.length, shut = games.map(b => b.shutout);
    const over = (list || []).some(b => b.type === 'match');
    return `${n === 1 ? 'one game closes' : n === 2 ? 'two games close on one deal' : 'three games close on one deal'} (${games.map(b => b.numeral).join('+')})` +
      `, ${shut.every(Boolean) ? (n > 1 ? 'all shut-outs' : 'a shut-out') : shut.some(Boolean) ? 'one of them a shut-out' : 'no shut-out'}` +
      `, ${over ? 'match ends' : 'match continues'}`;
  }

  function matchSummary(match, st) {
    st = norm(st || (match && match.settings));
    const games = (match.games || []).map((g, i) => Object.assign(gamePay(g, st), {
      index: i, numeral: NUMERALS[i] || String(i + 1), winner: g.closed ? g.winner : null
    }));
    const total = dollars(games.reduce((a, g) => a + cents(g.pays), 0));
    const active = st.hollywood ? match.games : match.games.slice(0, 1);
    return { total, winner: total > 0 ? 0 : total < 0 ? 1 : null, over: active.every(g => g.closed), games };
  }

  window.Ending = { stakes, snapshot, gamePay, beats, kind, matchSummary, NUMERALS };
})();

</script>
<script>
/* ============================================================
   ui.js — DOM rendering + animation helpers (no game logic)
   ============================================================ */
(function () {
  'use strict';
  const C = window.Cards;
  const $ = id => document.getElementById(id);
  // the one escape helper for text that reaches innerHTML (it lives in scoreboard.js, which
  // loads first and is tested on its own); everything else uses it as UI.esc
  const esc = window.Scoreboard.esc;

  /* Motion: every duration and curve in script is one of the tokens in style.css :root
     (docs/audit/design.md section 4), read from the page once:
       press  --t-press   the finger            out    --e-out     answers and arrivals
       quick  --t-quick   a change in place     move   --e-move    travel between two places
       move   --t-move    crossing the screen   spring --e-spring  one small overshoot
       arrive --t-arrive  a large thing arriving
       linger --t-linger  the only slow one
     The fallbacks are the same values, for a page without the stylesheet (the test shell). */
  const M = (() => {
    let cs = null;
    try { cs = window.getComputedStyle && document.documentElement && getComputedStyle(document.documentElement); } catch (e) { cs = null; }
    const read = (name, fb) => { const v = cs ? String(cs.getPropertyValue(name) || '').trim() : ''; return v || fb; };
    const ms = (name, fb) => parseFloat(read(name, '')) || fb;
    return {
      press: ms('--t-press', 120), quick: ms('--t-quick', 180), move: ms('--t-move', 280),
      arrive: ms('--t-arrive', 420), linger: ms('--t-linger', 1600),
      out: read('--e-out', 'cubic-bezier(0.32, 0.72, 0, 1)'),
      inOut: read('--e-move', 'cubic-bezier(0.77, 0, 0.175, 1)'),
      spring: read('--e-spring', 'cubic-bezier(.34, 1.45, .5, 1)')
    };
  })();
  const reducedMotion = () =>
    window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* a little lift and back: a card that may not go (design.md section 4, "a barred move") */
  function refuse(el) {
    if (!el || !el.animate || reducedMotion()) return;
    el.animate([{ transform: 'none' }, { transform: 'translateY(-6px)' }, { transform: 'none' }],
      { duration: M.quick, easing: M.spring });
  }

  /* ---------------- card elements ----------------
     Suits are drawn (the four <symbol>s in index.html), never typed, so a
     card looks the same on every phone. Court cards are typographic.     */
  const SUIT_IDS = ['spade', 'heart', 'diamond', 'club'];
  const suitSVG = (s, cls) =>
    `<svg class="suit${cls ? ' ' + cls : ''}" viewBox="0 0 32 32" aria-hidden="true"><use href="#suit-${SUIT_IDS[s]}"/></svg>`;
  const rankHTML = r => `<b${r === 10 ? ' class="ten"' : ''}>${C.RANKS[r - 1]}</b>`;
  const indexHTML = (card, cls) =>
    `<div class="idx${cls ? ' ' + cls : ''}">${rankHTML(C.rankOf(card))}${suitSVG(C.suitOf(card))}</div>`;
  const cardClass = card => (C.isRed(card) ? 'red' : 'black') + ' s' + C.suitOf(card);

  function cardEl(card, opts) {
    opts = opts || {};
    const el = document.createElement('div');
    el.className = 'card ' + cardClass(card) + (opts.cls ? ' ' + opts.cls : '');
    el.dataset.card = card;
    const r = C.rankOf(card);
    const centre = r > 10 ? `<div class="court">${C.RANKS[r - 1]}</div>` : suitSVG(C.suitOf(card), 'pip');
    // one corner index only: with a single centre pip, a turned 6 would read as a 9
    el.innerHTML = indexHTML(card) + centre;
    return el;
  }

  function backEl(opts) {
    opts = opts || {};
    const el = document.createElement('div');
    el.className = 'card back' + (opts.cls ? ' ' + opts.cls : '');
    return el;
  }

  /* ---------------- hand rendering ----------------
     Groups melds (gold underline) then deadwood.
     sortMode: 'melds' | 'runs' | 'rank'                */
  function handGroups(hand, sortMode, order) {
    if (order) {
      // the player's own arrangement: kept as dragged, anything new goes on the end
      const kept = order.filter(c => hand.includes(c));
      return [{ meld: false, cards: kept.concat(hand.filter(c => !kept.includes(c))) }];
    }
    const arr = C.bestArrangement(hand);
    if (sortMode === 'rank') {
      return [{ meld: false, cards: hand.slice().sort((a, b) => C.rankOf(a) - C.rankOf(b) || C.suitOf(a) - C.suitOf(b)) }];
    }
    if (sortMode === 'runs') {
      return [{ meld: false, cards: hand.slice().sort((a, b) => C.suitOf(a) - C.suitOf(b) || C.rankOf(a) - C.rankOf(b)) }];
    }
    const groups = [];
    const sortedMelds = arr.melds.slice().sort((a, b) => b.length - a.length);
    for (const m of sortedMelds) {
      const cards = m.slice().sort((a, b) => C.rankOf(a) - C.rankOf(b));
      groups.push({ meld: true, cards });
    }
    if (arr.deadwood.length) {
      const dw = arr.deadwood.slice().sort((a, b) => C.pointsOf(b) - C.pointsOf(a) || C.rankOf(b) - C.rankOf(a));
      groups.push({ meld: false, cards: dw });
    }
    return groups;
  }

  /* The hand is a fan. Cards overlap so that ten or eleven fit a phone,
     each showing its corner index; melds sit together with a hairline and
     a word under them. Positions are computed here and handed to CSS.
     opts: sortMode, order (cards in the player's own order), selected, fresh,
     onTap(card, el), onThrow(card) -> true if the throw was taken,
     onReorder(cards).                                                     */
  let handOpts = {}, handDrag = null, handPending = null;
  function renderHand(hand, opts) {
    opts = opts || {};
    // never pull a card out from under the finger: draw again once it lets go
    if (handDrag) { handPending = [hand, opts]; return; }
    handOpts = opts;
    const host = $('hand');
    // FLIP: remember where each card was, so re-sorts glide instead of snap
    const before = new Map();
    if (!reducedMotion()) {
      host.querySelectorAll('.card').forEach(el => {
        before.set(el.dataset.card, el.getBoundingClientRect());
      });
    }
    host.innerHTML = '';
    const n = hand.length;
    if (!n) return;
    const groups = handGroups(hand, opts.sortMode || 'melds', opts.order);
    const W = (host.clientWidth || 340) - 14;             // keep the turned corners on screen
    const cw = Math.max(52, Math.min(74, Math.round(W / 5.4)));
    const GAP = 9;                                        // extra room between groups
    const gaps = GAP * (groups.length - 1);
    const step = n > 1 ? Math.min(cw * 0.62, (W - cw - gaps) / (n - 1)) : 0;
    const total = cw + step * (n - 1) + gaps;
    const mid = (n - 1) / 2;
    host.style.setProperty('--cw', cw + 'px');
    const placed = [];
    let x = (W - total) / 2 + 7, i = 0;
    groups.forEach((g, gi) => {
      const x0 = x;
      for (const c of g.cards) {
        const el = cardEl(c);
        const d = i - mid;
        el.style.setProperty('--x', x.toFixed(1) + 'px');
        el.style.setProperty('--r', (d * 0.9).toFixed(2) + 'deg');
        el.style.setProperty('--y', (d * d * 0.32).toFixed(1) + 'px');
        el.style.zIndex = String(i + 1);
        if (opts.selected === c) el.classList.add('sel');  // lifts, but keeps its place so no neighbour is hidden
        if (opts.fresh === c) el.classList.add('fresh');
        // the card just taken from the pile: it may not go straight back this turn
        if (opts.barred === c) el.classList.add('barred');
        if (i === n - 1) el.classList.add('full');          // the only card not overlapped
        if (opts.onTap) el.addEventListener('click', () => (opts.barred === c ? refuse(el) : opts.onTap(c, el)));
        host.appendChild(el);
        placed.push(el);
        x += step; i++;
      }
      if (g.meld) {
        // spans the part of the meld you can see
        const last = gi === groups.length - 1;
        const width = last ? (x - step + cw) - x0 : (x + GAP) - x0 - 6;
        const brk = document.createElement('div');
        brk.className = 'hbrk';
        brk.style.left = (x0 + 2).toFixed(1) + 'px';
        brk.style.width = Math.max(0, width - 4).toFixed(1) + 'px';
        const isSet = C.rankOf(g.cards[0]) === C.rankOf(g.cards[1]);
        brk.textContent = width > 46 ? (isSet ? 'Set' : 'Run') : '';
        host.appendChild(brk);
      }
      x += GAP;
    });
    // a card just drawn travels from the pile to its own slot, shrinking to hand size,
    // while its neighbours part for it (design.md section 5, item 1)
    const come = arrival;
    arrival = null;
    const arriving = come && !reducedMotion() ? placed.find(el => Number(el.dataset.card) === come.card) : null;
    if (arriving && come.from && come.from.width) {
      const now = arriving.getBoundingClientRect();
      if (now.width) {
        const s = come.from.width / now.width;
        // the fan turns cards about their bottom centre: line the bottom centres up
        const dx = come.from.left + come.from.width / 2 - (now.left + now.width / 2);
        const dy = come.from.bottom - now.bottom;
        arriving.animate(
          [{ transform: `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) scale(${s.toFixed(3)})` }, { transform: 'none' }],
          { duration: M.move, easing: M.inOut });
      }
    }
    if (before.size) {
      for (const el of placed) {
        const prev = before.get(el.dataset.card);
        if (!prev) continue;
        const now = el.getBoundingClientRect();
        const dx = prev.left - now.left, dy = prev.top - now.top;
        if (Math.abs(dx) < 2 && Math.abs(dy) < 2) continue;
        el.animate(
          [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }],
          arriving ? { duration: M.quick, easing: M.out } : { duration: M.move, easing: M.inOut }
        );
      }
    }
  }
  /* the next drawing of the hand brings `card` in from `rect` (a pile, or where a drag let go) */
  let arrival = null;
  function arriveNext(card, rect) { arrival = { card, from: rect }; }

  function renderOppCards(count) {
    const host = $('opp-cards');
    host.innerHTML = '';
    for (let i = 0; i < count; i++) host.appendChild(backEl({ cls: 'sm' }));
  }

  function setOppStatus(text, dots) {
    $('opp-status').innerHTML = text ? text + (dots ? '<span class="dots"></span>' : '') : '';
  }

  /* ---------------- table piles ----------------
     opts: glowStock, glowDiscard (what you may draw from now),
     onDraw('stock' | 'discard') -> true if the draw was taken            */
  let pileOpts = {};
  function renderPiles(hand, opts) {
    opts = opts || {};
    pileOpts = opts;
    const stock = $('pile-stock');
    const discard = $('pile-discard');
    const back = stock.querySelector('.card');
    back.style.transform = back.style.transition = back.style.visibility = '';
    back.classList.remove('lift');
    $('stock-count').textContent = hand.stock.length;
    stock.classList.toggle('glow', !!opts.glowStock);
    discard.classList.toggle('glow', !!opts.glowDiscard);
    const n = hand.discard.length;
    const top = hand.discard[n - 1];
    discard.innerHTML = '';
    if (top !== undefined) {
      // earlier discards show as edges only: you may not look back through the pile
      if (n >= 3) discard.appendChild(blank('under u2'));
      if (n >= 2) discard.appendChild(blank('under u1'));
      discard.appendChild(cardEl(top, { cls: 'table-size top' }));
    } else {
      discard.appendChild(blank('empty-slot'));
    }
  }
  function blank(cls) {
    const d = document.createElement('div');
    d.className = 'card table-size ' + cls;
    return d;
  }

  /* ---------------- knock card / hollywood mini ----------------
     The knock card lies face up on the felt beside the piles for the whole
     hand, with its limit under it. A spade doubles: brass ring and ×2.    */
  function renderKnockChip(hand) {
    const chip = $('knock-chip');
    const kc = hand.knockCard;
    const line2 = hand.ginOnly ? 'Gin only' : hand.knockLimit + ' or under';
    // drawn once a hand: a redraw would cut its turn at the deal short
    const key = [kc, !!hand.doubled, line2].join('|');
    if (chip.dataset.key === key && chip.querySelector('.kc-card')) return;
    chip.dataset.key = key;
    chip.classList.toggle('doubled', !!hand.doubled);
    chip.innerHTML = '';
    const card = cardEl(kc, { cls: 'kc-card' });
    if (hand.doubled) card.insertAdjacentHTML('beforeend', '<div class="kc-ring"></div><div class="x2">×2</div>');
    chip.appendChild(card);
    chip.insertAdjacentHTML('beforeend',
      `<div class="kc-text"><div class="kc-line1">Knock card</div><div class="kc-line2">${line2}</div></div>`);
  }

  /* The deal (design.md section 5, items 2 and 3; section 6, moment 2). The hand is
     already drawn: each card runs from the stock into its slot, the rival's backs
     the same, the knock card turns over (a spade's ring is drawn round it and the
     ×2 drops on), then the first card turns face up. A tap anywhere finishes it.
     Resolves when it is over.                                                      */
  function dealIn() {
    return new Promise(resolve => {
      if (reducedMotion()) { resolve(); return; }
      const anims = [];
      const stock = $('pile-stock').getBoundingClientRect();
      const from = (el, delay) => {
        const r = el.getBoundingClientRect();
        if (!r.width || !stock.width) return;
        const s = stock.width / r.width;
        const dx = stock.left + stock.width / 2 - (r.left + r.width / 2);
        const dy = stock.top + stock.height / 2 - (r.top + r.height / 2);
        // unseen until its turn to leave the stock (a cut, not a fade), then it travels
        const at = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) scale(${s.toFixed(3)})`;
        anims.push(el.animate(
          [{ transform: at, opacity: 0 }, { transform: at, opacity: 1, offset: 0.01 }, { transform: 'none', opacity: 1 }],
          { duration: M.move, delay, easing: M.inOut, fill: 'backwards' }));
      };
      // ten cards each, 30 ms apart, the two seats alternating
      const STEP = M.press / 4;
      const mine = [...$('hand').querySelectorAll('.card')], theirs = [...$('opp-cards').querySelectorAll('.card')];
      mine.forEach((el, i) => from(el, i * STEP));
      theirs.forEach((el, i) => from(el, (i + 0.5) * STEP));
      const dealt = Math.max(mine.length, theirs.length) * STEP + M.move;
      // the knock card turns over from a back as the deal starts: it sets the price of the hand
      const chip = $('knock-chip'), kc = chip.querySelector('.kc-card');
      if (kc) {
        const back = document.createElement('div');
        back.className = 'kc-back';
        kc.appendChild(back);
        anims.push(kc.animate(
          [{ transform: 'perspective(400px) rotateY(180deg) rotate(4deg)' }, { transform: 'perspective(400px) rotateY(0deg) rotate(-4deg)' }],
          { duration: M.arrive, easing: M.out, fill: 'backwards' }));
        const gone = back.animate([{ opacity: 1 }, { opacity: 1, offset: 0.45 }, { opacity: 0, offset: 0.46 }, { opacity: 0 }],
          { duration: M.arrive, fill: 'forwards' });
        anims.push(gone);
        gone.onfinish = () => back.remove();
        if (chip.classList.contains('doubled')) {
          const ring = chip.querySelector('.kc-ring'), x2 = chip.querySelector('.x2');
          if (ring) anims.push(ring.animate([{ opacity: 0, transform: 'scale(.86)' }, { opacity: 1, transform: 'none' }],
            { duration: M.arrive, delay: M.arrive / 2, easing: M.spring, fill: 'backwards' }));
          if (x2) anims.push(x2.animate([{ opacity: 0, transform: 'translateY(-6px) rotate(-8deg)' }, { opacity: 1, transform: 'rotate(4deg)' }],
            { duration: M.move, delay: M.arrive / 2 + M.press, easing: M.spring, fill: 'backwards' }));
        }
      }
      // the first card turns face up once the hands are in
      const top = $('pile-discard').querySelector('.card.top');
      if (top) anims.push(top.animate([{ transform: 'scaleX(0)' }, { transform: 'none' }],
        { duration: M.quick, delay: dealt, easing: M.out, fill: 'backwards' }));
      let over = false;
      const finish = () => {
        if (over) return;
        over = true;
        window.removeEventListener('pointerdown', finish, true);
        anims.forEach(a => { try { a.finish(); } catch (e) { /* already gone */ } });
        const back = chip.querySelector('.kc-back');
        if (back) back.remove();
        resolve();
      };
      window.addEventListener('pointerdown', finish, true);
      setTimeout(finish, dealt + M.quick);
    });
  }

  /* The sheet in miniature. Drawn again for the same match, a score that moved
     rolls from the old figure to the new with one small overshoot, and a game
     that has just closed gets a line ruled under it before it dims
     (design.md section 5, item 4; section 6, moment 5).                      */
  let miniWas = null;
  function renderHollyMini(match) {
    const host = $('holly-mini');
    const was = miniWas && miniWas.match === match ? miniWas.games : null;
    miniWas = { match, games: match.games.map(g => ({ scores: g.scores.slice(), closed: !!g.closed })) };
    host.innerHTML = '';
    match.games.forEach((g, i) => {
      const col = document.createElement('div');
      // a side still blank in an open game the other side has scored in is on a blitz
      const blitz = g.closed ? '' : g.boxes[0] === 0 && g.boxes[1] > 0 ? ' blitz-us'
        : g.boxes[1] === 0 && g.boxes[0] > 0 ? ' blitz-them' : '';
      const closing = was && g.closed && !was[i].closed && !reducedMotion();
      col.className = 'col' + (g.closed ? ' closed' : '') + (closing ? ' closing' : '') + blitz;
      col.innerHTML = `<div class="g">${['I', 'II', 'III'][i]}</div>` +
        `<div class="s0">${g.scores[0]}</div><div class="s1">${g.scores[1]}</div>`;
      host.appendChild(col);
      if (was) [0, 1].forEach(s => {
        if (was[i].scores[s] !== g.scores[s]) rollFigure(col.querySelector('.s' + s), was[i].scores[s], g.scores[s]);
      });
    });
  }
  /* a figure rolls from `from` to `to` (--t-arrive), then gives one small overshoot (--t-quick) */
  function rollFigure(el, from, to, fmt) {
    fmt = fmt || String;
    if (!el || reducedMotion() || !window.requestAnimationFrame) { if (el) el.textContent = fmt(to); return; }
    const t0 = performance.now();
    const step = now => {
      if (!el.isConnected) return;
      const t = Math.min(1, (now - t0) / M.arrive), e = 1 - Math.pow(1 - t, 3);
      el.textContent = fmt(t < 1 ? Math.round(from + (to - from) * e) : to);
      if (t < 1) requestAnimationFrame(step);
      else if (el.animate) el.animate([{ transform: 'none' }, { transform: 'scale(1.12)' }, { transform: 'none' }], { duration: M.quick, easing: M.spring });
    };
    el.textContent = fmt(from);
    requestAnimationFrame(step);
  }

  /* ---------------- deadwood badge ----------------
     amateur: always shown · club: tap to peek (counted)
     pro: never shown — count it yourself                */
  function renderDeadwood(hand, mode, onPeek) {
    const badge = $('dw-badge');
    const el = $('dw-val');
    const h = hand.hands[0];
    badge.classList.remove('under', 'close');
    if (!h.length) { el.textContent = '–'; return; }
    let pts;
    if (h.length === 11) {
      pts = C.bestDiscard(h).points; // best achievable after discard
    } else {
      pts = C.deadwoodPoints(h);
    }
    if (mode === 'pro') {
      el.textContent = '–';
      badge.onclick = null;
      return;
    }
    if (mode === 'club' && !badge.dataset.peeking) {
      el.textContent = '?';
      badge.onclick = () => {
        badge.dataset.peeking = '1';
        el.textContent = pts;
        applyColor();
        if (onPeek) onPeek();
        setTimeout(() => { delete badge.dataset.peeking; el.textContent = '?'; badge.classList.remove('under', 'close'); }, M.linger);
      };
      return;
    }
    badge.onclick = null;
    el.textContent = pts;
    applyColor();
    function applyColor() {
      badge.classList.toggle('under', !hand.ginOnly && pts <= hand.knockLimit);
      badge.classList.toggle('close', !hand.ginOnly && pts > hand.knockLimit && pts <= hand.knockLimit + 8);
    }
  }

  /* ---------------- belief grid (Shankar table) ----------------
     marks: {cardId: 'in'|'out'} — tap cycles blank → out → in    */
  function beliefGridHTML(hand, marks) {
    let html = '<div class="bgrid">';
    html += '<div class="bg-cell bg-head"></div>';
    for (let r = 1; r <= 13; r++) html += `<div class="bg-cell bg-head">${C.RANKS[r - 1]}</div>`;
    for (let s = 0; s < 4; s++) {
      html += `<div class="bg-cell bg-head ${s === 1 || s === 2 ? 'red' : ''}">${C.SUITS[s]}</div>`;
      for (let r = 1; r <= 13; r++) {
        const c = C.cardId(s, r);
        let cls = '', txt = '';
        if (hand.hands[0].includes(c)) { cls = 'mine'; txt = '●'; }
        else if (hand.discard.includes(c)) { cls = 'pile'; txt = '–'; }
        else if (marks[c] === 'in') { cls = 'min'; txt = '✓'; }
        else if (marks[c] === 'out') { cls = 'mout'; txt = '✗'; }
        html += `<div class="bg-cell${cls ? ' ' + cls : ''}" data-bg="${c}">${txt}</div>`;
      }
    }
    html += '</div>';
    return html;
  }

  /* ---------------- status + action bar ---------------- */
  function setStatus(text) { $('status-line').textContent = text || ''; }

  function renderActions(buttons) {
    const bar = $('action-bar');
    bar.innerHTML = '';
    for (const b of buttons) {
      if (!b || (!b.label && !b.hint)) continue;   // nothing to say: no empty button
      if (b.hint) {
        const d = document.createElement('div');
        d.className = 'hint-text';
        d.textContent = b.hint;
        bar.appendChild(d);
        continue;
      }
      const btn = document.createElement('button');
      btn.className = 'btn' + (b.cls ? ' ' + b.cls : '');
      btn.textContent = b.label;
      if (b.disabled) btn.disabled = true;
      btn.addEventListener('click', b.onClick);
      bar.appendChild(btn);
    }
  }

  /* ---------------- touch: the one drag helper ----------------
     Pointer Events only. A press becomes a drag once it has moved a few
     pixels; until then it is a tap and the click goes through untouched.
     Once it is a drag the pointer is captured, everything moves by
     transform, and the click that would follow is swallowed.
     h.down(e) -> ctx or null      may this press become a drag?
     h.start(ctx, dx, dy) -> bool  it moved: claim it (false lets it go)
     h.move(ctx, dx, dy, e)
     h.end(ctx, g)                 g: { dx, dy, x, y, vx, vy, cancel }
     h.release(ctx)                the finger lifted, drag or not       */
  let swallowClick = false;
  window.addEventListener('pointerdown', () => { swallowClick = false; }, true);
  window.addEventListener('click', e => {
    if (!swallowClick) return;
    swallowClick = false;
    e.stopPropagation(); e.preventDefault();
  }, true);
  /* A sheet that has just replaced another one (or opened the moment one
     closed) holds taps for a moment, so the second tap of a double tap meant
     for the old sheet does not land on the new one. Set by openSheet.     */
  const SHEET_HOLD_MS = 250;
  let sheetHoldUntil = 0, sheetClosedAt = 0;
  window.addEventListener('click', e => {
    if (Date.now() >= sheetHoldUntil) return;
    const t = e.target;
    if (!t || !t.closest || !t.closest('#sheet')) return;
    e.stopPropagation(); e.preventDefault();
  }, true);
  // iOS Safari shows :active press states only on a page that listens for touches
  document.addEventListener('touchstart', () => {}, { passive: true });

  function drag(el, h) {
    let s = null;
    const listen = on => ['pointermove', 'pointerup', 'pointercancel'].forEach(t =>
      window[on ? 'addEventListener' : 'removeEventListener'](t, t === 'pointermove' ? move : up));
    el.addEventListener('pointerdown', e => {
      if (s || !e.isPrimary || e.button > 0) return;
      const ctx = h.down(e);
      if (!ctx) return;
      s = { id: e.pointerId, x0: e.clientX, y0: e.clientY, on: false, ctx, pts: [[e.clientX, e.clientY, e.timeStamp]] };
      listen(true);
    });
    function move(e) {
      if (!s || e.pointerId !== s.id) return;
      const dx = e.clientX - s.x0, dy = e.clientY - s.y0;
      s.pts.push([e.clientX, e.clientY, e.timeStamp]);
      if (s.pts.length > 6) s.pts.shift();
      if (!s.on) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        if (!h.start(s.ctx, dx, dy)) { const c = s.ctx; s = null; listen(false); if (h.release) h.release(c); return; }
        s.on = true;
        try { el.setPointerCapture(s.id); } catch (err) { /* a synthetic pointer has nothing to capture */ }
      }
      h.move(s.ctx, dx, dy, e);
    }
    function up(e) {
      if (!s || e.pointerId !== s.id) return;
      const cur = s;
      s = null; listen(false);
      if (h.release) h.release(cur.ctx);
      if (!cur.on) return;
      // the click a mouse sends straight after this release is part of the drag
      if (e.type === 'pointerup') { swallowClick = true; setTimeout(() => { swallowClick = false; }, 0); }
      // velocity over the last ~100 ms, for flicks
      const last = cur.pts[cur.pts.length - 1];
      const first = cur.pts.find(p => last[2] - p[2] <= 100) || last;
      const dt = Math.max(1, last[2] - first[2]);
      h.end(cur.ctx, {
        dx: e.clientX - cur.x0, dy: e.clientY - cur.y0, x: e.clientX, y: e.clientY,
        vx: (last[0] - first[0]) / dt, vy: (last[1] - first[1]) / dt,
        cancel: e.type === 'pointercancel'
      });
    }
  }

  /* run `fn` once a transition on `el` has finished (or after `ms`, whichever first) */
  function afterMove(el, ms, fn) {
    let done = false;
    const go = () => { if (done) return; done = true; el.removeEventListener('transitionend', go); fn(); };
    el.addEventListener('transitionend', go);
    setTimeout(go, ms + M.press / 2);
  }

  /* ---------------- sheets ----------------
     One behaviour for every sheet. It can be left three ways: drag it down
     (from the handle, or from the body when it is scrolled to the top), tap
     outside, or its own button.
       openSheet(html)                          leaving just closes it
       openSheet(html, { onDismiss })           leaving calls onDismiss, then closes
       openSheet(html, { locked, onDismiss })   leaving calls onDismiss, which decides
       openSheet(html, { locked: true })        a decision is required: no handle,
                                                no gestures, only its own buttons
     Any of them with { same: true }: the view already showing, drawn again
     (a mark, a step); taps on it are not held as they are for a new sheet. */
  let sheetOpts = {}, sheetGen = 0, sheetDragging = false;
  const sheetIsOpen = () => !$('sheet').classList.contains('hidden');
  const sheetDismissible = () => !sheetOpts.locked || typeof sheetOpts.onDismiss === 'function';

  function openSheet(html, opts) {
    sheetOpts = opts || {};
    sheetGen++;
    const sheet = $('sheet'), body = $('sheet-body'), back = $('sheet-backdrop');
    const wasOpen = sheetIsOpen();
    if (!sheetOpts.same && (wasOpen || Date.now() - sheetClosedAt < SHEET_HOLD_MS)) sheetHoldUntil = Date.now() + SHEET_HOLD_MS;
    const h0 = wasOpen && !sheetOpts.same ? sheet.offsetHeight : 0;
    body.innerHTML = html;
    // a new view starts at its top; the same view drawn again keeps its place
    if (!sheetOpts.same) body.scrollTop = 0;
    sheet.classList.toggle('fixed', !sheetDismissible());
    // a coach's verdict at the table: a short sheet that stops above the hand,
    // over a table left clear and sharp
    const ask = !!sheetOpts.ask;
    sheet.classList.toggle('ask', ask);
    back.classList.toggle('clear', ask);
    if (ask) {
      const hand = $('hand'), r = hand && hand.getBoundingClientRect();
      sheet.style.setProperty('--ask-bottom', r && r.height ? Math.max(0, Math.round(innerHeight - r.top)) + 'px' : '0px');
    }
    sheet.style.transform = sheet.style.transition = '';
    back.style.opacity = back.style.transition = '';
    sheet.classList.remove('hidden');
    back.classList.remove('hidden');
    if (wasOpen && !sheetOpts.same && !reducedMotion()) {
      // new content in an open sheet: it cross-fades, and a taller sheet grows up from where it stood
      body.animate([{ opacity: 0 }, { opacity: 1 }], { duration: M.quick, easing: M.out });
      const grew = sheet.offsetHeight - h0;
      if (h0 && grew > 2) sheet.animate([{ transform: `translateY(${grew}px)` }, { transform: 'none' }], { duration: M.move, easing: M.out });
    }
    return body;
  }
  function closeSheet() {
    if (sheetIsOpen()) sheetClosedAt = Date.now();
    sheetOpts = {};
    sheetGen++;
    const sheet = $('sheet'), back = $('sheet-backdrop');
    sheet.classList.add('hidden');
    back.classList.add('hidden');
    sheet.style.transform = sheet.style.transition = '';
    back.style.opacity = back.style.transition = '';
  }
  /* leave the open sheet the way its opener asked; false if it may not be left */
  function dismissSheet() {
    if (!sheetIsOpen() || !sheetDismissible()) return false;
    const o = sheetOpts, gen = sheetGen;
    if (o.onDismiss) o.onDismiss();
    // closes unless onDismiss took over (locked) or already moved on to another sheet
    if (!o.locked && sheetGen === gen) closeSheet();
    return true;
  }
  function sheetState() {
    return { open: sheetIsOpen(), locked: !!sheetOpts.locked, dismissible: sheetIsOpen() && sheetDismissible() };
  }

  /* One question before a tap that would erase something: what goes, in a few
     words; one button that does it, one that keeps it. Leaving the sheet any
     other way (a drag down, a tap outside) keeps it too. `onKeep` (default:
     close) and `onGo` run once, whichever comes first.
       askFirst({ title, line, go, onGo, onKeep })                          */
  function askFirst(o) {
    let done = false;
    const keep = () => { if (done) return; done = true; if (o.onKeep) o.onKeep(); else closeSheet(); };
    const body = openSheet(
      `<h2>${esc(o.title)}</h2>${o.line ? `<div class="sub">${esc(o.line)}</div>` : ''}
       <div class="row-btns"><button class="btn" id="ask-keep">Keep it</button><button class="btn danger" id="ask-go">${esc(o.go)}</button></div>`,
      { onDismiss: keep });
    body.querySelector('#ask-keep').addEventListener('click', keep);
    body.querySelector('#ask-go').addEventListener('click', () => {
      if (done) return;
      done = true;
      closeSheet();
      o.onGo();
    });
    return body;
  }

  function bindSheet() {
    const sheet = $('sheet'), body = $('sheet-body'), back = $('sheet-backdrop');
    back.addEventListener('click', dismissSheet);
    let h = 1;
    const settleBack = () => {
      const rm = reducedMotion();
      sheet.style.transition = rm ? 'none' : `transform ${M.move}ms ${M.out}`;
      back.style.transition = rm ? 'none' : `opacity ${M.move}ms ${M.out}`;
      sheet.style.transform = back.style.opacity = '';
      afterMove(sheet, rm ? 0 : M.move, () => { if (!sheetDragging) sheet.style.transition = back.style.transition = ''; });
    };
    drag(sheet, {
      down: e => {
        if (!sheetIsOpen() || !sheetDismissible()) return null;
        const grab = !!e.target.closest('.grab');
        if (!grab && e.target.closest('input, textarea, select')) return null;
        return { grab };
      },
      start: (c, dx, dy) => {
        if (Math.abs(dx) > Math.abs(dy)) return false;
        if (!c.grab && (dy < 0 || body.scrollTop > 0)) return false;   // that is a scroll
        h = sheet.offsetHeight || 1;      // the one layout read, before anything moves
        sheetDragging = true;
        sheet.style.transition = back.style.transition = 'none';
        return true;
      },
      move: (c, dx, dy) => {
        // follows the finger down; upward it gives a little and stops
        const y = dy >= 0 ? dy : -Math.min(14, Math.sqrt(-dy) * 1.6);
        sheet.style.transform = `translate3d(0, ${y.toFixed(1)}px, 0)`;
        back.style.opacity = String(Math.max(0, 1 - Math.max(0, dy) / h).toFixed(3));
      },
      end: (c, g) => {
        sheetDragging = false;
        const leave = !g.cancel && (g.dy > h / 4 || (g.vy > 0.5 && g.dy > 12));
        if (!leave) { settleBack(); return; }
        const gen = sheetGen;
        const finish = () => {
          if (sheetGen !== gen) return;     // something else opened meanwhile
          dismissSheet();
          if (sheetIsOpen() && sheetGen === gen) settleBack();   // its opener chose to stay
        };
        if (reducedMotion()) { finish(); return; }
        // carry on at the speed of the flick, then hand over
        const ms = Math.round(Math.max(M.press, Math.min(M.move, (h - g.dy) / Math.max(0.9, g.vy))));
        sheet.style.transition = `transform ${ms}ms ${M.out}`;
        back.style.transition = `opacity ${ms}ms ${M.out}`;
        sheet.style.transform = 'translate3d(0, 100%, 0)';
        back.style.opacity = '0';
        afterMove(sheet, ms, finish);
      }
    });
    // the body scrolls; at its top a downward drag is the sheet's, not the page's
    let t0 = null;
    sheet.addEventListener('touchstart', e => { t0 = e.touches.length === 1 ? [e.touches[0].clientX, e.touches[0].clientY] : null; }, { passive: true });
    sheet.addEventListener('touchmove', e => {
      if (!t0 || !sheetDismissible()) return;
      const dx = e.touches[0].clientX - t0[0], dy = e.touches[0].clientY - t0[1];
      if (sheetDragging || (body.scrollTop <= 0 && dy > 0 && dy > Math.abs(dx))) e.preventDefault();
    }, { passive: false });
  }

  /* ---------------- cards under the finger ----------------
     The hand: press lifts a card; drag it up onto the felt (or flick it up)
     to throw it; drag it sideways to move it in the fan. The piles: drag the
     stock or the top discard down to the hand to draw.                     */
  function springHome(el, then) {
    const ms = reducedMotion() ? 0 : M.move;
    el.style.transition = ms ? `transform ${ms}ms ${M.spring}` : 'none';
    el.style.transform = '';
    afterMove(el, ms, () => { el.style.transition = ''; el.classList.remove('lift'); if (then) then(); });
  }

  function bindHand() {
    const host = $('hand');
    const pile = () => $('pile-discard');
    // others slide aside to show where the dragged card will land
    function makeRoom(c, to) {
      const order = c.cards.map((_, i) => i).filter(i => i !== c.from);
      order.splice(to, 0, c.from);
      order.forEach((k, slot) => {
        const el = c.cards[k];
        el.style.zIndex = String(slot + 1);
        if (k !== c.from) el.style.transform = slot === k ? '' : `translate3d(${(c.xs[slot] - c.xs[k]).toFixed(1)}px, 0, 0)`;
      });
      c.order = order;
    }
    drag(host, {
      down: e => {
        const el = e.target.closest('.card');
        if (!el || !host.contains(el)) return null;
        el.classList.add('press');
        return { el, card: Number(el.dataset.card) };
      },
      release: c => c.el.classList.remove('press'),
      start: (c, dx, dy) => {
        const up = -dy > Math.abs(dx);
        if (up ? !handOpts.onThrow && !handOpts.onReorder : !handOpts.onReorder) return false;
        c.mode = up && handOpts.onThrow ? 'throw' : 'sort';
        // every layout read happens here, before anything moves
        c.cards = [...host.querySelectorAll('.card')];
        c.xs = c.cards.map(el => parseFloat(el.style.getPropertyValue('--x')) || 0);
        c.from = c.to = c.cards.indexOf(c.el);
        c.z = c.el.style.zIndex;
        const felt = document.querySelector('.table-center');
        c.feltBottom = felt ? felt.getBoundingClientRect().bottom : 0;
        handDrag = c;
        c.el.classList.add('lift');
        host.classList.add('sorting');
        return true;
      },
      move: (c, dx, dy, e) => {
        if (c.mode === 'sort' && dy < -70 && handOpts.onThrow) {   // pulled up out of the fan after all
          c.mode = 'throw'; makeRoom(c, c.from); c.to = c.from;
        }
        if (c.mode === 'sort') {
          const y = Math.max(-26, Math.min(10, dy * 0.5));
          c.el.style.transform = `translate3d(${dx.toFixed(1)}px, ${y.toFixed(1)}px, 0)`;
          const x = c.xs[c.from] + dx;
          let to = 0;
          c.xs.forEach((v, i) => { if (Math.abs(v - x) < Math.abs(c.xs[to] - x)) to = i; });
          if (to !== c.to) { c.to = to; makeRoom(c, to); }
        } else {
          c.el.style.transform = `translate3d(${dx.toFixed(1)}px, ${dy.toFixed(1)}px, 0) rotate(${(dx * 0.05).toFixed(2)}deg)`;

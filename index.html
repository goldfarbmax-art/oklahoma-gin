    const on = (id, fn) => { const el = body.querySelector(id); if (el) el.addEventListener('click', fn); };
    on('#btn-rematch', () => { U.closeSheet(); newMatch(); });
    on('#btn-gn-next', () => {
      U.closeSheet();
      if (!startGameNight(next.partner, next.opps, sc.pool, (sc.round || 1) + 1)) home();
    });
  }

  /* ---------------- menu / boards / stats / settings ---------------- */
  function openMenuSheet() {

    const n = app.names;
    const who = gameNight() && isTeam() && n
      ? `<div class="sub">Game night, match ${app.match.scout.round || 1}. With ${escH(n.partner)}. Across from you: ${escH(n.opp)}. Other table: ${escH(n.opp2)}.</div>`
      : '';
    const body = U.openSheet(

  function openBoardSheet() {

    U.openSheet(`<h2>Scoreboard</h2>${hollyBoardHTML(app.match)}
      <div class="end-note end-running"><span>${fmtMoney(st.box)} a box · ${fmtMoney(st.game)} a game</span><b>${fmtD(settlement(app.match).total)}</b></div>
      <div class="row-btns"><button class="btn" onclick="UI.closeSheet()">Close</button></div>`);

  function openPlaybookSheet() {

  /* ---------- live opponent tracker (Shankar table) ---------- */
  function openGridSheet() {
    const hand = app.table.hand;
    app.beliefMarks = app.beliefMarks || {};
    let drawn = false;
    function render() {
      const body = U.openSheet(
        `<div class="eyebrow lead">Tracker</div>
         <h2>Opponent tracker</h2>
         <div class="sub">Tap a card to cycle: blank → ✗ not in their hand → ✓ in their hand. ● is yours, – is on the pile. Scored against reality at hand end.</div>
         ${U.beliefGridHTML(hand, app.beliefMarks)}
         <div class="row-btns"><button class="btn" onclick="UI.closeSheet()">Back to the hand</button></div>`, { same: drawn });
      drawn = true;   // each mark redraws this same view: quick taps are not held
      body.querySelectorAll('[data-bg]').forEach(cell => cell.addEventListener('click', () => {
        const c = Number(cell.dataset.bg);
        const cur = app.beliefMarks[c];
        if (!cur) app.beliefMarks[c] = 'out';
        else if (cur === 'out') app.beliefMarks[c] = 'in';
        else delete app.beliefMarks[c];
        render();
      }));
    }
    render();
  }

  /* ---------- the Gym ----------
     Single drills, a mixed set, your own mistakes, the ten-minute daily set
     and the sixty-position baseline all run through one loop: make a question
     (the next one is made while you answer this one), pose it, judge it.     */
  const BASELINE_KEY = 'grt-baseline-run';
  const DAILY_MINUTES = 10;
  const dayKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const loadBaselineRun = () => { try { return JSON.parse(localStorage.getItem(BASELINE_KEY)); } catch (e) { return null; } };
  const saveBaselineRun = run => { try { run ? localStorage.setItem(BASELINE_KEY, JSON.stringify(run)) : localStorage.removeItem(BASELINE_KEY); } catch (e) {} };

  function openGymSheet() {
    const G = window.Gym, SK = G.SKILLS;
    const stats = app.coach.stats;
    let set = null, clock = null;
    const stopClock = () => { if (clock) { clearInterval(clock); clock = null; } };
    const pctOf = id => { const s = stats.drills[SK[id].key] || [0, 0]; return s[1] ? Math.round(100 * s[0] / s[1]) + '%' : ''; };

    /* a set that ends drops what it still has waiting to be dealt out */
    function endSet() {
      if (set) { set.gone = true; dropJobs(set); }
      set = null;
    }

    function home() {
      stopClock(); endSet();
      const mistakes = K.loadBlunders(), due = G.dueMistakes().length;
      const run = loadBaselineRun(), base = stats.baseline;
      const today = dayKey(new Date()), doneToday = stats.daily && stats.daily.last === today;
      const streak = (stats.daily && stats.daily.streak) || 0;
      const btn = id => `<button class="btn" data-skill="${id}">${SK[id].name}<small>${pctOf(id)}</small></button>`;
      const baseLine = run && run.queue ? `Resume · ${run.done} of ${run.queue.length} done`
        : base ? `Taken ${new Date(base.ts).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}: ${base.right} of ${base.total}. Take it again`
        : 'Sixty positions · about twenty minutes · can be paused';
      const body = U.openSheet(
        `<div class="eyebrow lead">The Gym</div>
         <h2>Training</h2>
         <div class="gym-lead">
           <button class="btn gold" id="gym-daily">Today's ten minutes<small>${doneToday ? 'Done today' + (streak > 1 ? ' · ' + streak + ' days running' : '') + '. Go again' : 'Leans on your weakest skill' + (due ? ' · ' + due + ' of your own mistakes due' : '')}</small></button>
           <button class="btn" id="gym-baseline">Baseline test<small>${baseLine}</small></button>
         </div>
         <div class="eyebrow sec">The team game</div>
         <div class="gym-grid">${['sums', 'bulge', 'first', 'sheet'].map(btn).join('')}</div>
         <div class="eyebrow sec">The hand</div>
         <div class="gym-grid">${['knockcard', 'knock', 'discard', 'ginrating', 'safewild', 'count'].map(btn).join('')}</div>
         <div class="eyebrow sec">Mixed</div>
         <div class="gym-grid">
           <button class="btn" id="gym-mixed">Everything<small>weakest first</small></button>
           <button class="btn" id="gym-mistakes">My mistakes<small>${mistakes.length ? mistakes.length + ' kept' + (due ? ' · ' + due + ' due' : '') : 'none yet'}</small></button>
         </div>`);
      body.querySelectorAll('[data-skill]').forEach(b => b.addEventListener('click', () => start('drill', b.dataset.skill)));
      body.querySelector('#gym-daily').addEventListener('click', () => start('daily'));
      body.querySelector('#gym-baseline').addEventListener('click', () => start('baseline'));
      body.querySelector('#gym-mixed').addEventListener('click', () => start('mixed'));
      body.querySelector('#gym-mistakes').addEventListener('click', () => start('mistakes'));
    }

    function start(type, skill) {
      set = { type, skill, asked: 0, right: 0, streak: 0, cost: 0, by: {}, made: 0, next: null, due: [], endsAt: 0 };
      if (type === 'daily') {
        set.endsAt = Date.now() + DAILY_MINUTES * 60000;
        set.due = G.dueMistakes().sort(() => Math.random() - 0.5).slice(0, 4);
      }
      if (type === 'baseline') {
        const run = loadBaselineRun();
        set.run = run && run.queue ? run : { queue: G.baselineQueue(), done: 0, by: {}, right: 0, cost: 0 };
        set.by = set.run.by; set.right = set.run.right; set.asked = set.run.done; set.cost = set.run.cost || 0;
        set.made = set.run.done;
      }
      advance();
    }

    /* how the next question gets made (decided one question ahead) */
    function maker() {
      const i = set.made++;
      const rules = app.settings, skill = set.skill;   // read now: the set may be gone when this runs
      if (set.type === 'baseline') {
        const id = set.run.queue[i];
        return id ? () => G.question(id, rules) : null;
      }
      if (set.type === 'drill') return () => G.question(skill, rules);
      if (set.type === 'mistakes') {
        return () => { const list = K.loadBlunders(); return list.length ? G.mistakeQuestion(list[(Math.random() * list.length) | 0], rules) : null; };
      }
      if (set.type === 'daily' && i % 3 === 1 && set.due.length) {
        const entry = set.due.shift();
        return () => { try { return G.mistakeQuestion(entry, rules); } catch (e) { return G.question(G.pickSkill(stats), rules); } };
      }
      return () => G.question(G.pickSkill(stats), rules);
    }
    function prepare() {
      const make = maker();
      return make ? gymPrepare(make, set) : Promise.resolve(null);
    }

    const timeLeft = () => Math.max(0, set.endsAt - Date.now());
    const clockText = () => { const s = Math.ceil(timeLeft() / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
    function tagLine(q) {
      if (set.type === 'daily') return `Ten minutes · <span id="gym-clock">${clockText()}</span> left · ${set.right}/${set.asked}`;
      if (set.type === 'baseline') return `Baseline · ${set.asked + 1} of ${set.run.queue.length}`;
      return `The Gym · ${q ? q.title : ''} · ${set.right}/${set.asked}`;
    }

    function advance() {
      // one at a time: a second tap on Next while a question is on its way does nothing
      if (!set || set.waiting) return;
      const over = (set.type === 'daily' && timeLeft() <= 0) ||
        (set.type === 'baseline' && set.asked >= set.run.queue.length);
      if (over) { summary(); return; }
      const mine = set;
      set.waiting = true;   // cleared when the question is posed (or none comes)
      const p = set.next || prepare();
      set.next = null;
      let shown = false;
      const waiting = setTimeout(() => {
        if (shown || set !== mine) return;
        const b = U.openSheet(`<div class="eyebrow lead">${tagLine(null)}</div><h2>Dealing a position…</h2>
          <div class="row-btns"><button class="btn ghost" id="gym-quit">End set</button></div>`, { locked: true, onDismiss: leave });
        b.querySelector('#gym-quit').addEventListener('click', leave);
      }, 150);
      p.then(q => {
        shown = true; clearTimeout(waiting);
        if (set !== mine) return;
        set.waiting = false;
        if (!q) {
          const none = set.type === 'mistakes';
          U.openSheet(`<div class="eyebrow lead">The Gym</div><h2>${none ? 'No mistakes kept yet' : 'Could not deal a position'}</h2>
            <div class="sub">${none ? 'Play some hands. Plays that cost you money are kept and come back here.' : 'Try again.'}</div>
            <div class="row-btns"><button class="btn" id="gym-home">Back</button></div>`)
            .querySelector('#gym-home').addEventListener('click', home);
          return;
        }
        pose(q);
      });
    }

    /* leaving a set early: the daily and baseline sets keep what was done */
    function leave() {
      if (set && set.type === 'daily' && set.asked >= 3) { summary(); return; }
      home();
    }

    function pose(q) {
      const mine = set;
      set.next = prepare();                       // the next one is dealt while you think
      const sheetHTML = q.sheet ? hollyBoardHTML(q.sheet, { team: true, compact: true }) : '';
      const cardsRow = q.cards ? `<div class="reveal-cards gym-cards">${q.cards.map(c => U.miniCardHTML(c)).join('')}</div>` : '';
      const opts = q.pickCard ? ''
        : `<div class="drill-options">${q.options.map(o => `<button class="btn" data-id="${o.id}">${o.label}</button>`).join('')}</div>`;
      const body = U.openSheet(
        `<div class="eyebrow lead">${tagLine(q)}</div>
         <h2>${q.title}</h2>
         ${sheetHTML}
         <div class="sub gym-prompt">${q.prompt}</div>
         ${cardsRow}${opts}
         <div class="row-btns"><button class="btn ghost" id="gym-quit">End set</button></div>`,
        { locked: true, onDismiss: leave });
      const t0 = Date.now();
      if (set.type === 'daily') {
        stopClock();
        clock = setInterval(() => { const el = document.getElementById('gym-clock'); if (el && set) el.textContent = clockText(); }, 1000);
      }
      let answered = false;
      function answer(val) {
        if (answered || set !== mine) return;
        answered = true;
        const took = (Date.now() - t0) / 1000;
        const v = q.pickCard ? Number(val) : val;
        const quick = q.resolve(v);
        const action = q.play ? q.play(v) : null;
        if (!action || !canJudge(q)) { show(q, quick, took); return; }
        let shown = false;
        const waiting = setTimeout(() => {
          if (shown || set !== mine) return;
          U.openSheet(`<div class="eyebrow lead">${tagLine(q)}</div><h2>Dealing it out…</h2>
            <div class="sub">Trying your play and the alternatives against the same deals.</div>`, { locked: true, onDismiss: leave });
        }, 120);
        gymVerdict(q, action, mine).then(res => { shown = true; clearTimeout(waiting); if (set === mine) show(q, res || quick, took); });
      }
      if (q.pickCard) {
        body.querySelectorAll('.reveal-cards .card').forEach((el, i) => {
          if (q.barred && q.barred.includes(q.cards[i])) {
            el.classList.add('barred');
            el.addEventListener('click', () => U.toast('You just took that card: it cannot go straight back'));
          } else el.addEventListener('click', () => answer(q.cards[i]));
        });
      } else {
        body.querySelectorAll('[data-id]').forEach(b => b.addEventListener('click', () => answer(b.dataset.id)));
      }
      body.querySelector('#gym-quit').addEventListener('click', leave);
    }

    function show(q, res, took) {
      const ok = res.grade === 'optimal' || res.grade === 'good';
      const tagBefore = tagLine(q);
      set.asked++;
      if (ok) { set.right++; set.streak++; } else set.streak = 0;
      if (res.cost > 0) set.cost += res.cost;
      const name = q.entry ? 'My mistakes' : SK[q.skill].name;
      const slot = set.by[name] || (set.by[name] = [0, 0]);
      slot[1]++; if (ok) slot[0]++;
      if (q.entry) G.reschedule(q.entry, ok);
      else K.recordDrillResult(app.coach, SK[q.skill].key, res.grade);
      if (set.type === 'baseline') {
        Object.assign(set.run, { done: set.asked, by: set.by, right: set.right, cost: set.cost });
        saveBaselineRun(set.run);
      }
      const tag = set.type === 'baseline' ? tagBefore : tagLine(q);
      const word = GRADE_WORD[res.grade] || res.grade;
      const timeNote = q.timed ? `<div class="sub gym-time">${took.toFixed(1)} seconds${ok && took <= 6 ? ': table speed' : ok ? ': right, now faster' : ''}</div>` : '';
      const last = (set.type === 'baseline' && set.asked >= set.run.queue.length) || (set.type === 'daily' && timeLeft() <= 0);
      const b2 = U.openSheet(
        `<div class="eyebrow lead">${tag}</div>
         <div class="grade-chip ${res.grade}">${word}</div>
         <div class="drill-explain">${res.explanation}</div>
         ${timeNote}
         <div class="row-btns">
           <button class="btn" id="gym-stop">${set.type === 'baseline' ? 'Pause' : 'End set'}</button>
           <button class="btn gold" id="gym-next">${last ? 'See the result' : 'Next'}</button>
         </div>`, { locked: true, onDismiss: leave });
      b2.querySelector('#gym-next').addEventListener('click', advance);
      b2.querySelector('#gym-stop').addEventListener('click', leave);
    }

    function summary() {
      stopClock();
      const s = set;
      const rows = Object.keys(s.by).map(name => [name, s.by[name][0], s.by[name][1]])
        .sort((a, b) => a[1] / a[2] - b[1] / b[2] || b[2] - a[2]);
      const bars = rows.map(([name, r, n]) =>
        `<div class="bar-row"><div class="bk wide">${name}</div>
          <div class="bar"><i style="width:${Math.round(100 * r / n)}%"></i></div><div class="bv">${r}/${n}</div></div>`).join('');
      const weak = rows.filter(([, r, n]) => n >= 2 && r / n < 0.7).slice(0, 2).map(x => x[0]);
      let title, sub;
      if (s.type === 'baseline') {
        stats.baseline = { ts: Date.now(), by: s.by, right: s.right, total: s.asked, cost: s.cost };
        saveBaselineRun(null);
        title = `Baseline: ${s.right} of ${s.asked}`;
        sub = (weak.length ? `Weakest: ${weak.join(' and ')}. The daily set will lean on ${weak.length > 1 ? 'them' : 'it'}. ` : 'No skill stood out as weak. ') +
          'A few positions per skill is a rough reading: treat a gap of one or two answers as noise.';
      } else {
        const d = stats.daily || (stats.daily = { last: '', streak: 0, sets: 0 });
        // yesterday as a calendar day, not 24 hours back (a day the clocks change is 23 or 25 hours)
        const now = new Date();
        const today = dayKey(now), yesterday = dayKey(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1));
        if (d.last !== today) d.streak = d.last === yesterday ? d.streak + 1 : 1;
        d.last = today; d.sets++;
        title = `${s.right} of ${s.asked} today`;
        sub = (d.streak > 1 ? `${d.streak} days running. ` : '') +
          (weak.length ? `Most room: ${weak.join(' and ')}.` : s.right === s.asked ? 'A clean set.' : '');
      }
      if (s.cost > 0) sub += ` Plays that were dealt out cost ${money2(s.cost)} in all.`;
      K.saveStats(app.coach);
      endSet();
      U.openSheet(
        `<div class="eyebrow lead">The Gym</div>
         <h2>${title}</h2>
         <div class="sub">${sub}</div>
         ${bars}
         <div class="row-btns"><button class="btn" id="gym-home">Done</button></div>`, { locked: true, onDismiss: home })
        .querySelector('#gym-home').addEventListener('click', home);
    }

    home();
  }

  /* the rating of decisions as one number with its give-or-take: "+$0.42 a hand · ±$0.40"; a dash until it exists */
  function houseText(r) {
    if (!r) return '–';
    const cents = Math.round(r.value * 100);
    return `${cents > 0 ? '+' : cents < 0 ? '−' : ''}$${(Math.abs(cents) / 100).toFixed(2)}<small> a hand · ±$${r.pm.toFixed(2)}</small>`;
  }

  function openStatsSheet() {
    const st = app.coach ? app.coach.stats : K.createCoach(false).stats;
    // one name for each skill: the Gym's own (Gym.SKILLS), for the record keys the Gym shares
    const SK = (window.Gym && window.Gym.SKILLS) || {};
    const skillName = (key, own) => { const s = Object.keys(SK).map(id => SK[id]).find(x => x.key === key); return s ? s.name : own; };
    const drillNames = {
      sums: 'Team sums', bulge: 'To the bulge', first: 'Playing first', sheet: 'The sheet', knockcard: 'Knock card',
      draw: 'Draw decision', discard: 'Best throw', knock: 'Knock or play on', ginrating: 'Gin cards', count: 'Count it',
      counting: 'Counting', read: 'Reading their hand', gym: 'Safe or wild'
    };
    const bars = Object.keys(drillNames).map(k => {
      const [ok, n] = st.drills[k] || [0, 0];
      const pct = n ? Math.round(100 * ok / n) : 0;
      return `<div class="bar-row"><div class="bk">${skillName(k, drillNames[k])}</div>
        <div class="bar"><i style="width:${n ? pct : 0}%"></i></div>
        <div class="bv">${n ? pct + '%' : '–'}</div></div>`;
    }).join('');
    const mv = st.moves;
    const mTotal = mv.optimal + mv.good + mv.acceptable + mv.blunder || 1;
    // weekly trend (last 4 buckets)
    const weeks = Object.keys(st.weekly || {}).sort().slice(-4);
    const trend = weeks.map(w => {
      const b = st.weekly[w];
      const pct = b.total ? Math.round(100 * b.sharp / b.total) : 0;
      return `<div class="bar-row"><div class="bk">${w.replace(/^\d+-/, '')} · ${b.hands}h</div>
        <div class="bar"><i style="width:${pct}%"></i></div><div class="bv">${b.total ? pct + '%' : '–'}</div></div>`;
    }).join('') || '<div class="sub">Play graded hands to build your trend.</div>';
    // dollars given away a hand, week by week: the number the training is meant to push down
    const leakWeeks = weeks.filter(w => st.weekly[w].hands > 0 && st.weekly[w].lost !== undefined);
    const leakMax = Math.max(0.01, ...leakWeeks.map(w => st.weekly[w].lost / st.weekly[w].hands));
    const leak = leakWeeks.map(w => {
      const b = st.weekly[w], per = b.lost / b.hands;
      return `<div class="bar-row"><div class="bk">${w.replace(/^\d+-/, '')} · ${b.hands}h</div>
        <div class="bar"><i style="width:${Math.round(100 * per / leakMax)}%"></i></div><div class="bv">$${per.toFixed(2)}</div></div>`;
    }).join('') || '<div class="sub">Play hands with the coach on to see what your play gives away.</div>';
    // the baseline test, set beside where each skill stands now
    const base = st.baseline;
    const baseRows = base ? Object.keys(base.by).map(name => {
      const [r, n] = base.by[name];
      return `<div class="bar-row"><div class="bk wide">${name}</div>
        <div class="bar"><i style="width:${Math.round(100 * r / n)}%"></i></div><div class="bv">${r}/${n}</div></div>`;
    }).join('') : '<div class="sub">Not taken yet. It is in the Gym: sixty positions, about twenty minutes.</div>';
    const t = st.tilt || { normal: [0, 0], tilted: [0, 0] };
    const tiltNote = t.tilted[1] >= 12
      ? `<div class="sub tilt">Tilt check: costly plays ${t.normal[1] ? Math.round(100 * t.normal[0] / t.normal[1]) : 0}% normally, ${Math.round(100 * t.tilted[0] / t.tilted[1])}% after two straight losses.</div>`
      : '';
    const milestones = K.MILESTONES.map(([id, label]) =>
      `<div class="bar-row"><div class="bk fill">${st.milestones && st.milestones[id] ? '✓' : '○'} ${label}</div></div>`).join('');
    U.openSheet(
      `<h2>Training record</h2>
       <div class="stat-grid">
         <div class="stat-card"><div class="k">Against the house</div><div class="v">${houseText(K.houseRating(st))}</div></div>
         <div class="stat-card"><div class="k">Bankroll vs AI</div><div class="v">${st.money < 0 ? '−' : ''}$${Math.abs(st.money || 0).toFixed(0)}</div></div>
         <div class="stat-card"><div class="k">Hands</div><div class="v">${st.handWins}<small> / ${st.hands}</small></div></div>
         <div class="stat-card"><div class="k">Matches</div><div class="v">${st.matchWins}<small> / ${st.matches}</small></div></div>
         <div class="stat-card"><div class="k">Right or fine</div><div class="v">${Math.round(100 * (mv.optimal + mv.good) / mTotal)}<small>%</small></div></div>
         <div class="stat-card"><div class="k">Given away a hand</div><div class="v">${st.pricedHands ? '$' + ((st.lost || 0) / st.pricedHands).toFixed(2) : '–'}</div></div>
       </div>
       <div class="eyebrow sec">Right or fine, by week</div>
       ${trend}
       <div class="eyebrow sec">Given away a hand, by week</div>
       ${leak}
       <div class="eyebrow sec">Baseline${base ? ' · ' + new Date(base.ts).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' · ' + base.right + ' of ' + base.total : ''}</div>
       ${baseRows}
       <div class="eyebrow sec">Drill accuracy</div>
       ${bars}
       ${tiltNote}
       <div class="eyebrow sec">Milestones</div>
       ${milestones}
       <div class="row-btns"><button class="btn" onclick="UI.closeSheet()">Close</button></div>`);
  }

  /* a stake as typed: any amount from $0.01 to $10,000, at most two decimals ("$1,250", "0.25", "12.5").
     Anything else is null, and the field goes back to the last good value. */
  function parseStake(text) {
    const t = String(text == null ? '' : text).replace(/[\s$,]/g, '');
    if (!/^(\d+(\.\d{0,2})?|\.\d{1,2})$/.test(t)) return null;
    const v = Math.round(parseFloat(t) * 100) / 100;
    return v >= 0.01 && v <= 10000 ? v : null;
  }
  const stakeText = v => fmtMoney(v).slice(1);   // the field has its own $
  const stakeField = (key, label) => `
      <label class="set-row stake-row"><span class="sr-label">${label}</span>
        <span class="stake-in"><i>$</i><input class="sc-input" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done"
          data-stake="${key}" value="${stakeText(app.settings[key])}" aria-label="${label}"></span></label>`;

  /* Reset stats erases the whole training record: the counts, the kept mistakes
     (made from the plays those counts graded) and a baseline test left paused
     (it would resume into a record that no longer has its start). What is there,
     in one sentence, or null when there is nothing to erase.                  */
  function recordContents() {
    const st = app.coach ? app.coach.stats : K.createCoach(false).stats;
    const sum = o => Object.keys(o || {}).reduce((t, k) => t + (Array.isArray(o[k]) ? o[k][1] || 0 : Number(o[k]) || 0), 0);
    const kept = K.loadBlunders().length, run = loadBaselineRun();
    const paused = run && Array.isArray(run.queue) ? run : null;
    const counted = st.hands || st.matches || sum(st.moves) || sum(st.drills) || st.baseline || (st.daily && st.daily.sets) ||
      (st.house && st.house.list && st.house.list.length) || st.money || st.peeks || Object.keys(st.milestones || {}).length || Object.keys(st.weekly || {}).length;
    if (!counted && !kept && !paused) return null;
    const parts = [];
    if (counted) parts.push(`${st.hands} hand${st.hands === 1 ? '' : 's'}, ${st.matches} match${st.matches === 1 ? '' : 'es'} and everything counted with them`);
    if (kept) parts.push(`${kept} kept mistake${kept === 1 ? '' : 's'}`);
    if (paused) parts.push(`the paused baseline test (${paused.done || 0} of ${paused.queue.length} done)`);
    const text = parts.length > 1 ? parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1] : parts[0];
    return text.charAt(0).toUpperCase() + text.slice(1) + '.';
  }
  function eraseRecord() {
    try { localStorage.removeItem('grt-stats'); localStorage.removeItem('grt-blunders'); } catch (e) {}
    // plays let go for good and still waiting were made before the reset: they would not count (the epoch)
    app.kept = []; saveKept();
    saveBaselineRun(null);
    if (app.coach) app.coach.stats = K.createCoach(false).stats;
  }

  /* the build running, as tools/build.js stamped it on <html data-build="date hash"> */
  function buildStamp() {
    try {
      const v = document.documentElement && document.documentElement.getAttribute('data-build');
      return v && v !== 'dev' ? String(v) : '';
    } catch (e) { return ''; }
  }

  function openSettingsSheet() {
    const s = app.settings;
    const build = buildStamp();
    const stepper = (key, label, hint, step, min, max) => `
      <div class="set-row"><div class="sr-label">${label}<small>${hint}</small></div>
        <div class="stepper" data-key="${key}" data-step="${step}" data-min="${min}" data-max="${max}">
          <button class="st-dn">−</button><span class="sv">${s[key]}</span><button class="st-up">+</button>
        </div></div>`;
    const toggle = (key, label, hint) => `
      <div class="set-row"><div class="sr-label">${label}<small>${hint}</small></div>
        <span class="switch"><input type="checkbox" data-tkey="${key}" ${s[key] ? 'checked' : ''}><span class="knob"></span></span>
      </div>`;
    const body = U.openSheet(
      `<h2>Table rules</h2>
       <div class="set-row"><div class="sr-label">Your name</div>
         <input class="sc-input" id="set-name" type="text" maxlength="16" value="${escH(s.playerName || '')}" placeholder="You" autocomplete="off" enterkeyhint="done"></div>
       <div class="sub">Scoring changes apply to the next match.</div>
       ${stepper('targetScore', 'Game target', 'Each Hollywood game plays to this', 25, 100, 500)}
       ${stakeField('dollarsPerBox', 'Stake a box')}
       ${stakeField('dollarsPerGame', 'Stake a game')}
       ${toggle('spadeDoubles', 'Spade doubles', 'A spade knock card doubles the points and the boxes')}
       ${toggle('shutoutDoubles', 'Shut-out doubles', 'Blanked game pays double')}
       ${toggle('fourColour', 'Four-colour deck', 'Clubs green, diamonds blue: easier to tell suits apart')}
       ${window.Backup ? `<div class="eyebrow sec">Your record</div>
       <div class="sub">Kept on this phone only. A backup file carries it anywhere.</div>
       <div class="gym-grid">
         <button class="btn" id="btn-backup-save">Save a backup</button>
         <button class="btn" id="btn-backup-load">Restore one</button>
       </div>` : ''}
       <div class="row-btns">
         <button class="btn danger" id="btn-reset-stats">Reset stats</button>
         <button class="btn" id="btn-set-done">Done</button>
       </div>
       ${build ? `<div class="build-line">Build ${escH(build.replace(' ', ' · '))}</div>` : ''}`);
    // the stakes: typed, checked when the field is left; anything not a stake goes back to the last good one
    const wireMoney = key => {
      const el = body.querySelector('[data-stake="' + key + '"]');
      if (!el) return;
      const show = () => { el.value = stakeText(app.settings[key]); };
      el.addEventListener('change', () => {
        const v = parseStake(el.value);
        if (v !== null) { app.settings[key] = v; saveSettings(); }
        show();
      });
      el.addEventListener('blur', show);
      el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); });
    };
    // your name: saved as typed (trimmed, 16 at most); empty means "You"
    const nameInput = body.querySelector('#set-name');
    nameInput.addEventListener('input', () => {
      app.settings.playerName = String(nameInput.value || '').trim().slice(0, 16);
      saveSettings();
    });
    wireMoney('dollarsPerBox');
    wireMoney('dollarsPerGame');
    body.querySelectorAll('.stepper').forEach(el => {
      const key = el.dataset.key, step = +el.dataset.step, min = +el.dataset.min, max = +el.dataset.max;
      const sv = el.querySelector('.sv');
      el.querySelector('.st-dn').addEventListener('click', () => {
        app.settings[key] = Math.max(min, app.settings[key] - step); sv.textContent = app.settings[key]; saveSettings();
      });
      el.querySelector('.st-up').addEventListener('click', () => {
        app.settings[key] = Math.min(max, app.settings[key] + step); sv.textContent = app.settings[key]; saveSettings();
      });
    });
    body.querySelectorAll('[data-tkey]').forEach(el => {
      el.addEventListener('change', () => { app.settings[el.dataset.tkey] = el.checked; saveSettings(); applyLook(); });
    });
    body.querySelector('#btn-reset-stats').addEventListener('click', () => {
      const what = recordContents();
      if (!what) { U.toast('Nothing to erase'); return; }
      U.askFirst({
        title: 'Erase your training record?', line: what, go: 'Erase',
        onGo: () => { eraseRecord(); openSettingsSheet(); U.toast('Training record erased'); },
        onKeep: openSettingsSheet
      });
    });
    body.querySelector('#btn-set-done').addEventListener('click', U.closeSheet);
    const saveBtn = body.querySelector('#btn-backup-save'), loadBtn = body.querySelector('#btn-backup-load');
    if (saveBtn) saveBtn.addEventListener('click', () => {
      if (app.coach) K.saveStats(app.coach);
      saveSettings(); saveMatch();
      window.Backup.save().then(how => U.toast(how === 'cancelled' ? 'No backup saved' : how === 'shared' ? 'Backup handed over' : 'Backup saved to your downloads'),
        () => U.toast('The backup could not be saved'));
    });
    if (loadBtn) loadBtn.addEventListener('click', () => {
      window.Backup.pick().then(text => {
        const info = window.Backup.inspect(text);   // throws if it is not one of ours
        const when = info.saved ? new Date(info.saved).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : 'an unknown date';
        const b = U.openSheet(
          `<div class="eyebrow lead">Restore</div>
           <h2>Replace what is on this phone?</h2>
           <div class="sub">This backup was saved on ${when}. It holds ${info.hands} hand${info.hands === 1 ? '' : 's'} of training record, ${info.mistakes} kept mistake${info.mistakes === 1 ? '' : 's'}, ${info.friends} friend${info.friends === 1 ? '' : 's'} and ${info.nights} logged night${info.nights === 1 ? '' : 's'}. Restoring it removes everything stored here now and puts the backup in its place.</div>
           <div class="row-btns">
             <button class="btn" id="btn-restore-no">Keep what is here</button>
             <button class="btn gold" id="btn-restore-yes">Restore</button>
           </div>`, { locked: true, onDismiss: openSettingsSheet });
        b.querySelector('#btn-restore-no').addEventListener('click', openSettingsSheet);
        b.querySelector('#btn-restore-yes').addEventListener('click', () => {
          // the restored record starts a new epoch (Coach.newRecordEpoch): no play made before the
          // restore, the backup's own hand in play included, is counted into it
          try { window.Backup.restore(text); K.newRecordEpoch(app.coach); location.reload(); }
          catch (e) { U.toast(e.message || 'That backup could not be restored'); }
        });
      }).catch(e => U.toast((e && e.message) || 'That file could not be read'));
    });
  }

  /* ---------------- boot ---------------- */
  /* look-and-feel settings that live on <body> */
  function applyLook() {
    document.body.classList.toggle('deck4', !!app.settings.fourColour);
  }

  document.addEventListener('DOMContentLoaded', () => {
    applyLook();
    // the hand is laid out in pixels, so lay it out again if the screen changes shape
    window.addEventListener('resize', () => {
      if (app.table && app.table.hand && onTable()) renderAll();
    });
    initHome();
    pileTaps();
    $('btn-new').addEventListener('click', () => askBeforeDropping(newMatch, 'New match'));
    $('btn-continue').addEventListener('click', continueMatch);
    $('btn-stats').addEventListener('click', openStatsSheet);
    $('btn-gym').addEventListener('click', openGymSheet);
    $('btn-playbook').addEventListener('click', openPlaybookSheet);
    $('btn-settings').addEventListener('click', openSettingsSheet);
    $('btn-menu').addEventListener('click', openMenuSheet);
    document.querySelector('.opp-id').addEventListener('click', openPeopleSheet);
    $('holly-mini').addEventListener('click', openBoardSheet);
    $('btn-sort').addEventListener('click', () => {
      const pro = app.settings.tableMode === 'pro';
      app.sortMode = app.sortMode === 'melds' ? 'runs' : app.sortMode === 'runs' ? 'rank' : (pro ? 'runs' : 'melds');
      U.toast('Sorted by ' + (app.sortMode === 'melds' ? 'melds' : app.sortMode === 'runs' ? 'suit' : 'rank'));
      renderAll();
    });
    if (!app.coach) app.coach = K.createCoach(app.settings.coach);
    loadKept();   // plays let go for good whose verdict had not landed when the app was closed
    const note = $('update-note');
    if (note) note.addEventListener('click', loadUpdate);
    watchUpdates();
  });

  window.__grt = app; // read by test/shell.js
})();

</script>
<script>
/* ============================================================
   Scout: the screens. Friends and how they play, real nights,
   the ledger, and a practice game night against their bots.
   Everything lives in the bottom sheet; the data is window.Scout.
   ============================================================ */
(function () {
  'use strict';

  const U = () => window.UI;
  const S = () => window.Scout;

  /* ---------------- small helpers ---------------- */
  const esc = s => U().esc(s);   // the app's one escape helper
  const MINUS = '−';
  function amount(v) {
    const a = Math.abs(v);
    const whole = Math.abs(a - Math.round(a)) < 0.005;
    return whole ? String(Math.round(a)) : a.toFixed(2);
  }
  function money(v) {
    v = Number(v) || 0;
    if (Math.abs(v) < 0.005) return '$0';
    return (v > 0 ? '+' : MINUS) + '$' + amount(v);
  }
  // money without a sign, for "give or take"
  const plain = v => '$' + amount(v);
  const cls = v => (v > 0.004 ? 'up' : v < -0.004 ? 'down' : '');
  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function niceDate(key) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key || '');
    if (!m) return esc(key || '');
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    const opts = { weekday: 'short', day: 'numeric', month: 'short' };
    if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
    return d.toLocaleDateString(undefined, opts);
  }
  function ordinal(n) {
    const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
  // a share (0..1) as plain words: "3 in 10", "1 in 8"
  function inWords(share) {
    if (share == null || !isFinite(share)) return null;
    if (share <= 0.0049) return 'almost none';
    if (share >= 0.095) return Math.round(share * 10) + ' in 10';
    return '1 in ' + Math.round(1 / share);
  }
  const friendName = id => { const f = S().friend(id); return f ? f.name : 'someone'; };
  const habit = key => S().HABITS.find(h => h.key === key);
  // the step whose value is nearest the read
  function nearestStep(h, v) {
    let best = h.steps[0][0], d = Infinity;
    h.steps.forEach(([val]) => {
      const dd = Math.abs(val - v);
      // a tie goes to the habit's default, as Scout does
      if (dd < d - 1e-9 || (Math.abs(dd - d) < 1e-9 && Math.abs(val - h.def) < Math.abs(best - h.def))) { d = dd; best = val; }
    });
    return best;
  }
  function segHtml(h, selected, attrs) {
    return `<div class="seg sc-seg${h.steps.length > 3 ? ' many' : ''}">${h.steps.map(([val, label]) =>
      `<button type="button" data-val="${val}" ${attrs}${selected !== null && selected === val ? ' class="on"' : ''}>${esc(label)}</button>`).join('')}</div>`;
  }
  // every view opens at its top
  function sheet(html, opts) {
    const body = U().openSheet(html, opts);
    body.scrollTop = 0;
    return body;
  }
  // text typed into a field of `body` and not yet saved (a stray tap outside must not lose it)
  const typed = (body, sel) => { const el = body.querySelector(sel); return el ? String(el.value || '').trim() : ''; };

  // scouting reports and counter tests stay for the session, until the read changes
  const reports = {};   // id -> { stats, counter }
  let runToken = 0;

  /* ============================================================
     1. Scout home
     ============================================================ */
  function home() {
    const sc = S();
    const list = sc.friends();
    const L = list.length ? sc.ledger() : null;
    let html = `<div class="eyebrow lead">Your table</div><h2>Scout</h2>`;
    if (!list.length) {
      html += `<p class="sub">Keep a read on each friend you play with: how early they knock, what they hold on to, how hard they defend. Log your real nights and the ledger shows what the table is actually paying you.</p>
        <div id="sc-add-wrap"><button type="button" class="btn gold sc-wide" id="sc-add">Add a friend</button></div>`;
    } else {
      html += `<div class="sc-friends">${list.map(f =>
        `<button type="button" class="sc-friend" data-id="${esc(f.id)}"><b>${esc(f.name)}</b><small>${esc(sc.summary(f))}</small></button>`).join('')}</div>
        <div id="sc-add-wrap"><button type="button" class="btn ghost sc-wide" id="sc-add">Add a friend</button></div>
        <div class="gym-lead sc-actions">
          <button type="button" class="btn gold" id="sc-log">Log a night<small>Two minutes, while you still remember it</small></button>
          <button type="button" class="btn" id="sc-ledger">The ledger<small>${L && L.matches ? esc(money(L.total)) + ' over ' + plural(L.matches, 'match', 'matches') : 'Nothing logged yet'}</small></button>
          <button type="button" class="btn" id="sc-gn"${list.length < 3 ? ' disabled' : ''}>Game night<small>${list.length < 3 ? 'Needs three friends. Add ' + (3 - list.length) + ' more' : 'Practice against their bots'}</small></button>
        </div>`;
    }
    html += `<div class="row-btns"><button type="button" class="btn ghost" id="sc-close">Close</button></div>`;
    // a tap outside leaves, unless a new friend's name is typed and not yet added
    const body = sheet(html, {
      locked: true,
      onDismiss: () => {
        if (typed(body, '#sc-new-name')) { U().toast('Tap Add to keep the name, or clear it'); return; }
        U().closeSheet();
      }
    });
    body.querySelector('#sc-close').addEventListener('click', () => U().closeSheet());
    body.querySelectorAll('.sc-friend').forEach(b => b.addEventListener('click', () => friendView(b.dataset.id)));
    body.querySelector('#sc-add').addEventListener('click', () => addForm(body));
    if (list.length) {
      body.querySelector('#sc-log').addEventListener('click', () => logNight());
      body.querySelector('#sc-ledger').addEventListener('click', () => ledgerView());
      body.querySelector('#sc-gn').addEventListener('click', () => gameNight());
    }
  }

  function addForm(body) {
    const wrap = body.querySelector('#sc-add-wrap');
    wrap.innerHTML = `<div class="sc-inline">
        <input class="sc-input" id="sc-new-name" type="text" maxlength="24" placeholder="Their name" autocomplete="off" enterkeyhint="done">
        <button type="button" class="btn gold" id="sc-new-go">Add</button>
      </div>`;
    const input = wrap.querySelector('#sc-new-name');
    const go = () => {
      const name = input.value.trim();
      if (!name) { U().toast('Type a name first'); input.focus(); return; }
      const f = S().addFriend(name);
      if (f && f.id) friendView(f.id); else home();
    };
    wrap.querySelector('#sc-new-go').addEventListener('click', go);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    input.focus();
  }

  /* ============================================================
     2. A friend
     ============================================================ */
  function friendView(id) {
    const sc = S();
    const f = sc.friend(id);
    if (!f) { home(); return; }
    runToken++;
    const habitsHtml = sc.HABITS.map(h => {
      const read = sc.read(f, h.key), n = sc.seen(f, h.key);
      return `<div class="sc-habit" data-key="${esc(h.key)}">
          <div class="sc-q"><span>${esc(h.q)}</span>${n > 1 ? `<em>seen ${n} times</em>` : ''}</div>
          ${segHtml(h, nearestStep(h, read), '')}
        </div>`;
    }).join('');
    const body = sheet(
      `<div class="eyebrow lead">A friend</div>
       <div class="sc-title" id="sc-title">
         <h2>${esc(f.name)}</h2>
         <button type="button" class="btn-mini sc-mini" id="sc-rename">Rename</button>
       </div>
       <p class="sub" id="sc-sum">${esc(sc.summary(f))}</p>
       <div class="eyebrow sec">How they play</div>
       ${habitsHtml}
       <label class="eyebrow sec sc-label" for="sc-notes">Tells and notes</label>
       <textarea class="sc-input sc-notes" id="sc-notes" rows="3" placeholder="What gives their hand away, what they say, when they slow down">${esc(f.notes || '')}</textarea>
       <div class="eyebrow sec">Scouting report</div>
       <p class="sub sc-honest">These numbers come from a bot built from your read, playing 300 hands against the app's standard bot. The numbers are only as good as the read.</p>
       <div id="sc-report"></div>
       <div id="sc-counter"></div>
       <div class="eyebrow sec">Remove</div>
       <button type="button" class="btn danger sc-wide" id="sc-remove">Remove ${esc(f.name)}</button>
       <div class="row-btns"><button type="button" class="btn ghost" id="sc-back">Back</button></div>`,
      // leaving by a tap outside or a drag keeps what was typed: notes and an unsaved new name
      { onDismiss: () => { commitRename(); saveNotes(); runToken++; } });

    // rename
    body.querySelector('#sc-rename').addEventListener('click', () => {
      const t = body.querySelector('#sc-title');
      t.innerHTML = `<div class="sc-inline">
          <input class="sc-input" id="sc-rn" type="text" maxlength="24" value="${esc(f.name)}" autocomplete="off" enterkeyhint="done">
          <button type="button" class="btn" id="sc-rn-go">Save</button>
        </div>`;
      const input = t.querySelector('#sc-rn');
      const go = () => { commitRename(); saveNotes(); friendView(id); };
      t.querySelector('#sc-rn-go').addEventListener('click', go);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
      input.focus(); input.select();
    });

    // habits
    body.querySelectorAll('.sc-habit').forEach(row => {
      const key = row.dataset.key;
      row.querySelectorAll('button[data-val]').forEach(b => b.addEventListener('click', () => {
        sc.setHabit(id, key, Number(b.dataset.val));
        row.querySelectorAll('button[data-val]').forEach(x => x.classList.toggle('on', x === b));
        const em = row.querySelector('.sc-q em'); if (em) em.remove();   // the read replaces the observations
        const fr = sc.friend(id); if (fr) body.querySelector('#sc-sum').textContent = sc.summary(fr);
        if (reports[id]) {
          delete reports[id];
          runToken++;
          paintReport(body, id); paintCounter(body, id);
        }
      }));
    });

    // a new name typed in the rename field
    function commitRename() {
      const name = typed(body, '#sc-rn');
      if (name && name !== f.name) sc.renameFriend(id, name);
    }

    // notes: saved as they are typed, so no way of leaving can lose them
    const notes = body.querySelector('#sc-notes');
    let savedNotes = f.notes || '';
    function saveNotes() {
      if (notes.value !== savedNotes) { sc.setNotes(id, notes.value); savedNotes = notes.value; }
    }
    notes.addEventListener('input', saveNotes);
    notes.addEventListener('change', saveNotes);

    paintReport(body, id);
    paintCounter(body, id);

    // a friend's read and notes cannot be had back: one question first, in the app's own sheet
    body.querySelector('#sc-remove').addEventListener('click', () => {
      saveNotes(); commitRename();
      const name = (sc.friend(id) || f).name;
      U().askFirst({
        title: 'Remove ' + name + '?', line: 'Their read and notes are erased.', go: 'Remove',
        onGo: () => { sc.removeFriend(id); delete reports[id]; runToken++; U().toast(name + ' removed'); home(); },
        onKeep: () => friendView(id)
      });
    });
    body.querySelector('#sc-back').addEventListener('click', () => { saveNotes(); runToken++; home(); });
  }

  function paintReport(body, id) {
    const box = body.querySelector('#sc-report');
    if (!box) return;
    const r = reports[id];
    if (!r || !r.stats) {
      box.innerHTML = `<button type="button" class="btn sc-wide" id="sc-build">Build the report</button><div class="sc-progress" id="sc-rp"></div>`;
      box.querySelector('#sc-build').addEventListener('click', () => buildReport(body, id));
      return;
    }
    const f = S().friend(id);
    const lines = reportLines(r.stats);
    let plan = [];
    try { plan = S().plan(f, r.stats) || []; } catch (e) { plan = []; }
    box.innerHTML = `<div class="sc-facts">${lines.map(l => `<div class="sc-fact">${l}</div>`).join('')}</div>
      ${plan.length ? `<div class="sc-plan">${plan.map(p => `<div class="pb-item"><div class="pb-t">${esc(p.title)}</div><div class="pb-b">${esc(p.text)}</div></div>`).join('')}</div>` : ''}
      <button type="button" class="btn-mini sc-mini" id="sc-rebuild">Build it again</button>`;
    box.querySelector('#sc-rebuild').addEventListener('click', () => { delete reports[id].stats; reports[id].counter = null; buildReport(body, id); });
  }

  function reportLines(st) {
    const out = [];
    const n = st.hands || 0;
    const per100 = s => Math.round((s || 0) * 100);
    if (st.endsByKnock != null) {
      let l = `Ends the hand by knocking in <b>${per100(st.endsByKnock)} of 100</b> hands`;
      if (st.knockTurn != null && isFinite(st.knockTurn)) l += `, on its ${ordinal(Math.max(1, Math.round(st.knockTurn)))} turn`;
      if (st.knockCount != null && isFinite(st.knockCount)) l += `, holding ${Math.round(st.knockCount)}`;
      out.push(l);
    }
    if (st.endsByGin != null) out.push(`Goes gin in <b>${per100(st.endsByGin)} of 100</b> hands`);
    if (st.caughtWith != null && isFinite(st.caughtWith)) out.push(`Caught with <b>${Math.round(st.caughtWith)}</b> when you knock first`);
    const uc = inWords(st.undercut);
    if (uc) out.push(`<b>${uc[0].toUpperCase() + uc.slice(1)}</b> of its knocks are undercut`);
    const fed = inWords(st.fed);
    if (fed) out.push(`You pick up <b>${fed}</b> of its throws`);
    const lt = inWords(st.looseTakes);
    if (st.looseTakes != null && st.looseTakes < 0.05) out.push('Takes from the pile <b>only to make a meld</b>');
    else if (lt) out.push(`<b>${lt[0].toUpperCase() + lt.slice(1)}</b> of its pickups from the pile make no meld yet`);
    if (st.winShare != null) out.push(`Wins <b>${per100(st.winShare)} of 100</b> hands against the standard bot` + (n ? ` (${n} played)` : ''));
    return out;
  }

  function buildReport(body, id) {
    const f = S().friend(id);
    const box = body.querySelector('#sc-report');
    if (!f || !box) return;
    const token = ++runToken;
    box.innerHTML = `<div class="sc-progress on" id="sc-rp">Dealing hands…</div>`;
    const prog = box.querySelector('#sc-rp');
    const onProgress = p => {
      if (token !== runToken || !prog.isConnected) return;
      prog.textContent = progressText(p, 300);
    };
    let promise;
    try { promise = Promise.resolve(S().measureAsync(f, 300, onProgress)); } catch (e) { promise = Promise.reject(e); }
    promise.then(stats => {
      if (token !== runToken || !box.isConnected) return;
      reports[id] = { stats, counter: null };
      paintReport(body, id); paintCounter(body, id);
    }).catch(err => {
      if (token !== runToken || !box.isConnected) return;
      console.error(err);
      box.innerHTML = `<p class="sub">The report could not be built this time.</p><button type="button" class="btn sc-wide" id="sc-build">Try again</button>`;
      box.querySelector('#sc-build').addEventListener('click', () => buildReport(body, id));
    });
  }

  // onProgress may report a fraction, a count, or { done, total }
  function progressText(p, total) {
    let done = null;
    if (typeof p === 'number') done = p <= 1 ? Math.round(p * total) : Math.round(p);
    else if (p && typeof p === 'object') {
      if (p.total) total = p.total;
      if (p.done != null) done = p.done; else if (p.hands != null) done = p.hands;
    }
    return done == null ? 'Dealing hands…' : `Dealt ${Math.min(done, total)} of ${total} hands…`;
  }

  function paintCounter(body, id) {
    const box = body.querySelector('#sc-counter');
    if (!box) return;
    const r = reports[id];
    if (!r || !r.stats) { box.innerHTML = ''; return; }
    if (!r.counter) {
      box.innerHTML = `<p class="sub sc-honest">Plays 400 hands against this bot with your knock timing changed, and checks whether any change beats your normal game by more than luck would.</p>
        <button type="button" class="btn sc-wide" id="sc-ct">Test a counter-play</button>`;
      box.querySelector('#sc-ct').addEventListener('click', () => runCounter(body, id));
      return;
    }
    const c = r.counter;
    const opts = c.options || [];
    const bx = v => (v == null || !isFinite(v)) ? '' : (v < 0 ? MINUS : v > 0 ? '+' : '') + Math.abs(v).toFixed(2);
    const best = typeof c.best === 'string' ? opts.find(o => o.key === c.best) : c.best;
    const verdict = best
      ? `Against this bot, <b>${esc(best.label)}</b> gains ${bx(best.vsBook)} boxes a hand over your normal game, give or take ${Math.abs(best.margin || 0).toFixed(2)}.`
      : `No change in knock timing beat your normal game by more than the margin. Play your normal game against this bot.`;
    box.innerHTML = `<div class="eyebrow sec">Counter-play, ${c.hands || 400} hands</div>
      <div class="sc-table">${opts.map(o => `<div class="sc-trow${best && o.key === best.key ? ' best' : ''}">
          <span class="sc-tl">${esc(o.label)}</span>
          <span class="sc-tv">${bx(o.boxes)}<small>your boxes a hand</small></span>
        </div>`).join('')}</div>
      <p class="sc-verdict">${verdict}</p>
      <button type="button" class="btn-mini sc-mini" id="sc-ct-again">Test again</button>`;
    box.querySelector('#sc-ct-again').addEventListener('click', () => runCounter(body, id));
  }

  function runCounter(body, id) {
    const f = S().friend(id);
    const box = body.querySelector('#sc-counter');
    if (!f || !box) return;
    const token = ++runToken;
    box.innerHTML = `<div class="sc-progress on">Dealing hands…</div>`;
    const prog = box.querySelector('.sc-progress');
    const onProgress = p => { if (token === runToken && prog.isConnected) prog.textContent = progressText(p, 400); };
    let promise;
    try { promise = Promise.resolve(S().counterTestAsync(f, 400, onProgress)); } catch (e) { promise = Promise.reject(e); }
    promise.then(res => {
      if (token !== runToken || !box.isConnected) return;
      if (reports[id]) reports[id].counter = res;
      paintCounter(body, id);
    }).catch(err => {
      if (token !== runToken || !box.isConnected) return;
      console.error(err);
      box.innerHTML = `<p class="sub">The test could not be run this time.</p><button type="button" class="btn sc-wide" id="sc-ct">Try again</button>`;
      box.querySelector('#sc-ct').addEventListener('click', () => runCounter(body, id));
    });
  }

  /* ============================================================
     3. Log a night
     ============================================================ */
  const OBS_KEYS = ['knock', 'spec', 'defense'];
  function logNight() {
    const sc = S();
    const all = sc.friends();
    const st = {
      date: todayKey(),
      played: all.length === 3 ? all.map(f => f.id) : [],
      matches: [newMatch()],
      obs: {},
      notes: '',
    };
    function newMatch() { return { partner: null, opps: [], won: null, amount: '' }; }

    const body = sheet(
      `<div class="eyebrow lead">Log a night</div>
       <h2>Two minutes</h2>
       <p class="sub">What happened, while you still remember it.</p>
       <label class="eyebrow sec sc-label" for="sc-date">Date</label>
       <input class="sc-input sc-date" id="sc-date" type="date" value="${st.date}" max="${todayKey()}">
       <div id="sc-night"></div>
       <label class="eyebrow sec sc-label" for="sc-nnotes">Notes</label>
       <textarea class="sc-input sc-notes" id="sc-nnotes" rows="2" placeholder="Anything worth remembering"></textarea>
       <div class="row-btns">
         <button type="button" class="btn ghost" id="sc-back">Back</button>
         <button type="button" class="btn gold" id="sc-save">Save the night</button>
       </div>`,
      // a stray tap outside (or a drag) does not throw away a night with anything in it: Back does
      { locked: true, onDismiss: () => { if (started()) U().toast('Not saved yet. Save the night, or tap Back to drop it'); else home(); } });
    const started = () => !!(st.notes.trim() || Object.keys(st.obs).length ||
      st.matches.some(m => m.partner || m.opps.length || m.won !== null || String(m.amount).trim()));
    const wrap = body.querySelector('#sc-night');
    body.querySelector('#sc-date').addEventListener('change', e => { st.date = e.target.value; });
    body.querySelector('#sc-nnotes').addEventListener('input', e => { st.notes = e.target.value; });
    body.querySelector('#sc-back').addEventListener('click', () => home());
    body.querySelector('#sc-save').addEventListener('click', save);

    // keep each match consistent with who played
    function tidy() {
      const p = st.played;
      st.matches.forEach(m => {
        if (m.partner && !p.includes(m.partner)) m.partner = null;
        m.opps = m.opps.filter(o => p.includes(o) && o !== m.partner);
        if (p.length === 3 && m.partner) m.opps = p.filter(x => x !== m.partner);
      });
      Object.keys(st.obs).forEach(k => { if (!p.includes(k)) delete st.obs[k]; });
    }

    function chip(id, on, attrs) {
      return `<button type="button" class="sc-chip${on ? ' on' : ''}" ${attrs}>${esc(friendName(id))}</button>`;
    }

    function render() {
      tidy();
      const p = st.played;
      let html = `<div class="eyebrow sec">Who played</div>
        <div class="sc-chips">${all.map(f => chip(f.id, p.includes(f.id), `data-play="${esc(f.id)}"`)).join('')}</div>
        <p class="sc-note">You are always in.${p.length < 3 ? ' Pick at least three.' : ''}</p>`;
      html += `<div class="eyebrow sec">Matches</div>`;
      html += st.matches.map((m, i) => {
        const oppPool = p.filter(x => x !== m.partner);
        const autoOpps = p.length === 3;
        return `<div class="sc-match" data-i="${i}">
          <div class="sc-mhead"><span>Match ${i + 1}</span>${st.matches.length > 1 ? `<button type="button" class="btn-mini sc-mini sc-mrm" data-rm="${i}">Remove</button>` : ''}</div>
          <div class="eyebrow sec">Partner</div>
          ${p.length ? `<div class="sc-chips">${p.map(id => chip(id, m.partner === id, `data-partner="${esc(id)}"`)).join('')}</div>` : `<p class="sc-note">Pick who played first.</p>`}
          <div class="eyebrow sec">Against</div>
          ${!m.partner ? `<p class="sc-note">Pick the partner first.</p>`
            : autoOpps ? `<p class="sc-opps">${m.opps.map(o => esc(friendName(o))).join(' and ')}</p>`
            : `<div class="sc-chips">${oppPool.map(id => chip(id, m.opps.includes(id), `data-opp="${esc(id)}"`)).join('')}</div>`}
          <div class="eyebrow sec">Your result</div>
          <div class="sc-result">
            <div class="seg sc-seg sc-wl">
              <button type="button" data-won="1"${m.won === true ? ' class="on"' : ''}>Won</button>
              <button type="button" data-won="0"${m.won === false ? ' class="on"' : ''}>Lost</button>
            </div>
            <div class="sc-money"><span>$</span><input class="sc-input" type="text" inputmode="decimal" placeholder="0" value="${esc(m.amount)}" data-amt="${i}" aria-label="Amount for match ${i + 1}"></div>
          </div>
        </div>`;
      }).join('');
      html += `<button type="button" class="btn ghost sc-wide" id="sc-addm">Add another match</button>`;
      if (p.length) {
        html += `<div class="eyebrow sec">What you saw tonight</div>
          <p class="sc-note">Optional. Tap only what you actually saw; tap again to clear.</p>`;
        html += p.map(id => `<div class="sc-obs" data-f="${esc(id)}">
            <div class="sc-oname">${esc(friendName(id))}</div>
            ${OBS_KEYS.map(k => {
              const h = habit(k);
              if (!h) return '';
              const sel = st.obs[id] && st.obs[id][k] != null ? st.obs[id][k] : null;
              return `<div class="sc-habit" data-key="${k}"><div class="sc-q"><span>${esc(h.q)}</span></div>${segHtml(h, sel, '')}</div>`;
            }).join('')}
          </div>`).join('');
      }
      wrap.innerHTML = html;

      wrap.querySelectorAll('[data-play]').forEach(b => b.addEventListener('click', () => {
        const id = b.dataset.play;
        st.played = p.includes(id) ? p.filter(x => x !== id) : all.map(f => f.id).filter(x => x === id || p.includes(x));
        render();
      }));
      wrap.querySelectorAll('.sc-match').forEach(row => {
        const m = st.matches[+row.dataset.i];
        row.querySelectorAll('[data-partner]').forEach(b => b.addEventListener('click', () => {
          m.partner = m.partner === b.dataset.partner ? null : b.dataset.partner;
          if (st.played.length !== 3) m.opps = m.opps.filter(o => o !== m.partner);
          render();
        }));
        row.querySelectorAll('[data-opp]').forEach(b => b.addEventListener('click', () => {
          const id = b.dataset.opp;
          if (m.opps.includes(id)) m.opps = m.opps.filter(o => o !== id);
          else if (m.opps.length < 2) m.opps.push(id);
          else m.opps = [m.opps[1], id];
          render();
        }));
        row.querySelectorAll('[data-won]').forEach(b => b.addEventListener('click', () => {
          m.won = b.dataset.won === '1';
          row.querySelectorAll('[data-won]').forEach(x => x.classList.toggle('on', x === b));
        }));
        row.querySelector('[data-amt]').addEventListener('input', e => { m.amount = e.target.value; });
        const rm = row.querySelector('[data-rm]');
        if (rm) rm.addEventListener('click', () => { st.matches.splice(+rm.dataset.rm, 1); render(); });
      });
      wrap.querySelector('#sc-addm').addEventListener('click', () => {
        const prev = st.matches[st.matches.length - 1];
        const m = newMatch();
        // partners rotate at the table: suggest the next pairing when Scout can
        if (prev && prev.partner && st.played.length === 3 && typeof S().nextTeams === 'function') {
          try {
            const nt = S().nextTeams({ partner: prev.partner, opps: prev.opps }, st.played.slice());
            if (nt && st.played.includes(nt.partner)) { m.partner = nt.partner; m.opps = (nt.opps || []).slice(); }
          } catch (e) { /* leave it blank */ }
        }
        st.matches.push(m); render();
      });
      wrap.querySelectorAll('.sc-obs').forEach(blk => {
        const fid = blk.dataset.f;
        blk.querySelectorAll('.sc-habit').forEach(row => {
          const key = row.dataset.key;
          row.querySelectorAll('button[data-val]').forEach(b => b.addEventListener('click', () => {
            const v = Number(b.dataset.val);
            const o = st.obs[fid] || (st.obs[fid] = {});
            if (o[key] === v) delete o[key]; else o[key] = v;
            row.querySelectorAll('button[data-val]').forEach(x => x.classList.toggle('on', o[key] === Number(x.dataset.val)));
          }));
        });
      });
    }

    function parseAmount(s) {
      const v = parseFloat(String(s || '').replace(/[$,\s]/g, '').replace(/^[-−+]/, ''));
      return isFinite(v) ? Math.round(v * 100) / 100 : NaN;
    }

    function save() {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(st.date || '')) { U().toast('Pick the date'); return; }
      if (!st.matches.length) { U().toast('Add at least one match'); return; }
      const out = [];
      for (let i = 0; i < st.matches.length; i++) {
        const m = st.matches[i], n = st.matches.length > 1 ? ' in match ' + (i + 1) : '';
        if (!m.partner) { U().toast('Pick the partner' + n); return; }
        if (m.opps.length !== 2 || m.opps[0] === m.opps[1] || m.opps.includes(m.partner)) { U().toast('Pick two opponents' + n); return; }
        if (m.won === null) { U().toast('Won or lost' + n + '?'); return; }
        const a = parseAmount(m.amount);
        if (!(a > 0)) { U().toast('Type the amount' + n); return; }
        out.push({ partner: m.partner, opps: m.opps.slice(), dollars: m.won ? a : -a });
      }
      const notes = (body.querySelector('#sc-nnotes').value || '').trim();
      S().addNight({ date: st.date, matches: out, notes });
      Object.keys(st.obs).forEach(fid => Object.keys(st.obs[fid]).forEach(k => {
        S().observe(fid, k, st.obs[fid][k]);
        delete reports[fid];
      }));
      const total = out.reduce((s, m) => s + m.dollars, 0);
      U().toast('Night saved, ' + money(total));
      ledgerView();
    }

    render();
  }

  /* ============================================================
     4. The ledger
     ============================================================ */
  function sparkline(series) {
    const pts = (series || []).map(Number).filter(isFinite);
    if (pts.length < 1) return '';
    if (pts[0] !== 0) pts.unshift(0);
    if (pts.length < 2) return '';
    const W = 320, H = 76, pad = 6;
    let lo = Math.min(0, ...pts), hi = Math.max(0, ...pts);
    if (hi - lo < 1) { hi += 1; lo -= 1; }
    const x = i => (i / (pts.length - 1)) * W;
    const y = v => pad + (hi - v) / (hi - lo) * (H - 2 * pad);
    const d = pts.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    const last = pts[pts.length - 1];
    return `<div class="sc-spark">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Running total, ending at ${esc(money(last))}">
        <line x1="0" x2="${W}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" class="zero"/>
        <path d="${d}" class="line"/>
      </svg>
      <div class="sc-spark-k"><span>Start</span><span>Dashed line is even</span><span>Match ${pts.length - 1}</span></div>
    </div>`;
  }

  function ledgerView() {
    const sc = S();
    const L = sc.ledger();
    const P = sc.practiceSummary ? sc.practiceSummary() : null;
    const nights = (L.nights || []).slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    let read;
    if (!L.matches) read = 'No real nights logged yet. Log one and this page starts keeping score.';
    else if (L.matches < 4) read = 'Too early to read anything. It takes more than a handful of matches before the money says much.';
    else if (L.margin == null) read = `${money(L.perMatch)} a match so far.`;
    else {
      const real = Math.abs(L.perMatch) > L.margin;
      // a sentence, not a statement: whole dollars once the numbers are big enough
      const r = v => (Math.abs(v) >= 5 ? Math.round(v) : v);
      read = `${money(r(L.perMatch))} a match, give or take ${plain(r(L.margin))}. ` + (real
        ? (L.perMatch > 0 ? 'That is more than the swing, so it is a real edge, not luck.' : 'That is more than the swing, so the losses are real, not bad luck.')
        : 'That is not yet distinguishable from breaking even.');
    }
    const rows = list => list.map(r => `<div class="sc-lrow">
        <span class="sc-ln">${esc(r.name)}<small>${plural(r.matches, 'match', 'matches')}</small></span>
        <span class="sc-lv ${cls(r.perMatch)}">${esc(money(r.perMatch))}<small>a match</small></span>
      </div>`).join('');
    const body = sheet(
      `<div class="eyebrow lead">The ledger</div>
       <div class="sc-head">
         <div class="sc-total ${cls(L.total)}">${esc(money(L.total))}</div>
         <div class="sc-head-sub">${plural(L.matches || 0, 'match', 'matches')} over ${plural(nights.length, 'night')}</div>
       </div>
       <p class="sub sc-read">${esc(read)}</p>
       ${L.matches ? sparkline(L.series) : `<button type="button" class="btn gold sc-wide" id="sc-log">Log a night</button>`}
       ${(L.byPartner || []).length ? `<div class="eyebrow sec">By partner</div><div class="sc-list">${rows(L.byPartner)}</div>` : ''}
       ${(L.byOpponent || []).length ? `<div class="eyebrow sec">Against</div><div class="sc-list">${rows(L.byOpponent)}</div>` : ''}
       ${nights.length ? `<div class="eyebrow sec">The nights</div><div class="sc-list">${nights.map(n => `<div class="sc-lrow sc-night">
           <span class="sc-ln">${niceDate(n.date)}<small>${plural(n.matches || 0, 'match', 'matches')}${n.notes ? ' · ' + esc(n.notes) : ''}</small></span>
           <span class="sc-lv ${cls(n.total)}">${esc(money(n.total))}</span>
           <button type="button" class="btn-mini sc-mini sc-nrm" data-id="${esc(n.id)}">Remove</button>
         </div>`).join('')}</div>` : ''}
       <div class="eyebrow sec">Practice, not money</div>
       <p class="sub sc-practice">${P && P.matches
         ? `Against their bots: ${esc(money(P.total))} over ${plural(P.matches, 'match', 'matches')}${P.wins != null ? `, ${P.wins} won` : ''}. Practice results never count in the ledger.`
         : 'No practice matches against their bots yet. Practice is kept separate from the real money.'}</p>
       <div class="row-btns"><button type="button" class="btn ghost" id="sc-back">Back</button></div>`);
    body.querySelector('#sc-back').addEventListener('click', () => home());
    const lg = body.querySelector('#sc-log');
    if (lg) lg.addEventListener('click', () => logNight());
    // a night is real money in the ledger: one question first, saying what goes
    body.querySelectorAll('.sc-nrm').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.id, n = nights.find(x => String(x.id) === id);
      if (!n) return;
      const keep = body.scrollTop;
      const back = () => { ledgerView(); const nb = document.getElementById('sheet-body'); if (nb) nb.scrollTop = keep; };
      U().askFirst({
        title: 'Remove the night of ' + (/^\d{4}-\d\d-\d\d$/.test(n.date || '') ? niceDate(n.date) : String(n.date || '')) + '?',   // askFirst escapes
        line: `${plural(n.matches || 0, 'match', 'matches')}, ${money(n.total || 0)}, erased from the ledger.`,
        go: 'Remove',
        onGo: () => { sc.removeNight(id); U().toast('Night removed'); back(); },
        onKeep: back
      });
    }));
  }

  /* ============================================================
     5. Game night setup
     ============================================================ */
  function gameNight(was) {
    const sc = S();
    const all = sc.friends();
    // `was`: the picks made before a question about the match in progress was answered "Keep it"
    let picked = was ? was.picked.filter(id => all.some(f => f.id === id)) : all.length === 3 ? all.map(f => f.id) : [];
    let partner = was ? was.partner : null;
    const body = sheet(
      `<div class="eyebrow lead">Game night</div>
       <h2>Practice night</h2>
       <p class="sub">Three of your friends' bots, played the way you read them. Practice only, kept apart from the real money in the ledger.</p>
       <div id="sc-gn"></div>
       <div class="row-btns">
         <button type="button" class="btn ghost" id="sc-back">Back</button>
         <button type="button" class="btn gold" id="sc-deal">Deal</button>
       </div>`);
    const wrap = body.querySelector('#sc-gn');
    function render() {
      if (partner && !picked.includes(partner)) partner = null;
      wrap.innerHTML = `<div class="eyebrow sec">Who is at the table</div>
        <div class="sc-chips">${all.map(f => `<button type="button" class="sc-chip${picked.includes(f.id) ? ' on' : ''}" data-pick="${esc(f.id)}">${esc(f.name)}</button>`).join('')}</div>
        <p class="sc-note">${picked.length === 3 ? 'Three picked.' : 'Pick three. ' + picked.length + ' of 3 so far.'}</p>
        <div class="eyebrow sec">Partner first</div>
        ${picked.length === 3
          ? `<div class="sc-chips">${picked.map(id => `<button type="button" class="sc-chip${partner === id ? ' on' : ''}" data-partner="${esc(id)}">${esc(friendName(id))}</button>`).join('')}</div>`
          : `<p class="sc-note">Pick the three first.</p>`}
        <p class="sub sc-rot">Partners rotate after each match, as at your table, so you play with each of them in turn.</p>`;
      wrap.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
        const id = b.dataset.pick;
        if (picked.includes(id)) picked = picked.filter(x => x !== id);
        else if (picked.length < 3) picked = picked.concat(id);
        else { U().toast('Three at most. Tap one to take them out'); return; }
        render();
      }));
      wrap.querySelectorAll('[data-partner]').forEach(b => b.addEventListener('click', () => { partner = b.dataset.partner; render(); }));
    }
    render();
    body.querySelector('#sc-back').addEventListener('click', () => home());
    body.querySelector('#sc-deal').addEventListener('click', () => {
      if (picked.length !== 3) { U().toast('Pick three friends'); return; }
      if (!partner) { U().toast('Pick who partners you first'); return; }
      if (!window.GameNight || typeof window.GameNight.start !== 'function') { U().toast('Game night is not available yet'); return; }
      const opps = picked.filter(x => x !== partner);
      const rotation = [partner].concat(opps);
      const deal = () => window.GameNight.start(partner, opps, rotation);
      // a match in progress would be thrown away: one question first
      const line = typeof window.GameNight.atStake === 'function' ? window.GameNight.atStake() : null;
      if (!line) { U().closeSheet(); deal(); return; }
      const was = { picked: picked.slice(), partner };
      U().askFirst({ title: 'Drop the match in progress?', line, go: 'Deal', onGo: deal, onKeep: () => gameNight(was) });
    });
  }

  /* ---------------- entry ---------------- */
  function open() {
    if (!window.Scout || !window.UI) { if (window.UI) U().toast('Scout is not available'); return; }
    home();
  }

  window.ScoutUI = { open };

  document.addEventListener('DOMContentLoaded', () => {
    const b = document.getElementById('btn-scout');
    if (b) b.addEventListener('click', open);
  });
})();

</script>
</body>

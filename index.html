        ['Speculation', 'Taking a pile card that makes no meld but builds a better combination. The book’s limits: early (under ten discards), only when it lets you throw a higher safer card so your count does not rise, only for a combination whose hit lets you knock or gin at once, pairs before suited neighbours, and one combination a deal at most.', { test: 'speculate', view: true }],
        ['Fishing', 'Throwing a card so its rank looks safe and they throw you one. Low cards only (seven and under), early only, only for a card that gives you gin or the knock, and only with at least three ways behind it. If they take the bait instead you can be 40 points worse off on one play. Not a habit.', { view: true }],
        ['Angling', 'Fishing for the next rank: from two queens and a jack of a third suit, throw the jack to pull a queen. Rare, and only a worry in the first few discards.', { view: true }],
        ['Against fishing', 'Do not treat every throw as bait or you will have nothing safe left. If nearby ranks have shown, the throw is probably honest. One counter is to take a card you think is bait and throw it back later.'],
        ['Buying time', 'They throw a jack you think comes from a pair. Take it and throw a higher card that is safe. They hold the other jack a little longer, and you knock later with the jack as your face-down card. High cards only (eight and up), early only.', { view: true }],
        ['The daring version', 'Holding a pair of jacks, pass their first jack and take the second to knock. The author warns against it: they can knock or gin first and your jacks are dead weight.', { view: true }],
        ['Getting them to knock', 'Stuck with two of their layoff cards, throw aces and twos as if going flat out for gin. A worried opponent knocks, and you lay off.', { view: true }],
        ['Getting them to throw high', 'Take one or two low cards whether you need them or not. They read a low hand and start unloading pictures into your high combinations.', { view: true }],
        ['Cards you do not need', 'With a poor hand, take two pile cards quickly. They assume two melds, turn defensive, and you get time.', { view: true }],
        ['Hide how you used it', 'After taking the queen of spades, throwing another queen shows a run and throwing the king, jack or ten of spades shows a set. Hide it when you safely can. A safe throw comes first.'],
        ['Vary yourself', 'Do not always knock at once, do not always or never speculate. Do not sort by rank from one end, or hold melds in separate groups. Re-arrange often.']
      ]
    },
    {
      title: 'Two against two',
      tag: 'what the book says about partners',
      items: [
        ['The bulge', 'The team’s lead from the hands already finished, while another is still playing. Your partner won 25: the bulge is 25.'],
        ['Hand key and game key', 'The hand key is the most points you can hold and still come out even if they gin. The game key is the most you can hold and still save the game if they gin. The app’s hold count keeps you ahead rather than even, so it is one under the hand key whenever coming out even is possible.'],
        ['Partner over the line: knock fast', 'If your partner’s result already puts the team over the game line, do not play for gin. The other side needs a big hand to stop it and needs time to get one. Knock quickly.'],
        ['Partner lost and they are blank', 'If your partner lost and the other side has no score yet, a small knock no longer keeps them off the sheet. This is the one place the book says to go for the big hand.'],
        ['No help from partners', 'A partner may correct arithmetic but may not point out a missed layoff or a better arrangement.'],
        ['One box or several', 'In the book the two results are combined and the winning team writes one box. At this table boxes are netted by kind (knock 1, gin 2, undercut 2, gin off 3), and the net boxes go only to the team that wins the points, and only when they are in its favour. You win by 20 with a knock and your partner loses by 15 to a gin: your team writes 5 and nobody gets a box. So the book’s advice about steady small wins needs care here: a gin is worth two knocks in boxes.', { note: 'House rule confirmed by the owner. The book’s team game is simpler.' }]
      ]
    },
    {
      title: 'House rules at this table',
      tag: 'oklahoma · hollywood',
      items: [
        ['The knock deck', 'A separate deck sets each hand’s knock card: pictures count 10, an ace means gin only. In the book the 21st card of the same deck does this. A knock card of 10 comes up about three hands in ten, each other value about one in thirteen.'],
        ['Spades double', 'A spade knock card doubles the points and the boxes of the hand. In the book it doubles points only.'],
        ['The scoring', 'A knock scores the difference and one box. Gin is 25 plus their count and two boxes. An undercut is 25 plus the difference and two boxes. A gin off, laying off to nothing after they knock, is 30 and three boxes, whatever they knocked with. Holding ten melded cards when they knock is not a gin off: you would have gone gin, so it is just an undercut.'],
        ['Who deals', 'The loser deals: the winner is dealt to and plays first. In 2v2 the team that lost the deal deals at both tables. A dead hand, or a deal whose points cancel, keeps the same dealers. The first dealer of a match is drawn at random.'],
        ['Hollywood entries', 'Your first win goes in Game I, your second in I and II, the third and later in all three. A finished game takes no more scores.'],
        ['Paid by boxes and games', 'The book calls this simplified scoring: the point difference is ignored and you are paid for each extra box and for the game, doubled for a shut-out. Its examples make the game worth two and a half or five boxes. At $2 and $20 a game is worth ten.'],
        ['The first box', 'A shut-out doubles the game, so getting on the sheet early matters more than the size of the win. The book’s example of steady play: a side that lost the game 148 to 155 still finished 143 points ahead on thirteen boxes to three.'],
        ['Rules the book plays differently', 'Two are worth settling. At the end of the stock the book lets the other player take the last discard to knock or gin before the hand is dead; the app ends the hand at once. And a knock made over the knock card may, in the book, be accepted by the other player for an undercut if they hold the knock card or less; the app only exposes the hand. The full list is in docs/book-notes-full.md.']
      ]
    },
    {
      title: 'Numbers worth knowing',
      tag: 'from the book’s statistics',
      items: [
        ['The dealt hand', 'The average dealt hand counts 57. Three in five have no meld. Three in four hold one or more pairs and no three of a kind, and two pairs is the most common shape. Only about one in fifty has no two cards of a rank. Gin at the deal is about 1 in 116,000.'],
        ['The average result', 'In the author’s study of about a thousand hands, the average hand was won or lost by 26 points.'],
        ['Where points leak', 'The author’s estimate, per 100 hands: unsafe throws 300 points, careless throws 200, and 100 each for waiting too long to knock, badly timed knocks and gin tries, not knowing the score, and speculating at the wrong time. His numbers, with no data given.', { view: true }],
        ['Luck and skill', 'By his count 15 hands in 100 are pure luck, 60 are luck that skill makes bigger or smaller, and 25 are pure skill. At eight hours a week you play about 6,000 hands a year, which is plenty for luck to even out.', { view: true }],
        ['Streaks', 'Between equal players twenty hands contain a run of three wins or losses 98 times in 100. A small edge shows up as more streaks, which is why the better player looks lucky. Judge a session by ranges, never by an exact count.']
      ]
    }
  ];

  function measuredLine(key) {
    const m = MEASURED[key];
    return m ? `<div class="pb-m">Measured: ${m}</div>` : '';
  }

  function render() {
    let html = '<h2>Playbook</h2><div class="sub">From a full read of Pramod Shankar’s <i>How to Win at Gin Rummy</i>, in our own words. ' +
      `Advice that could be tested was: the same 2v2 deals were played twice (${MEASURED_OVER}), once by the Expert bot as it plays and once with that one piece of advice forced on one team, ` +
      'and the difference was priced at $2 a box and $20 a game. A minus means the bot’s own judgement earned more than the rule followed to the letter. The book’s advice was tested against the bot as it knocked before its knock rule was refitted.</div>';
    for (const s of SECTIONS) {
      html += `<details class="pb-section"><summary><span>${s.title}</span><em>${s.tag}</em></summary><div class="pb-items">`;
      for (const [t, body, extra] of s.items) {
        const x = extra || {};
        html += `<div class="pb-item"><div class="pb-t">${t}</div><div class="pb-b">${body}</div>` +
          (x.test ? measuredLine(x.test) : '') + (x.test2 ? measuredLine(x.test2) : '') +
          (x.view ? '<div class="pb-v">The book’s view of heads-up gin scored in points. It may not carry over to 2v2 for boxes and games.</div>' : '') +
          (x.note ? `<div class="pb-v">${x.note}</div>` : '') +
          '</div>';
      }
      html += '</div></details>';
    }
    html += '<div class="row-btns"><button class="btn" onclick="UI.closeSheet()">Back to the table</button></div>';
    return html;
  }

  window.Playbook = { SECTIONS, render };
})();

</script>
<script>
/* ============================================================
   gym.js — rapid-fire position training
   Positions are generated by playing two standard AIs to a
   random mid-hand state, then posing the human-seat question.
   ============================================================ */
(function () {
  'use strict';
  const C = window.Cards, E = window.Engine, A = window.AI;

  /* ---------------- question builders ---------------- */
  /* a card just taken from the pile may not go straight back */
  const barred = hand => (hand.drawnFrom === 'discard' && hand.drawnCard !== null && hand.drawnCard !== undefined ? [hand.drawnCard] : []);

  function gradeGap(gap) {
    return gap <= 0.001 ? 'optimal' : gap <= 1.6 ? 'good' : gap <= 4 ? 'acceptable' : 'blunder';
  }

  function discardQuestion(hand, intro) {
    const scored = A.scoreDiscards(hand, 0, null);
    return {
      kind: 'discard', wantClear: true,
      title: 'Best throw',
      prompt: (intro || '') + `${hand.ginOnly ? 'Knock card: gin only' : 'Knock with ' + hand.knockLimit + ' or less'}. ${hand.discard.length} card${hand.discard.length === 1 ? '' : 's'} in the pile, your turn ${hand.turns[0]}. Tap the best throw.`,
      cards: hand.hands[0].slice(),
      pickCard: true, barred: barred(hand),
      // for the playout coach: the position, and the play an answer stands for
      hand, play: card => ({ type: 'discard', card }),
      resolve(card) {
        const mine = scored.find(s => s.card === card);
        const best = scored[0];
        const gap = best.score - (mine ? mine.score : -99);
        const u = C.usefulness(card, window.Coach.couldHold(hand, 0));
        return {
          grade: gradeGap(gap),
          explanation: best.card === card
            ? `Right. The ${C.name(card)} leaves a count of ${best.dw} with ${best.hits} draws that improve you.`
            : `The ${C.name(best.card)} was best (a count of ${best.dw}, ${best.hits} draws that improve you). Your ${C.name(card)} has ${u} way${u === 1 ? '' : 's'} for them to use it and gives up ${(Math.round(gap * 10) / 10)} points of value.`
        };
      }
    };
  }

  function knockQuestion(hand) {
    const scored = A.scoreDiscards(hand, 0, null);
    const k = scored.filter(s => s.canKnock)[0];
    if (!k) return null;
    const rest = hand.hands[0].filter(c => c !== k.card);
    const gr = C.ginRating(rest, E.unseenFor(hand, 0));
    const margin = A.knockMargin(k.dw, hand.turns[0], gr);
    return {
      kind: 'knock', wantClear: true,
      title: 'Knock or play on',
      prompt: `Throwing the ${C.name(k.card)} leaves you ${k.dw}; the knock card allows ${hand.knockLimit}. ${hand.discard.length} card${hand.discard.length === 1 ? '' : 's'} in the pile, ${gr} card${gr === 1 ? ' gins' : 's gin'} you.`,
      cards: hand.hands[0].slice(),
      options: [{ id: 'knock', label: `Knock at ${k.dw}` }, { id: 'play', label: 'Play on' }],
      hand,
      play: answer => (answer === 'knock'
        ? { type: 'discard', card: k.card, knock: true }
        : { type: 'discard', card: scored[0].card }),
      resolve(answer) {
        const right = (answer === 'knock') === (margin > 0);
        return {
          grade: right ? (Math.abs(margin) > 3 ? 'optimal' : 'good') : (Math.abs(margin) > 3 ? 'blunder' : 'acceptable'),
          explanation: margin > 0
            ? `The published formula says knock, by ${fmt(margin)} points.`
            : `The published formula says play on: holding out is worth ${fmt(-margin)} points more here (${gr} card${gr === 1 ? ' gins' : 's gin'} you).`
        };
      }
    };
  }

  /* Gin cards: the ten cards and the throw are shown; how many cards not in that
     hand would give you gin (Coach.ginCountQuestion: every other card counts, so
     the answer needs nothing the question does not show)? The answers shown are
     low..low+3 and the count is low + r, with low (0 to 3) and r (0 to 3) drawn
     apart and evenly, so neither a place in the list nor a value tells you the
     answer; then a heads-up hand is played until a throw of a loose card leaves
     that count, with six or more cards melded and no gin on the table. The throw
     is the natural one when it fits.                                          */
  function ginRatingQuestion(rules) {
    const low = rndInt(0, 3), want = low + rndInt(0, 3);
    for (let attempt = 0; attempt < 80; attempt++) {
      const match = E.makeMatch(rules || {});
      match.settings.manualLayoff = false;
      E.startHandFrom(match, C.shuffle(C.freshDeck()), rndInt(0, 51));
      const hand = match.hand;
      const brains = [A.createBrain('standard', 0), A.createBrain('standard', 1)];
      let guard = 0;
      while (hand.phase !== 'over' && guard++ < 300) {
        if (hand.current === 0 && hand.phase === 'discard' && hand.turn >= 2) {
          const eleven = hand.hands[0];
          const acts = E.legalActions(hand);
          if (!acts.some(a => a.type === 'big-gin' || a.canGin)) {
            const no = barred(hand);
            const natural = C.bestDiscard(eleven).card;
            const loose = C.bestArrangement(eleven).deadwood.filter(c => !no.includes(c));
            loose.sort((a, b) => (b === natural) - (a === natural));
            for (const card of loose) {
              const rest = eleven.filter(c => c !== card);
              const arr = C.bestArrangement(rest);
              if (arr.points === 0 || rest.length - arr.deadwood.length < 6) continue;
              const g = window.Coach.ginCountQuestion(card, rest, low);
              if (g.gr !== want) continue;
              return {
                kind: 'ginrating', hand, thrown: card, gins: g.gins,
                title: 'Gin cards',
                prompt: g.prompt,
                cards: tidy(rest),
                options: g.options,
                resolve: g.resolve
              };
            }
          }
        }
        const evs = E.act(match, A.decide(brains[hand.current], match));
        for (const ev of evs) { A.observe(brains[0], ev); A.observe(brains[1], ev); }
      }
    }
    return null;
  }

  function safeWildQuestion(hand) {
    const unseen = window.Coach.couldHold(hand, 0);   // the cards they were seen taking count as theirs
    const arr = C.bestArrangement(hand.hands[0]);
    const pool = arr.deadwood.length ? arr.deadwood : hand.hands[0];
    // pick the card with the most teachable (unambiguous) usefulness
    let pick = null, pu = -1;
    for (const c of pool) {
      const u = C.usefulness(c, unseen);
      if (u <= 1 || u >= 4) { pick = c; pu = u; break; }
      if (pu < 0) { pick = c; pu = u; }
    }
    const band = u => u <= 1 ? 'safe' : u <= 3 ? 'edgy' : 'wild';
    return {
      kind: 'gym', hand,
      title: 'Safe or wild',
      prompt: `${hand.discard.length} card${hand.discard.length === 1 ? '' : 's'} in the pile. How dangerous is throwing the ${C.name(pick)} right now?`,
      cards: hand.hands[0].slice(),
      options: [
        { id: 'safe', label: 'Safe (0 or 1 ways)' },
        { id: 'edgy', label: 'Edgy (2 or 3 ways)' },
        { id: 'wild', label: 'Wild (4 to 6 ways)' }
      ],
      resolve(answer) {
        const right = answer === band(pu);
        return {
          grade: right ? 'optimal' : 'blunder',
          explanation: `The ${C.name(pick)} is ${band(pu)}: ${pu} way${pu === 1 ? '' : 's'} left for them to meld it, counting the cards they took. Count the live neighbours and cards of its rank before every throw.`
        };
      }
    };
  }

  /* rebuild a poseable hand from a stored blunder snapshot */
  function handFromSnapshot(snap) {
    const known = new Set(snap.h0.concat(snap.faceUp));
    const pool = [];
    for (let c = 0; c < 52; c++) if (!known.has(c)) pool.push(c);
    C.shuffle(pool);
    const oppKnown = snap.faceUp.filter(c => !snap.pile.includes(c) && !snap.h0.includes(c));
    const opp = oppKnown.concat(pool.slice(0, Math.max(0, snap.oppLen - oppKnown.length)));
    const stock = pool.slice(Math.max(0, snap.oppLen - oppKnown.length));
    const match = E.makeMatch({});
    match.settings.manualLayoff = false;
    E.buildHand(match, {
      hands: [snap.h0, opp], stock, discard: snap.pile, faceUp: snap.faceUp,
      knockCard: snap.knockCard, doubled: snap.doubled, dealer: 0,
      current: 0, phase: 'discard', turn: snap.turn, turns: snap.turns
    });
    // a card just taken from the pile may not go straight back (saved since 2026-11-15; older entries lack it)
    if (snap.drawnFrom === 'discard' && snap.drawnCard !== null && snap.drawnCard !== undefined && snap.h0.includes(snap.drawnCard)) {
      match.hand.drawnFrom = 'discard';
      match.hand.drawnCard = snap.drawnCard;
    } else if (snap.drawnFrom === 'stock') match.hand.drawnFrom = 'stock';
    return match;
  }

  const fmt = x => (Math.round(x * 10) / 10).toString();

  /* ---------------- team sums ----------------
     The arithmetic of a 2v2 night, drilled until it is instant: scoring a
     hand, netting two tables, what you need once your partner has finished,
     how much you can hold, whether a knock is locked, where a result lands
     on the sheet, what a column pays. Every answer is exact.              */

  /* one hand's score under the table's rules, as the engine settles it.
     -> (type, k, d) => { points, boxes }: type 'knock' | 'undercut' | 'gin' | 'gin-off',
     k the knocker's count, d the other count after layoffs.                */
  function sumsScore(R, spade) {
    const on = spade && R.spadeDoubles !== false;
    const mp = on ? 2 : 1, mb = on && R.spadeDoublesBoxes !== false ? 2 : 1;
    return (type, k, d) => {
      const p = type === 'knock' ? d - k : type === 'gin' ? R.ginBonus + d
        : type === 'undercut' ? R.undercutBonus + (k - d) : R.ginOffBonus;   // a gin off is a flat 30
      const b = type === 'knock' ? R.boxesKnock : type === 'gin' ? R.boxesGin
        : type === 'undercut' ? R.boxesUndercut : R.boxesGinOff;
      return { points: p * mp, boxes: b * mb };
    };
  }

  function sumsQuestion(rules) {
    const R = Object.assign({
      ginBonus: 25, undercutBonus: 25, ginOffBonus: 30,
      boxesKnock: 1, boxesGin: 2, boxesUndercut: 2, boxesGinOff: 3,
      dollarsPerBox: 2, dollarsPerGame: 20
    }, rules || {});
    const rnd = (a, b) => a + ((Math.random() * (b - a + 1)) | 0);
    const pick = arr => arr[(Math.random() * arr.length) | 0];
    const boxes = n => `${n} box${n === 1 ? '' : 'es'}`;
    // the table's switches: a spade may double nothing, the points only, or points and boxes
    const spadeOn = R.spadeDoubles !== false, spadeBoxes = R.spadeDoublesBoxes !== false;
    const spadeDeal = chance => spadeOn && Math.random() < chance;
    const spadeLead = spadeBoxes ? 'A spade: points and boxes double. ' : 'A spade: points double, boxes do not. ';
    const doubledNote = spadeBoxes ? ', all doubled on a spade' : ', the points doubled on a spade';

    /* four answers, the right one among them, in random order */
    function ask(prompt, right, wrongs, working, fact) {
      const labels = [right];
      for (const w of wrongs) if (w !== right && !labels.includes(w) && labels.length < 4) labels.push(w);
      const options = labels.map((label, i) => ({ id: String(i), label })).sort(() => Math.random() - 0.5);
      return {
        kind: 'sums', title: 'Team sums', prompt, options, fact,
        resolve(answer) {
          const ok = answer === '0';
          return { grade: ok ? 'optimal' : 'blunder', explanation: (ok ? 'Right. ' : `It is ${right}. `) + working };
        }
      };
    }

    /* one finished hand, from your side: points and boxes, signed, and what
       happened, said of `who` ('you' or 'partner')                          */
    function result(spade) {
      const mp = spade ? 2 : 1, mb = spade && spadeBoxes ? 2 : 1;
      const t = pick(['knock', 'knock', 'knock', 'gin', 'undercut', 'ginoff']);
      const win = Math.random() < 0.5, s = win ? 1 : -1;
      const was = who => (who === 'you' ? 'were' : 'was');
      if (t === 'knock') {
        const p = rnd(3, 34);
        return { p: s * p * mp, k: s * R.boxesKnock * mb, text: () => `${win ? 'won' : 'lost'} a knock by ${p * mp}` };
      }
      if (t === 'gin') {
        const p = R.ginBonus + rnd(6, 40);
        return { p: s * p * mp, k: s * R.boxesGin * mb, text: who => (win ? `ginned for ${p * mp}` : `${was(who)} ginned for ${p * mp}`) };
      }
      if (t === 'undercut') {
        const p = R.undercutBonus + rnd(0, 7);
        return { p: s * p * mp, k: s * R.boxesUndercut * mb, text: who => (win ? `undercut a knock for ${p * mp}` : `knocked and ${was(who)} undercut for ${p * mp}`) };
      }
      const p = R.ginOffBonus;
      return { p: s * p * mp, k: s * R.boxesGinOff * mb, text: who => (win ? `ginned off for ${p * mp}` : `knocked and ${was(who)} ginned off for ${p * mp}`) };
    }
    /* what the sheet gets from net points p and net boxes k: boxes never go to the
       side that lost the points (the owner, 2026-11-15) */
    function sheetLine(p, k) {
      const side = x => (x > 0 ? 'Your team' : 'Their team');
      if (p === 0) return 'No points, ' + (k === 0 ? 'no boxes' : `${side(k).toLowerCase()} gets ${boxes(Math.abs(k))}`);
      if (k === 0 || Math.sign(p) !== Math.sign(k)) return `${side(p)} writes ${Math.abs(p)}, no boxes`;
      return `${side(p)} writes ${Math.abs(p)} and gets ${boxes(Math.abs(k))}`;
    }
    /* the old way, boxes written for the side that netted them: a wrong answer now */
    const splitLine = (p, k) => `${p > 0 ? 'Your team' : 'Their team'} writes ${Math.abs(p)}; ${k > 0 ? 'your team' : 'their team'} gets ${boxes(Math.abs(k))}`;

    const builders = {
      /* score one hand */
      score() {
        const spade = spadeDeal(0.25);
        const sc = sumsScore(R, spade);
        const m = spade ? 2 : 1, mb = spade && spadeBoxes ? 2 : 1;
        const lead = spade ? spadeLead : '';
        const t = pick(['knock', 'undercut', 'gin', 'ginoff', 'ginoff', 'melded']);
        if (t === 'knock') {
          const k = rnd(1, 10), d = k + rnd(2, 30), r = sc('knock', k, d);
          const right = `${r.points} and ${boxes(r.boxes)}`;
          return ask(`${lead}You knock with ${k}. After layoffs they hold ${d}. What do you score?`, right,
            [`${(d - k + R.undercutBonus) * m} and ${boxes(R.boxesKnock * mb)}`, `${d * m} and ${boxes(R.boxesKnock * mb)}`,
              `${(d - k) * m} and ${boxes(R.boxesGin * mb)}`, `${d - k} and ${boxes(R.boxesKnock)}`, `${(d + k) * m} and ${boxes(R.boxesKnock * mb)}`,
              `${(d - k) * m} and ${boxes(R.boxesKnock * 2)}`],
            `A knock scores the difference, ${d} − ${k} = ${d - k}, and ${boxes(R.boxesKnock)}${spade ? doubledNote : ''}.`,
            { type: 'knock', spade, k, d, side: 0, points: r.points, boxes: r.boxes });
        }
        if (t === 'undercut') {
          const k = rnd(4, 10), d = rnd(1, k), r = sc('undercut', k, d);
          const p = R.undercutBonus + (k - d);
          const right = `They score ${r.points} and ${boxes(r.boxes)}`;
          return ask(`${lead}You knock with ${k}. After layoffs they hold ${d}. What happens?`, right,
            [`They score ${(R.undercutBonus + k) * m} and ${boxes(R.boxesUndercut * mb)}`, `They score ${p * m} and ${boxes(R.boxesKnock * mb)}`,
              `They score ${R.ginOffBonus * m} and ${boxes(R.boxesGinOff * mb)}`, `You score ${Math.max(1, k - d) * m} and ${boxes(R.boxesKnock * mb)}`,
              `They score ${p} and ${boxes(R.boxesUndercut)}`],
            `They hold the same or less, so it is an undercut: ${R.undercutBonus} + the difference (${k} − ${d} = ${k - d}) = ${p}, and ${boxes(R.boxesUndercut)}${spade ? doubledNote : ''}.`,
            { type: 'undercut', spade, k, d, side: 1, points: r.points, boxes: r.boxes });
        }
        if (t === 'gin') {
          const d = rnd(4, 45), r = sc('gin', 0, d);
          const p = R.ginBonus + d;
          const right = `${r.points} and ${boxes(r.boxes)}`;
          return ask(`${lead}You go gin. They are caught with ${d}. What do you score?`, right,
            [`${p * m} and ${boxes(R.boxesKnock * mb)}`, `${(R.ginOffBonus + d) * m} and ${boxes(R.boxesGinOff * mb)}`, `${d * m} and ${boxes(R.boxesGin * mb)}`,
              `${p} and ${boxes(R.boxesGin)}`, `${p * m} and ${boxes(R.boxesGinOff * mb)}`],
            `Gin is ${R.ginBonus} + their ${d} = ${p}, and ${boxes(R.boxesGin)}${spade ? doubledNote : ''}. No layoffs against a gin.`,
            { type: 'gin', spade, k: 0, d, side: 0, points: r.points, boxes: r.boxes });
        }
        if (t === 'melded') {
          // all ten melded when they knock, nothing laid off: not a gin off, an undercut
          const k = rnd(1, 10), r = sc('undercut', k, 0);
          const p = R.undercutBonus + k;
          const right = `You score ${r.points} and ${boxes(r.boxes)}`;
          return ask(`${lead}They knock with ${k}. Your ten cards are already all melded, so you have nothing to lay off. What happens?`, right,
            [`You score ${R.ginOffBonus * m} and ${boxes(R.boxesGinOff * mb)}`, `You score ${(R.ginOffBonus + k) * m} and ${boxes(R.boxesGinOff * mb)}`,
              `You score ${(R.ginBonus + k) * m} and ${boxes(R.boxesGin * mb)}`, `You score ${p * m} and ${boxes(R.boxesGinOff * mb)}`, `You score ${p} and ${boxes(R.boxesUndercut)}`],
            `With nothing laid off it is not a gin off, just an undercut: ${R.undercutBonus} + the difference (${k} − 0 = ${k}) = ${p}, and ${boxes(R.boxesUndercut)}${spade ? doubledNote : ''}.`,
            { type: 'undercut', spade, k, d: 0, side: 0, points: r.points, boxes: r.boxes });
        }
        const k = rnd(1, 10), r = sc('gin-off', k, 0);
        const p = R.ginOffBonus;
        const right = `You score ${r.points} and ${boxes(r.boxes)}`;
        return ask(`${lead}They knock with ${k}. You lay off your loose cards and end with nothing. What happens?`, right,
          [`You score ${(R.undercutBonus + k) * m} and ${boxes(R.boxesUndercut * mb)}`, `You score ${(R.ginOffBonus + k) * m} and ${boxes(R.boxesGinOff * mb)}`,
            `You score ${(R.ginBonus + k) * m} and ${boxes(R.boxesGin * mb)}`, `You score ${k * m} and ${boxes(R.boxesKnock * mb)}`, `You score ${p} and ${boxes(R.boxesGinOff)}`],
          `Laying off to nothing is a gin off: a flat ${R.ginOffBonus}, whatever they knocked with, and ${boxes(R.boxesGinOff)}${spade ? doubledNote : ''}.`,
          { type: 'gin-off', spade, k, d: 0, side: 0, points: r.points, boxes: r.boxes });
      },

      /* net the two tables */
      net() {
        const spade = spadeDeal(0.2);
        const a = result(spade), b = result(spade);
        const p = a.p + b.p, k = a.k + b.k;
        const sign = x => (x >= 0 ? '+' : '−') + Math.abs(x);
        return ask(`${spade ? spadeLead + 'Both results are already doubled. ' : ''}You ${a.text('you')}. Your partner ${b.text('partner')}. What goes on the sheet?`,
          sheetLine(p, k),
          [p !== 0 && k !== 0 && Math.sign(p) !== Math.sign(k) ? splitLine(p, k) : sheetLine(p, -k || -1),
            sheetLine(p, Math.sign(p) * Math.abs(a.k) + Math.sign(p) * Math.abs(b.k) || 1), sheetLine(-p, -k), sheetLine(p, a.k), sheetLine(Math.abs(a.p) + Math.abs(b.p), k),
            sheetLine(p, k + 1), sheetLine(p + 5, k), sheetLine(p, -k || 1)],
          `Points: ${sign(a.p)} and ${sign(b.p)} make ${sign(p)}. Boxes are netted the same way: ${sign(a.k)} and ${sign(b.k)} make ${sign(k)}.` +
          (p !== 0 && k !== 0 && Math.sign(p) !== Math.sign(k) ? ' Boxes never go to the side that lost the points, so nobody gets a box.' : ''));
      },

      /* partner finished: what do you need? */
      need() {
        if (Math.random() < 0.5) {
          const L = rnd(6, 62);
          return ask(`Your partner has finished and lost ${L}. What is the least you must win your hand by for your team to take the points?`,
            String(L + 1), [String(L), String(L + R.ginBonus), String(Math.max(1, L - R.ginBonus)), String(L + 2), String(L - 1)],
            `You have to beat ${L}, not match it: ${L} exactly cancels and nobody writes points. So ${L + 1}.`);
        }
        const W = rnd(8, 60);
        return ask(`Your partner has finished and won ${W}. What is the most you can lose your hand by and still take the points?`,
          String(W - 1), [String(W), String(W - R.ginBonus), String(W + 1), String(W - 2), String(Math.max(0, W - R.ginOffBonus))],
          `Lose by ${W} and it cancels. Lose by ${W - 1} and you are still one point ahead.`);
      },

      /* how much deadwood can you hold against a gin? */
      hold() {
        const spade = spadeDeal(0.25), m = spade ? 2 : 1;
        const hold = rnd(0, 20);
        const W = (R.ginBonus + hold) * m + rnd(1, m);          // just enough to make `hold` the answer
        return ask(`${spade ? spadeLead : ''}Your partner has won ${W}. If they go gin, what is the biggest count you can be caught with and still be ahead on points?`,
          String(hold), [String(hold + 1), String(Math.max(0, hold - 5)), String(hold + 5), String(Math.max(0, W - R.ginBonus)), String(hold + 2), String(Math.max(0, hold - 1))],
          `A gin against you costs ${R.ginBonus} + your count${spade ? ', doubled' : ''}. With ${hold} that is ${(R.ginBonus + hold) * m}, under ${W}. With ${hold + 1} it is ${(R.ginBonus + hold + 1) * m}, which is not.`);
      },

      /* is a knock locked? */
      lock() {
        const spade = spadeDeal(0.25), m = spade ? 2 : 1;
        const k = rnd(1, 10);
        // the worst a knock can meet: a gin off (a flat 30) or an undercut by a hand already all melded (25 + k)
        const ginOff = R.ginOffBonus, under = R.undercutBonus + k;
        const worst = Math.max(ginOff, under) * m;
        const kind = under > ginOff ? 'an undercut' : 'a gin off';
        const W = worst + pick([-6, -3, -1, 0, 1, 2, 4, 8]);
        const locked = W > worst;
        const yes = 'Yes, the points are locked', no = `No, ${kind} for ${worst} would ${W === worst ? 'cancel them' : 'take them'}`;
        return ask(`${spade ? spadeLead : ''}Your partner has won ${W}. You can knock with ${k}. If you knock, are the points locked whatever they hold?`,
          locked ? yes : no, [locked ? no : yes, locked ? `No, a gin off for ${(R.ginOffBonus + k) * m} would take them` : 'Yes, a knock can only lose the difference'],
          `The worst a knock can meet is a gin off (a flat ${ginOff}) or an undercut by a hand already melded (${R.undercutBonus} + your ${k} = ${under}). The bigger is ${Math.max(ginOff, under)}${spade ? `, doubled ${worst}` : ''}. Your partner won ${W}, so ${locked ? 'you stay ahead' : W === worst ? 'it would cancel exactly' : 'that would put them ahead'}.`);
      },

      /* where does a result land on a Hollywood sheet? */
      land() {
        const s = rnd(0, 3), b = pick([1, 2, 2, 3, 4]), p = rnd(5, 60);
        const games = Math.min(s + 1, 3);
        const where = ['Game I only', 'Games I and II', 'All three games'];
        const line = g => `${where[g - 1]} · ${boxes(b * g)} in all`;
        return ask(`All three games are open and your team has put ${s === 0 ? 'nothing' : s === 1 ? 'one result' : s + ' results'} on the sheet so far. You win this deal for ${p} points and ${boxes(b)}. Where does it go?`,
          line(games), [line(1), line(2), line(3), `${where[games - 1]} · ${boxes(b)} in all`, `${where[Math.min(2, games)]} · ${boxes(b)} in all`],
          `Your first result goes in Game I, your second in I and II, and from the third on in all three. This is result number ${s + 1}, so ${where[games - 1].toLowerCase()}, with the ${boxes(b)} written in each: ${boxes(b * games)}.`);
      },

      /* what does a finished column pay? */
      pay() {
        const won = Math.random() < 0.5, blank = Math.random() < 0.35;
        const w = rnd(3, 9), l = blank ? 0 : rnd(1, 7);
        const mine = won ? w : l, theirs = won ? l : w;
        const base = (mine - theirs) * R.dollarsPerBox + (won ? 1 : -1) * R.dollarsPerGame;
        const doubles = blank && R.shutoutDoubles !== false;
        const total = doubles ? base * 2 : base;
        const fmt = x => (x < 0 ? '−$' : '+$') + Math.abs(x);
        return ask(`A game finishes. ${won ? 'Your team won it' : 'Their team won it'}. Boxes in that game: your team ${mine}, theirs ${theirs}.${blank ? (won ? ' Their team never scored in it.' : ' Your team never scored in it.') : ''} At $${R.dollarsPerBox} a box and $${R.dollarsPerGame} a game, what does that game pay you?`,
          fmt(total), [fmt(doubles ? base : base * 2), fmt(-total), fmt((mine - theirs) * R.dollarsPerBox), fmt(total + R.dollarsPerGame), fmt((won ? 1 : -1) * R.dollarsPerGame), fmt(total - 2 * R.dollarsPerBox)],
          `Boxes: ${mine} − ${theirs} = ${mine - theirs}, times $${R.dollarsPerBox} is ${fmt((mine - theirs) * R.dollarsPerBox)}. The game is ${fmt((won ? 1 : -1) * R.dollarsPerGame)}. Together ${fmt(base)}${doubles ? `, and a shut-out doubles the whole game: ${fmt(total)}` : blank ? ': at this table a shut-out does not double' : ''}.`,
          { type: 'pay', won, mine, theirs, blank, total });
      }
    };
    return builders[pick(['score', 'score', 'net', 'net', 'net', 'need', 'hold', 'lock', 'lock', 'land', 'pay'])]();
  }

  /* ---------------- 2v2 scenes ----------------
     The team drills need more than a hand: a sheet with something on it,
     and a partner who has either finished (you know the score you are
     playing to) or is still going. A scene is a real team deal, dealt and
     played by the bots under the real rules until you have a decision.   */
  const rndInt = (a, b) => a + ((Math.random() * (b - a + 1)) | 0);
  const pickOne = arr => arr[(Math.random() * arr.length) | 0];
  const ROMAN = ['I', 'II', 'III'];
  const boxWord = n => `${n} box${n === 1 ? '' : 'es'}`;

  /* one table's result as hands really end at a team table (money-data.js): [points, boxes] for seat 0 */
  function drawHand() {
    const H = window.MoneyData.handHist;
    let u = Math.random();
    for (const [x, k, p] of H) { if ((u -= p) <= 0) return [x, k]; }
    return [H[0][0], H[0][1]];
  }
  /* one team deal: two hands netted, one deal in four doubled by a spade */
  function drawDeal() {
    const a = drawHand(), b = drawHand(), m = Math.random() < 0.25 ? 2 : 1;
    return [(a[0] + b[0]) * m, (a[1] + b[1]) * m];
  }
  /* write a deal's net result on the sheet the way the engine settles one */
  function putDeal(match, p, k) {
    // boxes go to the points winner only when the net is in its favour
    if (p !== 0) { const w = p > 0 ? 0 : 1; E.applyHollywood(match, w, Math.abs(p), Math.max(0, w === 0 ? k : -k)); }
    else if (k !== 0) E.addBoxes(match, k > 0 ? 0 : 1, Math.abs(k));
  }
  const sheetCopy = match => ({
    settings: match.settings, games: JSON.parse(JSON.stringify(match.games)),
    handWins: match.handWins.slice(), over: false
  });
  /* would this result finish a game? */
  function closes(match, p, k) {
    const c = sheetCopy(match);
    putDeal(c, p, k);
    return c.games.some((g, i) => g.closed && !match.games[i].closed);
  }

  /* put a believable history on a sheet.
     fresh: nothing · random: a few deals in · late: someone is close to going out
     blitzed: they have scored and you have not · blitzing: the other way round */
  function writeSheet(match, kind) {
    const T = match.settings.targetScore;
    if (!kind || kind === 'fresh') return match;
    if (kind === 'blitzed' || kind === 'blitzing') {
      const sign = kind === 'blitzing' ? 1 : -1, side = sign > 0 ? 0 : 1;
      const n = rndInt(1, 4);
      for (let i = 0; i < n; i++) {
        const d = drawDeal();
        const p = Math.abs(d[0]) || 12, k = Math.max(1, Math.abs(d[1]));
        if (match.games[0].scores[side] + p >= T - 12) break;
        putDeal(match, sign * p, sign * k);
      }
      if (match.games[0].scores[side] === 0) putDeal(match, sign * rndInt(8, 40), sign);
      return match;
    }
    if (kind === 'late') {
      for (let i = 0; i < 120; i++) {
        const [p, k] = drawDeal();
        if (closes(match, p, k)) continue;
        putDeal(match, p, k);
        const top = Math.max(...match.games.map(g => Math.max(g.scores[0], g.scores[1])));
        if (top >= T - 55) break;
      }
      return match;
    }
    // random: one to nine deals in; a finished game or two is fine, a finished match is not
    const n = rndInt(1, 9);
    for (let i = 0; i < n; i++) {
      const [p, k] = drawDeal();
      const c = sheetCopy(match);
      putDeal(c, p, k);
      if (c.over || c.games.every(g => g.closed)) continue;
      putDeal(match, p, k);
    }
    // a few deals in means points on the sheet: dead deals and box-only nets can leave it blank
    if (!match.games.some(g => g.scores[0] || g.scores[1])) {
      const sign = Math.random() < 0.5 ? 1 : -1;
      putDeal(match, sign * rndInt(8, 40), sign);
    }
    return match;
  }

  /* Deal a hand and play it with the bots until you (seat 0) have eleven cards
     and a real choice. opts:
       rules        the table's settings
       team         false for a heads-up hand (default: a team deal)
       sheet        kind of history to put on the sheet (see writeSheet)
       partnerDone  team only: the other table is played out first, so you know its score
       knockCard    function returning the knock card to use
       wantKnock    stop at your first chance to knock (not gin)
       noKnock      never stop where you could knock (a question about the throw alone)
     Returns { match, table, hand }: the sheet, the table you sit at, the hand. */
  function dealPosition(opts) {
    opts = opts || {};
    const team = opts.team !== false;
    for (let attempt = 0; attempt < 60; attempt++) {
      const match = team ? E.makeTeamMatch(opts.rules || {}) : E.makeMatch(opts.rules || {});
      match.settings.manualLayoff = false;
      writeSheet(match, opts.sheet);
      if (match.over || match.games.every(g => g.closed)) continue;
      const knockCard = opts.knockCard ? opts.knockCard() : rndInt(0, 51);
      let table;
      if (team) {
        E.startDealFrom(match, [C.shuffle(C.freshDeck()), C.shuffle(C.freshDeck())], knockCard);
        table = match.tables[0];
        if (opts.partnerDone) {
          const t2 = match.tables[1];
          const b2 = [A.createBrain('standard', 0), A.createBrain('standard', 1)];
          let g2 = 0;
          while (!E.tableDone(t2) && g2++ < 400) E.actAt(match, 1, A.decide(b2[t2.hand.current], t2));
          if (!E.tableDone(t2) || t2.hand.result.dead) continue;   // a dead hand leaves nothing to play to
          E.updateBulges(match);
        }
      } else {
        E.startHandFrom(match, C.shuffle(C.freshDeck()), knockCard);
        table = match;
      }
      const hand = table.hand;
      const brains = [A.createBrain('standard', 0), A.createBrain('standard', 1)];
      const target = opts.wantKnock ? 0 : rndInt(2, 15);
      let guard = 0;
      while (hand.phase !== 'over' && guard++ < 300) {
        if (hand.current === 0 && hand.phase === 'discard') {
          const acts = E.legalActions(hand);
          const gin = acts.some(a => a.type === 'big-gin' || a.canGin);
          const knock = !hand.ginOnly && acts.some(a => a.canKnock);
          if (!gin && (opts.wantKnock ? knock : hand.turn >= target && !(opts.noKnock && knock))) return { match, table, hand, brain: brains[0] };
        }
        const evs = E.act(table, A.decide(brains[hand.current], table));
        for (const ev of evs) { A.observe(brains[0], ev); A.observe(brains[1], ev); }
      }
    }
    return null;
  }

  /* melds together, then the loose cards from high to low */
  function tidy(cards) {
    const arr = C.bestArrangement(cards);
    const melds = arr.melds.map(m => m.slice().sort((a, b) => C.rankOf(a) - C.rankOf(b)));
    const loose = arr.deadwood.slice().sort((a, b) => C.rankOf(b) - C.rankOf(a));
    return [].concat(...melds, loose);
  }

  const lineText = (hand, s) => (hand.ginOnly
    ? `Knock card ${C.name(hand.knockCard)}: gin only, nobody can knock.`
    : `Knock card ${C.name(hand.knockCard)}: knock with ${hand.knockLimit} or less.`) +
    (hand.doubled ? (s && s.spadeDoublesBoxes === false ? ' A spade: points double, boxes do not.' : ' A spade: points and boxes double.') : '');

  /* the sums behind a bulge decision, in plain words. dw: what a knock would hold, or null */
  function bulgeNotes(hand, s, table, dw) {
    const b = table.bulge, m = hand.doubled ? 2 : 1, out = [];
    if (b > 0) {
      if (dw !== null) {
        const worst = A.worstKnockLoss(hand, s, dw), kind = A.worstKnockKind(s, dw);
        out.push(worst < b
          ? `A knock locks the points: the worst it can meet is ${kind} for ${worst}, and your partner won ${b}.`
          : `A knock is not locked: ${kind} would cost ${worst} against your partner's ${b}.`);
      }
      const hold = A.holdCount(hand, s, b);
      out.push(hold >= 0
        ? `If they gin, you keep the points holding ${hold} or less.`
        : 'Any gin against you takes the points back.');
    } else if (b < 0) {
      const need = -b + 1, per = Math.ceil(need / m);
      out.push(`You need to win by ${need} to take the points.`);
      if (dw !== null) out.push(`A knock with ${dw} gets there only if they are left with ${per + dw} or more.`);
      out.push(per - s.ginBonus <= 0 ? 'Any gin is enough.' : `Gin is enough if they hold ${per - s.ginBonus} or more.`);
    }
    return out.join(' ');
  }

  /* what on the sheet should be steering this deal */
  function sheetFacts(match) {
    const T = match.settings.targetScore, out = [];
    const dbl = match.settings.shutoutDoubles !== false;
    match.games.forEach((g, i) => {
      if (g.closed) return;
      const [a, b] = g.scores;
      if (dbl && a === 0 && b > 0) out.push([5 - i, `You are blank in Game ${ROMAN[i]} with them on ${b}: lose it that way and it pays double.`]);
      if (dbl && b === 0 && a > 0) out.push([4 - i, `They are blank in Game ${ROMAN[i]}: finish it before they score and it pays double.`]);
      if (b > 0 && b >= T - 50) out.push([b >= T - 25 ? 6 : 3, `They need ${T - b} to finish Game ${ROMAN[i]}.`]);
      if (a > 0 && a >= T - 50) out.push([a >= T - 25 ? 6 : 3, `You need ${T - a} to finish Game ${ROMAN[i]}.`]);
    });
    return out.sort((x, y) => y[0] - x[0]).slice(0, 2).map(x => x[1]).join(' ');
  }

  /* A decision in a scene. If you can knock it is knock-or-play-on; otherwise
     it is which card to throw. The verdict comes from dealing it out (main.js);
     resolve() is the rule-of-thumb answer used only if that cannot run.       */
  function sceneQuestion(pos, base) {
    const { match, table, hand } = pos;
    const s = match.settings;
    const scored = A.scoreDiscards(hand, 0, null);
    const knocks = hand.ginOnly ? [] : scored.filter(x => x.canKnock);
    const bulge = table.bulge === undefined ? null : table.bulge;
    const q = Object.assign({
      cards: tidy(hand.hands[0]), hand, table, match, wantClear: true,
      sheet: match.games.some(g => g.scores[0] || g.scores[1] || g.boxes[0] || g.boxes[1]) ? match : null
    }, base);
    const pile = `${hand.discard.length} card${hand.discard.length === 1 ? '' : 's'} in the pile.`;
    // a hand that can gin (a position from your own play): gin is the answer on offer
    const gin = scored.find(x => x.canGin);
    if (gin) {
      const on = scored.find(x => !x.canGin) || scored[0];
      q.prompt = `${q.lead} ${lineText(hand, s)} ${pile} Throwing the ${C.name(gin.card)} gives you gin.`;
      q.options = [
        { id: 'gin', label: `Gin, throwing the ${C.name(gin.card)}` },
        { id: 'play', label: `Play on, throwing the ${C.name(on.card)}` }
      ];
      q.play = a => (a === 'gin' ? { type: 'discard', card: gin.card, gin: true } : { type: 'discard', card: on.card });
      q.notes = () => q.facts || '';
      q.resolve = a => ({
        grade: a === 'gin' ? 'optimal' : 'blunder',
        explanation: [a === 'gin' ? 'Gin ends the hand at once, for the bonus and the boxes.' : 'Gin was on.', q.notes()].filter(Boolean).join(' ')
      });
    } else if (knocks.length) {
      const low = knocks.slice().sort((a, b) => a.dw - b.dw)[0];
      const on = scored[0];
      const rest = hand.hands[0].filter(c => c !== low.card);
      const gr = C.ginRating(rest, E.unseenFor(hand, 0));
      let margin = A.knockMargin(low.dw, hand.turns[0], gr);
      if (bulge !== null) margin += A.bulgeAdjust(hand, s, low.dw, gr, bulge);
      q.prompt = `${q.lead} ${lineText(hand, s)} ${pile} Throwing the ${C.name(low.card)} leaves you ${low.dw}.`;
      q.options = [
        { id: 'knock', label: `Knock with ${low.dw}` },
        { id: 'play', label: `Play on, throwing the ${C.name(on.card)}` }
      ];
      q.play = a => (a === 'knock' ? { type: 'discard', card: low.card, knock: true } : { type: 'discard', card: on.card });
      q.notes = () => [bulge !== null ? bulgeNotes(hand, s, table, low.dw) : '', q.facts || ''].filter(Boolean).join(' ');
      q.resolve = a => {
        const right = (a === 'knock') === (margin > 0);
        return {
          grade: right ? (Math.abs(margin) > 3 ? 'optimal' : 'good') : (Math.abs(margin) > 3 ? 'blunder' : 'acceptable'),
          explanation: (margin > 0 ? 'By rule of thumb, knock.' : 'By rule of thumb, play on.') + ' ' + q.notes()
        };
      };
    } else {
      const dwNow = scored[0].dw;
      q.prompt = `${q.lead} ${lineText(hand, s)} ${pile} Tap the card you throw.`;
      q.pickCard = true;
      q.barred = barred(hand);
      q.play = card => ({ type: 'discard', card });
      q.notes = () => [
        bulge !== null ? bulgeNotes(hand, s, table, null) + ` Your best throw leaves you ${dwNow}.` : '', q.facts || ''
      ].filter(Boolean).join(' ');
      q.resolve = card => {
        const mine = scored.find(x => x.card === card), best = scored[0];
        const gap = best.score - (mine ? mine.score : -99);
        return {
          grade: gradeGap(gap),
          explanation: (best.card === card ? 'By rule of thumb, the best throw.' : `By rule of thumb, the ${C.name(best.card)} was better.`) + ' ' + q.notes()
        };
      };
    }
    return q;
  }

  /* your partner has finished: play to the score */
  function bulgeQuestion(rules) {
    const pos = dealPosition({
      rules, partnerDone: true, wantKnock: Math.random() < 0.7,
      sheet: Math.random() < 0.6 ? 'fresh' : 'random'
    });
    if (!pos) return null;
    const b = pos.table.bulge, k = pos.table.bulgeBoxes || 0;
    return sceneQuestion(pos, {
      kind: 'bulge', title: 'Play to the bulge',
      lead: `Your partner has finished and ${b > 0 ? `won ${b} (${boxWord(k)})` : `lost ${-b} (${boxWord(-k)})`}.`,
      facts: pos.match.games.some(g => g.scores[0] || g.scores[1]) ? sheetFacts(pos.match) : ''
    });
  }

  /* your partner is still playing: the sheet decides how much to risk */
  function firstQuestion(rules) {
    const pos = dealPosition({
      rules, wantKnock: Math.random() < 0.75,
      sheet: pickOne(['blitzed', 'blitzed', 'blitzed', 'blitzing', 'blitzing', 'late', 'late', 'late', 'random', 'random'])
    });
    if (!pos) return null;
    return sceneQuestion(pos, {
      kind: 'first', title: 'Playing first',
      lead: 'Your partner is still playing, so you do not know their result.',
      facts: sheetFacts(pos.match)
    });
  }

  /* the knock card changes the hand: low cards, gin-only aces, spades */
  function knockCardQuestion(rules) {
    // with spades not doubling at this table, a spade is just another knock card
    const type = pickOne(rules && rules.spadeDoubles === false ? ['low', 'low', 'ace', 'ace', 'high']
      : ['low', 'low', 'ace', 'ace', 'spade', 'spade', 'high']);
    const suit = () => rndInt(1, 3);
    const knockCard = {
      low: () => C.cardId(suit(), rndInt(2, 4)),
      ace: () => C.cardId(rndInt(0, 3), 1),
      spade: () => C.cardId(0, rndInt(3, 13)),
      high: () => C.cardId(suit(), rndInt(9, 13))
    }[type];
    const team = !rules || rules.mode !== 'solo';
    const pos = dealPosition({ rules, team, knockCard, wantKnock: type !== 'ace' && Math.random() < 0.8 });
    if (!pos) return null;
    const s = pos.match.settings;
    const tip = {
      low: 'A low knock card makes the knock late and thin: by the time you are under it, they are often close too.',
      ace: 'Gin only: no knock can end it, so the hand runs long and what you are caught holding is what you pay.',
      spade: s.spadeDoublesBoxes === false ? 'On a spade every point counts twice, for and against; the boxes do not.' : 'On a spade every point and every box counts twice, for and against.',
      high: 'A high knock card lets a knock come early. At this table the fitted rule still knocks only about 39% of the time it can.'
    }[type];
    return sceneQuestion(pos, {
      kind: 'knockcard', title: 'Knock card',
      lead: team ? 'Your partner is still playing, so you do not know their result.' : 'Heads-up.',
      facts: tip
    });
  }

  /* ---------------- knock or play on, at this table ----------------
     The published knock formula was fitted on another game: plain gin to 100,
     knock card always 10, against a bot that never knocks. This drill deals
     team positions and keeps the ones where that formula, or the book's rule
     (knock early, wait late on four gin cards), gives a different answer from
     the rule fitted to this table's own play (knock-model.js). The verdict
     still comes from dealing the position out; the fitted rule's answer and
     its reasons are added to it.                                             */
  const KNOCK_WHY = {
    // each: [says knock, says play on], given the record
    gr2: r => [r.gr === 0 ? 'no single card gins you' : `only ${r.gr} card${r.gr === 1 ? '' : 's'} gin${r.gr === 1 ? 's' : ''} you`, `${r.gr} cards gin you, and gin is two boxes to a knock's one`],
    turn: r => [`it is only your turn ${r.turn}`, `it is your turn ${r.turn}, and in the records a knock wins less the longer a hand has run`],
    dw2: r => [`you would be knocking with only ${r.dw}`, `you would be knocking with ${r.dw}`],
    room: r => ['you are right at the knock card', `you are ${r.limit - r.dw} under the knock card, and in the records that much room makes waiting cheap`],
    dbl: (r, s) => ['', s && s.spadeDoublesBoxes === false ? 'on a spade a gin is worth twice the points'
      : `on a spade a gin is ${2 * ((s && s.boxesGin) || 2)} boxes`],
    lowCard: () => ['', 'a low knock card means they are close too'],
    ahead: () => ['your partner is ahead', ''],
    locked: () => ['even a gin off or an undercut cannot take the points back', ''],
    behind: () => ['', 'your partner lost, so a small knock may not win the deal'],
    hole: r => ['', `you are ${-r.bulge} behind, and a plain knock rarely gets that back`],
    holeGr: r => ['', `you are ${-r.bulge} behind and gin is how it comes back`],
    meBlank: () => ['you are blank in a game, and any score gets you on the sheet', ''],
    oppBlank: () => ['', 'they are blank in a game, so a bigger hand is worth more'],
    oppNear: () => ['', ''], meNear: () => ['', ''],
    late: () => ['', 'with over twenty in the pile they know your melds'],
    early: () => ['', ''],
    layoff: () => ['', 'you know they hold a card that lays off on your melds'],
    picks: () => ['', 'they have been taking pile cards, so their hand is made'],
    odd: () => ['', 'seven or nine cards melded is the shape that gins'],
    turnGr: () => ['', '']
  };
  /* the fitted rule's answer on a position, with the two biggest reasons for it */
  function fittedAnswer(pos, k) {
    const model = window.KnockModel;
    if (!model || !A.fittedKnock) return null;
    const rec = A.knockRecord(pos.table, 0, k, pos.brain ? pos.brain.est : null);
    const f = A.fittedKnock(rec, model);
    const knock = f > 0;
    const pushes = model.terms.map((name, i) => [name, model.weights[i] * A.KNOCK_TERMS[name](rec)])
      .filter(([name, v]) => name !== 'one' && (knock ? v > 0 : v < 0))
      .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
    const why = [];
    for (const [name] of pushes) {
      const text = KNOCK_WHY[name] ? KNOCK_WHY[name](rec, pos.match && pos.match.settings)[knock ? 0 : 1] : '';
      if (text && !why.includes(text)) why.push(text);
      if (why.length === 2) break;
    }
    return {
      rec, f, knock, why,
      paper: A.knockMargin(rec.dw, rec.turn, rec.gr) > 0,
      book: !(rec.pile > 20 && rec.gr >= 4)
    };
  }
  function tableKnockQuestion(rules) {
    const team = true;   // the rule was fitted on the team game; the heads-up drill keeps the old dealer
    // half the questions are clear knocks and half are play-ons the old rules get wrong,
    // so the right answer cannot be guessed from the drill's name
    const wantKnock = Math.random() < 0.5;
    let pick = null;
    for (let t = 0; t < 24; t++) {
      const pos = dealPosition({
        rules, team, wantKnock: true, partnerDone: team && Math.random() < 0.5,
        sheet: pickOne(['fresh', 'random', 'random', 'late', 'blitzed', 'blitzing'])
      });
      if (!pos) continue;
      const knocks = A.scoreDiscards(pos.hand, 0, null).filter(x => x.canKnock);
      if (!knocks.length) continue;
      const low = knocks.slice().sort((a, b) => a.dw - b.dw)[0];
      const fa = fittedAnswer(pos, low);
      if (!fa) return null;
      const disputed = fa.knock !== fa.paper || fa.knock !== fa.book;
      const sure = Math.abs(fa.f) >= 0.12;
      // the kind asked for first, then disputed, then how sure the records are
      const rank = (fa.knock === wantKnock ? 2 : 0) + (disputed ? 1 : 0) + Math.min(1, Math.abs(fa.f));
      if (!pick || rank > pick.rank) pick = { pos, fa, rank };
      if (fa.knock === wantKnock && sure && (wantKnock || disputed)) break;
    }
    if (!pick) return null;
    const { pos, fa } = pick;
    const b = pos.table.bulge, kb = pos.table.bulgeBoxes || 0;
    const lead = !team ? 'Heads-up.'
      : b === null || b === undefined ? 'Your partner is still playing, so you do not know their result.'
        : `Your partner has finished and ${b > 0 ? `won ${b} (${boxWord(kb)})` : b < 0 ? `lost ${-b} (${boxWord(-kb)})` : 'broke even'}.`;
    const word = k => (k ? 'knock' : 'play on');
    const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
    const said = `Fitted to this table's own play, the rule says ${word(fa.knock)}. ` +
      (fa.why[0] ? cap(fa.why[0]) + '. ' : '') + (fa.why[1] ? 'Also, ' + fa.why[1] + '. ' : '') +
      (fa.knock !== fa.paper || fa.knock !== fa.book
        ? `The published formula says ${word(fa.paper)} and the book's rule says ${word(fa.book)}.`
        : 'The published formula and the book agree.');
    const sheetNote = pos.match.games.some(g => g.scores[0] || g.scores[1]) ? sheetFacts(pos.match) : '';
    const q = sceneQuestion(pos, { kind: 'knock', title: 'Knock or play on', lead, facts: '' });
    q.fitted = fa;
    // read when the verdict is shown: by then the position has been dealt out (q.judged), and the
    // two methods either agree or the note says plainly that they do not
    Object.defineProperty(q, 'facts', {
      get() {
        const top = q.judged && q.judged.rows && q.judged.rows[0];
        const split = top && !!top.action.knock !== fa.knock;
        return [said, split ? 'Dealt out, this one came out the other way: treat it as close.' : '', sheetNote].filter(Boolean).join(' ');
      }
    });
    // if the position cannot be dealt out, the fitted rule is the answer (not the published formula)
    q.resolve = a => {
      const right = (a === 'knock') === fa.knock, sure = Math.abs(fa.f) >= 0.12;
      return { grade: right ? (sure ? 'optimal' : 'good') : (sure ? 'blunder' : 'acceptable'), explanation: q.notes() };
    };
    return q;
  }

  /* ---------------- reading the sheet ----------------
     Exact answers from the numbers on the pad: what finishes a game, what
     keeps one open, and what a sure result is worth against a gamble.     */
  const models = {};
  /* the money table for a set of rules and stakes (built once, shared with the coach) */
  function modelFor(mode, settings, perBox, perGame) {
    const key = [mode, settings.targetScore, settings.shutoutDoubles, settings.spadeDoubles, settings.hollywood, perBox, perGame].join('|');
    if (!models[key]) models[key] = window.Money.build({ mode, settings, perBox, perGame });
    return models[key];
  }

  function sheetQuestion(rules) {
    const R = Object.assign({ dollarsPerBox: 2, dollarsPerGame: 20 }, rules || {});
    const base = (prompt, match, right, wrongs, working, fact) => {
      const labels = [right];
      for (const w of wrongs) if (w !== right && !labels.includes(w) && labels.length < 4) labels.push(w);
      const options = labels.map((label, i) => ({ id: String(i), label })).sort(() => Math.random() - 0.5);
      return {
        kind: 'sheet', title: 'Read the sheet', prompt, options, sheet: match,
        fact,   // the numbers behind the answer (the tests check them against the engine)
        resolve(answer) {
          const ok = answer === '0';
          return { grade: ok ? 'optimal' : 'blunder', explanation: (ok ? 'Right. ' : `The answer: ${right}. `) + working };
        }
      };
    };
    const fresh = kind => writeSheet(E.makeTeamMatch(R), kind);
    const partner = b => (b > 0 ? `Your partner has won ${b}.` : b < 0 ? `Your partner has lost ${-b}.` : 'Your partner\'s hand was dead: nothing either way.');

    const builders = {
      /* what do you need to finish a game this deal? */
      close() {
        for (let t = 0; t < 40; t++) {
          const m = fresh('late'), T = m.settings.targetScore;
          const gi = m.games.findIndex(g => !g.closed && g.scores[0] >= T - 60 && g.scores[0] > 0);
          if (gi < 0) continue;
          const left = T - m.games[gi].scores[0];
          const b = pickOne([rndInt(4, Math.max(5, left - 3)), -rndInt(4, 30), -rndInt(4, 30)]);
          const need = left - b;
          if (need < 1 || b === 0) continue;
          return base(`${partner(b)} What is the least you must win your own hand by to finish Game ${ROMAN[gi]} this deal?`, m,
            String(need), [String(left), String(need + 1), String(Math.max(1, need - 1)), String(Math.abs(left + b)), String(need + 10)],
            `You have ${m.games[gi].scores[0]} in Game ${ROMAN[gi]}, so the team needs ${left} net. ${b > 0 ? `Your partner's ${b} is already toward it: ${left} − ${b} = ${need}.` : `Your partner's loss has to be made up first: ${left} + ${-b} = ${need}.`}`,
            { type: 'close', gi, partner: b, answer: need });
        }
        return null;
      },
      /* how much can you lose and keep a game open? */
      alive() {
        for (let t = 0; t < 40; t++) {
          const m = fresh(pickOne(['late', 'late', 'blitzed'])), T = m.settings.targetScore;
          const gi = m.games.findIndex(g => !g.closed && g.scores[1] >= T - 70 && g.scores[1] > 0);
          if (gi < 0) continue;
          const left = T - m.games[gi].scores[1];
          const b = pickOne([rndInt(5, 30), -rndInt(3, Math.max(4, left - 4)), -rndInt(3, Math.max(4, left - 4))]);
          const most = left - 1 + b;
          if (most < 0 || most > 90) continue;
          const blank = m.games[gi].scores[0] === 0 && m.settings.shutoutDoubles !== false;
          return base(`They need ${left} to finish Game ${ROMAN[gi]}${blank ? ', and you are blank in it, so it would pay double' : ''}. ${partner(b)} What is the most you can lose your own hand by and keep that game open?`, m,
            String(most), [String(most + 1), String(left), String(Math.max(0, left - 1)), String(Math.max(0, most - 1)), String(Math.abs(left - b))],
            `They finish if the team loses ${left} net, so the team can lose ${left - 1}. ${b > 0 ? `Your partner's ${b} gives you that much more room: ${left - 1} + ${b} = ${most}.` : `Your partner has used ${-b} of it: ${left - 1} − ${-b} = ${most}.`}`,
            { type: 'alive', gi, partner: b, answer: most });
        }
        return null;
      },
      /* which games does this win finish? */
      ends() {
        for (let t = 0; t < 40; t++) {
          const m = fresh('late'), T = m.settings.targetScore;
          const open = m.games.map((g, i) => i).filter(i => !m.games[i].closed && m.games[i].scores[0] > 0);
          if (!open.length) continue;
          const aim = pickOne(open);
          const n = T - m.games[aim].scores[0] + pickOne([-6, -2, 0, 0, 1, 4, 9]);
          if (n < 4 || n > 110) continue;
          const c = sheetCopy(m);
          putDeal(c, n, 1);
          const done = c.games.map((g, i) => i).filter(i => c.games[i].closed && !m.games[i].closed);
          const name = list => (!list.length ? 'None' : list.length === 3 ? 'All three'
            : (list.length === 1 ? 'Game ' : 'Games ') + list.map(i => ROMAN[i]).join(' and ') + (list.length === 1 ? ' only' : ''));
          const sums = open.map(i => `${ROMAN[i]}: ${m.games[i].scores[0]} + ${n} = ${m.games[i].scores[0] + n}`).join(' · ');
          return base(`The two tables net ${n} for your team this deal. Which games does that finish?`, m,
            name(done), ['None', 'Game I only', 'Games I and II', 'All three', 'Game II only', 'Game III only'],
            `A game finishes at ${T}. ${sums}.`, { type: 'ends', net: n, answer: done });
        }
        return null;
      },
      /* a sure result against a gamble, priced on this sheet */
      worth() {
        if (!window.Money) return null;
        const money = x => (x < 0 ? '−$' : '+$') + Math.abs(x).toFixed(2);
        for (let t = 0; t < 60; t++) {
          const m = fresh(pickOne(['blitzed', 'blitzing', 'late', 'late', 'random', 'fresh']));
          const model = modelFor('team', m.settings, R.dollarsPerBox, R.dollarsPerGame);
          const sw = window.Money.swing(model, m), at = window.Money.at;
          const sure = rndInt(4, 22), q = pickOne([40, 50, 60]);
          const big = m.settings.ginBonus + rndInt(8, 40), lose = rndInt(8, 28);
          const bG = m.settings.boxesGin, bK = m.settings.boxesKnock;
          const A1 = at(sw, sure, bK);
          const win = at(sw, big, bG), loss = at(sw, -lose, -bK);
          const B1 = q / 100 * win + (1 - q / 100) * loss;
          if (Math.abs(A1 - B1) < 1.5) continue;
          const bank = A1 > B1;
          const facts = sheetFacts(m);
          return base(`This deal can end two ways for your team (both tables netted). Bank: a sure ${sure} points and ${boxWord(bK)}. Gamble: ${q} in 100 to win ${big} and ${boxWord(bG)}, otherwise lose ${lose} and ${boxWord(bK)}. Which is worth more on this sheet?`, m,
            bank ? 'Bank it' : 'Gamble', [bank ? 'Gamble' : 'Bank it'],
            `By the money table at your stakes: banking is worth ${money(A1)}. The gamble is ${q}% of ${money(win)} and ${100 - q}% of ${money(loss)}, which averages ${money(B1)}.` + (facts ? ' ' + facts : ''),
            { type: 'worth', bank: A1, gamble: B1, sure, q, big, lose });
        }
        return null;
      }
    };
    for (let t = 0; t < 6; t++) {
      const q = builders[pickOne(['close', 'alive', 'ends', 'worth', 'worth'])]();
      if (q) return q;
    }
    return null;
  }

  /* ---------------- count it ----------------
     What are you holding? The count every knock and every bulge sum starts from. */
  function countQuestion(rules) {
    // mostly hands with something made in them: finding the melds is the work
    let pos = null;
    for (let t = 0; t < 6; t++) {
      pos = dealPosition({ team: false, rules });
      if (pos && (C.bestArrangement(pos.hand.hands[0]).melds.length || Math.random() < 0.15)) break;
    }
    if (!pos) return null;
    const eleven = pos.hand.hands[0];
    const bd = C.bestDiscard(eleven);
    const ten = eleven.filter(c => c !== bd.card);
    const right = C.deadwoodPoints(ten);
    const loose = C.bestArrangement(ten).deadwood;
    const wrongs = new Set();
    for (const c of ten) { wrongs.add(right + C.pointsOf(c)); if (right - C.pointsOf(c) >= 0) wrongs.add(right - C.pointsOf(c)); }
    [right + 1, right + 2, Math.max(0, right - 1), right + 5, right + 10].forEach(x => wrongs.add(x));
    wrongs.delete(right);
    const picks = [...wrongs].sort(() => Math.random() - 0.5).slice(0, 3);
    const options = [right].concat(picks).sort((a, b) => a - b).map(n => ({ id: String(n), label: String(n) }));
    // shown in dealt order, not sorted: finding the melds is the skill
    return {
      kind: 'count', title: 'Count it', timed: true,
      prompt: 'Ten cards, unsorted. With the best melds made, how many points are loose?',
      cards: ten.slice().sort(() => Math.random() - 0.5), options,
      resolve(answer) {
        const ok = Number(answer) === right;
        return {
          grade: ok ? 'optimal' : 'blunder',
          explanation: (ok ? 'Right. ' : `It is ${right}. `) +
            (loose.length ? `loose are ${loose.map(c => C.name(c)).join(', ')}.` : 'every card is in a meld.')
        };
      }
    };
  }

  /* a position from your own play, on the sheet and against the partner score it happened on */
  function sceneFromSnapshot(snap, rules) {
    const sc = snap.scene;
    if (!sc || sc.mode !== 'team') {
      const match = handFromSnapshot(snap);
      return { match, table: match, hand: match.hand };
    }
    const match = E.makeTeamMatch(rules || {});
    match.settings.manualLayoff = false;
    if (sc.games) match.games.forEach((g, i) => Object.assign(g, JSON.parse(JSON.stringify(sc.games[i]))));
    const solo = handFromSnapshot(snap);
    const table = match.tables[0];
    table.hand = solo.hand;
    table.bulge = sc.bulge === undefined ? null : sc.bulge;
    table.bulgeBoxes = sc.bulgeBoxes === undefined ? null : sc.bulgeBoxes;
    return { match, table, hand: table.hand };
  }

  function mistakeQuestion(entry, rules) {
    const pos = sceneFromSnapshot(entry.pos, rules);
    const b = pos.table.bulge;
    const lead = `From your own play (you chose ${entry.chosen || 'another line'}).` +
      (b !== null && b !== undefined ? ` Your partner had ${b > 0 ? 'won ' + b : b < 0 ? 'lost ' + -b : 'a dead hand'}.` : '');
    const q = sceneQuestion(pos, { kind: 'mistake', title: 'My mistakes', lead, facts: '', wantClear: false });
    q.entry = entry;
    return q;
  }

  /* ---------------- the skills, and choosing between them ---------------- */

  /* key: the name stats are kept under (coach.js stats.drills) */
  const SKILLS = {
    sums: { name: 'Team sums', key: 'sums', team: true, make: rules => sumsQuestion(rules) },
    bulge: { name: 'Play to the bulge', key: 'bulge', team: true, make: rules => bulgeQuestion(rules) },
    first: { name: 'Playing first', key: 'first', team: true, make: rules => firstQuestion(rules) },
    sheet: { name: 'Read the sheet', key: 'sheet', team: true, make: rules => sheetQuestion(rules) },
    knockcard: { name: 'Knock card', key: 'knockcard', make: rules => knockCardQuestion(rules) },
    // heads-up hands, dealt by the checked dealer: never already gin, and never a knock the question would hide
    discard: { name: 'Best throw', key: 'discard', make: rules => { const g = dealPosition({ team: false, rules, noKnock: true }); return g && discardQuestion(g.hand); } },
    knock: { name: 'Knock or play on', key: 'knock', make: rules => (window.KnockModel && (!rules || rules.mode !== 'solo') ? tableKnockQuestion(rules) : (() => { const g = dealPosition({ team: false, rules, wantKnock: true }); return g && knockQuestion(g.hand); })()) },
    ginrating: { name: 'Gin cards', key: 'ginrating', make: rules => ginRatingQuestion(rules) },
    safewild: { name: 'Safe or wild', key: 'gym', make: rules => { const g = dealPosition({ team: false, rules }); return g && safeWildQuestion(g.hand); } },
    count: { name: 'Count it', key: 'count', make: rules => countQuestion(rules) }
  };

  /* one question for a skill (null if a position could not be dealt) */
  function question(skill, rules) {
    const sk = SKILLS[skill];
    if (!sk) return null;
    for (let t = 0; t < 3; t++) {
      let q = null;
      try { q = sk.make(rules); } catch (e) { console.error('gym ' + skill, e); q = null; }
      if (q) { q.skill = skill; return q; }
    }
    return null;
  }

  /* how often each skill should come up: the weaker you are at it, the more;
     team skills count half as much again, because that is the game you play.
     An untested skill is treated as a coin flip.                            */
  function skillWeights(stats, skills) {
    return (skills || Object.keys(SKILLS)).map(id => {
      const s = (stats && stats.drills && stats.drills[SKILLS[id].key]) || [0, 0];
      const acc = (s[0] + 2) / (s[1] + 4);
      return [id, (0.25 + (1 - acc)) * (SKILLS[id].team ? 1.5 : 1)];
    });
  }
  function pickSkill(stats, skills) {
    const w = skillWeights(stats, skills);
    let roll = Math.random() * w.reduce((s, x) => s + x[1], 0);
    for (const [id, x] of w) { roll -= x; if (roll <= 0) return id; }
    return w[0][0];
  }

  /* the baseline test: a fixed mix of sixty, team skills first in weight */
  const BASELINE_MIX = { sums: 8, bulge: 10, first: 8, sheet: 8, knockcard: 8, discard: 6, knock: 4, ginrating: 3, safewild: 2, count: 3 };
  function baselineQueue() {
    const q = [];
    for (const id of Object.keys(BASELINE_MIX)) for (let i = 0; i < BASELINE_MIX[id]; i++) q.push(id);
    // mixed up, but never the same skill three times running
    for (let tries = 0; tries < 50; tries++) {
      q.sort(() => Math.random() - 0.5);
      if (!q.some((x, i) => i >= 2 && x === q[i - 1] && x === q[i - 2])) break;
    }
    return q;
  }

  /* your own mistakes come back on a widening schedule, by the player's own
     calendar days: a right answer on a due position pushes it out to 1, 3, 7,
     16 and then 35 days; a right answer once those 35 days are up retires it
     (six right in all). A right answer before a position is due moves nothing,
     so it moves at most one step a day. A wrong one brings it back tomorrow. */
  const SPACING_DAYS = [1, 3, 7, 16, 35];
  /* local midnight, `days` calendar days after `now` */
  function dayStart(now, days) {
    const d = new Date(now);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + days).getTime();
  }
  function dueMistakes(now) {
    now = now || Date.now();
    return window.Coach.loadBlunders().filter(e => !e.due || e.due <= now);
  }
  function reschedule(entry, right, now) {
    now = now || Date.now();
    const list = window.Coach.loadBlunders();
    const i = list.findIndex(e => (entry.id !== undefined ? e.id === entry.id : e.ts === entry.ts));
    if (i < 0) return;
    const e = list[i];
    if (right && e.due && e.due > now) return;   // not due yet: answered early, it stays where it was
    const step = right ? (e.step || 0) + 1 : 0;
    if (right && step > SPACING_DAYS.length) list.splice(i, 1);
    else { e.step = step; e.due = dayStart(now, SPACING_DAYS[Math.max(0, step - 1)]); }
    window.Coach.saveBlunders(list);
  }

  window.Gym = {
    question, sumsQuestion, sumsScore, sheetQuestion, bulgeQuestion, firstQuestion, knockCardQuestion,
    countQuestion, mistakeQuestion, tableKnockQuestion, dealPosition, writeSheet, bulgeNotes,
    modelFor,
    SKILLS, skillWeights, pickSkill, BASELINE_MIX, baselineQueue, dueMistakes, reschedule
  };
})();

<script>
/* ============================================================
   scout.js — a record of how each friend plays, bots tuned to it,
   and the money from real nights.
   No DOM here: the data, the tuning, measurements of the tuned
   bots, and the ledger. Stored under localStorage 'grt-scout'.
   ============================================================ */
(function () {
  'use strict';
  const E = window.Engine;
  const A = window.AI;
  const KEY = 'grt-scout';

  /* the questions answered about each friend */
  const HABITS = [
    { key: 'knock', q: 'When they can knock', def: 0,
      steps: [[-2, 'Waits for gin'], [-1, 'Usually waits'], [0, 'Mixes it'], [1, 'Usually knocks'], [2, 'Knocks at once']] },
    { key: 'spec', q: 'Taking cards from the pile', def: 0,
      steps: [[0, 'Only for a meld'], [1, 'Sometimes without one'], [2, 'Often without one']] },
    { key: 'defense', q: 'Their throws late in a hand', def: 1,
      steps: [[0, 'Careless'], [1, 'Ordinary'], [2, 'Careful']] },
    { key: 'skill', q: 'Overall', def: 1,
      steps: [[0, 'Beginner'], [1, 'Solid'], [2, 'Sharp']] },
    { key: 'bulge', q: 'Once their partner has finished', def: 1,
      steps: [[0, 'Ignores the score'], [1, 'Plays to it']] }
  ];
  const habit = key => HABITS.find(h => h.key === key);

  /* ---------------- storage ---------------- */

  let cache = null;

  function store() {
    try { return typeof localStorage !== 'undefined' ? localStorage : null; } catch (e) { return null; }
  }

  /* fill in anything missing so the rest of the code can trust the shape */
  function normalize(d) {
    if (!d || typeof d !== 'object') d = {};
    if (!Array.isArray(d.friends)) d.friends = [];
    if (!Array.isArray(d.nights)) d.nights = [];
    if (!Array.isArray(d.practice)) d.practice = [];
    d.friends = d.friends.filter(f => f && typeof f === 'object' && f.id);
    for (const f of d.friends) {
      if (typeof f.name !== 'string') f.name = String(f.name || '');
      if (!f.seen || typeof f.seen !== 'object') f.seen = {};
      for (const h of HABITS) {
        if (!Array.isArray(f.seen[h.key])) f.seen[h.key] = [];
        f.seen[h.key] = f.seen[h.key].filter(v => typeof v === 'number' && isFinite(v));
      }
      if (typeof f.notes !== 'string') f.notes = '';
      if (typeof f.created !== 'number') f.created = 0;
    }
    d.nights = d.nights.filter(n => n && typeof n === 'object');
    for (const n of d.nights) {
      if (!n.id) n.id = newId('n', d.nights);
      if (typeof n.date !== 'string') n.date = today();
      if (!Array.isArray(n.matches)) n.matches = [];
      n.matches = n.matches.filter(m => m && typeof m === 'object');
      for (const m of n.matches) {
        if (!Array.isArray(m.opps)) m.opps = [];
        m.dollars = Number(m.dollars) || 0;
      }
      if (typeof n.notes !== 'string') n.notes = '';
    }
    d.practice = d.practice.filter(p => p && typeof p === 'object');
    return d;
  }

  function data() {
    if (cache) return cache;
    let parsed = null;
    const s = store();
    try { parsed = s ? JSON.parse(s.getItem(KEY) || 'null') : null; } catch (e) { parsed = null; }
    cache = normalize(parsed);
    return cache;
  }

  function save() {
    const s = store();
    if (!s) return;
    try { s.setItem(KEY, JSON.stringify(data())); } catch (e) { /* storage full or blocked */ }
  }

  function reload() { cache = null; return data(); }

  function today() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  /* 'f1', 'f2'... one more than the highest in use */
  function newId(prefix, list) {
    let max = 0;
    for (const x of list) {
      const m = /^[a-z]+(\d+)$/.exec(x && x.id || '');
      if (m) max = Math.max(max, Number(m[1]));
    }
    return prefix + (max + 1);
  }

  /* ---------------- friends ---------------- */

  const friends = () => data().friends;
  const friend = id => friends().find(f => f.id === id) || null;

  function addFriend(name) {
    const f = { id: newId('f', friends()), name: String(name || '').trim(), seen: {}, notes: '', created: Date.now() };
    for (const h of HABITS) f.seen[h.key] = [];
    friends().push(f);
    save();
    return f;
  }

  function renameFriend(id, name) {
    const f = friend(id);
    if (f) { f.name = String(name || '').trim(); save(); }
    return f;
  }

  function removeFriend(id) {
    const d = data();
    d.friends = d.friends.filter(f => f.id !== id);
    save();
  }

  function setNotes(id, text) {
    const f = friend(id);
    if (f) { f.notes = String(text || ''); save(); }
    return f;
  }

  function clampTo(key, value) {
    const h = habit(key);
    if (!h) throw new Error('unknown habit ' + key);
    const lo = h.steps[0][0], hi = h.steps[h.steps.length - 1][0];
    return Math.max(lo, Math.min(hi, Number(value)));
  }

  /* a considered read: it replaces whatever was noted before */
  function setHabit(id, key, value) {
    const f = friend(id);
    if (!f) return null;
    f.seen[key] = [clampTo(key, value)];
    save();
    return f;
  }

  /* one more thing seen at the table */
  function observe(id, key, value) {
    const f = friend(id);
    if (!f) return null;
    f.seen[key].push(clampTo(key, value));
    save();
    return f;
  }

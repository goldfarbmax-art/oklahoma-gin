          pile().classList.toggle('target', e.clientY < c.feltBottom);
        }
      },
      end: (c, g) => {
        handDrag = null;
        host.classList.remove('sorting');
        pile().classList.remove('target');
        const redraw = () => { if (handPending && !handDrag) { const p = handPending; handPending = null; renderHand(p[0], p[1]); } };
        if (c.mode === 'throw') {
          const onFelt = g.y < c.feltBottom || (g.vy < -0.6 && g.dy < -40);
          if (!g.cancel && onFelt && handOpts.onThrow && handOpts.onThrow(c.card)) {
            c.el.style.visibility = 'hidden';    // the throw flies from where it was let go
            handPending = null;
            return;
          }
          if (!c.el.isConnected) { redraw(); return; }
          c.el.style.zIndex = c.z;
          springHome(c.el, redraw);
          return;
        }
        if (!g.cancel && c.to !== c.from && handOpts.onReorder) {
          handPending = null;
          handOpts.onReorder(c.order.map(i => Number(c.cards[i].dataset.card)));
          return;
        }
        c.cards.forEach((el, i) => { el.style.zIndex = String(i + 1); if (el !== c.el) springHome(el); });
        springHome(c.el, redraw);
      }
    });
  }

  let dropRect = null;
  /* where the last pile drag let go (once), so the draw flies on from there */
  function takeDropRect() { const r = dropRect; dropRect = null; return r; }

  function bindPiles() {
    [['pile-stock', 'stock'], ['pile-discard', 'discard']].forEach(([id, which]) => {
      const pile = $(id);
      drag(pile, {
        down: () => {
          const open = which === 'stock' ? pileOpts.glowStock : pileOpts.glowDiscard;
          if (!open || !pileOpts.onDraw) return null;
          const el = pile.querySelector(which === 'stock' ? '.card' : '.card.top');
          return el ? { el } : null;
        },
        start: (c, dx, dy) => {
          if (dy <= 0 || Math.abs(dx) > dy * 2) return false;
          c.handTop = $('hand').getBoundingClientRect().top;
          c.el.classList.add('lift');
          return true;
        },
        move: (c, dx, dy) => {
          c.el.style.transform = `translate3d(${dx.toFixed(1)}px, ${dy.toFixed(1)}px, 0) rotate(${(dx * -0.04).toFixed(2)}deg)`;
        },
        end: (c, g) => {
          const reached = g.y > c.handTop - 40 || (g.vy > 0.6 && g.dy > 50);
          if (!g.cancel && reached) {
            dropRect = c.el.getBoundingClientRect();
            if (pileOpts.onDraw(which)) { c.el.style.visibility = 'hidden'; return; }
            dropRect = null;
          }
          springHome(c.el);
        }
      });
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    bindSheet();
    bindHand();
    bindPiles();
  });

  /* ---------------- the lay-down ----------------
     Whoever ends the hand lays it down: the cards travel from that seat to
     the middle of the table, grouped by meld, and the kind is named. A tap
     skips it. o: { who, kind: 'knock'|'gin'|'big-gin', melds, deadwood,
     from: 'hand'|'opp' }. Resolves when it is over (at most 1.6 s).     */
  const KIND_NAME = { knock: 'Knock', gin: 'Gin', 'big-gin': 'Big gin' };
  function layDown(o) {
    return new Promise(resolve => {
      const rm = reducedMotion();
      const melds = (o.melds || []).map(m => m.slice().sort((a, b) => C.rankOf(a) - C.rankOf(b)));
      const dead = (o.deadwood || []).slice().sort((a, b) => C.rankOf(a) - C.rankOf(b));
      const groups = melds.map(cards => ({ cards, meld: true }));
      if (dead.length) groups.push({ cards: dead, meld: false });
      const n = groups.reduce((t, g) => t + g.cards.length, 0);
      if (!n) { resolve(); return; }

      // size it to the screen: overlapped within a meld, apart between them;
      // one row if the cards stay big enough, otherwise two
      const felt = document.querySelector('.table-center');
      const fr = felt ? felt.getBoundingClientRect() : { left: 0, width: innerWidth, top: 0, height: innerHeight };
      const W = Math.min(fr.width || innerWidth, 440) - 12;
      const GAP = 16, LAP = 0.5;
      const fit = row => {
        const m = row.reduce((t, g) => t + g.cards.length, 0);
        return Math.floor((W - GAP * (row.length - 1)) / (row.length + LAP * (m - row.length)));
      };
      let rows = [groups];
      if (groups.length > 1 && fit(groups) < 54) {
        // split where the two rows come out closest in size
        let best = null;
        for (let k = 1; k < groups.length; k++) {
          const split = [groups.slice(0, k), groups.slice(k)];
          const w = Math.min(fit(split[0]), fit(split[1]));
          if (!best || w > best.w) best = { w, split };
        }
        if (best.w > fit(groups)) rows = best.split;
      }
      const cw = Math.max(32, Math.min(64, Math.min(...rows.map(fit))));
      const step = cw * LAP, ch = cw * 1.42, ROWGAP = 22;
      const blockH = rows.length * ch + (rows.length - 1) * ROWGAP;
      const top = fr.top + fr.height / 2 - blockH / 2 + 22;

      const stage = document.createElement('div');
      // the celebration is the player's own: the other side's gin is laid down plain
      const myGin = o.kind !== 'knock' && !!o.mine;
      stage.className = 'laydown' + (myGin ? ' gin' : '');
      stage.innerHTML = `<div class="ld-scrim"></div>
        <div class="ld-title"><div class="ld-who"></div><div class="ld-kind">${KIND_NAME[o.kind] || KIND_NAME.knock}</div></div>`;
      stage.querySelector('.ld-title').style.top = (top - 66).toFixed(0) + 'px';
      stage.querySelector('.ld-who').textContent = o.who || '';

      // where each card starts: its own place in your fan, or the far seat
      const fromRects = new Map();
      const hidden = [];
      if (o.from === 'hand') {
        document.querySelectorAll('#hand .card').forEach(el => {
          fromRects.set(Number(el.dataset.card), el.getBoundingClientRect());
          el.style.visibility = 'hidden'; hidden.push(el);
        });
      }
      const seat = (o.from === 'hand' ? $('hand') : $('opp-cards')).getBoundingClientRect();

      const cards = [];
      let i = 0;
      rows.forEach((row, ri) => {
        const span = g => cw + step * (g.cards.length - 1);
        const total = row.reduce((t, g) => t + span(g), 0) + GAP * (row.length - 1);
        const y = top + ri * (ch + ROWGAP);
        let x = fr.left + (fr.width - total) / 2;
        row.forEach(g => {
          const x0 = x, gi = groups.indexOf(g), mid = x0 + span(g) / 2;
          g.cards.forEach((c, j) => {
            const el = cardEl(c, { cls: 'ld-card' + (g.meld ? '' : ' dead') + (j === g.cards.length - 1 ? ' full' : '') });
            el.style.setProperty('--cw', cw + 'px');
            el.style.left = x.toFixed(1) + 'px';
            el.style.top = y.toFixed(1) + 'px';
            el.style.zIndex = String(i + 2);
            stage.appendChild(el);
            cards.push({ el, c, x, y, i, gi, meld: g.meld, toward: Math.sign(mid - (x + cw / 2)), rowW: total, rowX: fr.left + (fr.width - total) / 2 });
            x += step; i++;
          });
          if (g.meld) {
            const line = document.createElement('div');
            line.className = 'ld-meld';
            line.style.cssText = `left:${(x0 + 3).toFixed(1)}px;width:${(span(g) - 6).toFixed(1)}px;top:${(y + ch + 8).toFixed(1)}px`;
            stage.appendChild(line);
          }
          x = x0 + span(g) + GAP;
        });
      });
      $('fx-layer').appendChild(stage);

      let over = false;
      const timers = [];
      const finish = () => {
        if (over) return;
        over = true;
        timers.forEach(clearTimeout);
        stage.remove();
        hidden.forEach(el => { el.style.visibility = ''; });
        resolve();
      };
      stage.addEventListener('pointerdown', finish);
      // reduced motion: shown still for a moment
      if (rm) { timers.push(setTimeout(finish, M.arrive + M.quick)); return; }

      const STAGGER = Math.min(M.press / 4, M.arrive / n);   // 30 ms apart, faster for a long hand
      cards.forEach(({ el, c, x, y, i }) => {
        const r = fromRects.get(c) || seat;
        const sx = r.left + r.width / 2 - (x + cw / 2), sy = r.top + r.height / 2 - (y + ch / 2);
        const s0 = fromRects.has(c) ? r.width / cw : 0.5;
        el.animate([
          { transform: `translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px) scale(${s0.toFixed(3)}) rotate(${(i % 2 ? 4 : -4)}deg)`, opacity: o.from === 'hand' ? 1 : 0 },
          { opacity: 1, offset: 0.35 },
          { transform: 'none', opacity: 1 }
        ], { duration: M.arrive, delay: i * STAGGER, easing: M.out, fill: 'backwards' });
      });
      const landed = M.arrive + (n - 1) * STAGGER;
      stage.querySelector('.ld-scrim').animate([{ opacity: 0 }, { opacity: 1 }], { duration: M.move, easing: M.out });
      const title = stage.querySelector('.ld-title');
      if (myGin) {
        /* A gin (design.md section 6, moment 1): each meld is squared up as if tapped
           by a hand, one pass of light crosses the cards, and the word settles.     */
        const at = M.press / (M.press + M.quick);
        cards.forEach(({ el, gi, meld, toward }) => {
          if (!meld || !toward) return;
          el.animate([{ transform: 'none' }, { transform: `translateX(${toward * 2}px)`, offset: at }, { transform: 'none' }],
            { duration: M.press + M.quick, delay: landed + gi * M.press / 2, easing: M.spring });
        });
        cards.forEach(({ el, x, rowW, rowX }) => {
          const shine = document.createElement('div');
          shine.className = 'ld-shine';
          // one band across the row: each card's sweep starts as the band reaches it
          shine.style.setProperty('--shine-at', Math.round(landed + M.move * (x - rowX) / Math.max(1, rowW)) + 'ms');
          el.appendChild(shine);
        });
        title.querySelector('.ld-kind').animate([{ opacity: 0, transform: 'scale(1.08)' }, { opacity: 1, transform: 'none' }],
          { duration: M.arrive, delay: Math.max(0, landed - M.move), easing: M.out, fill: 'backwards' });
      } else {
        title.animate(
          [{ opacity: 0, transform: 'translateY(8px) scale(.96)' }, { opacity: 1, transform: 'none' }],
          { duration: M.move, delay: Math.max(0, landed - M.move), easing: M.out, fill: 'backwards' });
      }
      stage.querySelectorAll('.ld-meld').forEach(l =>
        l.animate([{ transform: 'scaleX(0)' }, { transform: 'none' }], { duration: M.move, delay: landed - M.press, easing: M.out, fill: 'backwards' }));
      // hold, then fade; everything is gone once it has lingered (--t-linger)
      timers.push(setTimeout(() => {
        stage.animate([{ opacity: 1 }, { opacity: 0 }], { duration: M.quick, easing: M.out, fill: 'forwards' });
      }, Math.max(M.linger, landed + M.arrive) - M.quick));
      timers.push(setTimeout(finish, Math.max(M.linger, landed + M.arrive)));
    });
  }

  /* ---------------- toast ---------------- */
  let toastTimer = null;
  function toast(text, ms) {
    const t = $('toast');
    t.textContent = text;
    // at the table, speak from the open felt under the rival, not over the rail
    const game = $('screen-game');
    const row = document.querySelector('.opp-row');
    if (game && !game.classList.contains('hidden') && row) {
      t.style.top = Math.round(row.getBoundingClientRect().bottom + 10) + 'px';
    } else {
      t.style.top = '';
    }
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms || 1900);
  }

  /* ---------------- fx: flying card ----------------
     Animate a card (face or back) from one rect to another. */
  function flyCard(card, fromRect, toRect, opts) {
    opts = opts || {};
    return new Promise(resolve => {
      if (!fromRect || !toRect || !fromRect.width || !toRect.width) { resolve(); return; }
      if (reducedMotion()) { resolve(); return; }
      const layer = $('fx-layer');
      // fly at card size: a hand or a row of backs is a place, not a card to stretch to
      const cardLike = r => { const a = r.width / r.height; return a > 0.55 && a < 0.9; };
      const w0 = cardLike(fromRect) ? fromRect.width : 64;
      const w1 = cardLike(toRect) ? toRect.width : 64;
      const h0 = w0 * 1.42;
      const el = card === null ? backEl() : cardEl(card, { cls: w0 > 80 ? 'table-size' : '' });
      el.style.setProperty('--cw', w0 + 'px');
      el.style.left = (fromRect.left + fromRect.width / 2 - w0 / 2) + 'px';
      el.style.top = (fromRect.top + fromRect.height / 2 - h0 / 2) + 'px';
      layer.appendChild(el);
      const dx = toRect.left + toRect.width / 2 - (fromRect.left + fromRect.width / 2);
      const dy = toRect.top + toRect.height / 2 - (fromRect.top + fromRect.height / 2);
      const scale = w1 / w0;
      const anim = el.animate([
        { transform: 'translate(0,0) scale(1) rotate(0deg)' },
        { transform: `translate(${dx}px,${dy}px) scale(${scale}) rotate(${opts.rotate || 0}deg)` }
      ], { duration: opts.duration || M.move, easing: M.inOut });
      let done = false;
      const finish = () => { if (done) return; done = true; el.remove(); resolve(); };
      anim.onfinish = finish;
      // onfinish can be unreliable (throttled tabs, low-power mode) — never block the game
      setTimeout(finish, (opts.duration || M.move) + M.press);
    });
  }

  function rectOfId(id) { return $(id).getBoundingClientRect(); }

  /* The score written on the sheet (design.md section 5, item 4), on the paper sheet a
     result shows: the new running total rolls up from the score before the hand, and a
     box just written gives one small overshoot.
     `before`: Ending.snapshot of the games before the hand.                         */
  function writeBoard(host, before, match) {
    if (!host || !before || !match || reducedMotion()) return;
    host.querySelectorAll('.sb-sheet .sb-col').forEach((gEl, i) => {
      const was = before[i], g = match.games[i];
      if (!was || !g) return;
      const runs = gEl.querySelectorAll('.sb-run'), boxes = gEl.querySelectorAll('.sb-foot .sb-box');
      [0, 1].forEach(p => {
        const from = was.scores[p] || 0, to = g.scores[p] || 0;
        if (from !== to && runs[p]) rollFigure(runs[p].querySelector('.sb-now'), from, to);
        const bx = boxes[p];
        if (bx && (was.boxes[p] || 0) !== (g.boxes[p] || 0)) {
          bx.animate([{ transform: 'none' }, { transform: 'scale(1.25)' }, { transform: 'none' }], { duration: M.quick, delay: M.arrive, easing: M.spring });
        }
      });
    });
  }

  /* An undercut, on the result (design.md section 6, moment 3): a beat after the
     sheet lands the under-cutter's hand rises above the knocker's, the two counts
     beat in turn, and the points roll up. `host` holds the two .reveal-rows
     (knocker first); `pts`, the figure, rolls to `value` written by `fmt`. Buttons
     stay live; a tap anywhere finishes it.                                     */
  function undercutMoment(host, pts, value, fmt) {
    if (!host || reducedMotion()) return;
    const rows = [...host.querySelectorAll('.reveal-row')];
    if (rows.length < 2 || !rows[0].getBoundingClientRect) return;
    const [knocker, defender] = rows;
    const anims = [], timers = [];
    if (pts) pts.textContent = fmt(0);
    const swap = () => {
      const a = knocker.getBoundingClientRect(), b = defender.getBoundingClientRect();
      knocker.parentNode.insertBefore(defender, knocker);
      const a2 = knocker.getBoundingClientRect(), b2 = defender.getBoundingClientRect();
      anims.push(knocker.animate([{ transform: `translateY(${(a.top - a2.top).toFixed(1)}px)` }, { transform: 'none' }], { duration: M.move, easing: M.inOut }));
      anims.push(defender.animate([{ transform: `translateY(${(b.top - b2.top).toFixed(1)}px)` }, { transform: 'none' }], { duration: M.move, easing: M.inOut }));
    };
    const beat = el => { if (el) anims.push(el.animate([{ transform: 'none' }, { transform: 'scale(1.12)' }, { transform: 'none' }], { duration: M.quick, easing: M.spring })); };
    timers.push(setTimeout(swap, M.arrive));
    timers.push(setTimeout(() => beat(knocker.querySelector('.rdw')), M.arrive + M.move));
    timers.push(setTimeout(() => beat(defender.querySelector('.rdw')), M.arrive + M.move + M.quick));
    timers.push(setTimeout(() => { if (pts) rollFigure(pts, 0, value, fmt); }, M.arrive + M.move + M.quick * 2));
    const finish = () => {
      window.removeEventListener('pointerdown', finish, true);
      timers.forEach(clearTimeout);
      anims.forEach(x => { try { x.finish(); } catch (e) { /* gone */ } });
      // the under-cutter ends on top however early the tap came
      if (knocker.parentNode && !(defender.compareDocumentPosition(knocker) & Node.DOCUMENT_POSITION_FOLLOWING)) {
        knocker.parentNode.insertBefore(defender, knocker);
      }
      if (pts) pts.textContent = fmt(value);
    };
    window.addEventListener('pointerdown', finish, true);
    timers.push(setTimeout(() => window.removeEventListener('pointerdown', finish, true), M.linger));
  }

  /* ---------------- mini cards for sheets ----------------
     revealRowHTML: `label` is plain text (a name, "Max: gin"); it is escaped here. */
  function revealRowHTML(label, arrangement, laidSet, dwShown) {
    const groups = [];
    for (const m of arrangement.melds) {
      const cards = m.slice().sort((a, b) => C.rankOf(a) - C.rankOf(b));
      groups.push({ meld: true, cards });
    }
    if (arrangement.deadwood.length) {
      groups.push({ meld: false, cards: arrangement.deadwood });
    }
    let html = `<div class="reveal-row"><div class="rname"><span>${esc(label)}</span><span class="rdw">${dwShown}</span></div><div class="reveal-cards">`;
    for (const g of groups) {
      html += `<div class="mgroup${g.meld ? '' : ' dead'}">`;
      for (const c of g.cards) {
        const laid = laidSet && laidSet.has(c);
        html += miniCardHTML(c, laid);
      }
      html += '</div>';
    }
    html += '</div></div>';
    return html;
  }

  function miniCardHTML(c, laid) {
    return `<div class="card sm ${cardClass(c)}${laid ? ' laid' : ''}">${indexHTML(c)}</div>`;
  }

  window.UI = {
    $, esc, cardEl, backEl, renderHand, handGroups, renderOppCards, setOppStatus,
    renderPiles, renderKnockChip, renderHollyMini, renderDeadwood,
    setStatus, renderActions, openSheet, closeSheet, sheetState, askFirst, toast,
    flyCard, rectOfId, revealRowHTML, miniCardHTML, beliefGridHTML,
    layDown, takeDropRect, arriveNext, dealIn, undercutMoment, writeBoard, rollFigure, refuse,
    motion: M, reducedMotion
  };
})();

</script>
<script>
/* ============================================================
   main.js — application flow
   ============================================================ */
(function () {
  'use strict';
  const C = window.Cards, E = window.Engine, A = window.AI,
        K = window.Coach, U = window.UI;
  const $ = U.$;

  /* ---------------- app state ---------------- */
  const app = {
    settings: loadSettings(),
    match: null,
    brain: null,
    coach: null,
    sortMode: 'melds',
    selected: null,
    busy: false,
    drillChecked: '',
    drillPendingDiscard: null,
    drillCommit: null,   // a coach answer judged, its play not yet made: { act, at } (saved with the hand)
    drillVerdict: null,  // a coach verdict on screen, waiting for Continue
    handCounted: false,
    table: null,   // whoever owns your hand: the match itself heads-up, table 0 in a team deal
    t2: null,      // the other table in a team deal
    names: null,
    gen: 0,              // the hand in play: bumped by every new hand and by leaving the table, so a wait from an older one stops
    aiLoop: false,       // a rival's turn is under way (there is only ever one)
    mysteryPersona: null,
    lastResults: [],     // 1 won, 0 lost, the last six scored hands (the tilt check)
    tiltWarned: false,
    rec: null,           // the hand as dealt and played, for the replay
    beliefMarks: {},     // the opponent tracker's marks
    order: null,         // your own arrangement of the hand
    oracle: null,        // the evaluator: { runner, model, sw, key }
    gym: null,
    review: null,        // the deeper look at the last hand
    analysisOpen: null,
    brainLevel: null,    // the strength and style the bots of this hand were made with (a resumed hand makes them again)
    brainPersona: null,
    lastSave: null       // { bytes, ms } of the last save of the match and its hand
  };

  /* The owner's scoring is fixed (gin 25 and 2 boxes, undercut 25 and 2 boxes, a gin off
     30 and 3, a knock 1 box, a spade doubling points and boxes) and has no control on
     Table rules, so whatever an older version stored for it gives way to the house value.
     The engine still takes them as settings, for the tests and tools.                  */
  function houseScoring(s) {
    const fixed = ['ginBonus', 'bigGinBonus', 'undercutBonus', 'ginOffBonus', 'boxesKnock', 'boxesGin',
      'boxesUndercut', 'boxesGinOff', 'spadeDoublesBoxes', 'boxBonus', 'gameBonus'];
    if (s) for (const k of fixed) s[k] = E.DEFAULTS[k];
    return s;
  }

  function loadSettings() {
    let s = {};
    try { s = JSON.parse(localStorage.getItem('grt-settings')) || {}; } catch (e) {}
    if (!s || typeof s !== 'object' || Array.isArray(s)) s = {};
    // the scoreboard is the paper sheet; a board stored by an older version was never chosen
    delete s.board;
    const defaults = {
      mode: 'team',              // team (2v2) | solo (heads-up)
      level: 'expert',
      coach: true,
      tableMode: 'amateur',      // amateur | club | pro
      playerName: '',            // your name at the table; empty: "You"
      persona: 'balanced',       // balanced | rusher | chaser | rock | speculator | mystery
      dollarsPerBox: 2,          // house stakes: $2 a box
      dollarsPerGame: 20,        // $20 a game (doubled on a shutout)
      targetScore: 200, shutoutDoubles: true, spadeDoubles: true
    };
    // a stored value of the wrong kind (damaged, hand-edited) gives way to the default
    const choice = { mode: ['team', 'solo'], level: ['casual', 'standard', 'expert'], tableMode: ['amateur', 'club', 'pro'],
      persona: ['balanced', 'rusher', 'chaser', 'rock', 'speculator', 'mystery'] };
    for (const k of Object.keys(defaults)) {
      if (!(k in s)) continue;
      const v = s[k], d = defaults[k];
      const bad = typeof v !== typeof d || (typeof v === 'number' && !(isFinite(v) && v > 0)) || (choice[k] && !choice[k].includes(v));
      if (bad) delete s[k];
    }
    return houseScoring(Object.assign(defaults, s));
  }

  const PERSONAS = {
    rusher: { name: 'The Rusher', tip: 'Knocks at the very first chance, every time. Stop knocking against them: hold for gin and undercuts and farm the bonuses.' },
    chaser: { name: 'The Chaser', tip: 'Plays everything to gin and never knocks. Knock early and often: their deadwood stays high through the mid-game.' },
    rock: { name: 'The Rock', tip: 'Ultra-defensive: breaks combinations rather than throw anything live. Play on; their caution costs them speed, so build toward gin.' },
    speculator: { name: 'The Speculator', tip: 'Takes cards that don’t meld to build combinations and muddy your reads. Trust the pile count over pick-reads, and knock early: their deadwood runs high.' }
  };
  /* your name where the app names you against the others; empty: "You" */
  const myName = () => String(app.settings.playerName || '').trim().slice(0, 16) || 'You';
  const sameName = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
  const onTable = () => !$('screen-game').classList.contains('hidden');
  function activePersona() {
    if (gameNight()) return null;   // game night: the rivals are friends, not styles
    if (app.settings.persona === 'balanced') return null;
    if (app.settings.persona === 'mystery') return app.mysteryPersona;
    return app.settings.persona;
  }
  /* money as the table says it: $2, $0.25, $12.50, $1,250 (cents only when there are some) */
  const fmtMoney = x => {
    const c = Math.round(Math.abs(Number(x) || 0) * 100);
    const whole = String(Math.floor(c / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return '$' + whole + (c % 100 ? '.' + String(c % 100).padStart(2, '0') : '');
  };
  // signed, for side 0: +$34, −$40, and $0 with no sign
  const fmtD = x => (Math.round((Number(x) || 0) * 100) === 0 ? '$0' : (x < 0 ? '−' : '+') + fmtMoney(x));
  /* the stakes a match is played at: its own, fixed when it started (Table rules apply to the next match) */
  function matchStakes(match) {
    const s = (match && match.settings) || {};
    return {
      box: s.dollarsPerBox !== undefined ? s.dollarsPerBox : app.settings.dollarsPerBox,
      game: s.dollarsPerGame !== undefined ? s.dollarsPerGame : app.settings.dollarsPerGame
    };
  }
  /* exact box/game settlement for the match so far (his table's rules:
     net boxes × $box per column + $game per game won, doubled on a blitz) */
  function settlement(match) {
    const st = matchStakes(match);
    return E.settle(match, st.box, st.game);
  }
  function saveSettings() {
    try { localStorage.setItem('grt-settings', JSON.stringify(app.settings)); } catch (e) {}
  }
  /* The match is saved with the hand in play (`resume`), after every completed
     action, so closing the app comes back to the same moment. A finished match
     stays saved until its last sheet is left (dropSavedMatch): closing the app
     on the result comes back to the result. The hand itself is plain data; the
     bots' and the coach's memories are not saved but made again from

  const clock = () => (typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now());
  function saveMatch() {
    if (!app.match) return;   // nothing in play; a saved match is only ever dropped on purpose
    // Only the table in play is saved. Once the table is left, the save made on leaving is the truth
    // (a committed answer, the plays still waiting, the side quiz, table two, the recording): nothing
    // finishing later (a verdict, a timer) may write over it. The statistics are saved on their own.
    if (!onTable()) return;

      const t0 = clock();
      const m = Object.assign({}, app.match, { hand: null, lastDeal: null, resume: handState() });
      if (m.tables) m.tables = m.tables.map(t => ({ id: t.id, dealer: t.dealer }));   // the hands ride in `resume`

      bulges: isTeam() ? tables.map(x => [x.bulge === undefined ? null : x.bulge, x.bulgeBoxes === undefined ? null : x.bulgeBoxes]) : null,
      lastDeal: isTeam() ? match.lastDeal || null : null,

      drillUsed: !!app.coach.drillUsedThisHand, tilted: !!app.coach.tilted,

      moneyTurn: app.coach.moneyTurn, sideUsed: !!app.coach.sideUsed, sidePlan: app.coach.sidePlan,

  /* A saved match this version can play on: a match's shape, its sheet of three games, its

  const isRec = v => !!v && typeof v === 'object' && !Array.isArray(v);
  const pair = v => Array.isArray(v) && v.length === 2 && v.every(x => typeof x === 'number' && isFinite(x));
  function matchOK(m) {
    if (!isRec(m) || (m.mode !== 'solo' && m.mode !== 'team') || !isRec(m.settings)) return false;
    if (!(typeof m.settings.targetScore === 'number' && m.settings.targetScore > 0)) return false;
    if (!Array.isArray(m.games) || m.games.length !== 3) return false;
    if (!m.games.every(g => isRec(g) && pair(g.scores) && pair(g.boxes))) return false;
    if (m.handsPlayed !== undefined && !(typeof m.handsPlayed === 'number' && isFinite(m.handsPlayed))) return false;
    if (m.mode === 'team' && m.tables !== undefined && !Array.isArray(m.tables)) return false;

  function loadMatch() {

      const parsed = JSON.parse(raw);
      if (matchOK(parsed)) {

        if (!pair(m.handWins)) m.handWins = [0, 0];
        if (m.handsPlayed === undefined) m.handsPlayed = 0;
        if (m.dealer !== 0 && m.dealer !== 1) m.dealer = 0;
        if (m.mode === 'team' && m.pairing !== 1) m.pairing = 0;
        m.games.forEach(g => { if (!Array.isArray(g.entries) || g.entries.length !== 2 || !g.entries.every(Array.isArray)) g.entries = [[], []]; });

  /* a saved hand that can be put back as it was: this version's rules, every card once, a phase it can be in */
  function handOK(h) {
    if (!h || typeof h !== 'object' || !Array.isArray(h.hands) || h.hands.length !== 2) return false;
    const parts = [h.hands[0], h.hands[1], h.stock, h.discard];
    if (!parts.every(Array.isArray) || !Array.isArray(h.faceUp) || !Array.isArray(h.history) || !Array.isArray(h.turns)) return false;
    const all = [].concat(...parts);

  }
  /* that match in a few words: who it is with and where the money stands */

      const sc = m.scout, friend = id => { const f = scoutFriend(id); return f && f.name ? shortName(f.name) : ''; };
      const person = id => { const x = P && id ? P.byId(id) : null; return x ? x.name : ''; };
      const name = m.mode === 'team' ? (sc ? friend(sc.partner) : person(c[0])) : person(c[1 + p]);

  /* one question before a tap that would throw a match away; `go` runs on yes */

  /* ---------------- screens ---------------- */
  function showScreen(name) {

  }

  /* ---------------- a new version ----------------
     The offline cache (sw.js) fetches a new build in the background and keeps it
     waiting. While it waits, the home screen offers it: one tap asks it to take

     next launch opens on it (sw.js). Never at the table, never on its own.    */
  const updates = { reg: null, asked: false, checked: 0, reloading: false };

  function initHome() {

  /* ---------------- match lifecycle ---------------- */
  function newMatch() {

  function continueMatch() {

    if (saved.over) {   // a finished match whose last hand cannot be shown: there is nothing to go back to

      app.match = null;

      showScreen('home');

  }

  /* Back to the moment the app was closed: the hands, the piles, whose turn,

     nothing shown, if the saved hand cannot be put back.                    */
  function resumeHand(match, r) {
    if (!resumable(match, r)) return false;

      app.gen++;
      const gen = app.gen;
      app.aiLoop = null;
      stopT2Timer();
      if (r.mystery) app.mysteryPersona = r.mystery;
      app.brainLevel = r.level || app.settings.level;
      app.brainPersona = r.persona || null;

  /* A resumed hand's plays: the price tables they were judged against are made

      const ready = oracleReady(), o = app.oracle, swings = {};

        if (!e.job || e.job.ctx || !ready) continue;
        try {
          const at = e.job.at || {};
          // priced on the sheet the play was made on (saved with it), never the sheet as it is now:
          // a hand resumed on its result has its own result on the sheet already
          const games = at.games || app.match.games;
          const then = Object.assign({}, app.match, { games });
          const k = JSON.stringify(games);
          if (!swings[k]) swings[k] = Money.swing(o.model, then);
          const doubled = at.doubled === undefined ? app.table.hand.doubled : at.doubled;
          e.job.ctx = O.context(o.model, then, { hand: { doubled }, bulge: at.bulge === undefined ? null : at.bulge, bulgeBoxes: at.bulgeBoxes }, swings[k]);
        } catch (x) { console.error('resume price table', x); }
      }

      // no money table by the rule of thumb it was shown with (Coach.settle, as any play)

  /* Leave the table: everything that belongs to the hand stops here (the rival's
     turn, table two, the plays still waiting to be dealt out, the review, any
     sheet), so nothing opens over the home screen afterwards.               */
  function leaveTable() {
    app.gen++;
    // a verdict still being dealt out is no longer this table's: when it lands the record's gate
    // writes nothing (Coach.settle), and the play stays pending in the save, to be dealt out again
    // (and counted once, under its own id) if the hand is continued
    if (app.coach) K.leave(app.coach);
    stopT2Timer();
    stopReview();
    dropJobs('table');
    app.busy = false;
    app.aiLoop = null;
    app.drillPendingDiscard = null; app.drillAsk = null; app.coachDealing = false; app.drillVerdict = null;
    app.analysisOpen = null;
    if (app.coach) app.coach.afterEvent = null;
    U.closeSheet();
    // the last save of this table: a committed coach answer goes with the hand (Continue makes its play),
    // and nothing after it writes the match again (saveMatch saves only the table on screen)
    saveMatch();
    app.drillCommit = null;
    initHome();
    showScreen('home');
  }

  /* ---------------- plays let go for good ----------------
     Leave table keeps the hand (and its waiting plays) in the save, for Continue. A table let
     go for good is never continued: a finished match left by Home, Rematch or game night's next
     match, and a saved match given up for a new one (New match, game night's Deal: its plays
     were made and are counted like any). Its plays still waiting on a verdict are no sitting's
     any more (Coach.keep): each is judged once, wherever the player is, when its verdict lands,
     and kept with the record (grt-kept) until then, so an app closed first deals them out when
     it opens again. Each is kept with its match's rules and stakes; the sheet it was priced on

  const KEPT_KEY = 'grt-kept';
  app.kept = [];   // [{ play } or { ask }, with then: { mode, settings }]
  function saveKept() {
    try {
      const list = app.kept.map(k => (k.play ? { play: plainPlay(k.play), then: k.then } : { ask: plainPlay(k.ask), then: k.then }));
      if (list.length) localStorage.setItem(KEPT_KEY, JSON.stringify(list)); else localStorage.removeItem(KEPT_KEY);
    } catch (e) {}
  }
  function dropKept(x) {
    const i = app.kept.findIndex(k => k.play === x || k.ask === x);
    if (i >= 0) { app.kept.splice(i, 1); saveKept(); }
  }
  function keepAll(plays, asks, m) {
    if (!plays.length && !asks.length) return [];
    const then = { mode: m.mode, settings: m.settings }, added = [];
    plays.forEach(e => { K.keep(e); added.push({ play: e, then }); });
    asks.forEach(a => { K.keep(a.tally); a.kept = true; added.push({ ask: a, then }); });
    app.kept.push(...added);
    saveKept();
    return added;
  }
  /* the table on screen let go for good: its waiting plays, and their evaluations, go on */
  function keepPending() {
    const c = app.coach, m = app.match;
    if (!c || !m) return;
    const seat = c.seat || 0;
    const plays = (c.carry || []).concat(c.handLog || []).filter(e => e && e.pending && !e.kept && (e.seat || 0) === seat);
    const asks = (c.asks || []).filter(a => a && a.tally && !a.tally.kept && (a.tally.seat || 0) === seat);
    if (!keepAll(plays, asks, m).length) return;
    c.carry = (c.carry || []).filter(e => !e.kept);
    c.asks = (c.asks || []).filter(a => !a.kept);
    // what is still queued for them is no longer the table's to drop when it is left
    for (const q of jobQueue) if (q.owner === 'table' && !q.job.prejudge) q.owner = 'kept';
  }
  /* the saved match about to be given up (left earlier, or not opened since the app started):
     its waiting plays are copies nothing is dealing out, so they are dealt out now */
  function keepSaved() {
    let m = null;
    try { m = JSON.parse(localStorage.getItem('grt-match')); } catch (e) {}
    const r = isRec(m) && isRec(m.resume) && isRec(m.settings) ? m.resume : null;
    if (!r) return;
    const have = new Set(app.kept.map(k => (k.play || k.ask.tally).id));
    const fresh = e => isRec(e) && typeof e.id === 'string' && e.epoch !== undefined && !e.kept && !have.has(e.id);
    const plays = [].concat(Array.isArray(r.carry) ? r.carry : [], Array.isArray(r.log) ? r.log : []).filter(e => fresh(e) && e.pending);
    const asks = (Array.isArray(r.asks) ? r.asks : []).filter(a => isRec(a) && fresh(a.tally));
    judgeKept(keepAll(plays, asks, m));
  }
  /* kept plays read from storage at launch: dealt out again (the app was closed before they landed) */
  function loadKept() {
    let list = [];
    try { const v = JSON.parse(localStorage.getItem(KEPT_KEY)); if (Array.isArray(v)) list = v; } catch (e) {}
    const good = k => isRec(k) && isRec(k.then) && isRec(k.then.settings) &&
      (isRec(k.play) ? typeof k.play.id === 'string' : isRec(k.ask) && isRec(k.ask.tally) && typeof k.ask.tally.id === 'string');
    app.kept = list.filter(good).map(k => (k.play ? { play: K.keep(k.play), then: k.then } : { ask: Object.assign(k.ask, { kept: true }), then: k.then }));
    app.kept.forEach(k => { if (k.ask) K.keep(k.ask.tally); });
    if (app.kept.length !== list.length) saveKept();
    judgeKept(app.kept.slice());
  }
  /* deal kept plays out (their price tables made again from their own match's rules and sheet);
     with no money table, the rule of thumb each was shown with (as rehydrateLog) */
  function judgeKept(items) {
    if (!items.length) return;
    setTimeout(() => {
      for (const k of items) {
        const x = k.play || k.ask;
        try {
          if (x.job && !x.job.ctx && x.job.at && x.job.at.games && O && Money && window.Gym) {
            const at = x.job.at, s = k.then.settings, stake = matchStakes(k.then);
            const model = window.Gym.modelFor(k.then.mode === 'team' ? 'team' : 'solo', s, stake.box, stake.game);
            if (model) {
              const then = { mode: k.then.mode, settings: s, games: at.games };
              x.job.ctx = O.context(model, then, { hand: { doubled: !!at.doubled }, bulge: at.bulge === undefined ? null : at.bulge, bulgeBoxes: at.bulgeBoxes }, Money.swing(model, then));
            }
          }
        } catch (e) { console.error('kept price table', e); }
        if (x.job) { delete x.job.dropped; delete x.job.abandoned; }
        if (k.ask) { judgeAsk(x); continue; }
        if (x.job && x.job.ctx && x.action) {
          const house = x.houseKey ? x.job.actions.find(a => O.keyOf(a) === x.houseKey) || null : null;
          judgeMove(x, x.job, x.action, house);
        } else settlePlay(x, null);
      }
    }, 30);
  }

  function startNextHand() {
    const match = app.match;
    const gen = ++app.gen;   // anything still waiting from the last hand stops when it wakes
    app.aiLoop = null;
    stopT2Timer();
    match.settings.manualLayoff = app.settings.tableMode === 'pro';
    if (app.settings.persona === 'mystery' && !app.mysteryPersona && !gameNight()) {
      const keys = Object.keys(PERSONAS);
      app.mysteryPersona = keys[(Math.random() * keys.length) | 0];
    }
    const persona = activePersona();
    app.brainLevel = app.settings.level;
    app.brainPersona = persona;
    if (isTeam()) E.startDeal(match); else E.startHand(match);
    const b = brainsFor(app.brainLevel, persona);
    const who = b.who;   // the people playing this hand (null at game night)
    if (isTeam()) {
      app.table = match.tables[0];
      app.t2 = { table: match.tables[1], brains: b.t2, last: '', timer: null };
    } else {
      app.table = match;
      app.t2 = null;
    }
    app.names = seatNames();
    // the sheet as this deal found it: the result tells what the deal did to it (dealBeats)
    app.sheetBefore = window.Ending ? window.Ending.snapshot(match.games) : null;
    prepareOracle();
    app.brain = b.opp;
    if (!app.coach) app.coach = K.createCoach(app.settings.coach);
    app.coach.enabled = app.settings.coach;
    // the last hand's plays still being dealt out at this sitting go on with this one, saved with it,
    // until judged (a dead hand dealt again at once, a result passed quickly); a table left and not
    // continued (New match) takes its plays with it
    const carry = (app.coach.carry || []).concat(app.coach.handLog || []).filter(e => e && e.pending && !e.kept && e.seat === app.coach.seat);
    const asks = (app.coach.asks || []).filter(a => a.tally && !a.tally.kept && a.tally.seat === app.coach.seat);
    K.newHand(app.coach);
    app.coach.carry = carry;
    app.coach.asks = asks;
    // tilt flag: did you lose the last two scored hands?
    const lr = app.lastResults || [];
    app.coach.tilted = lr.length >= 2 && lr[lr.length - 1] === 0 && lr[lr.length - 2] === 0;
    // replay recording
    const hand = app.table.hand;
    app.rec = {
      hands: [hand.hands[0].slice(), hand.hands[1].slice()],
      stock: hand.stock.slice(),
      upcard: hand.discard[0],
      knockCard: hand.knockCard, doubled: hand.doubled,
      dealer: hand.dealer, actions: []
    };
    app.beliefMarks = {};
    app.selected = null;
    app.drillChecked = '';
    app.drillPendingDiscard = null; app.drillAsk = null; app.coachDealing = false;
    app.drillVerdict = null; app.drillCommit = null;
    app.handCounted = false;
    seatPlate(who, persona);
    // the other table does not wait for you: it is one turn in when you look up (measured: your
    // table then finishes first in about half the deals, tools/bench-pace.js)
    if (isTeam()) stepTable2();
    saveMatch();   // closing the app from here on comes back to this hand
    app.busy = true;   // a tap during the deal is ignored: the deal ends by starting play itself
    renderAll();
    dealAnimation().then(() => {
      if (gen !== app.gen) return;
      app.busy = false;
      renderAll();
      pump();
    });
  }

  /* the name plate opens on how this person plays (nothing carried over from the last hand) */
  function seatPlate(who, persona) {
    $('opp-name').textContent = app.names.opp;
    U.setOppStatus(who && !persona ? who.opp.line : '');
    $('opp-avatar').textContent = app.names.opp.charAt(0).toUpperCase() || '?';
    $('opp-avatar').style.borderColor = who ? who.opp.hue : '';
  }

  /* the bots of a hand: the one across from you, and table two's pair in a team deal */
  function brainsFor(settingsLevel, persona) {
    const level = settingsLevel;   // a style is played at the strength chosen
    const gn = gameNightSeats();   // null outside game night
    const who = gn ? null : seated();
    const styled = seat => A.createBrain(level, seat, persona);
    return {
      who,
      opp: gn ? scoutBrain(gn.opp, 1) : persona ? styled(1) : personBrain(who.opp, 1, settingsLevel),
      t2: !isTeam() ? null : gn
        ? [scoutBrain(gn.partner, 0), scoutBrain(gn.opp2, 1)]
        : [personBrain(who.partner, 0, settingsLevel), persona ? styled(1) : personBrain(who.opp2, 1, settingsLevel)]
    };
  }

  function recordAction(action, player) {
    if (!app.rec) return;
    const a = Object.assign({}, action, { player });
    if (action.type === 'take-upcard') a.card = E.upcard(app.table.hand);
    app.rec.actions.push(a);
  }

  /* the hands are drawn already: they run in from the stock (UI.dealIn; a tap finishes it) */
  async function dealAnimation() {
    U.setStatus('');
    await U.dealIn();
  }

  const wait = ms => new Promise(r => setTimeout(r, ms));

  /* ---------------- team play (2v2) ----------------
     You play table one. Your partner plays table two at the same time,
     under the same knock card. The two results net into one box.        */
  const isTeam = () => !!(app.match && app.match.mode === 'team');
  const signed = x => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x);
  const backToResult = () => (isTeam() ? openDealSheet() : openResultSheet());

  /* who sits where this deal (opponents may switch between deals) */
  /* The people at the table. Each match seats three from people.js: your partner
     and two rivals (heads-up: the first rival). A person's style is played as a
     tune on top of the chosen strength, so an Expert table stays Expert.        */
  const STYLE_TUNE = { rusher: { knock: 2 }, chaser: { knock: -2 }, rock: { defense: 6 }, speculator: { spec: 0.7 } };
  function cast() {
    const m = app.match, P = window.People;
    // nobody at the table shares your name: a seated person who does is replaced
    const mine = String(app.settings.playerName || '').trim();
    const clash = p => !!mine && sameName(p.name, mine);
    // the whole shuffle, so a clash can be skipped whether or not People.cast knows `exclude`
    const pool = () => P.cast((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0, P.ALL.length, { exclude: mine ? [mine] : [] })
      .filter(p => !clash(p));
    if (!m.cast || m.cast.length < 3 || m.cast.some(id => !P.byId(id))) {
      m.cast = pool().slice(0, 3).map(x => x.id);
    } else if (m.cast.some(id => clash(P.byId(id)))) {
      const spare = pool().filter(p => !m.cast.includes(p.id));
      m.cast = m.cast.map(id => (clash(P.byId(id)) ? spare.shift().id : id));
    }
    return m.cast.map(id => P.byId(id));
  }
  // who sits where this hand: your partner, the rival across from you, the rival at table two
  function seated() {
    const c = cast(), p = isTeam() ? app.match.pairing : 0;
    return { partner: c[0], opp: c[1 + p], opp2: c[2 - p] };
  }
  function personBrain(person, seat, level) {
    level = level || app.settings.level;
    const t = person && STYLE_TUNE[person.style];
    return t ? A.createBrain(level, seat, null, t) : A.createBrain(level, seat);
  }

  // who is at the table and how each of them plays
  function openPeopleSheet() {
    if (!app.match || gameNight()) return;
    const s = seated(), persona = activePersona();
    const row = (p, role, rival) => `<div class="pp"><div class="avatar" style="border-color:${p.hue}">${escH(p.initials)}</div>
      <div class="pp-who"><div class="pp-n">${escH(p.name)}</div><div class="pp-l">${rival && persona ? (app.settings.persona === 'mystery' ? '?' : PERSONAS[persona].name) : escH(p.line)}</div></div>
      <div class="eyebrow">${role}</div></div>`;
    const me = { name: myName(), initials: myName().charAt(0).toUpperCase(), hue: '#c9a45c', line: '' };   // brass: you
    U.openSheet(row(me, '') + (isTeam()
      ? row(s.partner, 'Partner') + row(s.opp, 'Your table', true) + row(s.opp2, 'Table two', true)
      : row(s.opp, '', true)));
  }

  function seatNames() {
    const s = seated();
    if (!isTeam()) return { opp: s.opp.name, partner: null, opp2: null };
    const p = app.match.pairing;
    const gn = gameNightSeats();
    if (gn) {
      // friend names (short form for the tight spots); a friend removed since falls back to the generic seat name
      const nm = (f, generic) => (f && f.name ? shortName(f.name) : generic);
      return { opp: nm(gn.opp, s.opp.name), partner: nm(gn.partner, s.partner.name), opp2: nm(gn.opp2, s.opp2.name) };
    }
    return { opp: s.opp.name, partner: s.partner.name, opp2: s.opp2.name };
  }

  /* ---------------- game night ----------------
     The team match played against bots built from the owner's friends (window.Scout).
     match.scout = { partner, opps: [idA, idB], pool: [3 ids], round, recorded? }.
     match.pairing says which of opps sits across from you this deal.          */
  function gameNight() { return !!(app.match && app.match.scout); }
  const escH = U.esc;   // the one escape helper: every name and note that reaches innerHTML goes through it
  const shortName = n => { n = String(n || '').trim(); return n.length > 12 ? (n.split(/\s+/)[0] || n).slice(0, 12) : n; };
  function scoutFriend(id) {
    try { return (window.Scout && id != null && window.Scout.friend(id)) || null; } catch (e) { return null; }
  }
  /* the friends in each seat right now (null outside game night; a missing friend is null) */
  function gameNightSeats() {
    if (!gameNight() || !isTeam()) return null;
    const sc = app.match.scout, p = app.match.pairing ? 1 : 0;
    return {
      partner: scoutFriend(sc.partner),
      opp: scoutFriend(sc.opps[p]),
      opp2: scoutFriend(sc.opps[1 - p])
    };
  }
  function scoutBrain(friend, seat) {
    try { if (window.Scout) return window.Scout.brainFor(friend || null, seat); } catch (e) { console.error('game night brain', e); }
    return A.createBrain('expert', seat);
  }
  const fullName = (f, generic) => (f && f.name ? String(f.name) : generic);

  /* one record per game-night match, whichever of the deal settlement and the
     match-end sheet gets there first */
  function recordGameNight(match) {
    const sc = match && match.scout;
    if (!sc || sc.recorded || !match.over || !window.Scout) return;
    sc.recorded = true;
    try {
      window.Scout.addPractice({ ts: Date.now(), partner: sc.partner, opps: [sc.opps[0], sc.opps[1]], dollars: settlement(match).total });
    } catch (e) { console.error('game night record', e); }
  }

  function startGameNight(partnerId, oppIds, pool, round) {
    if (!window.Scout) { U.toast('Game night is not available'); return false; }
    stopT2Timer();
    keepPending(); keepSaved();   // the match this one replaces (newMatch)
    oppIds = oppIds || [];
    const match = E.makeTeamMatch(app.settings);
    match.scout = {
      partner: partnerId,
      opps: [oppIds[0], oppIds[1]],
      pool: (pool || []).slice(),
      round: round || 1
    };
    match.pairing = Math.random() < 0.5 ? 0 : 1;   // which friend sits across from you
    stampMatch(match);
    app.match = match;
    showScreen('game');
    startNextHand();
    return true;
  }

  window.GameNight = {
    start: (partnerId, oppIds, pool) => startGameNight(partnerId, oppIds, pool, 1),
    // the match a Deal would throw away, in a few words (null: nothing would be lost)
    atStake: () => { const m = matchAtStake(); return m ? matchLine(m) : null; }
  };

  /* a legal move for whoever is to act, when a bot's own decision failed */
  function fallbackAction(hand) {
    if (hand.phase === 'upcard') return { type: 'pass-upcard' };
    if (hand.phase === 'draw') return { type: 'draw-stock' };
    const d = E.legalActions(hand).find(a => a.type === 'discard');
    return d ? { type: 'discard', card: d.card } : { type: 'big-gin' };
  }

  /* every action at your own table goes through here. In a team deal the
     other table keeps pace: about one player-turn there for each one here,
     so how fast you think does not decide who finishes first.            */
  function actHere(action) {
    const hand = app.table.hand;
    const before = hand.turn;
    const evs = E.act(app.table, action);
    if (isTeam()) {
      E.updateBulges(app.match);
      if (hand.turn > before && hand.phase !== 'over') {
        const roll = Math.random();
        const turns = roll < 0.2 ? 0 : roll < 0.8 ? 1 : 2;
        for (let i = 0; i < turns; i++) stepTable2();
      }
    }
    return evs;
  }

  /* one player-turn at table two (no animation: you are not watching it) */
  function stepTable2() {
    const t2 = app.t2;
    if (!t2 || E.tableDone(t2.table)) return;
    const hand = t2.table.hand;
    let guard = 0;
    while (hand.phase !== 'over' && guard++ < 6) {
      const p = hand.current;
      let action;
      try {
        action = A.decide(t2.brains[p], t2.table);
      } catch (e) {
        console.error('table two', e);
        action = fallbackAction(hand);
      }
      const upcard = E.upcard(hand);
      let evs;
      try { evs = E.actAt(app.match, 1, action); }
      catch (e) { console.error('table two', e); action = fallbackAction(hand); evs = E.actAt(app.match, 1, action); }
      for (const ev of evs) { A.observe(t2.brains[0], ev); A.observe(t2.brains[1], ev); }
      const who = p === 0 ? app.names.partner : app.names.opp2;
      if (action.type === 'take-upcard') t2.last = `${who} took the ${C.name(upcard)}`;
      else if (action.type === 'draw-stock') t2.last = `${who} drew from the stock`;
      else if (action.type === 'pass-upcard') t2.last = `${who} passed the ${C.name(upcard)}`;
      else if (action.type === 'discard') t2.last = `${who} threw the ${C.name(action.card)}`;
      if (action.type === 'discard' || action.type === 'pass-upcard' || action.type === 'big-gin') break;
    }
    if (E.tableDone(t2.table) && !E.tableDone(app.table)) {
      // your hand is still live: from here you play knowing this score
      const res = t2.table.hand.result;
      const r = E.signedResult(t2.table.hand);
      U.toast(res.dead ? 'Table two: dead hand, no score there'
        : r > 0 ? `${app.names.partner} won ${r} (${boxWord(E.signedBoxes(t2.table.hand))})` : `${app.names.partner} lost ${-r} (${boxWord(E.signedBoxes(t2.table.hand))})`, 2600);
      renderT2();
    }
  }

  function stopT2Timer() {
    if (app.t2 && app.t2.timer) { clearInterval(app.t2.timer); app.t2.timer = null; }
  }

  /* what the finished table means for the hand you are still playing */
  const boxWord = k => `${Math.abs(k)} box${Math.abs(k) === 1 ? '' : 'es'}`;
  function needText(bulge, boxes) {
    const hand = app.table.hand, s = app.match.settings;
    if (bulge > 0) {
      const hold = A.holdCount(hand, s, bulge);
      return `Up ${bulge} and ${boxWord(boxes)}. ` + (hold >= 0
        ? `Hold ${hold} or less and even a gin leaves your team ahead on points.`
        : `You stay ahead on points unless you lose this hand by ${bulge} or more.`);
    }
    return `Down ${-bulge} and ${boxWord(boxes)}. Win this hand by more than ${-bulge} to take the points.`;
  }

  /* the strip under the top bar: your partner's table */
  function renderT2() {
    const strip = $('t2-strip');
    if (!isTeam() || !app.t2) { strip.classList.add('hidden'); return; }
    strip.classList.remove('hidden');
    const t2 = app.t2.table, hand = t2.hand;
    const coached = app.settings.tableMode !== 'pro'; // at the Pro table you do the sums yourself
    let note = `${hand.stock.length} cards left`, plaque = '';
    if (E.tableDone(t2)) {
      if (hand.result.dead) {
        note = 'Dead hand. Yours decides the box.';
      } else {
        const r = E.signedResult(hand);
        note = coached ? needText(r, E.signedBoxes(hand)) : (r > 0 ? `${escH(app.names.partner)} won.` : `${escH(app.names.partner)} lost.`);
        plaque = `<div class="t2-plaque ${r > 0 ? 'up' : 'down'}">${signed(r)}<small>Bulge</small></div>`;
      }
    }
    strip.classList.toggle('done', E.tableDone(t2));
    strip.innerHTML =
      `<div class="t2-main"><div class="t2-who">${escH(app.names.partner)} <span>vs ${escH(app.names.opp2)}</span></div>` +
      `<div class="t2-note">${note}</div></div>${plaque}`;
  }

  /* both tables done: post the box and the money */
  function settleTeamDeal() {
    const match = app.match;
    if (match.lastDeal) return match.lastDeal;
    const deal = E.settleDeal(match);
    const st = app.coach.stats;
    const boxD = deal.entries * matchStakes(match).box;   // entries: boxes written for us (negative: for them)
    st.money += boxD;
    match.accruedMoney = (match.accruedMoney || 0) + boxD;
    if (match.over) {
      st.matches++;
      if (settlement(match).total > 0) st.matchWins++;
      evaluateMilestones(match);
      bookMatchMoney(match);
      recordGameNight(match);   // also from the match-end sheet; recorded once either way
    }
    K.saveStats(app.coach);
    saveMatch();
    U.renderHollyMini(match);
    return deal;
  }

  /* The games, and the doubling for a shut-out, go into the record the moment
     the match ends (boxes went in as they were made). Before the finished match
     is dropped from storage, so closing the app on the last result loses
     nothing; once per match, so no button or rematch can book it twice.    */
  function bookMatchMoney(match) {
    if (!match.over || match.moneyBooked) return;
    match.moneyBooked = true;
    app.coach.stats.money += settlement(match).total - (match.accruedMoney || 0);
    match.accruedMoney = settlement(match).total;
  }

  /* ---------------- the ending, told in beats ----------------
     window.Ending works out what the deal did to the sheet; these draw it.
     Names, never we and they: side 0 is you (and your partner), side 1 the
     other side. Gold and the won green are for your side only.           */
  function sideName(side) {
    const n = app.names || {};
    if (side === 0) return isTeam() && n.partner ? myName() + ' & ' + n.partner : myName();
    return isTeam() ? [n.opp, n.opp2].filter(Boolean).sort().join(' & ') || 'The other side' : (n.opp || 'The other side');
  }
  // one name or two: "Max takes", "Max & Bea take", "You take"
  const takes = side => sideName(side) + ((isTeam() || sideName(side) === 'You') ? ' take' : ' takes');
  const EndingAPI = () => window.Ending;
  /* what this deal (or hand) did to the sheet: [] when nothing closed */
  function dealBeats() {
    const N = EndingAPI(), match = app.match;
    if (!N || !match || !app.sheetBefore) return [];
    const st = matchStakes(match);
    return N.beats(app.sheetBefore, match.games, { box: st.box, game: st.game, shutoutDoubles: match.settings.shutoutDoubles, hollywood: match.settings.hollywood });
  }
  /* what a game's figure is made of, only when it is not just the game stake */
  function payMakeup(g) {
    if (!g.boxNet && !g.shutout) return '';
    const k = g.shutout ? 2 : 1;
    const parts = [];
    if (g.boxNet) parts.push(`Boxes ${fmtD(g.boxes / k)}`);
    parts.push(`Game ${fmtD(g.game / k)}`);
    if (g.shutout) parts.push('Shut-out ×2');
    return parts.join(' · ');
  }
  /* one row a game: the numeral, who took it, what it paid (for your side) */
  function gameRowHTML(g, i) {
    const mine = g.winner === 0;
    const make = payMakeup(g);
    return `<div class="end-row ${mine ? 'won' : 'lost'}" style="--i:${i || 0}">
        <span class="end-num"><small>Game</small>${g.numeral}</span>
        <span class="end-who"><b>${escH(sideName(g.winner))}</b>${make ? `<small>${make}</small>` : ''}</span>
        <span class="end-pay">${fmtD(g.pays)}</span>
      </div>`;
  }
  function gamesClosedHTML(beats) {
    const games = beats.filter(b => b.type === 'game');
    return games.length ? `<div class="end-games">${games.map(gameRowHTML).join('')}</div>` : '';
  }

  /* both hands of a finished table, face up (seat labels are plain text) */
  function revealHandHTML(hand, seatLabel) {
    const r = hand.result;
    if (r.dead) return '<div class="sub">Dead hand: the stock ran out, nothing scored here.</div>';
    const typeNames = { gin: 'gin', 'big-gin': 'gin', knock: 'knocked', undercut: 'knocked', 'gin-off': 'knocked' };
    return `<div class="reveal-hands">
      ${U.revealRowHTML(seatLabel[r.knocker] + ': ' + typeNames[r.type], r.knockerArr, null, r.knockerDW + ' deadwood')}
      ${U.revealRowHTML(seatLabel[r.defender] + (r.layoff.length ? ', laid off ' + r.layoff.length : ''),
        r.defenderArr, new Set(r.layoff), r.defenderDW + ' deadwood after layoffs')}
    </div>`;
  }

  /* the team's boxes for the deal, for your side: the boxes written (deal.awarded, already signed
     for your team: negative when written for them) where the engine says so, else the netted boxes */
  const teamBoxes = deal => (deal.awarded === undefined ? deal.netBoxes : deal.awarded);

  /* the result of a team deal. Opens as soon as your own hand ends; if table
     two is still playing it finishes here while you watch (or skip).       */
  function openDealSheet() {
    const match = app.match, t1 = app.table, t2 = app.t2.table, names = app.names;
    const r1 = t1.hand.result;
    const mine = E.signedResult(t1.hand), mineBoxes = E.signedBoxes(t1.hand);
    const t2done = E.tableDone(t2);
    const deal = t2done ? settleTeamDeal() : null;
    const theirs = t2done ? E.signedResult(t2.hand) : null;

    let head, line;
    if (!deal) {
      head = r1.dead ? 'Dead hand at your table' : mine > 0 ? 'You won your hand' : 'You lost your hand';
      line = r1.dead ? `Nothing scored here, so ${escH(names.partner)}’s hand decides the deal.`
        : mine > 0 ? `You won ${mine} and ${boxWord(mineBoxes)}. ${escH(names.partner)} can lose by up to ${mine - 1} and your team still takes the points.`
        : `You gave up ${-mine} and ${boxWord(mineBoxes)}. ${escH(names.partner)} has to win by more than ${-mine} to take the points.`;
    } else if (deal.dead[0] && deal.dead[1]) {
      head = 'Two dead hands';
      line = 'Nothing scored at either table. Same dealers deal again.';
    } else {
      head = deal.winner === null ? 'The points cancel' : `${escH(takes(deal.winner))} the points`;
      const n = deal.entries;   // boxes written for your team over every game (negative: for them)
      // the engine may hold the boxes back when the net box went against the side that won the points (deal.withheld)
      const boxText = deal.withheld ? 'No boxes: the net box went against the points'
        : n === 0 ? 'No boxes either way'
        : `${boxWord(n)} ${n > 0 ? 'made' : 'given up'} (${fmtD(n * matchStakes(match).box)})`;
      line = `${boxText} · running ${fmtD(settlement(match).total)}`;
    }

    const cell = (label, value, cls, boxes) =>
      `<div class="ds-cell${cls ? ' ' + cls : ''}"><span>${label}</span><b>${value}</b>` +
      `<small>${boxes === null || boxes === undefined ? '&nbsp;' : boxes === 0 ? 'no box' : signed(boxes) + (Math.abs(boxes) === 1 ? ' box' : ' boxes')}</small></div>`;
    const netCls = !deal || deal.winner === null ? '' : deal.winner === 0 ? 'up' : 'down';
    const sum = `<div class="deal-sum">
        ${cell(escH(myName()), r1.dead ? '0' : signed(mine), '', mineBoxes)}<i>+</i>
        ${cell(escH(names.partner), t2done ? (t2.hand.result.dead ? '0' : signed(theirs)) : '…', '', t2done ? E.signedBoxes(t2.hand) : null)}<i>=</i>
        ${cell('Team', deal ? (deal.net === 0 ? '0' : signed(deal.net)) : '…', 'net ' + netCls, deal ? teamBoxes(deal) : null)}
      </div>`;

    // still playing: the ticker says so, and the brass button is the way on (Skip ahead)
    const t2block = t2done
      ? `<div class="eyebrow sec">Table two · ${escH(names.partner)} vs ${escH(names.opp2)}</div>
         ${revealHandHTML(t2.hand, [names.partner, names.opp2])}`
      : `<div class="t2-live">
           <div><div class="eyebrow sec">Table two · still playing</div>
           <div class="t2-ticker" id="t2-ticker">${escH(app.t2.last || 'in play')}</div></div>
         </div>`;

    const html = `
      <div class="eyebrow lead">Team deal${t1.hand.doubled ? ' · spades ×2' : ''}</div>
      <h2>${head}</h2>
      ${sum}
      ${deal ? gamesClosedHTML(dealBeats()) : ''}
      <div class="sub">${line}</div>
      <div class="eyebrow sec">Table one · ${escH(myName())} vs ${escH(names.opp)}</div>
      ${revealHandHTML(t1.hand, [myName(), names.opp])}
      ${t2block}
      ${deal ? hollyBoardHTML(match) : ''}
      <div class="row-btns">
        ${app.coach.handLog.length ? '<button class="btn" id="btn-analysis">Analysis</button>' : ''}
        ${deal ? `<button class="btn gold" id="btn-next">${match.over ? 'Final tally' : 'Next deal'}</button>`
               : '<button class="btn gold" id="t2-skip">Skip ahead</button>'}
      </div>
      <div class="row-btns more">
        ${r1.dead ? '' : '<button class="btn ghost" id="btn-replay">Replay hand</button>'}
        <button class="btn ghost" id="btn-recall">Pile quiz</button>
        ${Object.keys(app.beliefMarks || {}).length ? '<button class="btn ghost" id="btn-grid-score">Score my reads</button>' : ''}
      </div>`;
    const body = U.openSheet(html, { locked: true });
    // an undercut at your table, the first time the sheet shows it: the under-cutter's hand rises over the knocker's
    if (r1.type === 'undercut' && !t1.hand.undercutShown) {
      t1.hand.undercutShown = true;
      U.undercutMoment(body.querySelector('.reveal-hands'), null);
    }
    // the deal written on the board, once, when it is settled
    if (deal && !t1.hand.boardWritten) { t1.hand.boardWritten = true; U.writeBoard(body, app.sheetBefore, match); }
    const on = (id, fn) => { const el = body.querySelector(id); if (el) el.addEventListener('click', fn); };
    on('#btn-analysis', () => openAnalysisSheet(true));
    on('#btn-next', () => {
      U.closeSheet();
      if (match.over) openMatchEndSheet(); else startNextHand();
    });
    on('#btn-replay', openReplaySheet);
    on('#btn-recall', openRecallSheet);
    on('#btn-grid-score', openGridScoreSheet);

    if (!t2done) {
      const finish = () => {
        stopT2Timer();
        let guard = 0;
        while (!E.tableDone(t2) && guard++ < 400) stepTable2();
        if (U.sheetState().open && document.getElementById('t2-ticker')) openDealSheet(); // still on this sheet: show the result
        else settleTeamDeal();                                     // looking at something else: just post it
      };
      on('#t2-skip', finish);
      if (!app.t2.timer) {
        app.t2.timer = setInterval(() => {
          stepTable2();
          const tick = document.getElementById('t2-ticker');
          if (tick) tick.textContent = app.t2.last;
          if (E.tableDone(t2)) finish();
          else saveMatch();   // how far table two has run (finish saves with the settled deal)
        }, 650);
      }
    }
  }

  /* ---------------- rendering ---------------- */
  function renderAll() {
    const match = app.match, hand = app.table.hand;
    if (!hand) return;
    U.renderKnockChip(hand);
    U.renderHollyMini(match);
    renderT2();
    U.renderOppCards(hand.hands[1].length);
    const humanTurn = hand.current === 0 && hand.phase !== 'over';
    U.renderPiles(hand, {
      glowStock: humanTurn && (hand.phase === 'draw'),
      glowDiscard: humanTurn && (hand.phase === 'draw' && !hand.forcedStock || hand.phase === 'upcard'),
      onDraw: onPileDraw
    });
    const mode = app.settings.tableMode;
    U.renderHand(hand.hands[0], {
      sortMode: mode === 'pro' && app.sortMode === 'melds' ? 'runs' : app.sortMode,
      order: handOrder(),
      selected: app.selected,
      fresh: hand.current === 0 ? hand.drawnCard : null,
      barred: barredCard(hand),
      onTap: onCardTap,
      onThrow: onCardThrow,
      onReorder: onHandReorder
    });
    U.renderDeadwood(hand, mode);
    renderStatusAndActions();
  }

  function renderStatusAndActions() {
    const hand = app.table.hand;
    const actions = [];
    if (hand.phase === 'over') {
      U.setStatus('');
      U.renderActions([]);
      return;
    }
    if (hand.current === 1) {
      U.setStatus('');
      U.renderActions([]);
      return;
    }
    // the coach is dealing your answer out, or its verdict waits for Continue: nothing to press here
    if (handLocked()) {
      U.setStatus(app.coachDealing ? 'Dealing it out…' : '');
      U.renderActions([]);
      return;
    }
    // a coach question, asked in place: the table stays in view and the answers are the action bar
    const ask = app.drillAsk;
    if (ask) {
      U.setStatus(ask.type === 'knock' ? 'Coach: knock or play on?' : 'Coach: ' + ask.prompt.charAt(0).toLowerCase() + ask.prompt.slice(1));
      U.renderActions(ask.options.map(o => ({ label: o.label, onClick: () => answerDrill(ask, o.id) })));
      return;
    }
    if (hand.phase === 'upcard') {
      const up = E.upcard(hand);
      U.setStatus(hand.upcardDecliner === null ? 'First card is up: take it or pass' : app.names.opp + ' passed: take it or pass');
      actions.push({ label: 'Take ' + C.name(up), cls: 'gold', onClick: () => humanAct({ type: 'take-upcard' }) });
      actions.push({ label: 'Pass', onClick: () => humanAct({ type: 'pass-upcard' }) });
    } else if (hand.phase === 'draw') {
      U.setStatus(hand.forcedStock ? 'Both passed: draw from the stock' : 'Your draw: tap a pile');
    } else if (hand.phase === 'discard') {
      if (app.drillPendingDiscard) {
        U.setStatus('Coach: pick your best throw');
      } else {
        U.setStatus('Pick a card to discard');
      }
      const acts = E.legalActions(hand);
      const bigGin = acts.find(a => a.type === 'big-gin');
      if (bigGin) {
        actions.push({ label: 'Big gin', cls: 'knock shimmer', onClick: () => humanAct({ type: 'big-gin' }) });
      }
      if (app.selected != null) {
        const entry = acts.find(a => a.type === 'discard' && a.card === app.selected);
        if (entry) {
          actions.push({ label: 'Discard ' + C.name(app.selected), onClick: () => humanDiscard(app.selected, false, false) });
          if (entry.canGin) {
            actions.push({ label: 'Gin', cls: 'knock shimmer', onClick: () => humanDiscard(app.selected, false, true) });
          } else if (entry.canKnock) {
            actions.push({ label: 'Knock at ' + entry.deadwood, cls: 'knock', onClick: () => humanDiscard(app.selected, true, false) });
          } else if (app.settings.tableMode === 'pro' && !hand.ginOnly) {
            // pro table: you may attempt a knock — miscounting has consequences
            actions.push({ label: 'Knock', cls: 'knock', onClick: () => humanDiscard(app.selected, true, false) });
          }
        }
      }
    }
    U.renderActions(actions);
  }

  /* the card just taken from the pile, while it may not go straight back (the engine refuses it too) */
  function barredCard(hand) {
    return hand && hand.current === 0 && hand.phase === 'discard' && hand.drawnFrom === 'discard' ? hand.drawnCard : null;
  }

  /* ---------------- the dollar coach ----------------
     Every play you make is also dealt out in the background (oracle.js) and
     priced in dollars at your stakes (money.js). When that verdict lands it
     replaces the quick rule-of-thumb grade.                                */
  const O = window.Oracle, Money = window.Money;
  const money2 = x => '$' + x.toFixed(2);
  const GRADE_WORD = { optimal: 'Right', good: 'Fine', acceptable: 'A slip', blunder: 'Costly' };

  /* The evaluator deals out one job at a time. Jobs wait here, each marked with
     who asked ('table' for your plays, or a Gym set), so whoever leaves can drop
     what it still has waiting: a dropped job resolves with null and is marked
     `dropped`. The job being dealt out finishes (a few seconds at most).     */
  const jobQueue = [];
  let jobBusy = false;
  function runner() {
    if (!app.oracle) app.oracle = { runner: null, model: null, sw: null, key: '' };
    if (!app.oracle.runner) app.oracle.runner = O.createRunner();
    return app.oracle.runner;
  }
  function runJob(job, owner) {
    return new Promise(resolve => { jobQueue.push({ job, owner, resolve }); nextJob(); });
  }
  /* The one limit on a job, with one owner (here): a job that has not come back within
     jobLimitMs of the page's own clock (Oracle.watch: time while the page is hidden or the
     phone asleep does not count) is abandoned: it resolves with null (the play is then graded
     by the rule of thumb for the decision made, and a committed answer is made), the evaluator
     is replaced (its worker ended; the next job starts a new worker, never the main thread for
     good), and the queue goes on. Real jobs take 1.3 s (a pre-judgement) to about 6 s (a costly
     play's second look). A late answer is ignored.                                         */
  app.jobLimitMs = 18000;
  function nextJob() {
    if (jobBusy || !jobQueue.length) return;
    const { job, resolve } = jobQueue.shift();
    jobBusy = true;
    let done = false, limit = null;
    const settle = stats => {
      if (done) return;   // the job was abandoned, or has answered already
      done = true;
      if (limit) limit.cancel();
      jobBusy = false; resolve(stats); nextJob();
    };
    const r = runner();
    limit = O.watch(app.jobLimitMs, () => {
      if (done) return;
      job.abandoned = true;
      console.error('evaluator: a job did not come back in time; abandoned');
      try { if (r.abandon) r.abandon(); } catch (e) {}
      if (app.oracle && app.oracle.runner === r) app.oracle.runner = null;   // the next job gets a new evaluator
      settle(null);
    });
    r.evaluate(job).then(settle, () => settle(null));
  }
  function dropJobs(owner) {
    for (let i = jobQueue.length - 1; i >= 0; i--) {
      if (jobQueue[i].owner !== owner) continue;
      const x = jobQueue.splice(i, 1)[0];
      x.job.dropped = true;
      x.resolve(null);
    }
  }

  /* price the sheet for this match (once per set of stakes and rules);
     `onReady` runs once the table is built, or once it is known it cannot be */
  function prepareOracle(onReady) {
    stopReview();   // a new deal: the last hand's deeper look is no longer wanted
    if (!O || !Money) { if (onReady) onReady(); return; }
    runner();
    const o = app.oracle, s = app.match.settings, mode = app.match.mode;
    o.sw = null;   // the sheet may have moved since the last deal
    o.waiting = o.waiting || [];
    if (onReady) o.waiting.push(onReady);
    const flush = () => { const w = o.waiting.splice(0); w.forEach(fn => { try { fn(); } catch (e) { console.error('money table ready', e); } }); };
    const stake = matchStakes(app.match);   // the match's own stakes, not Table rules' next ones
    const key = [mode, s.targetScore, s.shutoutDoubles, s.spadeDoubles, s.hollywood,
      stake.box, stake.game].join('|');
    if (o.key === key) { if (!o.building) flush(); return; }
    o.key = key; o.model = null; o.building = true;
    setTimeout(() => {
      try {
        const model = window.Gym.modelFor(mode === 'team' ? 'team' : 'solo', s,
          stake.box, stake.game);
        if (o.key === key) o.model = model;
      } catch (e) { console.error('money table', e); }
      if (o.key === key) { o.building = false; flush(); }
    }, 30);
  }
  const oracleReady = () => !!(app.oracle && app.oracle.model);

  /* everything needed to deal out the play about to be made (taken BEFORE it is made) */
  function oracleJob(action) {
    if (!oracleReady()) return null;
    try {
      const o = app.oracle;
      const list = O.withAction(O.candidates(app.table, 0, 4), action);
      if (list.length < 2) return null;
      if (!o.sw) o.sw = Money.swing(o.model, app.match);
      return {
        snap: O.snapshot(app.table, 0, app.coach.est), actions: list,
        ctx: O.context(o.model, app.match, app.table, o.sw),
        n: 500, first: 14, budgetMs: 1300, focus: O.keyOf(action)
      };
    } catch (e) { console.error('oracle job', e); return null; }
  }

  function playName(a, cap) {
    let s;
    if (a.type === 'take-upcard') s = 'taking the upcard';
    else if (a.type === 'pass-upcard') s = 'passing';
    else if (a.type === 'draw-stock') s = 'drawing from the stock';
    else if (a.type === 'big-gin') s = 'declaring big gin';
    else if (a.gin) s = 'going gin';
    else if (a.knock) s = 'knocking with the ' + C.name(a.card) + ' down';
    else s = 'throwing the ' + C.name(a.card);
    return cap ? s[0].toUpperCase() + s.slice(1) : s;
  }

  /* why the better play was better, from facts noted when the play was made */
  function reasonFor(best, entry) {
    const mine = entry.action, f = entry.facts || {};
    if (mine.type !== 'discard') {
      if (best.type === 'take-upcard') return f.makesMeld ? 'The upcard completed a meld.' : 'The upcard did more for this hand than an average draw.';
      return 'A blind draw is worth more on average, and it keeps your hand hidden.';
    }
    if (best.gin) return 'Gin was on.';
    if (best.knock && !mine.knock) return 'A knock banks the result now, before they can improve.';
    if (!best.knock && mine.knock) return 'The knock wins too little here, or runs into an undercut too often.';
    const b = f.cards && f.cards[best.card], c = f.cards && f.cards[mine.card];
    if (!b || !c) return '';
    const parts = [];
    if (b.dw < c.dw) parts.push(`leaves ${c.dw - b.dw} fewer deadwood`);
    if (b.hits > c.hits) parts.push(`keeps ${b.hits - c.hits} more live draw${b.hits - c.hits === 1 ? '' : 's'}`);
    if (b.u < c.u) parts.push(`is the safer throw (${b.u} live ways to use it, against ${c.u})`);
    return parts.length ? 'It ' + parts.join(', ') + '.' : '';
  }

  function verdictText(v, entry) {
    const deals = `${v.n} deals`;
    if (v.grade === 'optimal') return `Best of the ${v.plays} plays compared (${deals}).`;
    if (v.close) {
      return `Too close to call: ${playName(v.best)} came out ${money2(v.loss)} ahead over ${deals}, and a gap has to clear ${money2(1.5 * v.margin)} to count.`;
    }
    if (v.grade === 'good') {
      return `Fine. ${playName(v.best, true)} came out ${money2(v.loss)} ahead over ${deals}: a real edge, but a small one.`;
    }
    const why = reasonFor(v.best, entry);
    return `${playName(v.best, true)} was worth ${money2(v.loss)} more (give or take ${money2(v.margin)}, ${deals}).` + (why ? ' ' + why : '');
  }

  /* The house figure needs both plays dealt out in full. When the race inside
     the play's own job dropped one of them, the two are set against each other
     on deals of their own (200, 0.9 s at most). Resolves with the play's stats. */
  function houseDuel(job, entry, action, house, stats) {
    if (!house || !stats || !stats.n || !entry.houseKey || job.dropped) return Promise.resolve(null);
    const fig = K.houseFigure(stats, entry.key, entry.houseKey);
    if (fig) return Promise.resolve(fig);
    return runJob({ snap: job.snap, actions: [action, house], ctx: job.ctx, n: 200, first: 14, budgetMs: 900, focus: entry.key }, ownerOf(entry))
      .then(duel => (duel && duel.n ? K.houseFigure(duel, entry.key, entry.houseKey) : null));
  }
  /* who a play's evaluation belongs to: the table, or no table once the play is let go for good (keepPending) */
  const ownerOf = entry => (entry && entry.kept ? 'kept' : 'table');
  /* a pre-judgement (maybeFireDrill) goes to the front of the queue: it is worth something only before the player moves */
  function runJobFirst(job, owner) {
    return new Promise(resolve => { jobQueue.unshift({ job, owner, resolve }); nextJob(); });
  }
  function dropPrejudge() {
    for (let i = jobQueue.length - 1; i >= 0; i--) {
      if (!jobQueue[i].job.prejudge) continue;
      const x = jobQueue.splice(i, 1)[0];
      x.job.dropped = true;
      x.resolve(null);
    }
  }

  /* log a play; if it can be dealt out, the entry is filled in when the verdict lands */
  function submitMove(entry, action) {
    entry.action = action;
    // the rule-of-thumb verdict for the decision made: shown at once, and counted if nothing dealt out comes
    entry.rule = { grade: entry.grade, text: entry.text };
    dropPrejudge();   // the player has moved: a decision still waiting to be pre-judged is not wanted
